<title>@@APP_TITLE@@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@500;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* @@STYLES@@ */
</style>

<header class="wrap top">
  <div class="eyebrow" data-i18n="page.header.eyebrow"></div>
  <h1 data-i18n="app.title"></h1>
  <p class="lead" data-i18n="page.header.lead"></p>
  <div class="loc-row">
    <label class="loc-pick"><span data-i18n="page.location.label"></span> <select id="location-select" class="clickable"></select></label>
    <div class="loc" id="location-facts"></div>
  </div>
  <div class="top-tools">
    <div class="seg theme-sw" id="theme-switch" role="group" data-i18n-attr="aria-label:page.theme.groupLabel"><span class="lab" data-i18n="page.theme.label"></span><button class="btn" type="button" data-theme-option="auto" data-i18n="page.theme.auto"></button><button class="btn" type="button" data-theme-option="light" data-i18n="page.theme.light"></button><button class="btn" type="button" data-theme-option="dark" data-i18n="page.theme.dark"></button><button class="btn" type="button" data-theme-option="eco" data-i18n="page.theme.eco"></button></div>
    <div class="seg" id="data-tools" role="group" data-i18n-attr="aria-label:page.dataTools.groupLabel"><button class="btn ghost" type="button" id="clear-all" data-i18n="page.dataTools.clearAll" data-i18n-attr="title:page.dataTools.clearAllTitle"></button><button class="btn ghost" type="button" id="undo-params" disabled data-i18n="page.dataTools.previous" data-i18n-attr="title:page.dataTools.previousTitle"></button></div>
    <div class="seg" id="language-switch" role="group" data-i18n-attr="aria-label:page.language.groupLabel"><span class="lab" data-i18n="page.language.label"></span><button class="btn" type="button" data-language-option="pl" lang="pl" data-i18n="page.language.pl"></button><button class="btn" type="button" data-language-option="en" lang="en" data-i18n="page.language.en"></button></div>
  </div>
</header>

<div class="bar" role="region" data-i18n-attr="aria-label:page.kpi.regionLabel">
  <div class="wrap">
    <div class="kpi main"><div class="k" data-i18n="page.kpi.netIncome"></div><div class="v" id="kpi-net">–</div><div class="s" id="kpi-net-detail">–</div></div>
    <div class="kpi"><div class="k" data-i18n="page.kpi.hours"></div><div class="v" id="kpi-hours">–</div><div class="s" id="kpi-hours-detail">–</div></div>
    <div class="kpi hide-s"><div class="k" data-i18n="page.kpi.revenue"></div><div class="v" id="kpi-revenue">–</div><div class="s" id="kpi-revenue-detail">–</div></div>
    <div class="kpi"><div class="k" data-i18n="page.kpi.pessimistic" data-i18n-attr="title:page.kpi.pessimisticTitle"></div><div class="v" id="kpi-pessimistic">–</div><div class="s" id="kpi-pessimistic-detail">–</div></div>
    <div class="kpi hide-s"><div class="k" data-i18n="page.kpi.investment"></div><div class="v" id="kpi-investment">–</div><div class="s" id="kpi-investment-detail">–</div></div>
    <div class="kpi"><div class="k" data-i18n="page.kpi.feed"></div><div class="v" id="kpi-feed">–</div><div class="s" id="kpi-feed-detail">–</div></div>
    <div class="kpi hide-s"><div class="k" data-i18n="page.kpi.stocking"></div><div class="v" id="kpi-stocking">–</div><div class="s" data-i18n="page.kpi.stockingDetail"></div></div>
  </div>
</div>

<div class="wrap presets">
  <div class="prow" id="preset-buttons"><span class="lbl" data-i18n="page.presets.variant"></span></div>
  <div class="prow" id="philosophy-buttons"><span class="lbl" data-i18n="page.presets.philosophies"></span></div>
  <div class="prow" id="assumption-buttons"><span class="lbl" data-i18n="page.presets.assumptions"></span></div>
  <div class="prow" id="saved-variants-row"><span class="lbl" data-i18n="page.presets.savedVariants"></span><input class="mine-name" id="saved-variant-name" type="text" maxlength="40" data-i18n-attr="aria-label:page.presets.nameLabel; placeholder:page.presets.namePlaceholder"><button class="btn ghost" type="button" id="save-variant" data-i18n="page.presets.saveCurrent"></button><span id="saved-variants" style="display:contents"></span><span class="small muted" id="saved-variants-note" data-i18n="page.presets.savedLocally"></span></div>
  <div class="prow" id="export-row"><span class="lbl" data-i18n="page.presets.exportAndReport"></span></div>
</div>

<div class="wrap layout">
  <aside class="ctrls" id="controls" data-i18n-attr="aria-label:page.controls.label"></aside>

  <div class="res">
    <div class="panel">
      <div class="panel-h"><h2 data-i18n="page.results.title"></h2><p data-i18n="page.results.intro"></p></div>
      <div class="warns" id="warnings"></div>
    </div>

    <nav class="jump" aria-labelledby="jump-label">
      <span class="lab" id="jump-label" data-i18n="page.jump.label"></span>
      <a class="btn clickable" href="#farm-plan" data-i18n="page.jump.plan"></a>
      <a class="btn clickable" href="#rotation" data-i18n="page.jump.rotation"></a>
      <a class="btn clickable" href="#nitrogen" data-i18n="page.jump.nitrogen"></a>
      <a class="btn clickable" href="#money" data-i18n="page.jump.money"></a>
      <a class="btn clickable" href="#cashflow" data-i18n="page.jump.cashflow"></a>
      <a class="btn clickable" href="#labour" data-i18n="page.jump.labour"></a>
      <a class="btn clickable" href="#market-panel" data-i18n="page.jump.market"></a>
      <a class="btn clickable" href="#infrastructure" data-i18n="page.jump.infrastructure"></a>
      <a class="btn clickable" href="#stages" data-i18n="page.jump.startup"></a>
      <a class="btn clickable" href="#calendar" data-i18n="page.jump.calendar"></a>
    </nav>

    <div class="panel">
      <div class="panel-h"><h2 data-i18n="page.landAndFeed.title"></h2><p data-i18n="page.landAndFeed.intro"></p></div>
      <div class="landbar" id="land-bar"></div>
      <div class="legend" id="land-legend"></div>
      <div class="feed" id="feed-balance"></div>
      <p class="small muted" id="feed-note"></p>
    </div>

    <div class="panel" id="farm-plan">
      <div class="panel-h"><h2 data-i18n="page.farmPlan.title"></h2></div>
      <p class="intro" data-i18n="page.farmPlan.intro"></p>
      <div class="seg" id="plan-months"></div>
      <div class="seg" id="plan-grazing"></div>
      <div class="plan-grid">
        <div class="plan-wrap"><svg id="plan-svg" viewBox="0 0 1000 540" role="img" data-i18n-attr="aria-label:page.farmPlan.mapLabel"></svg><div class="legend" id="plan-legend"></div></div>
        <div class="note" id="plan-info" aria-live="polite"></div>
      </div>
      <div class="notes">
        <details class="note fold"><summary data-i18n="page.farmPlan.notes.grazingOrderTitle"></summary><div id="grazing-order-note"></div></details>
        <details class="note fold"><summary data-i18n="page.farmPlan.notes.buildingsTitle"></summary><div data-i18n-html="page.farmPlan.notes.buildings"></div></details>
        <details class="note fold"><summary data-i18n="page.farmPlan.notes.waterAndFencingTitle"></summary><div data-i18n-html="page.farmPlan.notes.waterAndFencing"></div></details>
        <details class="note fold"><summary data-i18n="plan.grazing.noteTitle"></summary><div id="grazing-note" aria-live="polite"></div></details>
      </div>
    </div>

    <div class="panel" id="rotation">
      <div class="panel-h"><h2 data-i18n="page.rotation.title"></h2></div>
      <p class="intro" data-i18n="page.rotation.intro"></p>
      <div class="seg" id="rotation-controls"></div>
      <div class="tw"><table class="rot" id="rotation-table"></table></div>
      <p class="small" id="rotation-note"></p>
      <div class="tw"><table id="crops-table"></table></div>
      <h3 class="sub-h" data-i18n="page.rotation.seedsTitle"></h3>
      <p class="small muted" data-i18n="page.rotation.seedsIntro"></p>
      <div class="tw"><table id="seed-table"></table></div>

      <h3 class="sub-h" id="catch-crops" data-i18n="page.catchCrops.title"></h3>
      <p class="intro" data-i18n="page.catchCrops.intro"></p>
      <div class="notes">
        <details class="note fold" open><summary data-i18n="ecoScheme.title"></summary><div id="catch-crop-summary"></div></details>
        <details class="note fold"><summary data-i18n="coverCropAdvice.title"></summary><div id="catch-crop-fields"></div></details>
      </div>
      <details class="fold-block">
        <summary data-i18n="page.catchCrops.mixesTitle"></summary>
        <p class="small muted" data-i18n="page.catchCrops.brownNote"></p>
        <div class="tw"><table id="catch-mix-table"></table></div>
        <div class="tw"><table id="stubble-mix-table"></table></div>
        <p class="small muted" data-i18n="page.catchCrops.requirements"></p>
        <p class="small muted" data-i18n="page.catchCrops.grainLegumeMixtures"></p>
      </details>
    </div>

    <div class="panel" id="nitrogen">
      <div class="panel-h"><h2 data-i18n="page.nitrogen.title"></h2><p data-i18n="page.nitrogen.intro"></p></div>
      <div class="seg" id="nitrogen-controls"></div>
      <div class="twocol">
        <div class="tw"><table id="nitrogen-table"></table></div>
        <div class="tw"><table id="nitrogen-cycle-table"></table></div>
      </div>
      <div class="notes">
        <div class="note" id="nitrogen-fields"></div>
        <div class="note" id="carbon-summary"></div>
      </div>
      <div class="tw"><table id="carbon-table"></table></div>
      <div class="notes">
        <details class="note fold"><summary data-i18n="page.nitrogen.baleGrazingTitle"></summary><div data-i18n-html="page.nitrogen.baleGrazingNote"></div></details>
        <details class="note fold"><summary data-i18n="page.nitrogen.soilCareTitle"></summary><div data-i18n-html="page.nitrogen.soilCare"></div></details>
        <details class="note fold"><summary data-i18n="page.nitrogen.carbonMethodTitle"></summary><div data-i18n-html="page.nitrogen.carbonMethod"></div></details>
      </div>
    </div>

    <div class="panel" id="money">
      <div class="panel-h"><h2 data-i18n="page.money.title"></h2><p data-i18n="page.money.intro"></p></div>
      <svg class="chart" id="waterfall" viewBox="0 0 640 250" role="img" data-i18n-attr="aria-label:page.money.chartLabel"></svg>
      <div class="twocol">
        <div class="tw"><table id="revenue-table"></table></div>
        <div class="tw"><table id="costs-table"></table></div>
      </div>
      <div class="twocol">
        <div class="tw"><table id="subsidies-table"></table></div>
        <div class="tw"><table id="home-use-table"></table></div>
      </div>
    </div>

    <div class="panel" id="cashflow">
      <div class="panel-h"><h2 data-i18n="page.cashflow.title"></h2><p data-i18n="page.cashflow.intro"></p></div>
      <div class="opening-cash" id="opening-cash"></div>
      <svg class="chart" id="cashflow-chart" viewBox="0 0 640 230" role="img" data-i18n-attr="aria-label:page.cashflow.chartLabel"></svg>
      <div class="tw"><table id="cashflow-table"></table></div>
      <p class="small muted" id="cashflow-note"></p>
    </div>

    <div class="panel">
      <div class="panel-h"><h2 data-i18n="page.enterprises.title"></h2><p data-i18n="page.enterprises.intro"></p></div>
      <div class="tw"><table id="enterprises-table"></table></div>
      <p class="small muted" id="enterprises-note"></p>
      <p class="small muted" data-i18n="page.enterprises.colourNote"></p>
      <p class="small muted" data-i18n="page.enterprises.perHourNote"></p>
    </div>

    <div class="panel" id="next-steps">
      <div class="panel-h"><h2 data-i18n="page.nextSteps.title"></h2><p data-i18n="page.nextSteps.intro"></p></div>
      <div class="tw"><table id="next-steps-table"></table></div>
      <p class="small" id="next-steps-note"></p>
    </div>

    <div class="panel">
      <div class="panel-h"><h2 data-i18n="page.sensitivity.title"></h2><p data-i18n="page.sensitivity.intro"></p></div>
      <svg class="chart" id="sensitivity-chart" viewBox="0 0 640 300" role="img" data-i18n-attr="aria-label:page.sensitivity.chartLabel"></svg>
      <p class="small muted" id="sensitivity-note"></p>
    </div>

    <div class="panel" id="risk">
      <div class="panel-h"><h2 data-i18n="page.risk.title"></h2><p data-i18n="page.risk.intro"></p></div>
      <svg class="chart" id="risk-chart" viewBox="0 0 640 220" role="img" data-i18n-attr="aria-label:page.risk.chartLabel"></svg>
      <p id="risk-summary"></p>
      <p class="small muted" data-i18n="page.risk.method"></p>
    </div>

    <div class="panel" id="labour">
      <div class="panel-h"><h2 data-i18n="page.labour.title"></h2><p id="labour-summary" data-i18n="page.labour.intro"></p></div>
      <svg class="chart" id="labour-chart" viewBox="0 0 640 270" role="img" data-i18n-attr="aria-label:page.labour.chartLabel"></svg>
      <div class="legend" id="labour-legend"></div>
      <div class="day-plan" id="labour-day" aria-live="polite"></div>
      <div class="tw"><table id="labour-table"></table></div>
    </div>

    <div class="panel" id="market-panel">
      <div class="panel-h"><h2 data-i18n="page.market.title"></h2><p data-i18n="page.market.intro"></p></div>
      <div class="tw"><table id="market"></table></div>
      <div id="customers"></div>
    </div>

    <div class="panel" id="infrastructure">
      <div class="panel-h"><h2 data-i18n="page.infrastructure.title"></h2><p data-i18n="page.infrastructure.intro"></p></div>
      <div class="infra" id="infrastructure-list"></div>
      <p class="small muted" id="infrastructure-note"></p>
    </div>

    <div class="panel" id="investments">
      <div class="panel-h"><h2 data-i18n="page.investments.title"></h2><p data-i18n="page.investments.intro"></p></div>
      <div class="tw"><table id="investments-table"></table></div>
      <p class="small" id="investments-owned-note"></p>
      <p class="small muted" data-i18n="page.investments.editNote"></p>
    </div>

    <div class="panel">
      <div class="panel-h"><h2 data-i18n="page.household.title"></h2><p data-i18n="page.household.intro"></p></div>
      <div class="tw"><table id="household-table"></table></div>
      <p class="small muted" id="household-note"></p>
    </div>
  </div>

</div>

<section class="wrap full" id="comparison">
  <h2 data-i18n="page.comparison.title"></h2>
  <p class="intro" data-i18n="page.comparison.intro"></p>
  <div class="tw"><table id="comparison-table"></table></div>
</section>

<section class="wrap full" id="calendar">
  <h2 data-i18n="page.calendar.title"></h2>
  <p class="intro" data-i18n="page.calendar.intro"></p>
  <div class="tw"><table class="cal" id="calendar-table"></table></div>
  <p class="small muted" data-i18n="page.calendar.note"></p>
</section>

<section class="wrap full" id="stages">
  <h2 data-i18n="page.stages.title"></h2>
  <p class="intro" data-i18n="page.stages.intro"></p>
  <div class="seg" id="startup-years"></div>
  <div class="cards" id="startup-kpis"></div>
  <p class="small" id="startup-summary"></p>
  <div class="years" id="startup-steps"></div>
  <p class="small muted" data-i18n="page.stages.method"></p>
</section>

<section class="wrap full" id="regulations">
  <h2 data-i18n="page.regulations.title"></h2>
  <p class="intro" data-i18n="page.regulations.intro"></p>
  <div class="notes">
    <div class="note" data-i18n-html="page.regulations.notes.subsidies"></div>
    <div class="note" data-i18n-html="page.regulations.notes.organic"></div>
    <div class="note" data-i18n-html="page.regulations.notes.milkEggsCheese"></div>
    <div class="note" data-i18n-html="page.regulations.notes.poultryAndPigs"></div>
    <div class="note" data-i18n-html="page.regulations.notes.produceBeesEducation"></div>
    <div class="note" data-i18n-html="page.regulations.notes.processingAndShipping"></div>
    <div class="note" data-i18n-html="page.regulations.notes.wolvesBuildingsManure"></div>
    <div class="note" data-i18n-html="page.regulations.notes.taxesAndInsurance"></div>
  </div>
</section>

<section class="wrap full" id="assumptions">
  <h2 data-i18n="page.assumptions.title"></h2>
  <div class="notes">
    <div class="note" data-i18n-html="page.assumptions.method"></div>
    <div class="note src" data-i18n-html="page.assumptions.sources"></div>
  </div>
</section>

<footer class="wrap">
  <p data-i18n="page.footer"></p>
  <p data-i18n-html="page.footerLinks"></p>
</footer>

<script>
/* @@SCRIPTS@@ */
</script>
