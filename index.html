// ===== ui/tint.js =====
// Subtle background colours for numbers in tables: from red (weakest) to green (best).

/** Parses a number as displayed ("−12 300 zł", "1,5") or returns null. */
function parseDisplayedNumber(text) {
  const normalised = String(text)
    .replace(/−/g, '-')
    .replace(/[^\d,.\-]/g, '')
    .replace(/\.(?=\d{3})/g, '')
    .replace(',', '.');
  const value = parseFloat(normalised);
  return isFinite(value) ? value : null;
}

const mixBackground = (colorVariable, strength) =>
  strength > 0.005
    ? `color-mix(in srgb, var(${colorVariable}) ${Math.round(strength * 100)}%, transparent)`
    : '';

/**
 * Colours selected columns of a table.
 * Modes: "pos" – green by size, "neg" – red by size, "rank" – red to green by value,
 * "low" – like rank but lower is better.
 * @param {string} tableId
 * @param {Object<number, string>} modeByColumn
 */
function tintTable(tableId, modeByColumn) {
  const table = byId(tableId);
  if (!table) return;
  const rows = [...table.querySelectorAll('tbody tr')].filter(row => !row.classList.contains('tot'));
  for (const [column, mode] of Object.entries(modeByColumn)) {
    const cells = rows.map(row => row.cells[+column]).filter(Boolean);
    const values = cells.map(cell => parseDisplayedNumber(cell.textContent));
    const numbers = values.filter(value => value !== null);
    if (!numbers.length) continue;
    const min = Math.min(...numbers);
    const max = Math.max(...numbers);
    const maxAbs = Math.max(...numbers.map(Math.abs)) || 1;
    cells.forEach((cell, index) => {
      const value = values[index];
      cell.style.background = value === null ? '' : cellBackground(mode, value, min, max, maxAbs);
    });
  }
}

function cellBackground(mode, value, min, max, maxAbs) {
  if (mode === 'pos') return mixBackground('--ok', (0.3 * Math.abs(value)) / maxAbs);
  if (mode === 'neg') return mixBackground('--bad', (0.22 * Math.abs(value)) / maxAbs);
  let position = max > min ? (value - min) / (max - min) : 0.5;
  if (mode === 'low') position = 1 - position;
  if (value < 0 && mode !== 'low') return mixBackground('--bad', 0.12 + (0.18 * Math.abs(value)) / maxAbs);
  return position < 0.4
    ? mixBackground('--bad', (0.2 * (0.4 - position)) / 0.4)
    : mixBackground('--ok', (0.34 * (position - 0.4)) / 0.6);
}

function tintTables() {
  tintTable('revenue-table', { 1: 'pos' });
  tintTable('subsidies-table', { 1: 'pos' });
  tintTable('home-use-table', { 1: 'pos' });
  tintTable('costs-table', { 1: 'neg' });
  tintTable('cashflow-table', { 1: 'pos', 2: 'pos', 3: 'neg', 4: 'rank', 6: 'rank' });
  tintTable('enterprises-table', { 1: 'rank', 2: 'rank' });
  tintTable('next-steps-table', { 2: 'rank' });
  tintTable('labour-table', { 1: 'neg', 2: 'neg' });
  tintTable('calendar-table', { 2: 'low', 5: 'rank' });
}

// ===== ui/charts.js =====
// Helpers for the SVG charts.

/** Round axis step giving about four grid lines up to `max` (1, 2, 2.5, 5 or 10 × a power of ten). */
function niceAxisStep(max) {
  const rawStep = max / 4;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const normalised = rawStep / magnitude;
  const niceNormalised =
    normalised <= 1 ? 1 : normalised <= 2 ? 2 : normalised <= 2.5 ? 2.5 : normalised <= 5 ? 5 : 10;
  return niceNormalised * magnitude;
}

/**
 * Horizontal line across the plot area of a chart.
 * @param {{width: number, padLeft: number, padRight: number}} chart
 */
const horizontalLine = (chart, y, attributes = {}) =>
  element('line', { x1: chart.padLeft, x2: chart.width - chart.padRight, y1: y, y2: y, ...attributes });

/** Small grey text of an axis or a legend. */
const axisText = (x, y, text, anchor = null) =>
  element('text', { x, y, 'text-anchor': anchor, class: 'ax' }, text);

/** A shape with a hover tooltip. */
const withTooltip = (name, attributes, tooltip) => element(name, attributes, element('title', {}, tooltip));

// ===== ui/kpi-bar.js =====
// Summary bar at the top: net income, working hours, revenue, pessimistic result,
// investments, feed balance and stocking density.

/** Below this yearly feed need (tonnes) the feed surplus is not shown as a percentage. */
const MIN_FEED_NEED_FOR_PERCENT = 1;

function renderKpis(results, pessimistic) {
  const target = computeIncomeTarget(params);

  byId('kpi-net').textContent = formatPln(results.netIncome);
  byId('kpi-net').classList.toggle('neg', results.netIncome < 0);
  byId('kpi-net-detail').textContent = t('kpi.netPerMonth', { amount: formatPln(results.netIncome / 12) });

  byId('kpi-hours').textContent = t('units.hours', { value: formatNumber(results.totalHours, 0) });
  byId('kpi-hours-detail').textContent = t('kpi.hoursDetail', {
    weekly: formatNumber(results.totalHours / 52, 0),
    daily: formatNumber(results.totalHours / 365, 1),
    peak: formatNumber(pessimistic.weeklyHoursPeak, 0),
    limit: formatNumber(params.weeklyHoursLimit, 0),
  });
  const overworked = results.labourUtilisation > 1 || pessimistic.weeklyHoursPeak > params.weeklyHoursLimit;
  byId('kpi-hours-detail').style.color = overworked ? 'var(--bad)' : '';

  byId('kpi-revenue').textContent = formatPln(results.revenue + results.subsidies);
  byId('kpi-revenue-detail').title = t('kpi.revenueExplanation');
  byId('kpi-revenue-detail').textContent = t('kpi.revenueDetail', {
    subsidies: formatPln(results.subsidies),
    costs: formatPln(results.costs + results.depreciation),
  });

  const meetsTarget = pessimistic.netIncome >= target;
  byId('kpi-pessimistic').textContent = formatPln(pessimistic.netIncome);
  byId('kpi-pessimistic').style.color = meetsTarget ? 'var(--ok)' : 'var(--bad)';
  byId('kpi-pessimistic-detail').textContent = t(meetsTarget ? 'kpi.aboveTarget' : 'kpi.belowTarget', {
    thousands: formatNumber(target / 1000, 0),
  });

  byId('kpi-investment').textContent = formatPln(results.capex);
  byId('kpi-investment-detail').textContent = t('kpi.perYear', { amount: formatPln(results.depreciation) });

  renderFeedKpi(results);
  byId('kpi-stocking').textContent = formatNumber(results.livestockUnitsPerHa, 2);
}

function renderFeedKpi(results) {
  const tolerance = -0.05;
  const feedOk =
    results.grainBalance >= tolerance && results.hayBalance >= tolerance && results.strawBalance >= tolerance;
  const balances = [
    ['hay', results.hayBalance],
    ['grain', results.grainBalance],
    ['straw', results.strawBalance],
  ];
  if (results.grazingSurplus < tolerance) balances.push(['pasture', results.grazingSurplus]);
  const describe = (items, amount) =>
    items
      .map(([feed, balance]) =>
        t('kpi.feedItem', { feed: t(`feeds.${feed}`), tonnes: formatNumber(amount(balance), 1) })
      )
      .join(', ');
  const grainForSale =
    results.grainSoldTonnes > 0.05
      ? t('kpi.grainForSale', { tonnes: formatNumber(results.grainSoldTonnes, 1) })
      : '';
  const sawdust =
    results.sawdustTonnes > 0.05 ? t('kpi.sawdust', { tonnes: formatNumber(results.sawdustTonnes, 1) }) : '';

  if (feedOk) {
    const need = results.hayNeed + results.grainNeed + results.strawNeed;
    // sold grain is not kept; straw replaced by sawdust counts as covered
    const strawCovered =
      results.strawSupply +
      Math.max(0, -results.strawBalanceBeforeSawdust) * (params.sawdustForStraw ? 1 : 0);
    const supply = results.haySupply + results.grainSupply - results.grainSoldTonnes + strawCovered;
    // without animals there is nothing to feed, so a percentage would mean nothing
    const surplusPercent = Math.max(0, ((supply - need) / Math.max(0.1, need)) * 100);
    byId('kpi-feed').textContent =
      need < MIN_FEED_NEED_FOR_PERCENT
        ? t('kpi.feedNoAnimals')
        : t('kpi.feedSurplus', { percent: formatNumber(surplusPercent, 0) });
    byId('kpi-feed-detail').textContent =
      t('kpi.feedReserve', { items: describe(balances, balance => Math.max(0, balance)) }) +
      sawdust +
      grainForSale;
  } else {
    const shortages = balances.filter(([, balance]) => balance < tolerance);
    const missing = shortages.reduce((sum, [, balance]) => sum - balance, 0);
    byId('kpi-feed').textContent = t('kpi.feedShortage', { tonnes: formatNumber(missing, 1) });
    byId('kpi-feed-detail').textContent =
      t('kpi.feedMissing', { items: describe(shortages, balance => -balance) }) + sawdust;
  }
  byId('kpi-feed').style.color = feedOk ? 'var(--ok)' : 'var(--bad)';
  byId('kpi-feed-detail').title = t('kpi.feedExplanation');
}

/** Short text per parameter group, e.g. "4 head" for the dairy cows. */

      count(params.geese, 'geese'),
      count(params.ducks, 'ducks'),

// ===== ui/render.js =====
// Re-rendering: every change of the params recomputes the model and redraws all panels.

/** When true, all panels show the pessimistic scenario instead of the current settings. */
let showPessimistic = false;
let pendingFrame = 0;
let slowPanelsTimer = 0;

/** Called after any change of `params`: re-renders once per animation frame and remembers the settings. */
function onParamsChanged() {
  recordParamsChange();
  if (pendingFrame) return;
  pendingFrame = requestAnimationFrame(() => {
    pendingFrame = 0;
    render();
    saveParams();
  });
}

function render() {
  const pessimistic = simulateFarm(applyPessimisticScenario(params));
  const results = showPessimistic ? pessimistic : simulateFarm(params);
  markActivePresets();

  renderKpis(results, pessimistic);
  renderGroupSummaries(results);
  renderWarnings(results, pessimistic);
  renderLandUse(results);
  renderFeedBalance(results);
  renderMoney(results);
  renderHouseholdBudget(results, pessimistic);
  renderCashflow(results);
  renderEnterprises(results);

  // these panels run the model many times, so they wait until the sliders stop moving
  clearTimeout(slowPanelsTimer);
  slowPanelsTimer = setTimeout(() => {
    renderNextSteps();
    renderSensitivity();
    tintTables();
  }, 220);

  renderLabour(results);
  renderMarket(results);
  renderInvestments(results);
  renderComparison();
  renderFarmPlan(results);
  renderRotation(results);
  renderCalendar(results);
  tintTables();
}

function renderWarnings(results, pessimistic) {
  const target = computeIncomeTarget(params);
  const warnings = results.warnings.map(warning => ({
    level: warning.level,
    text: t(`warnings.${warning.key}`, warning.values),
  }));
  const add = (atStart, level, key, values) => {
    const warning = { level, text: t(`warnings.${key}`, values) };
    if (atStart) warnings.unshift(warning);
    else warnings.push(warning);
  };

  if (showPessimistic) add(true, 'info', 'viewingPessimistic');
  if (pessimistic.netIncome < target)
    add(true, 'warn', 'pessimisticBelowTarget', {
      result: formatPln(pessimistic.netIncome),
      gap: formatPln(target - pessimistic.netIncome),
      target: formatPln(target),
    });
  else
    add(false, 'ok', 'pessimisticAboveTarget', {
      result: formatPln(pessimistic.netIncome),
      target: formatPln(target),
    });
  if (
    pessimistic.weeklyHoursPeak > params.weeklyHoursLimit &&
    results.weeklyHoursPeak <= params.weeklyHoursLimit
  )
    add(true, 'warn', 'pessimisticPeakOverLimit', {
      peak: formatNumber(pessimistic.weeklyHoursPeak, 0),
      limit: formatNumber(params.weeklyHoursLimit, 0),
    });
  if (!warnings.some(warning => warning.level === 'bad'))
    add(true, 'ok', 'planFits', {
      area: formatNumber(params.ownedHa + params.leasedHa, 1),
      net: formatPln(results.netIncome),
      hours: formatNumber(results.totalHours, 0),
      percent: formatNumber(results.labourUtilisation * 100, 0),
      homeValue: formatPln(results.homeUseTotal),
    });

  byId('warnings').innerHTML = warnings
    .map(warning => `<div class="w ${warning.level}"><span>${escapeHtml(warning.text)}</span></div>`)
    .join('');
}

    { id: 'pasture', hectares: params.pastureHa, color: 'var(--color-pasture)' },
    { id: 'meadow', hectares: params.meadowHa, color: 'var(--color-meadow)' },
    { id: 'clover', hectares: results.cloverHa, color: 'var(--color-clover)' },
    { id: 'cereals', hectares: results.cerealHa, color: 'var(--color-cereal)' },

    { id: 'marketGarden', hectares: params.marketGardenHa, color: 'var(--color-other)' },

  const barTotal = Math.max(
    totalHa,
    sumBy(segments, segment => segment.hectares)
  );
  const label = segment => escapeHtml(t(`landUse.${segment.id}`));

    element('div', {
      style: `width:${(segment.hectares / barTotal) * 100}%;background:${segment.color}`,
      title: `${label(segment)}: ${hectares(segment)}`,

    element(

      {},
      element('i', { style: `background:${segment.color}` }) +

function renderFeedBalance(results) {
  // straw replaced by sawdust or wood chips counts as covered, as in the KPI bar and the model
  const strawReplacedBySawdust = params.sawdustForStraw ? Math.max(0, -results.strawBalanceBeforeSawdust) : 0;
  const rows = [
    {
      id: 'pasture',
      need: results.grazingNeed,

      color: 'var(--color-pasture)',

    },
    {

      need: results.grainNeed,
      supply: results.grainSupply - results.grainSoldTonnes,
      color: 'var(--color-cereal)',
      unit: 'tonnes',
    },
    {
      id: 'straw',
      need: results.strawNeed,
      supply: results.strawSupply + strawReplacedBySawdust,
      color: 'var(--color-sheep)',

    },
  ];
  const housedDays = 365 - params.grazingDays;
  byId('feed-balance').innerHTML = rows.map(row => feedRowHtml(row, housedDays)).join('');

  const notes = [];
  if (results.hayFromPasture > 0.1)
    notes.push(t('feedBalance.hayFromPasture', { tonnes: formatNumber(results.hayFromPasture, 1) }));
  if (results.grainSoldTonnes > 0.05)
    notes.push(
      t(results.grainNeed < 0.05 ? 'feedBalance.grainSoldAll' : 'feedBalance.grainSold', {
        harvest: formatNumber(results.grainSupply, 1),
        sold: formatNumber(results.grainSoldTonnes, 1),
        reserve: params.feedReserveShare,
      })
    );
  if (results.strawPloughedTonnes > 0.05 && results.grainNeed >= 0.05)
    notes.push(t('feedBalance.strawPloughed', { tonnes: formatNumber(results.strawPloughedTonnes, 1) }));
  if (strawReplacedBySawdust > 0.05)
    notes.push(
      t('feedBalance.sawdustCovers', {
        straw: formatNumber(strawReplacedBySawdust, 1),
        sawdust: formatNumber(results.sawdustTonnes, 1),
      })
    );
  if (results.wheyGrainSaved > 0.005)
    notes.push(t('feedBalance.wheyForPigs', { kg: formatNumber(results.wheyGrainSaved * 1000, 0) }));
  notes.push(
    t('feedBalance.ownCost', {
      grain: formatNumber(results.grainCostPerTonne, 0),

  byId('feed-note').textContent = notes.join(' ');

function feedRowHtml(row, housedDays) {
  const scale = Math.max(row.need, row.supply, 0.01);
  const balance = row.supply - row.need;
  const status = balance < -0.05 ? 'bad' : balance < row.need * 0.05 ? 'warn' : 'ok';
  const unit = t(`feedBalance.units.${row.unit}`);
  const amount = value => `${formatNumber(value, 1)} ${unit}`;
  const sign = balance >= 0 ? '+' : '−';
  const bar = (className, widthShare, background) =>
    element('div', {
      class: className,
      style: `width:${widthShare * 100}%` + (background ? `;background:${background}` : ''),
    });
  const label = element(
    'div',
    { class: 'fl' },
    t(`feedBalance.${row.id}.label`) +
      element('span', {}, t(`feedBalance.${row.id}.detail`, { days: housedDays }))
  );
  const numbers = element(
    'div',
    { class: 'fnums' },
    element('span', {}, t('feedBalance.need', { amount: amount(row.need) })) +
      element('span', {}, t('feedBalance.supply', { amount: amount(row.supply) }))
  );
  const bars = element(
    'div',
    { class: 'fbars' },
    bar('fb need', row.need / scale) + bar('fb', row.supply / scale, row.color) + numbers
  );
  const pill = element(
    'div',
    { class: `pill ${status}` },
    sign + t('units.tonnes', { value: formatNumber(Math.abs(balance), 1) })
  );
  return element('div', { class: 'frow' }, label + bars + pill);
}

/** Dashed line carrying the running total from one bar to the next. */
function waterfallConnector(fromX, toX, y) {
  return element('line', {
    x1: fromX,
    x2: toX,
    y1: y,
    y2: y,
    stroke: 'var(--muted)',
    'stroke-dasharray': '3 3',
  });
}

function renderWaterfall(results) {
  const { revenue: sales, subsidies, costs, depreciation, netIncome } = results;
  const chart = { width: 640, height: 250, padLeft: 10, padRight: 10, padTop: 26, padBottom: 36 };
  const top = Math.max(sales + subsidies, 1);
  const bottom = Math.min(0, netIncome);
  const plotHeight = chart.height - chart.padTop - chart.padBottom;
  const y = value => chart.padTop + ((top - value) / (top - bottom)) * plotHeight;

  // each bar runs from `from` to `to`; costs and depreciation show their amount as negative
  const bars = [
    { id: 'sales', from: 0, to: sales, color: 'var(--accent)' },
    { id: 'subsidies', from: sales, to: sales + subsidies, color: 'var(--color-fields)' },
    {
      id: 'costs',
      from: sales + subsidies,
      to: sales + subsidies - costs,
      value: -costs,
      color: 'var(--bad)',
    },
    {
      id: 'depreciation',
      from: sales + subsidies - costs,
      to: netIncome,
      value: -depreciation,
      color: 'var(--warn)',
    },
    { id: 'net', from: 0, to: netIncome, color: netIncome >= 0 ? 'var(--ok)' : 'var(--bad)' },
  ];
  const slot = (chart.width - chart.padLeft - chart.padRight) / bars.length;
  let svg = horizontalLine(chart, y(0), { class: 'grid' });
  bars.forEach((bar, index) => {
    if (bar.value === undefined) bar.value = bar.to - bar.from;
    const label = t(`money.waterfall.${bar.id}`);
    const x = chart.padLeft + index * slot + slot * 0.18;
    const width = slot * 0.64;
    const yTop = y(Math.max(bar.from, bar.to));
    const yBottom = y(Math.min(bar.from, bar.to));
    const thousands = t('units.thousandsPln', { value: formatNumber(Math.abs(bar.value) / 1000, 0) });
    const isLast = index === bars.length - 1;

    svg += withTooltip(
      'rect',
      { x, y: yTop, width, height: Math.max(1, yBottom - yTop), fill: bar.color, rx: 2 },
      `${label}: ${formatPlnExact(bar.value)}`
    );
    if (!isLast) svg += waterfallConnector(x + width, x + slot, y(bar.to));
    svg += element(
      'text',
      { x: x + width / 2, y: yTop - 7, 'text-anchor': 'middle', 'font-size': 13, class: 'num' },
      (bar.value < 0 ? '−' : '') + thousands
    );
    svg += axisText(x + width / 2, chart.height - 12, label, 'middle');
  });
  byId('waterfall').innerHTML = svg;
}

/**
 * Table with one row per item above 0.5 zł and a total row.
 * @param {object} table
 * @param {string} table.header - first column title
 * @param {string} table.valueHeader - amount column title
 * @param {object} table.items - amount per item id
 * @param {(item: string) => string} table.label
 * @param {(item: string) => string} [table.detail] - small text under the label
 * @param {(item: string) => ?string} [table.rowClass] - class of the label cell
 * @param {string} [table.extraRows] - rows added before the total
 * @param {string} table.totalLabel
 * @param {number} table.total
 */
function itemsTableHtml(table) {
  const header = tableHeader([table.header, table.valueHeader]);
  const rows = Object.entries(table.items)
    .filter(([, amount]) => amount > 0.5)
    .map(([item, amount]) => {
      const detail = table.detail && table.detail(item);
      const detailHtml = detail ? '<br>' + element('span', { class: 'small muted' }, detail) : '';
      const rowAttributes = table.rowClass ? { class: table.rowClass(item) } : {};
      return tableRow([
        cell(table.label(item) + detailHtml, rowAttributes),
        numberCell(formatPlnExact(amount)),
      ]);
    });
  const totalRow = tableRow([cell(table.totalLabel), numberCell(formatPlnExact(table.total))], {
    class: 'tot',
  });
  return header + tableBody([...rows, table.extraRows || '', totalRow]);
}

// ===== ui/panels/household.js =====
// Panel "Household budget": family spending, child benefit, safety margin and how the farm's
// result compares with what the family needs.

function renderHouseholdBudget(results, pessimistic) {
  const budget = results.householdBudget;
  const perMonth = amount => t('household.perMonth', { amount: formatPlnExact(amount) });
  const rows = [
    [
      t('household.spending'),
      budget.spending,
      t('household.spendingDetail', { amount: formatNumber(params.householdMonthlySpending, 0) }),
    ],
    [t('household.margin', { percent: params.householdSafetyMargin }), budget.margin, ''],
    [t('household.savings'), budget.savings, ''],
    [
      t('household.childBenefit'),
      -budget.childBenefit,
      t('household.childBenefitDetail', {
        children: params.childBenefitChildren,
        amount: CHILD_BENEFIT_PER_MONTH,
      }),
    ],
  ];

  const amountCell = (amount, isNegative = amount < 0) => numberCell(formatPlnExact(amount), isNegative);
  const noteCell = note => cell(note, { class: 'small muted' });
  const summaryRow = (label, amount, attributes = {}) =>
    tableRow([cell(label), amountCell(amount, false), noteCell(perMonth(amount / 12))], attributes);

  const header = tableHeader([t('household.item'), t('money.perYear'), ''], index => index === 1);
  const body = [
    ...rows.map(([label, amount, note]) => tableRow([cell(label), amountCell(amount), noteCell(note)])),
    summaryRow(t('household.required'), budget.required, { class: 'tot' }),
    summaryRow(t('household.withoutChildBenefit'), budget.withoutChildBenefit),
    summaryRow(t('household.realisticResult'), results.netIncome),
    tableRow([
      cell(t('household.pessimisticResult')),
      amountCell(pessimistic.netIncome, pessimistic.netIncome < budget.required),
      noteCell(perMonth(pessimistic.netIncome / 12)),
    ]),
  ];
  byId('household-table').innerHTML = header + tableBody(body);

  byId('household-note').textContent = householdNote(results, pessimistic);
}

/** Whether the pessimistic result covers the family's needs, and how the target is set. */
function householdNote(results, pessimistic) {
  const budget = results.householdBudget;
  const surplus = pessimistic.netIncome - budget.required;
  const coverage =
    surplus >= 0
      ? t('household.surplus', { amount: formatPln(surplus) })
      : t('household.shortfall', { amount: formatPln(-surplus) });
  const yearsOfSpending =
    budget.spending > 0
      ? formatNumber((pessimistic.netIncome + budget.childBenefit) / budget.spending, 1)
      : '–';
  const summary = t('household.summary', {
    ratio: yearsOfSpending,
    depreciation: formatPln(results.depreciation),
  });
  const target = t(
    params.targetFromHouseholdBudget ? 'household.targetFromBudget' : 'household.targetSetDirectly'
  );
  return [coverage, summary, target].join(' ');
}

    .map((column, index) => `<th${index ? ' class="n"' : ''}>${t(`enterprisesTable.columns.${column}`)}</th>`)
    .join('');
  const negativeClass = value => (value < 0 ? ' neg' : '');
  const cell = (value, extraClass = '') => `<td class="n${extraClass}">${value}</td>`;

  let html = `<thead><tr>${header}</tr></thead><tbody>`;
  for (const enterprise of results.enterprises.filter(item => item.active)) {
    const hasSales = enterprise.revenue > 0;
    html +=
      `<tr><td>${escapeHtml(t(`enterprises.${enterprise.labelKey}`))}</td>` +
      cell(
        hasSales && enterprise.netPerHa !== null ? formatNumber(enterprise.netPerHa, 0) : '–',
        negativeClass(enterprise.netPerHa || 0)
      ) +
      cell(hasSales ? formatNumber(enterprise.netPerHour, 0) : '–', negativeClass(enterprise.netPerHour)) +
      cell(formatPlnExact(enterprise.net), negativeClass(enterprise.net)) +
      cell(
        enterprise.landHa > 0.005 ? t('units.hectares', { value: formatNumber(enterprise.landHa, 2) }) : '–'
      ) +
      cell(formatNumber(enterprise.hours, 0)) +
      cell(formatPlnExact(enterprise.revenue)) +
      cell(formatPlnExact(enterprise.cost)) +
      cell(formatPlnExact(enterprise.depreciation)) +
      cell(formatPlnExact(enterprise.subsidy)) +
      `</tr>`;
  }
  html +=
    `<tr class="sub"><td>${t('enterprisesTable.unallocated')}</td>` +
    cell('') +
    cell('') +
    cell(formatPlnExact(results.unallocated.net)) +
    cell('') +
    cell(formatNumber(results.unallocated.hours, 0)) +
    cell('') +
    cell('') +
    cell('') +
    cell('') +
    `</tr>`;
  html +=
    `<tr class="tot"><td>${t('enterprisesTable.farm')}</td>` +
    cell(formatNumber(results.netIncome / results.farmedHa, 0)) +
    cell(formatNumber(results.netPerHour, 0)) +
    cell(formatPlnExact(results.netIncome)) +
    cell(t('units.hectares', { value: formatNumber(results.farmedHa, 1) })) +
    cell(formatNumber(results.totalHours, 0)) +
    cell(formatPlnExact(results.revenue)) +
    cell('') +
    cell(formatPlnExact(results.depreciation)) +
    cell(formatPlnExact(results.subsidies)) +
    `</tr></tbody>`;
  byId('enterprises-table').innerHTML = html;

  const items = results.subsidyItems;
  const areaPayments =
    items.basicPayment +
    items.redistributive +
    items.organic +
    items.livestockBonus +
    items.lessFavouredArea +
    items.extensiveGrassland +
    items.youngFarmer;
  byId('enterprises-note').textContent = t('enterprisesTable.note', {
    perHa: formatNumber(areaPayments / Math.max(0.01, results.farmedHa), 0),
  });
}

// ===== ui/panels/labour.js =====
// Panel "Working time": hours per month stacked by activity group against the family's time
// and the weekly limit, and a table of hours per activity.

const LABOUR_CHART = { width: 640, height: 270, padLeft: 44, padRight: 10, padTop: 14, padBottom: 30 };

function renderLabour(results) {
  renderLabourChart(results);

  byId('labour-legend').innerHTML = LABOUR_GROUPS.map(
    group => `<span><i style="background:${group.color}"></i>${t(`labourGroups.${group.id}`)}</span>`
  ).join('');

  byId('labour-summary').textContent = t('labour.summary', {
    average: formatNumber(results.weeklyHoursAverage, 0),
    peak: formatNumber(results.weeklyHoursPeak, 0),
    available: formatNumber(results.availableHours / 52, 0),
  });

  renderLabourTable(results);
}

function renderLabourChart(results) {
  const chart = LABOUR_CHART;
  const familyHoursPerMonth = results.availableHours / 12;
  const limitPerMonth = params.weeklyHoursLimit * WEEKS_PER_MONTH;
  const max = Math.max(results.peakMonthHours, familyHoursPerMonth, limitPerMonth, 1);
  const step = niceAxisStep(max);
  const top = Math.ceil(max / step) * step;
  const y = hours => chart.padTop + (1 - hours / top) * (chart.height - chart.padTop - chart.padBottom);
  const right = chart.width - chart.padRight;
  const monthLabels = messages('months.numerals');

  let svg = '';
  for (let hours = 0; hours <= top + 1e-9; hours += step) {
    svg += horizontalLine(chart, y(hours), { class: 'grid' });
    svg += axisText(chart.padLeft - 6, y(hours) + 4, formatNumber(hours, 0), 'end');
  }

  const slot = (chart.width - chart.padLeft - chart.padRight) / 12;
  results.monthlyHours.forEach((month, index) => {
    const x = chart.padLeft + index * slot + slot * 0.16;
    const width = slot * 0.68;
    let stacked = 0;
    for (const group of LABOUR_GROUPS) {
      const hours = month[group.id];
      if (hours <= 0) continue;
      const tooltip = t('labour.barTooltip', {
        month: monthLabels[index],
        group: t(`labourGroups.${group.id}`),
        hours: formatNumber(hours, 0),
      });
      const bar = {
        x,
        y: y(stacked + hours),
        width,
        height: Math.max(0.5, y(stacked) - y(stacked + hours)),
        fill: group.color,
      };
      svg += withTooltip('rect', bar, tooltip);
      stacked += hours;
    }
    svg += axisText(x + width / 2, chart.height - 10, monthLabels[index], 'middle');
  });

  if (familyHoursPerMonth > 0) {
    const familyY = y(familyHoursPerMonth);
    const label = t('labour.familyTime', { hours: formatNumber(familyHoursPerMonth, 0) });
    svg += horizontalLine(chart, familyY, {
      stroke: 'var(--ink)',
      'stroke-width': 1.5,
      'stroke-dasharray': '6 4',
    });
    svg += element('text', { x: right, y: familyY - 5, 'text-anchor': 'end', 'font-size': 12 }, label);
  } else {
    svg += axisText(right, chart.padTop + 12, t('labour.axisLabel'), 'end');
  }

  const limitY = y(limitPerMonth);
  const limitLabel = t('labour.yourLimit', { hours: formatNumber(params.weeklyHoursLimit, 0) });
  svg += horizontalLine(chart, limitY, {
    stroke: 'var(--bad)',
    'stroke-width': 1.5,
    'stroke-dasharray': '2 4',
  });
  svg += element(
    'text',
    { x: chart.padLeft + 6, y: limitY - 5, 'font-size': 12, fill: 'var(--bad)' },
    limitLabel
  );

  byId('labour-chart').innerHTML = svg;
}

function renderLabourTable(results) {
  const activities = Object.entries(results.hoursByActivity)
    .filter(([, hours]) => hours > 0.5)
    .sort((a, b) => b[1] - a[1]);
  const columns = ['activity', 'perYear', 'perWeek', 'share'];
  const percent = value => t('units.percent', { value });

  const rows = activities.map(
    ([activity, hours]) =>
      `<tr><td>${t(`labour.activities.${activity}`)}</td>` +
      numberCell(formatNumber(hours, 0)) +
      numberCell(formatNumber(hours / 52, 1)) +
      numberCell(percent(formatNumber((hours / results.totalHours) * 100, 0))) +
      '</tr>'
  );
  const totalRow =
    `<tr class="tot"><td>${t('money.total')}</td>` +
    numberCell(formatNumber(results.totalHours, 0)) +
    numberCell(formatNumber(results.weeklyHoursAverage, 1)) +
    numberCell(percent(100)) +
    '</tr>';

  const header = tableHeader(columns.map(column => t(`labour.columns.${column}`)));
  byId('labour-table').innerHTML = `${header}<tbody>${rows.join('')}${totalRow}</tbody>`;
}

// ===== ui/panels/investments.js =====
// Panel "Investments": amounts tied two-way to the unit-price sliders. Typing a total sets the
// unit price so that quantity × price equals the typed amount.

const INVESTMENT_COLUMNS = ['investment', 'cost', 'unitPrice', 'years', 'perYear'];

function renderInvestments(results) {
  // do not rebuild the table while the user is typing in it
  if (document.activeElement && document.activeElement.classList.contains('inv-in')) return;

  const header = tableHeader(INVESTMENT_COLUMNS.map(column => t(`investmentsTable.columns.${column}`)));
  const rows = results.investmentItems.filter(item => item.quantity > 0).map(investmentRow);
  rows.push(
    tableRow(
      [
        cell(t('money.total')),
        cell(formatPlnExact(results.capex), { class: 'n' }),
        cell(''),
        cell('', { class: 'n' }),
        cell(formatPlnExact(results.depreciation), { class: 'n' }),
      ],
      { class: 'tot' }
    )
  );
  byId('investments-table').innerHTML = header + tableBody(rows);

  document
    .querySelectorAll('[data-investment]')
    .forEach(input => input.addEventListener('change', () => setInvestmentTotal(results, input)));
  document
    .querySelectorAll('[data-investment-years]')
    .forEach(input =>
      input.addEventListener('change', () => setParamFromInput(input.dataset.investmentYears, input))
    );
}

function investmentRow(item) {
  const label = escapeHtml(t(`investments.${item.id}`));
  const costInput = voidElement('input', {
    class: 'inv-in',
    type: 'number',
    min: 0,
    step: 500,
    inputmode: 'numeric',
    'data-investment': item.id,
    value: Math.round(item.cost),
    'aria-label': t('investmentsTable.costLabel', { investment: label }),
  });

  return tableRow([
    cell(label),
    cell(costInput, { class: 'n' }),
    cell(unitPriceText(item), { class: 'n small muted' }),
    cell(item.lifetimeParam ? lifetimeInput(item, label) : item.lifetimeYears, { class: 'n' }),
    cell(formatPlnExact(item.yearlyDepreciation), { class: 'n' }),
  ]);
}

/** Editable lifetime of the "other investments" row. */
function lifetimeInput(item, label) {
  const parameter = parameterById(item.lifetimeParam);
  return voidElement('input', {
    class: 'inv-in inv-years',
    type: 'number',
    min: parameter.min,
    max: parameter.max,
    step: 1,
    inputmode: 'numeric',
    'data-investment-years': item.lifetimeParam,
    value: item.lifetimeYears,
    'aria-label': t('investmentsTable.yearsLabel', { investment: label }),
  });
}

/** "price × quantity" for investments bought in more than one unit. */
function unitPriceText(item) {
  if (item.quantity === 1) return '';

  const price = formatParameterValue(parameterById(item.priceParam), params[item.priceParam]);
  const quantity = formatNumber(item.quantity, item.quantity < 10 ? 1 : 0);
  return `${price} × ${quantity}`;
}

/** Sets a parameter from a typed number, kept within the parameter's range. */
function setParamFromInput(id, input) {
  const parameter = parameterById(id);
  const value = parseFloat(input.value);
  if (!isFinite(value)) return;

  params[id] = Math.min(parameter.max, Math.max(parameter.min, value));
  syncInputs();
  input.blur();
  onParamsChanged();
}

function setInvestmentTotal(results, input) {
  const item = results.investmentItems.find(candidate => candidate.id === input.dataset.investment);
  const total = parseFloat(input.value);
  if (!item || !isFinite(total) || total < 0 || item.quantity <= 0) return;

  const id = item.priceParam;
  params[id] = Math.round((total / item.quantity) * 100) / 100;

  const slider = byId('input-' + id);
  if (slider) {
    slider.value = params[id];
    byId('output-' + id).textContent = formatParameterValue(parameterById(id), params[id]);
  }
  input.blur();
  onParamsChanged();
}

// ===== ui/panels/comparison.js =====
// Section "Compare variants": every preset and saved variant under realistic assumptions and in the
// pessimistic scenario, with a button that loads it.

function renderComparison() {
  const realistic = assumptionSetById('realistic').params;
  const target = computeIncomeTarget(params);
  const columns = [
    'variant',
    'netRealistic',
    'netPessimistic',
    'hours',
    'peakPessimistic',
    'investments',
    'feed',
    'load',
  ];
  let html = tableHeader(
    columns.map(column => (column === 'load' ? '' : t(`comparison.columns.${column}`))),
    index => index > 0 && index < 6
  );
  html += '<tbody>';

  for (const preset of PRESETS) {
    const variantParams = { ...params, ...preset.params, ...realistic };
    html += comparisonRowHtml({
      title: t(`presets.${preset.id}.label`),
      subtitle: t(`presets.${preset.id}.note`),
      variantParams,
      target,
      showShortageDetails: true,
      loadButtonData: { 'data-load-preset': preset.id },
    });
  }
  savedVariants.forEach((variant, index) => {
    html += comparisonRowHtml({
      title: variant.name,
      subtitle: t('comparison.savedVariant'),
      variantParams: { ...defaultParams(), ...variant.params },
      target,
      showShortageDetails: false,
      loadButtonData: { 'data-load-saved': index },
    });
  });
  byId('comparison-table').innerHTML = html + `</tbody>`;

  const loadAndScroll = values => {
    applyParams(values);
    byId('controls').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  document.querySelectorAll('[data-load-saved]').forEach(button =>
    button.addEventListener('click', () => {
      endHistoryStep();
      params = { ...defaultParams(), ...savedVariants[+button.dataset.loadSaved].params };
      loadAndScroll({});
    })
  );
  document
    .querySelectorAll('[data-load-preset]')
    .forEach(button =>
      button.addEventListener('click', () => loadAndScroll(presetById(button.dataset.loadPreset).params))
    );
}

function comparisonRowHtml({ title, subtitle, variantParams, target, showShortageDetails, loadButtonData }) {
  const realistic = simulateFarm(variantParams);
  const pessimistic = simulateFarm(applyPessimisticScenario(variantParams));
  const feedCell = showShortageDetails
    ? feedStatusHtml(realistic, 'bad', 'comparison.missing') +
      ' ' +
      (feedIsSufficient(pessimistic)
        ? ''
        : feedStatusHtml(pessimistic, 'warn', 'comparison.missingPessimistic'))
    : feedIsSufficient(realistic)
      ? element('span', { class: 'pill ok' }, t('comparison.enough'))
      : element('span', { class: 'pill bad' }, t('comparison.missingShort'));
  const titleHtml =
    element('b', {}, escapeHtml(title)) +
    '<br>' +
    element('span', { class: 'small muted' }, escapeHtml(subtitle));
  const loadButton = element(
    'button',
    { class: 'btn', type: 'button', ...loadButtonData },
    t('comparison.load')
  );

  return tableRow([
    cell(titleHtml),
    numberCell(formatPln(realistic.netIncome)),
    numberCell(formatPln(pessimistic.netIncome), pessimistic.netIncome < target),
    numberCell(formatNumber(realistic.totalHours, 0)),
    numberCell(
      formatNumber(pessimistic.weeklyHoursPeak, 0),
      pessimistic.weeklyHoursPeak > params.weeklyHoursLimit
    ),
    numberCell(formatPln(realistic.capex)),
    cell(feedCell),
    cell(loadButton),
  ]);
}

const feedIsSufficient = results =>
  results.grainBalance >= -0.05 && results.hayBalance >= -0.05 && results.strawBalance >= -0.05;

/** "enough" pill, or a pill listing the missing grain, hay and straw. */
function feedStatusHtml(results, level, missingKey) {
  if (feedIsSufficient(results))
    return level === 'bad' ? `<span class="pill ok">${t('comparison.enough')}</span>` : '';
  const shortages = [
    ['grain', results.grainBalance],
    ['hay', results.hayBalance],
    ['straw', results.strawBalance],
  ]
    .filter(([, balance]) => balance < -0.05)
    .map(([feed, balance]) => t(`comparison.shortage.${feed}`, { tonnes: formatNumber(-balance, 1) }))
    .join(', ');
  return `<span class="pill ${level}">${t(missingKey, { items: shortages })}</span>`;
}

// ===== ui/panels/cashflow.js =====
// Panel "Cash flow": table and chart month by month, with the bank balance.

const CASHFLOW_CHART = { width: 640, height: 230, padLeft: 56, padRight: 10, padTop: 14, padBottom: 40 };

function renderCashflow(results) {
  const cashflow = results.cashflow;
  renderOpeningCash(cashflow);
  renderCashflowTable(cashflow);
  renderCashflowChart(cashflow);

  const lowestBalance = t('cashflow.lowestBalance', {
    month: messages('months.names')[cashflow.minBalanceMonth].toLowerCase(),
    amount: formatPln(cashflow.minBalance),
  });
  const warning = cashflow.minBalance < 0 ? t('cashflow.belowZero') + ' ' : '';
  const explanation = t('cashflow.explanation', { household: formatPln(cashflow.householdDraw) });
  byId('cashflow-note').textContent = `${lowestBalance} ${warning}${explanation}`;
}

function renderCashflowTable(cashflow) {
  const monthNames = messages('months.names');
  const columns = ['month', 'sales', 'subsidies', 'costs', 'result', 'household', 'balance'];
  const money = (amount, canBeNegative = false) => numberCell(formatPln(amount), canBeNegative && amount < 0);
  const totals = { inflows: 0, subsidy: 0, outflows: 0, household: 0 };

  const rows = cashflow.months.map((month, index) => {
    for (const field in totals) totals[field] += month[field];
    const selected = index === cashflow.minBalanceMonth ? 'sel' : '';
    return (
      `<tr class="${selected}"><td>${monthNames[index]}</td>` +
      money(month.inflows) +
      money(month.subsidy) +
      money(month.outflows) +
      money(month.netIncome, true) +
      money(month.household) +
      money(month.balance, true) +
      '</tr>'
    );
  });
  const totalRow =
    `<tr class="tot"><td>${t('cashflow.year')}</td>` +
    money(totals.inflows) +
    money(totals.subsidy) +
    money(totals.outflows) +
    money(totals.inflows + totals.subsidy - totals.outflows) +
    money(totals.household) +
    money(cashflow.closingBalance) +
    '</tr>';

  const header = tableHeader(columns.map(column => t(`cashflow.columns.${column}`)));
  byId('cashflow-table').innerHTML = `${header}<tbody>${rows.join('')}${totalRow}</tbody>`;
}

/** Bars: the month's result after the household draw; line: the bank balance. */
function renderCashflowChart(cashflow) {
  const chart = CASHFLOW_CHART;
  const monthNames = messages('months.names');
  const numerals = messages('months.numerals');
  const slot = (chart.width - chart.padLeft - chart.padRight) / 12;
  const afterHousehold = cashflow.months.map(month => month.netIncome - month.household);
  const balances = cashflow.months.map(month => month.balance);
  const low = Math.min(0, ...afterHousehold, ...balances, params.openingCash);
  const high = Math.max(1, ...afterHousehold, ...balances, params.openingCash);
  const y = value =>
    chart.padTop + ((high - value) / (high - low)) * (chart.height - chart.padTop - chart.padBottom);
  const slotCentre = index => chart.padLeft + index * slot + slot / 2;

  let svg = '';
  const step = niceAxisStep(high - low);
  for (let value = Math.ceil(low / step) * step; value <= high; value += step) {
    const label = t('units.thousandsPln', { value: formatNumber(value / 1000, 0) });
    svg += horizontalLine(chart, y(value), { stroke: 'var(--line)' });
    svg += axisText(chart.padLeft - 6, y(value) + 4, label, 'end');
  }
  svg += horizontalLine(chart, y(0), { stroke: 'var(--muted)' });

  afterHousehold.forEach((value, index) => {
    const tooltip = t('cashflow.barTooltip', { month: monthNames[index], amount: formatPln(value) });
    const bar = {
      x: chart.padLeft + index * slot + slot * 0.2,
      y: Math.min(y(value), y(0)),
      width: slot * 0.6,
      height: Math.max(1, Math.abs(y(value) - y(0))),
      fill: value < 0 ? 'var(--bad)' : 'var(--color-cattle)',
      opacity: '.75',
    };
    svg += withTooltip('rect', bar, tooltip);
    svg += axisText(slotCentre(index), chart.height - chart.padBottom + 16, numerals[index], 'middle');
  });

  const balancePoints = balances.map((value, index) => `${slotCentre(index)},${y(value)}`).join(' ');
  svg += element('polyline', {
    fill: 'none',
    stroke: 'var(--ink)',
    'stroke-width': 2,
    points: balancePoints,
  });
  balances.forEach((value, index) => {
    const tooltip = t('cashflow.balanceTooltip', { month: monthNames[index], amount: formatPln(value) });
    svg += withTooltip('circle', { cx: slotCentre(index), cy: y(value), r: 3, fill: 'var(--ink)' }, tooltip);
  });
  svg += axisText(chart.padLeft, chart.height - 4, t('cashflow.legend'));

  byId('cashflow-chart').innerHTML = svg;
}

/**
 * Field for the money on the farm account on 1 January, the starting point of the balance.
 * It is the same value as the "openingCash" slider in the household group.
 */
function renderOpeningCash(cashflow) {
  const container = byId('opening-cash');
  const input = container.querySelector('input');
  if (input && document.activeElement === input) return; // the user is typing

  const parameter = parameterById('openingCash');
  const field = voidElement('input', {
    id: 'opening-cash-input',

  const closing = t('cashflow.openingCash.closing', {
    closing: formatPln(cashflow.closingBalance),
    change:
      (cashflow.closingBalance >= params.openingCash ? '+' : '−') +

  });

  container.innerHTML =
    element(
      'label',
      { class: 'opening-cash-field', for: 'opening-cash-input' },
      element('span', { class: 'opening-cash-title' }, t('cashflow.openingCash.title')) +

    ) + element('p', { class: 'small muted' }, t('cashflow.openingCash.description') + ' ' + closing);

  byId('opening-cash-input').addEventListener('change', event =>
    setParamFromInput('openingCash', event.target)
