    replacementHeifers: replacementHeifers * 0.6,
    bull: bulls,
    sheep: params.sheep * 0.1,
    goats: params.goats * 0.1,
    horses: params.horses * 0.8,
    beefCattle: sucklerCows + finishers * 0.9 + beefHeifers * 0.6,
    layingHens: params.layingHens * 0.014,
    broilers: (params.broilers / 4) * 0.007,
    geese: params.geese * 0.02 * 0.5,
    ducks: (params.ducks / 2) * 0.004,
    turkeys: params.turkeys * 0.6 * 0.03,
    guineaFowl: params.guineaFowl * 0.5 * 0.004,
    pigs: params.pigs * 0.3 * 0.6, // fatteners live about seven months of the year
    rabbits: params.rabbits * 0.02,
  };
  const units = livestockUnitsByAnimal;
  const livestockUnits = sumValues(units);
  const grazingUnits = units.dairyCows + units.replacementHeifers + units.bull + units.sheep + units.goats;
  return {
    livestockUnitsByAnimal,
    livestockUnits,
    livestockUnitsPerHa: farmedHa > 0 ? livestockUnits / farmedHa : 0,
    grasslandStocking: grasslandHa > 0 ? (grazingUnits + units.horses + units.beefCattle) / grasslandHa : 0,
  };
}

// ===== model/stages/feed-balance.js =====
// Feed balance: forage, grain and straw produced on the farm against what the animals need.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Forage (tonnes of dry matter per year) ----------

/** Dry matter per head and year (t) of the animals whose need does not depend on the breed. */
const FORAGE_PER_HEAD = {
  replacementHeifer: 3.3,
  bull: 5.0,
  eweBase: 0.55, // plus EWE_FORAGE_PER_LAMB for every lamb reared
  goat: 0.6,
  milkingGoatExtra: 0.15,
  rabbitDoe: 0.3,
  goose: 0.05,
  horse: 3.2,
  beefHeifer: 2.5,
  duck: 0.01,
  turkey: 0.04,
  guineaFowl: 0.005,
  pig: 0.15, // grass and roots eaten by pastured pigs
};
const EWE_FORAGE_PER_LAMB = 0.15;

function computeForageBalance(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers, lambsPerEwe, beefSystem } = results;
  const dairyBreed = DAIRY_BREEDS[params.dairyBreed] || DAIRY_BREEDS.extensive;
  const beefBreed = BEEF_BREEDS[params.beefBreed] || BEEF_BREEDS.extensive;
  const finisherForage = finishers * beefSystem.foragePerFinisherTonnes * beefBreed.youngStockDryMatterFactor;
  const forageNeedByAnimal = {
    dairyCows: params.dairyCows * dairyBreed.dryMatterPerCowTonnes,
    replacementHeifers: replacementHeifers * FORAGE_PER_HEAD.replacementHeifer,
    bull: bulls * FORAGE_PER_HEAD.bull,
    sheep: params.sheep * (FORAGE_PER_HEAD.eweBase + EWE_FORAGE_PER_LAMB * lambsPerEwe),
    goats:
      params.goats * (FORAGE_PER_HEAD.goat + (params.goatMilking ? FORAGE_PER_HEAD.milkingGoatExtra : 0)),
    rabbits: params.rabbits * FORAGE_PER_HEAD.rabbitDoe,
    geese: params.geese * FORAGE_PER_HEAD.goose,
    horses: params.horses * FORAGE_PER_HEAD.horse,
    beefCattle:
      sucklerCows * beefBreed.sucklerCowDryMatterTonnes +
      finisherForage +
      beefHeifers * FORAGE_PER_HEAD.beefHeifer * beefBreed.youngStockDryMatterFactor,
    ducks: params.ducks * FORAGE_PER_HEAD.duck,
    turkeys: params.turkeys * FORAGE_PER_HEAD.turkey,
    guineaFowl: params.guineaFowl * FORAGE_PER_HEAD.guineaFowl,
    pigs: params.pigs * FORAGE_PER_HEAD.pig,
  };
  const forageNeed = sumValues(forageNeedByAnimal);
  // finishers kept in the shed all year eat conserved forage only
  const housedForage = beefSystem.finishersGraze ? 0 : finisherForage;
  const grazingNeed = ((forageNeed - housedForage) * params.grazingDays) / 365;
  const winterNeed = forageNeed - grazingNeed + outwinteringHayWaste(params, forageNeedByAnimal, beefSystem);

  // sheep grazing after cattle use the pasture better
  const dairyHerd = params.dairyCows + replacementHeifers + bulls;
  const mixedGrazingFactor =
    params.sheep > 0 && dairyHerd > 0 ? Math.min(1, params.sheep / (1.5 * dairyHerd)) : 0;
  const pastureProduction =
    params.pastureHa * params.pastureYield * (1 + (params.mixedGrazingBonus / 100) * mixedGrazingFactor);
  const mixedGrazingGain =
    ((params.pastureHa * params.pastureYield * params.mixedGrazingBonus) / 100) * mixedGrazingFactor;

  const meadowHay = params.meadowHa * params.meadowYield * 0.75;
  const meadowGrazing = params.meadowHa * params.meadowYield * 0.25;
  const cloverHay = results.cloverHa * params.cloverYield;

  const rotation = computeRotation(params);
  const fieldHa = results.usableArableHa / rotation.fieldCount;
  const catchCropHa = params.catchCrops ? rotation.catchCropFields * fieldHa : 0;
  const undersownHa = params.catchCrops ? rotation.undersownFields * fieldHa : 0;
  const stubbleCropHa = params.stubbleCrop ? rotation.stubbleCropFields * fieldHa : 0;
  const coverCropForage =
    catchCropHa * params.catchCropForageYield + stubbleCropHa * params.stubbleCropForageYield;

  const grazingSupply = pastureProduction + meadowGrazing + coverCropForage;
  const grazingSurplus = grazingSupply - grazingNeed;
  const hayFromPasture = Math.max(0, grazingSurplus) * 0.7;
  const haySupply = meadowHay + cloverHay + hayFromPasture;
  const grazingDeficit = Math.max(0, -grazingSurplus);
  const hayNeedTotal = winterNeed + grazingDeficit;
  // roughage bought on purpose covers this part of the need, the rest has to come from the fields
  const boughtForageTonnes = (hayNeedTotal * params.boughtForageShare) / 100;
  const hayNeed = hayNeedTotal - boughtForageTonnes;

  return {
    forageNeedByAnimal,
    forageNeed,
    grazingNeed,
    winterNeed,
    mixedGrazingGain,
    grazingSupply,
    grazingSurplus,
    hayFromPasture,
    haySupply,
    hayNeedTotal,
    boughtForageTonnes,
    hayNeed,
    hayBalance: haySupply - hayNeed,
    meadowHay,
    cloverHay,
    rotation,
    fieldHa,
    catchCropHa,
    undersownHa,
    stubbleCropHa,
    coverCropForage,
  };
}

// ---------- Grain and straw (tonnes per year) ----------

/** Grain per head and year (t) of the animals whose grain is not set by a slider. */
const GRAIN_PER_HEAD = {
  goose: 0.012,
  ewePerLambing: 0.01,
  horse: 0.2,
  milkingGoat: 0.1,
};
/** Share of the feed of hens, broilers, ducks and other poultry that is the farm's own grain (the rest is minerals and grit). */
const HEN_GRAIN_SHARE = 0.9;
const BROILER_GRAIN_SHARE = 0.9;
const TURKEY_GRAIN_SHARE = 0.85;
/** Dry matter in a litre of whey or buttermilk, which replaces grain for pigs and hens. */
const BYPRODUCT_DRY_MATTER_PER_LITRE = 0.06;
/** Most of the grain that whey and buttermilk may replace: pigs and hens. */
const BYPRODUCT_MAX_SHARE_OF_PIG_GRAIN = 0.3;
const BYPRODUCT_MAX_SHARE_OF_HEN_GRAIN = 0.1;

function computeGrainBalance(params, results) {
  const { henReplacements, cockerels, finishers, beefSystem } = results;
  const kg = amount => amount / 1000;
  const grainNeedByAnimal = {
    layingHens:
      kg(params.layingHens * params.henFeedGramsPerDay) *
      0.365 *
      (1 - params.rangeFeedSaving / 100) *
      HEN_GRAIN_SHARE,
    hatching: params.ownHatching
      ? kg(henReplacements * params.pulletGrainKg + cockerels * params.cockerelGrainKg)
      : 0,
    broilers: kg(params.broilers * params.broilerFeedKg) * BROILER_GRAIN_SHARE,
    geese: params.geese * GRAIN_PER_HEAD.goose,
    ducks: kg(params.ducks * params.duckGrainKg) * BROILER_GRAIN_SHARE,
    turkeys: kg(params.turkeys * params.turkeyGrainKg) * TURKEY_GRAIN_SHARE,
    guineaFowl: kg(params.guineaFowl * params.guineaFowlGrainKg) * TURKEY_GRAIN_SHARE,
    dairyCows: kg(params.dairyCows * params.oatsPerCow),
    beefCattle: finishers * beefSystem.grainPerFinisherTonnes,
    pigs: kg(params.pigs * params.pigGrainKg),
    // a doe eats about 40 kg a year and each young rabbit about 3 kg until slaughter
    rabbits: kg(params.rabbits * (params.rabbitsRearedPerDoe * 3 + 40)),
    sheep: params.sheep * GRAIN_PER_HEAD.ewePerLambing * params.lambingsPerEwe,
    goats: params.goatMilking ? params.goats * GRAIN_PER_HEAD.milkingGoat : 0,
    horses: params.horses * GRAIN_PER_HEAD.horse,
  };

  // whey and buttermilk replace part of the pigs' grain, then a little of the hens'
  let byproductGrain =
    ((results.byproductsFedLitres + results.goatWheyLitres) * BYPRODUCT_DRY_MATTER_PER_LITRE) / 1000;
  const replaceGrain = (animal, maxShare) => {
    const replaced = Math.min(byproductGrain, grainNeedByAnimal[animal] * maxShare);
    grainNeedByAnimal[animal] -= replaced;
    byproductGrain -= replaced;
    return replaced;
  };
  const wheyGrainSaved =
    replaceGrain('pigs', BYPRODUCT_MAX_SHARE_OF_PIG_GRAIN) +
    replaceGrain('layingHens', BYPRODUCT_MAX_SHARE_OF_HEN_GRAIN);

  const grainNeedTotal = sumValues(grainNeedByAnimal);
  const boughtGrainTonnes = (grainNeedTotal * params.boughtConcentrateShare) / 100;
  const grainNeed = grainNeedTotal - boughtGrainTonnes;
  // fodder beet and potatoes replace grain in the rations at about their dry-matter energy
  const grainSupply = results.cerealHa * params.cerealYield + results.rootCropHa * params.rootCropYield;
  const grainSoldTonnes = surplusGrainForSale(params, grainSupply, grainNeed);
  return {
    grainNeedByAnimal,
    wheyGrainSaved,
    grainNeedTotal,
    boughtGrainTonnes,
    grainNeed,
    grainSupply,
    grainSoldTonnes,
    grainBalance: grainSupply - grainSoldTonnes - grainNeed,
  };
}

/**
 * Grain sold after harvest: everything above the animals' need plus a reserve for a poor year
 * (`feedReserveShare` percent of the need). Without animals all the grain is sold.
 */
function surplusGrainForSale(params, grainSupply, grainNeed) {
  if (!params.sellSurplusGrain) return 0;
  const kept = grainNeed * (1 + params.feedReserveShare / 100);
  return Math.max(0, grainSupply - kept);
}

/** Share of hay trampled and left when animals winter on bale grazing. */
const BALE_GRAZING_HAY_WASTE = 0.1;
/** Share of the winter bedding still needed with bale grazing (stormy days, calving, lambing). */
const BALE_GRAZING_BEDDING_SHARE = 0.3;
/** Forage-need keys of the cattle, sheep and goats that winter outside on bale grazing. */
const BALE_GRAZING_FORAGE_KEYS = ['dairyCows', 'replacementHeifers', 'bull', 'beefCattle', 'sheep', 'goats'];

/**
 * Hay trampled in winter by animals kept outside: all cattle, sheep and goats on bale grazing,
 * or the beef herd when it lives outside all year.
 */
function outwinteringHayWaste(params, forageNeedByAnimal, beefSystem) {
  const winterShare = (365 - params.grazingDays) / 365;
  const outsideKeys = params.baleGrazing
    ? BALE_GRAZING_FORAGE_KEYS
    : beefSystem.outwintering
      ? ['beefCattle']
      : [];
  return sumBy(outsideKeys, key => forageNeedByAnimal[key]) * winterShare * BALE_GRAZING_HAY_WASTE;
}

/** Straw for bedding per head and year (t) at REFERENCE_WINTER_DAYS of housing; poultry per bird. */
const STRAW_PER_HEAD = {
  dairyCow: 1.2,
  replacementHeifer: 0.6,
  bull: 0.8,
  ewe: 0.12,
  goat: 0.1,
  horse: 1.2,
  sucklerCow: 1.0,
  finisher: 0.8,
  beefHeifer: 0.6,
  layingHen: 0.006,
  broiler: 0.002,
  goose: 0.01,
  duck: 0.005,
  turkey: 0.015,
  guineaFowl: 0.002,
  pig: 0.3, // pastured pigs need bedding only in their huts
  rabbitDoe: 0.05,
};

function computeStrawBalance(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers, winterFactor, beefSystem } =
    results;
  const straw = STRAW_PER_HEAD;
  const beefWinterFactor = winterFactor * beefSystem.strawFactor;
  const strawNeedByAnimal = {
    dairyCows: params.dairyCows * straw.dairyCow * winterFactor,
    replacementHeifers: replacementHeifers * straw.replacementHeifer * winterFactor,
    bull: bulls * straw.bull * winterFactor,
    sheep: params.sheep * straw.ewe * winterFactor * (0.7 + 0.3 * params.lambingsPerEwe),
    goats: params.goats * straw.goat * winterFactor,
    horses: params.horses * straw.horse * winterFactor,
    beefCattle:
      (sucklerCows * straw.sucklerCow + finishers * straw.finisher + beefHeifers * straw.beefHeifer) *
      beefWinterFactor,
    layingHens: params.winterPolytunnel ? 0 : params.layingHens * straw.layingHen,
    broilers: params.broilers * straw.broiler,
    geese: params.geese * straw.goose,
    ducks: params.ducks * straw.duck,
    turkeys: params.turkeys * straw.turkey,
    guineaFowl: params.guineaFowl * straw.guineaFowl,
    pigs: params.pigs * straw.pig,
    rabbits: params.rabbits * straw.rabbitDoe,
  };
  if (params.baleGrazing)
    for (const key of BALE_GRAZING_FORAGE_KEYS.concat(['replacementHeifers', 'bull']))
      if (key in strawNeedByAnimal) strawNeedByAnimal[key] *= BALE_GRAZING_BEDDING_SHARE;
  const strawNeed = sumValues(strawNeedByAnimal);
  // straw beyond the need and the reserve stays on the field and is ploughed in
  const strawHarvest = results.cerealHa * params.strawYield;
  const strawPloughedTonnes = Math.max(0, strawHarvest - strawNeed * (1 + params.feedReserveShare / 100));
  const strawSupply = strawHarvest - strawPloughedTonnes;
  const strawBalanceBeforeSawdust = strawSupply - strawNeed;
  const sawdustTonnes =
    params.sawdustForStraw && strawBalanceBeforeSawdust < 0
      ? -strawBalanceBeforeSawdust * params.sawdustPerStrawTonne
      : 0;
  const strawBalance = params.sawdustForStraw
    ? Math.max(0, strawBalanceBeforeSawdust)
    : strawBalanceBeforeSawdust;
  return {
    strawNeedByAnimal,
    strawNeed,
    strawHarvest,
    strawPloughedTonnes,
    strawSupply,
    strawBalance,
    strawBalanceBeforeSawdust,
    sawdustTonnes,
  };
}

// ===== model/stages/nitrogen.js =====
// Nitrogen and carbon: how much nitrogen the animals produce, how much they spread themselves on
// the pasture and runs, how much ends up as manure to haul out, the nitrogen cycle of the whole
// farm (what comes in, what leaves with the products, what is lost), and a rough estimate of the
// carbon the soil stores against the methane the ruminants breathe out.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.
//
// Amounts are approximate, per head and year, after the tables of the Polish nitrates programme;
// the carbon figures are orientation values for planning, not a certified carbon account.

/** Nitrogen in excreta per head and year (kg N); meat poultry per bird raised. */
const NITROGEN_PER_HEAD = {
  dairyCows: 70,
  replacementHeifers: 40,
  bull: 55,
  sucklerCows: 65,
  finishers: 40,
  beefHeifers: 35,
  sheep: 11,
  goats: 9,
  horses: 45,
  pigs: 5,
  layingHens: 0.5,
  broilers: 0.04,
  geese: 0.35,
  ducks: 0.12,
  turkeys: 0.4,
  guineaFowl: 0.04,
  rabbits: 3,
};

/** Upper limit of nitrogen from farm manures per hectare and year (organic rules, nitrates programme). */
const MANURE_NITROGEN_LIMIT_PER_HA = 170;
/** Nitrogen in one tonne of farmyard manure (kg). */
const NITROGEN_PER_TONNE_OF_MANURE = 5;
/** Nitrogen fixed by a clover-grass ley and by grazed grass with white clover per hectare and year (kg). */
const CLOVER_NITROGEN_FIXATION_PER_HA = 150;
const PASTURE_CLOVER_FIXATION_PER_HA = 30;
/** Nitrogen falling with rain and dust per hectare and year in Poland (kg). */
const ATMOSPHERIC_NITROGEN_PER_HA = 12;
/** Nitrogen in one tonne of grain, one tonne of hay (dry matter) and one hectare of root crops (kg). */
const NITROGEN_PER_TONNE_OF_GRAIN = 18;
const NITROGEN_PER_TONNE_OF_HAY = 25;
const NITROGEN_PER_HA_OF_ROOT_CROPS = 80;
/** Nitrogen leaving the farm in products: per 1000 l of milk, per kg of carcass, per egg (kg). */
const NITROGEN_PER_1000_LITRES_OF_MILK = 5.3;
const NITROGEN_PER_KG_OF_CARCASS = 0.03;
const NITROGEN_PER_EGG = 0.0011;
/** Share of nitrogen lost as ammonia from housed manure, and from dung and urine on the pasture. */
const AMMONIA_LOSS_FROM_MANURE = 0.25;
const AMMONIA_LOSS_ON_PASTURE = 0.08;
/** Dung on the bale-grazing field loses ammonia about half as fast as manure in a heap. */
const BALE_GRAZING_AMMONIA_FACTOR = 0.5;
/** Carcass share of a live weaner, to count the nitrogen leaving with animals sold live. */
const WEANER_CARCASS_SHARE = 0.55;
/** Smallest bale-grazing field (ha) counted for soil carbon. */
const MIN_BALE_GRAZING_HA = 0.5;

/** Animals that spend the grazing season on the pasture. */
const GRAZING_ANIMALS = [
  'dairyCows',
  'replacementHeifers',
  'bull',
  'sucklerCows',
  'finishers',
  'beefHeifers',
  'sheep',
  'goats',
  'horses',
  'pigs',
];
/** Animals that can winter outside on bale grazing. */
const BALE_GRAZING_ANIMALS = [
  'dairyCows',
  'replacementHeifers',
  'bull',
  'sucklerCows',
  'finishers',
  'beefHeifers',
  'sheep',
  'goats',
];
/** Beef animals that winter outside when the herd lives outside all year. */
const OUTWINTERED_BEEF_ANIMALS = ['sucklerCows', 'finishers', 'beefHeifers'];
/** Poultry kept outside in mobile houses and pens through the season. */
const RANGE_POULTRY = ['broilers', 'geese', 'ducks', 'turkeys', 'guineaFowl'];

function computeNitrogenBalance(params, results) {
  const headCount = animalNumbers(params, results);
  const nitrogenByAnimal = Object.fromEntries(
    Object.entries(NITROGEN_PER_HEAD).map(([animal, perHead]) => [animal, headCount[animal] * perHead])
  );
  const totalNitrogen = sumValues(nitrogenByAnimal);

  const grazingShare = params.grazingDays / 365;
  const winterOutside = id =>
    (params.baleGrazing && BALE_GRAZING_ANIMALS.includes(id)) ||
    (results.beefSystem.outwintering && OUTWINTERED_BEEF_ANIMALS.includes(id));
  const housedAllYear = id => id === 'finishers' && !results.beefSystem.finishersGraze;
  let onPasture = 0;
  let onBaleGrazing = 0;
  let inManure = 0;
  for (const [animal, nitrogen] of Object.entries(nitrogenByAnimal)) {
    if (RANGE_POULTRY.includes(animal)) onPasture += nitrogen;
    else if (housedAllYear(animal)) inManure += nitrogen;
    else if (GRAZING_ANIMALS.includes(animal) || animal === 'layingHens') {
      onPasture += nitrogen * grazingShare;
      if (winterOutside(animal)) onBaleGrazing += nitrogen * (1 - grazingShare);
      else inManure += nitrogen * (1 - grazingShare);
    } else inManure += nitrogen;
  }

  const manureTonnes = inManure / NITROGEN_PER_TONNE_OF_MANURE;
  const baleGrazingManureSavedTonnes = onBaleGrazing / NITROGEN_PER_TONNE_OF_MANURE;
  const fields = arableNitrogenBalance(params, results, inManure + onBaleGrazing);
  const farmCycle = farmNitrogenCycle(params, results, { onPasture, inManure, onBaleGrazing, fields });

  return {
    nitrogen: {
      total: totalNitrogen,
      perFarmedHa: results.farmedHa > 0 ? totalNitrogen / results.farmedHa : 0,
      limitPerHa: MANURE_NITROGEN_LIMIT_PER_HA,
      onPasture,
      onBaleGrazing,
      inManure,
      manureTonnes,
      manureHours: manureTonnes * params.manureHoursPerTonne,
      pasturePerHa: params.pastureHa > 0 ? onPasture / params.pastureHa : 0,
      baleGrazingManureSavedTonnes,
      ...fields,
      cycle: farmCycle,
    },
  };
}

function animalNumbers(params, results) {
  return {
    dairyCows: params.dairyCows,
    replacementHeifers: results.replacementHeifers,
    bull: results.bulls,
    sucklerCows: results.sucklerCows,
    finishers: results.finishers,
    beefHeifers: results.beefHeifers,
    sheep: params.sheep,
    goats: params.goats,
    horses: params.horses,
    pigs: params.pigs,
    layingHens: params.layingHens,
    broilers: params.broilers,
    geese: params.geese,
    ducks: params.ducks,
    turkeys: params.turkeys,
    guineaFowl: params.guineaFowl,
    rabbits: params.rabbits,
  };
}

/**
 * Nitrogen balance of the land that gets the manure (arable fields and hay meadows): manure and
 * bale-grazing dung plus clover fixation, minus what the grain, the hay and the root crops take off.
 */
function arableNitrogenBalance(params, results, manureNitrogen) {
  const manuredHa = results.usableArableHa + params.meadowHa;
  const cloverFixation = results.cloverHa * CLOVER_NITROGEN_FIXATION_PER_HA;
  const grainHarvest = results.cerealHa * params.cerealYield;
  const removedWithCrops =
    grainHarvest * NITROGEN_PER_TONNE_OF_GRAIN +
    (results.cloverHay + results.meadowHay) * NITROGEN_PER_TONNE_OF_HAY +
    results.rootCropHa * NITROGEN_PER_HA_OF_ROOT_CROPS;
  const balance = manureNitrogen + cloverFixation - removedWithCrops;
  return {
    manuredHa,
    manureToFields: manureNitrogen,
    cloverFixation,
    removedWithCrops,
    fieldBalancePerHa: manuredHa > 0 ? balance / manuredHa : 0,
  };
}

/**
 * Farm-gate nitrogen cycle: inputs (legumes, rain, bought feed), what leaves with the products
 * (milk, meat, eggs, grain), ammonia losses, and the rest that stays in the soil or is leached.
 * Products are counted from the herd and flock sizes, so this stage can run before revenue.
 */
function farmNitrogenCycle(params, results, { onPasture, inManure, onBaleGrazing, fields }) {
  const catchCropMix = CATCH_CROP_MIXES[params.catchCropMix] || CATCH_CROP_MIXES[0];
  const stubbleMix = STUBBLE_CROP_MIXES[params.stubbleCropMix] || STUBBLE_CROP_MIXES[0];
  const inputs = {
    clover: fields.cloverFixation,
    pastureClover: params.pastureHa * PASTURE_CLOVER_FIXATION_PER_HA,
    coverCrops:
      results.catchCropHa * catchCropMix.legumeNitrogen + results.stubbleCropHa * stubbleMix.legumeNitrogen,
    atmosphere: results.farmedHa * ATMOSPHERIC_NITROGEN_PER_HA,
    boughtFeed:
      results.boughtForageTonnes * NITROGEN_PER_TONNE_OF_HAY +
      results.boughtGrainTonnes * NITROGEN_PER_TONNE_OF_GRAIN +
      Math.max(0, -results.grainBalance) * NITROGEN_PER_TONNE_OF_GRAIN +
      Math.max(0, -results.hayBalance) * NITROGEN_PER_TONNE_OF_HAY,
  };
  const carcassKg =
    params.broilers * params.broilerCarcassKg +
    results.finishers * ((params.finisherWeightKg * params.finisherKillingOut) / 100) +
    results.weanersSold * params.weanerWeightKg * WEANER_CARCASS_SHARE +
    params.sheep * results.lambsPerEwe * ((params.lambLiveWeightKg * params.lambKillingOut) / 100) +
    params.pigs * params.pigCarcassKg +
    params.geese * GOOSE_CARCASS_KG +
    params.ducks * params.duckCarcassKg +
    params.turkeys * params.turkeyCarcassKg;
  const outputs = {
    milk: ((results.milkTotal + results.goatMilkUsed) / 1000) * NITROGEN_PER_1000_LITRES_OF_MILK,
    meat: carcassKg * NITROGEN_PER_KG_OF_CARCASS,
    eggs: params.layingHens * params.eggsPerHen * NITROGEN_PER_EGG,
    grain: results.grainSoldTonnes * NITROGEN_PER_TONNE_OF_GRAIN,
  };
  const ammonia =
    (inManure + onBaleGrazing * BALE_GRAZING_AMMONIA_FACTOR) * AMMONIA_LOSS_FROM_MANURE +
    onPasture * AMMONIA_LOSS_ON_PASTURE;
  const totalInputs = sumValues(inputs);
  const totalOutputs = sumValues(outputs);
  const surplus = totalInputs - totalOutputs;
  return {
    inputs,
    outputs,
    totalInputs,
    totalOutputs,
    ammonia,
    surplus,
    surplusPerHa: results.farmedHa > 0 ? surplus / results.farmedHa : 0,
    // after ammonia, what stays in the soil (organic matter) or may be leached
    soilOrLeachedPerHa: results.farmedHa > 0 ? (surplus - ammonia) / results.farmedHa : 0,
    efficiency: totalInputs > 0 ? totalOutputs / totalInputs : 0,
  };
}

// ---------- Carbon ----------

/** Soil carbon stored per hectare and year (t C), orientation values for Polish conditions. */
const SOIL_CARBON_PER_HA = {
  pastureDailyMovesLongRest: 0.5, // adaptive grazing: moves at least every 3 days, rests of 40+ days
  pastureRotational: 0.3,
  pastureSetStocked: 0.1, // moved once a week or less
  meadow: 0.2,
  clover: 0.5,
  cereals: -0.2, // ploughed arable land without cover loses carbon
  catchCrop: 0.3, // added on the hectares with a cover crop
  manure: 0.25, // added on the manured hectares
  orchard: 0.3,
  baleGrazing: 0.3, // dung and trampled hay on the wintering field
};
/** Tonnes of CO2 per tonne of carbon. */
const CO2_PER_CARBON = 3.67;
/** Methane from digestion per head and year (kg CH4), and its global warming potential (100 years). */
const ENTERIC_METHANE_PER_HEAD = {
  dairyCows: 110,
  replacementHeifers: 50,
  bull: 70,
  sucklerCows: 85,
  finishers: 60,
  beefHeifers: 50,
  sheep: 8,
  goats: 5,
  horses: 18,
  pigs: 1.5,
};
const METHANE_WARMING_POTENTIAL = 27;

function computeCarbonBalance(params, results) {
  const plan = results.grazingPlan;
  const pastureRate =
    plan.moveIntervalDays <= 3 && plan.restDays >= 40
      ? SOIL_CARBON_PER_HA.pastureDailyMovesLongRest
      : plan.moveIntervalDays >= 7
        ? SOIL_CARBON_PER_HA.pastureSetStocked
        : SOIL_CARBON_PER_HA.pastureRotational;
  const manuredHa = results.rotation.manuredFields * results.fieldHa;
  const baleGrazingHa =
    results.nitrogen.onBaleGrazing > 0
      ? Math.max(MIN_BALE_GRAZING_HA, results.nitrogen.onBaleGrazing / MANURE_NITROGEN_LIMIT_PER_HA)
      : 0;
  const soilCarbonByLand = {
    pasture: params.pastureHa * pastureRate,
    meadow: params.meadowHa * SOIL_CARBON_PER_HA.meadow,
    clover: results.cloverHa * SOIL_CARBON_PER_HA.clover,
    cereals: (results.cerealHa + results.rootCropHa) * SOIL_CARBON_PER_HA.cereals,
    coverCrops:
      (results.catchCropHa + results.undersownHa + results.stubbleCropHa) * SOIL_CARBON_PER_HA.catchCrop,
    manure: manuredHa * SOIL_CARBON_PER_HA.manure,
    orchard: results.orchardHa * SOIL_CARBON_PER_HA.orchard,
    baleGrazing: baleGrazingHa * SOIL_CARBON_PER_HA.baleGrazing,
  };
  const soilCarbon = sumValues(soilCarbonByLand);
  const headCount = animalNumbers(params, results);
  const methaneKg = sumBy(
    Object.keys(ENTERIC_METHANE_PER_HEAD),
    id => headCount[id] * ENTERIC_METHANE_PER_HEAD[id]
  );
  const sequestrationCo2 = soilCarbon * CO2_PER_CARBON;
  const methaneCo2 = (methaneKg * METHANE_WARMING_POTENTIAL) / 1000;
  return {
    carbon: {
      soilCarbonByLand,
      soilCarbon,
      soilCarbonPerHa: results.farmedHa > 0 ? soilCarbon / results.farmedHa : 0,
      sequestrationCo2,
      methaneKg,
      methaneCo2,
      netCo2: sequestrationCo2 - methaneCo2,
      pastureRate,
    },
  };
}

// ===== model/stages/products.js =====
// Milk and dairy products, goat milk, and the renewal of the laying flock.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Cow's milk and dairy products ----------

/** Part of the cheese and curd lost to trimming, tasting and unsold pieces. */
const DAIRY_PRODUCT_LOSS = 0.1;
/** Butter churned from one kilogram of cream (35–40% fat cream, 82% fat butter). */
const BUTTER_PER_KG_OF_CREAM = 0.45;
/** Whey left from one litre of milk made into cheese, and from one litre of skimmed milk made into curd. */
const WHEY_PER_LITRE_FOR_CHEESE = 0.85;
const WHEY_PER_LITRE_FOR_CURD = 0.8;

/**
 * Milk left after the calves and losses (`milkUsedShare`) is sold raw or made into aged cheese
 * and curd cheese. The cream is skimmed off before making curd: it is sold as cream or churned
 * into butter. Whey and buttermilk are sold (`byproductsSoldShare`) or fed to pigs and hens.
 */
function computeMilkAndDairyProducts(params) {
  const milkTotal = params.dairyCows * params.milkPerCow;
  const milkUsed = (milkTotal * params.milkUsedShare) / 100;
  const hasCows = params.dairyCows > 0;
  const cheeseShare = hasCows ? params.cheeseShare / 100 : 0;
  const curdShare = hasCows ? Math.min(params.curdShare / 100, 1 - cheeseShare) : 0;
  const milkForCheese = milkUsed * cheeseShare;
  const milkForCurd = milkUsed * curdShare;
  const freshMilkAvailable = milkUsed - milkForCheese - milkForCurd;

  const cheeseKg = (milkForCheese / 100) * params.cheeseYield;
  const curdKg = (milkForCurd / 100) * params.curdYield;
  const creamKg = (milkForCurd / 100) * params.creamYield;
  const creamForButterKg = (creamKg * params.butterShare) / 100;
  const butterKg = creamForButterKg * BUTTER_PER_KG_OF_CREAM;
  const buttermilkLitres = creamForButterKg - butterKg;
  const wheyLitres = milkForCheese * WHEY_PER_LITRE_FOR_CHEESE + milkForCurd * WHEY_PER_LITRE_FOR_CURD;
  const soldShare = params.byproductsSoldShare / 100;

  return {
    milkTotal,
    milkUsed,
    milkForCheese,
    milkForCurd,
    freshMilkAvailable,
    cheeseKg,
    cheeseAvailable: cheeseKg * (1 - DAIRY_PRODUCT_LOSS),
    curdKg,
    curdAvailable: curdKg * (1 - DAIRY_PRODUCT_LOSS),
    creamKg,
    creamAvailable: creamKg - creamForButterKg,
    butterKg,
    buttermilkLitres,
    wheyLitres,
    buttermilkSoldLitres: buttermilkLitres * soldShare,
    wheySoldLitres: wheyLitres * soldShare,
    // whey and buttermilk that are not sold go to the pigs and hens
    byproductsFedLitres: (wheyLitres + buttermilkLitres) * (1 - soldShare),
    dairyProductsKg: cheeseKg + curdKg + butterKg,
  };
}

// ---------- Goat milk ----------

/** Share of the goat milk drunk by the kids before weaning or lost. */
const GOAT_MILK_FOR_KIDS_AND_LOSSES = 0.15;

function computeGoatMilk(params) {
  const milking = params.goatMilking && params.goats > 0;
  const goatMilkUsed = milking ? params.goats * params.milkPerGoat * (1 - GOAT_MILK_FOR_KIDS_AND_LOSSES) : 0;
  const goatMilkForCheese = (goatMilkUsed * params.goatCheeseShare) / 100;
  const goatCheeseKg = (goatMilkForCheese / 100) * params.goatCheeseYield;
  return {
    goatMilkUsed,
    goatMilkSold: goatMilkUsed - goatMilkForCheese,
    goatMilkForCheese,
    goatCheeseKg,
    goatCheeseSold: goatCheeseKg * (1 - DAIRY_PRODUCT_LOSS),
    goatWheyLitres: goatMilkForCheese * WHEY_PER_LITRE_FOR_CHEESE,
  };
}

// ---------- Laying flock ----------

/** With own hatching: chicks hatched per pullet needed (half are cockerels), cockerels reared per pullet. */
const CHICKS_PER_PULLET = 2;
const COCKERELS_PER_PULLET = 0.9;

function computeFlockRenewal(params) {
  const henReplacements = params.layingHens / params.flockReplacementYears;
  const cockerels = params.ownHatching ? henReplacements * COCKERELS_PER_PULLET : 0;
  const chicks = params.ownHatching ? henReplacements * CHICKS_PER_PULLET : 0;
  return { henReplacements, cockerels, chicks };
}

// ===== model/stages/revenue.js =====
// Yearly sales by product: what is left after the family has taken its own food, including red
// meat from the abattoir and processed goods (farm retail, RHD).
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Products available, food for the household, sales ----------

/** Share of the birds and rabbits that reach slaughter weight. */
const BROILERS_REARED = 0.95;
const TURKEYS_AND_GUINEA_FOWL_REARED = 0.9;
const RABBITS_REARED = 0.9;
const GEESE_REARED = 0.9;
const DUCKS_REARED = 0.93;
/** Carcass of a goose and of a cockerel from own hatching (kg). */
const GOOSE_CARCASS_KG = 5;
const COCKEREL_CARCASS_KG = 1.5;
/** A spent hen is sold for this much when the flock is replaced (PLN). */
const SPENT_HEN_PRICE = 10;
/** A cull ewe brings this much (PLN); a cull suckler cow is worth more than a dairy cow. */
const CULL_EWE_PRICE = 250;
const CULL_SUCKLER_COW_PRICE_FACTOR = 1.3;
/** Share of the honey and mushrooms fit for sale. */
const HONEY_SOLD_SHARE = 0.95;
const MUSHROOMS_SOLD_SHARE = 0.9;
/** Calves born per dairy cow and year. */
const CALVES_PER_COW = 0.95;

function computeRevenue(params, results) {
  const { cowReplacements, calvesSold } = calfSales(params);
  const eggs = params.layingHens * params.eggsPerHen;
  const lambs = computeLambSales(params, results);
  const finisherCarcassKg = (params.finisherWeightKg * params.finisherKillingOut) / 100;
  const finishersAsMeat = (results.finishers * params.finishersSoldAsMeatShare) / 100;
  const fruitTonnes = results.orchardHa * params.orchardYield;
  const fruitSoldShare = Math.min(1, params.fruitSoldShare / 100);
  const fruitPreservesShare = Math.min(1 - fruitSoldShare, params.preservesFruitShare / 100);

  // what the farm has for its own table or for sale, in the units of HOME_CONSUMPTION_PER_ADULT
  const available = {
    eggs: (eggs * params.eggsSoldShare) / 100,
    milk: results.freshMilkAvailable + results.goatMilkSold,
    cheese: results.cheeseAvailable + results.goatCheeseSold,
    curd: results.curdAvailable,
    butter: results.butterKg,
    cream: results.creamAvailable,
    pork: params.pigs * params.pigCarcassKg,
    beef: finishersAsMeat * finisherCarcassKg,
    lamb: lambs.lambMeatKg,
    rabbits: params.rabbits * params.rabbitsRearedPerDoe * RABBITS_REARED,
    fruit: fruitTonnes * 1000 * (1 - fruitSoldShare - fruitPreservesShare),
    mushrooms: params.mushroomLogs * params.mushroomYieldPerLog * MUSHROOMS_SOLD_SHARE,
    honey: params.beehives * params.honeyPerHive * HONEY_SOLD_SHARE,
  };
  const poultryBirds = {
    broilers: [params.broilers * BROILERS_REARED, params.broilerCarcassKg],
    cockerels: [results.cockerels, COCKEREL_CARCASS_KG],
    ducks: [params.ducks * DUCKS_REARED, params.duckCarcassKg],
    guineaFowl: [params.guineaFowl * TURKEYS_AND_GUINEA_FOWL_REARED, params.guineaFowlCarcassKg],
    turkeys: [params.turkeys * TURKEYS_AND_GUINEA_FOWL_REARED, params.turkeyCarcassKg],
    geese: [params.geese * GEESE_REARED, GOOSE_CARCASS_KG],
  };
  const home = takeHomeFood(params, available, poultryBirds);
  const sold = Object.fromEntries(
    Object.entries(available).map(([item, amount]) => [item, amount - home.taken[item]])
  );
  // fruit not eaten at home is not sold either (only fruitSoldShare is picked for sale)
  const fruitSoldKg = fruitTonnes * 1000 * fruitSoldShare;
  const birdsSold = id => poultryBirds[id][0] - home.birdsTaken[id];

  const dogs = feedGuardDogs(params, results, lambs);
  const lambMeatSoldKg = Math.max(0, sold.lamb - dogs.lambMeatKg);
  const processing = computeProcessing(params, {
    lambMeatKg: lambMeatSoldKg,
    porkKg: sold.pork,
    beefKg: sold.beef,
    fruitKg: fruitTonnes * 1000 * fruitPreservesShare,
    geeseRaised: birdsSold('geese'),
    ducksRaised: birdsSold('ducks'),
  });
  const kidMeatSoldKg = results.kidsSold * params.kidCarcassKg;
  const vegetableProduction = params.marketGardenHa * params.vegetableSalesPerHa;

  const revenueItems = {
    milk: Math.max(0, sold.milk - results.goatMilkSold) * params.milkPrice,
    goatMilk: Math.min(sold.milk, results.goatMilkSold) * params.goatMilkPrice,
    cheese: Math.max(0, sold.cheese - results.goatCheeseSold) * params.cheesePrice,
    goatCheese: Math.min(sold.cheese, results.goatCheeseSold) * params.goatCheesePrice,
    curd: sold.curd * params.curdPrice,
    cream: sold.cream * params.creamPrice,
    butter: sold.butter * params.butterPrice,
    dairyByproducts:
      results.buttermilkSoldLitres * params.buttermilkPrice + results.wheySoldLitres * params.wheyPrice,
    grainSales: results.grainSoldTonnes * params.grainSalePrice,
    calves: calvesSold * params.calfPrice + cowReplacements * params.cullCowPrice,
    eggs: sold.eggs * params.eggPrice + results.henReplacements * SPENT_HEN_PRICE,
    cockerels: birdsSold('cockerels') * params.cockerelPrice,
    goats: kidMeatSoldKg * params.kidMeatPricePerKg,
    pigs: (sold.pork - processing.porkProcessedKg) * params.porkBoxPricePerKg,
    beefCattle:
      results.weanersSold * params.weanerWeightKg * params.weanerPricePerKg +
      (sold.beef - processing.beefProcessedKg) * params.beefBoxPricePerKg +
      (results.finishers - finishersAsMeat) * params.finisherWeightKg * params.finisherLivePricePerKg +
      results.beefReplacements * params.cullCowPrice * CULL_SUCKLER_COW_PRICE_FACTOR,
    broilers: birdsSold('broilers') * params.broilerCarcassKg * params.broilerPricePerKg,
    geese: (processing.geeseRaised - processing.geeseProcessed) * params.goosePrice,
    ducks:
      (processing.ducksRaised - processing.ducksProcessed) * params.duckCarcassKg * params.duckPricePerKg,
    turkeys: birdsSold('turkeys') * params.turkeyCarcassKg * params.turkeyPricePerKg,
    guineaFowl: birdsSold('guineaFowl') * params.guineaFowlCarcassKg * params.guineaFowlPricePerKg,
    rabbits: sold.rabbits * params.rabbitPrice,
    sheep: lambs.lambsSoldLive * params.lambLivePrice + lambs.ewesReplaced * CULL_EWE_PRICE,
    lambMeat: (lambMeatSoldKg - processing.lambMeatProcessedKg) * params.lambMeatPricePerKg,
    processedGoods: processing.processedValue,
    fruit: fruitSoldKg * params.fruitPricePerKg,
    mushrooms: sold.mushrooms * params.mushroomPrice,
    vegetables: vegetableProduction * (1 - params.preservesVegetableShare / 100),
    honey: sold.honey * params.honeyPrice,
    horseRiding: params.horses > 0 ? params.ridesPerYear * params.ridePricePerHour : 0,
  };
  const preservesFromVegetables =
    vegetableProduction * (params.preservesVegetableShare / 100) * params.preservesValueFactor;
  revenueItems.processedGoods += preservesFromVegetables;
  processing.processedValueBySpecies.preserves += preservesFromVegetables;
  processing.processedValue += preservesFromVegetables;

  const homeUse = { ...homeFoodValue(params, home), dogFood: dogs.ownMeatKg * params.dogFoodPricePerKg };
  const meatBoxKg = lambMeatSoldKg + sold.beef + sold.pork + kidMeatSoldKg;
  return {
    calves: params.dairyCows * CALVES_PER_COW,
    calvesSold,
    cowReplacements,
    eggs,
    eggsSold: sold.eggs,
    freshMilkSold: Math.max(0, sold.milk - results.goatMilkSold),
    cheeseSold: Math.max(0, sold.cheese - results.goatCheeseSold),
    curdSold: sold.curd,
    butterSold: sold.butter,
    creamSold: sold.cream,
    porkSoldKg: sold.pork,
    beefBoxKg: sold.beef,
    ...lambs,
    lambMeatSoldKg,
    kidMeatSoldKg,
    ...processing,
    fruitTonnes,
    fruitSoldTonnes: fruitSoldKg / 1000,
    mushroomsKg: params.mushroomLogs * params.mushroomYieldPerLog,
    honeyKg: sold.honey,
    revenueItems,
    revenue: sumValues(revenueItems),
    beefBoxRevenue: (sold.beef - processing.beefProcessedKg) * params.beefBoxPricePerKg,
    retailSalesRevenue: retailSales(revenueItems, sold, params, processing),
    homeUse,
    homeUseTotal: sumValues(homeUse),
    homeFoodTaken: home.taken,
    dogs,
    meatBoxKg,
    slaughter: computeSlaughterTrips(params, results, lambs, finishersAsMeat),
  };
}

function calfSales(params) {
  const calves = params.dairyCows * CALVES_PER_COW;
  const cowReplacements = params.dairyCows / params.lactationsPerCow;
  return { cowReplacements, calvesSold: Math.max(0, calves - cowReplacements) };
}

function computeLambSales(params, results) {
  const lambs = params.sheep * results.lambsPerEwe;
  const ewesReplaced = (params.sheep * params.eweReplacementShare) / 100;
  const lambsSold = Math.max(0, lambs - ewesReplaced);
  const lambsSoldAsMeat = (lambsSold * params.lambsSoldAsMeatShare) / 100;
  const lambCarcassKg = (params.lambLiveWeightKg * params.lambKillingOut) / 100;
  return {
    lambs,
    ewesReplaced,
    lambsSold,
    lambsSoldAsMeat,
    lambsSoldLive: lambsSold - lambsSoldAsMeat,
    lambCarcassKg,
    lambMeatKg: lambsSoldAsMeat * lambCarcassKg,
  };
}

// ---------- Food for the household ----------

/**
 * Takes the family's yearly food from what the farm produces, product by product, as far as the
 * farm has it. Poultry meat comes from the birds in the order of `poultryBirds`.
 */
function takeHomeFood(params, available, poultryBirds) {
  const eaters = params.homeUseFromFarm ? householdEaters(params) : 0;
  const taken = {};
  for (const item of Object.keys(available))
    taken[item] = Math.min(available[item], (HOME_CONSUMPTION_PER_ADULT[item] || 0) * eaters);

  let poultryKgNeeded = HOME_CONSUMPTION_PER_ADULT.poultry * eaters;
  const birdsTaken = {};
  for (const [id, [birds, carcassKg]] of Object.entries(poultryBirds)) {
    birdsTaken[id] = Math.min(birds, poultryKgNeeded / carcassKg);
    poultryKgNeeded -= birdsTaken[id] * carcassKg;
  }
  taken.poultryKg = sumBy(Object.entries(poultryBirds), ([id, [, carcassKg]]) => birdsTaken[id] * carcassKg);
  return { taken, birdsTaken, poultryBirds };
}

/** Value of the food the family takes, at the farm's own selling prices (not cash). */
function homeFoodValue(params, home) {
  const { taken, birdsTaken } = home;
  const poultryPrice = {
    broilers: params.broilerCarcassKg * params.broilerPricePerKg,
    cockerels: params.cockerelPrice,
    ducks: params.duckCarcassKg * params.duckPricePerKg,
    guineaFowl: params.guineaFowlCarcassKg * params.guineaFowlPricePerKg,
    turkeys: params.turkeyCarcassKg * params.turkeyPricePerKg,
    geese: params.goosePrice,
  };
  return {
    eggs: taken.eggs * params.eggPrice,
    milk: taken.milk * params.milkPrice,
    cheese: taken.cheese * params.cheesePrice,
    curd: taken.curd * params.curdPrice,
    butter: taken.butter * params.butterPrice,
    cream: taken.cream * params.creamPrice,
    poultry: sumBy(Object.keys(poultryPrice), id => birdsTaken[id] * poultryPrice[id]),
    pork: taken.pork * params.porkBoxPricePerKg,
    beef: taken.beef * params.beefBoxPricePerKg,
    lamb: taken.lamb * params.lambMeatPricePerKg,
    rabbits: taken.rabbits * params.rabbitPrice,
    fruit: taken.fruit * params.fruitPricePerKg,
    mushrooms: taken.mushrooms * params.mushroomPrice,
    honey: taken.honey * params.honeyPrice,
  };
}

// ---------- Livestock guardian dogs ----------

/**
 * Meat for the guardian dogs: from the farm's kids that are not sold, then from the lamb meat,
 * and the rest bought as dog food (or everything bought when `dogsFedOwnMeat` is off).
 */
function feedGuardDogs(params, results, lambs) {
  const meatNeededKg = params.guardDogs * params.dogMeatKgPerMonth * 12;
  const kidMeatKg = params.dogsFedOwnMeat ? (results.kids - results.kidsSold) * params.kidCarcassKg : 0;
  const fromKidsKg = Math.min(meatNeededKg, kidMeatKg);
  const lambMeatKg = params.dogsFedOwnMeat ? Math.min(meatNeededKg - fromKidsKg, lambs.lambMeatKg) : 0;
  const ownMeatKg = fromKidsKg + lambMeatKg;
  return { meatNeededKg, ownMeatKg, lambMeatKg, boughtKg: meatNeededKg - ownMeatKg };
}

// ---------- Slaughter trips ----------

/** Places on the livestock trailer, counted in lambs, that one animal of each kind takes. */
const TRAILER_PLACES_PER_ANIMAL = { lamb: 1, kid: 1, pig: 2, finisher: 5 };

/**
 * Trips to the abattoir for the animals sold as meat. Every batch needs two trips (delivery and
 * collection of the carcasses), each there and back.
 */
function computeSlaughterTrips(params, results, lambs, finishersAsMeat) {
  const trailerPlaces = params.lambsPerAbattoirTrip;
  const tripsFor = (animals, places) =>
    animals > 0 ? Math.ceil((animals * places) / trailerPlaces - 1e-9) : 0;
  const trips = {
    sheep: tripsFor(lambs.lambsSoldAsMeat, TRAILER_PLACES_PER_ANIMAL.lamb),
    goats: tripsFor(results.kidsSold, TRAILER_PLACES_PER_ANIMAL.kid),
    pigs: tripsFor(params.pigs, TRAILER_PLACES_PER_ANIMAL.pig),
    beefCattle: tripsFor(finishersAsMeat, TRAILER_PLACES_PER_ANIMAL.finisher),
  };
  const kmBySpecies = Object.fromEntries(
    Object.entries(trips).map(([species, count]) => [species, count * 2 * 2 * params.abattoirDistanceKm])
  );
  return { trips, kmBySpecies, totalTrips: sumValues(trips), totalKm: sumValues(kmBySpecies) };
}

// ---------- Processing (farm retail) ----------

/** Weight of the finished product per bird or per kg of meat (for the parcels). */
const PROCESSED_KG_PER_GOOSE = 2.5;
const PROCESSED_KG_PER_DUCK = 1.2;
const PROCESSED_KG_PER_KG_OF_RED_MEAT = 0.6;
/** Value of one kilogram of preserves in jars, used to count the parcels (PLN). */
const PRESERVES_VALUE_PER_KG = 30;

function computeProcessing(params, inputs) {
  const { geeseRaised, ducksRaised } = inputs;
  const geeseProcessed = (geeseRaised * params.geeseProcessedShare) / 100;
  const ducksProcessed = (ducksRaised * params.ducksProcessedShare) / 100;
  const lambMeatProcessedKg = (inputs.lambMeatKg * params.lambProcessedShare) / 100;
  const porkProcessedKg = (inputs.porkKg * params.porkProcessedShare) / 100;
  const beefProcessedKg = (inputs.beefKg * params.beefProcessedShare) / 100;
  const processedValueBySpecies = {
    geese: geeseProcessed * params.processedValuePerGoose,
    ducks: ducksProcessed * params.processedValuePerDuck,
    sheep: lambMeatProcessedKg * params.processedValuePerLambKg,
    pigs: porkProcessedKg * params.processedValuePerPorkKg,
    beefCattle: beefProcessedKg * params.processedValuePerBeefKg,
    preserves: inputs.fruitKg * params.fruitPricePerKg * params.preservesValueFactor,
  };
  const redMeatProcessedKg = lambMeatProcessedKg + porkProcessedKg + beefProcessedKg;
  const processedKg =
    geeseProcessed * PROCESSED_KG_PER_GOOSE +
    ducksProcessed * PROCESSED_KG_PER_DUCK +
    redMeatProcessedKg * PROCESSED_KG_PER_KG_OF_RED_MEAT +
    processedValueBySpecies.preserves / PRESERVES_VALUE_PER_KG;
  const processedValue = sumValues(processedValueBySpecies);
  return {
    geeseRaised,
    geeseProcessed,
    ducksRaised,
    ducksProcessed,
    lambMeatProcessedKg,
    porkProcessedKg,
    beefProcessedKg,
    processedValueBySpecies,
    processedValue,
    processedMeatValue: processedValue - processedValueBySpecies.preserves,
    processedKg,
    parcels: (processedKg * params.shippedShare) / 100 / params.parcelWeightKg,
  };
}

/**
 * Sales under farm retail rules (RHD): dairy products, red meat from the abattoir and processed
 * goods. Fresh eggs, raw milk, fruit, honey and poultry slaughtered on the farm are direct sales
 * of unprocessed produce and are not counted here.
 */
function retailSales(revenueItems, sold, params, processing) {
  const { cheese, goatCheese, curd, cream, butter, lambMeat, processedGoods, goats, pigs } = revenueItems;
  const beefBoxes = (sold.beef - processing.beefProcessedKg) * params.beefBoxPricePerKg;
  return cheese + goatCheese + curd + cream + butter + lambMeat + processedGoods + goats + pigs + beefBoxes;
}

// ===== model/stages/costs.js =====
// Running costs per year.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Running costs ----------

/** Cost lines that do not follow the general rise of costs in the pessimistic case. */
const FIXED_PRICE_COST_ITEMS = ['landLease', 'retailTax'];

/** Farm retail (RHD) sales are free of income tax up to this amount a year. */
const RETAIL_TAX_FREE_LIMIT = 100000;
/** Flat-rate tax on the retail sales above the limit. */
const RETAIL_FLAT_TAX_RATE = 0.02;

function retailFlatTax(retailSalesRevenue) {
  return Math.max(0, retailSalesRevenue - RETAIL_TAX_FREE_LIMIT) * RETAIL_FLAT_TAX_RATE;
}

/** Packaging and cultures per kg of curd, butter and cream, and per litre of goat milk (PLN). */
const DAIRY_PRODUCT_PACKAGING_PER_KG = 1.5;
const GOAT_MILK_COSTS_PER_LITRE = 0.4;
/** Share of the dairy cost of a cow that a replacement heifer costs. */
const HEIFER_COST_SHARE = 0.3;

function computeCosts(params, results) {
  const {
    replacementHeifers,
    bulls,
    sucklerCows,
    finishers,
    beefHeifers,
    kidsSold,
    chicks,
    henReplacements,
  } = results;
  const sellsDirectly =
    results.freshMilkSold > 0 ||
    results.eggsSold > 0 ||
    results.meatBoxKg > 0 ||
    params.broilers > 0 ||
    params.ducks > 0 ||
    params.guineaFowl > 0 ||
    params.turkeys > 0;
  const slaughterKm = results.slaughter.kmBySpecies;
  const finishersAsMeat = (finishers * params.finishersSoldAsMeatShare) / 100;

  const costItems = {
    arable: results.usableArableHa * params.arableCostPerHa,
    rootCrops: results.rootCropHa * params.rootCropCostPerHa,
    meadow: params.meadowHa * params.meadowCostPerHa,
    pasture: params.pastureHa * params.pastureCostPerHa,
    dairyCows:
      params.dairyCows > 0
        ? params.dairyCows * params.costPerCow +
          replacementHeifers * params.costPerCow * HEIFER_COST_SHARE +
          (bulls ? params.bullCost : params.dairyCows * params.inseminationCost)
        : 0,
    milkPackaging: results.freshMilkSold * params.milkPackagingCostPerLitre,
    cheese:
      (results.cheeseKg + results.goatCheeseKg) * params.cheeseCostPerKg +
      (results.curdKg + results.butterKg + results.creamKg) * DAIRY_PRODUCT_PACKAGING_PER_KG,
    layingHens:
      (params.ownHatching ? chicks * params.hatchingCostPerChick : henReplacements * params.pulletPrice) +
      params.layingHens * params.henExtrasCost +
      results.eggsSold * params.eggPackagingCost +
      (params.winterPolytunnel ? params.layingHens * params.tunnelBeddingCostPerHen : 0),
    broilers: params.broilers * params.costPerBroiler,
    geese: params.geese * params.costPerGoose,
    ducks: params.ducks * params.costPerDuck,
    catchCrops:
      results.catchCropHa * params.catchCropCostPerHa + results.stubbleCropHa * params.stubbleCropCostPerHa,
    beefCattle:
      (sucklerCows + finishers + beefHeifers) * params.beefCattleCostPerHead +
      finishersAsMeat * params.finisherSlaughterCost +
      results.beefBoxKg * params.butcheryCostPerKg +
      slaughterKm.beefCattle * params.trailerCostPerKm,
    turkeys: params.turkeys * params.costPerTurkey,
    guineaFowl: params.guineaFowl * params.costPerGuineaFowl,
    processedGoods:
      (results.processedValue * params.processingMaterialsShare) / 100 +
      results.parcels * Math.max(0, params.parcelCost - params.shippingFeeCharged),
    fruit: (results.fruitSoldTonnes * 1000 * params.fruitPricePerKg * params.fruitCostShare) / 100,
    mushrooms: params.mushroomLogs * params.mushroomLogCost,
    rabbits: params.rabbits * params.costPerRabbitDoe,
    vegetables: (params.marketGardenHa * params.vegetableSalesPerHa * params.vegetableCostShare) / 100,
    beehives: params.beehives * params.hiveCost,
    sheep: params.sheep * params.costPerEwe,
    slaughter:
      results.lambsSoldAsMeat * params.lambSlaughterCost +
      results.lambMeatKg * params.butcheryCostPerKg +
      slaughterKm.sheep * params.trailerCostPerKm,
    goats:
      params.goats * params.costPerGoat +
      kidsSold * params.kidSlaughterCost +
      slaughterKm.goats * params.trailerCostPerKm +
      results.goatMilkUsed * GOAT_MILK_COSTS_PER_LITRE,
    horses: params.horses * params.horseCost,
    guardDogs: params.guardDogs * params.costPerDog + results.dogs.boughtKg * params.dogFoodPricePerKg,
    landLease: params.leasedHa * params.leaseRentPerHa,
    pigs:
      params.pigs * (params.costPerPig + params.pigSlaughterCost) +
      results.porkSoldKg * params.butcheryCostPerKg +
      slaughterKm.pigs * params.trailerCostPerKm,
    fixed: params.fixedCosts,
    retailTax: retailFlatTax(results.retailSalesRevenue),
    sales: sellsDirectly ? params.salesCosts : 0,
    energy: params.energyCosts,
  };

  // the pessimistic scenario raises every running cost except the lease
  const costMultiplier = params.costMultiplier || 1;
  for (const item in costItems) if (!FIXED_PRICE_COST_ITEMS.includes(item)) costItems[item] *= costMultiplier;

  const purchases = {
    grain: (Math.max(0, -results.grainBalance) + results.boughtGrainTonnes) * params.grainPurchasePrice,
    hay: (Math.max(0, -results.hayBalance) + results.boughtForageTonnes) * params.hayPurchasePrice,
    straw: Math.max(0, -results.strawBalance) * params.strawPurchasePrice,
    sawdust: results.sawdustTonnes * params.sawdustPrice,
  };
  costItems.purchases = sumValues(purchases);
  return { costItems, purchases, costs: sumValues(costItems) };
}

// ===== model/stages/investments.js =====
// Investments: the infrastructure the chosen enterprises need (data/infrastructure.js), the
// one-off cost of what the farm does not have yet and its yearly depreciation.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Investments ----------

function computeInvestments(params, results) {
  const infrastructure = INFRASTRUCTURE_ITEMS.map(item => {
    const quantity = item.quantity(params, results);
    const owned = !!params[ownedParameterId(item.id)];
    const fullCost = quantity * params[item.priceParam];
    return {
      id: item.id,
      category: item.category,
      priceParam: item.priceParam,
      lifetimeYears: item.lifetimeYears,
      quantity,
      needed: quantity > 0,
      owned,
      fullCost,
    };
  }).filter(item => item.needed);

  // what the farm still has to buy, and anything else the user typed in
  const investmentItems = infrastructure
    .filter(item => !item.owned)
    .map(item => ({ ...item, cost: item.fullCost }));
  investmentItems.push({
    id: 'other',
    priceParam: 'investOther',
    quantity: 1,
    lifetimeYears: params.investOtherLifetimeYears,
    lifetimeParam: 'investOtherLifetimeYears',
    cost: params.investOther,
  });
  for (const item of investmentItems) item.yearlyDepreciation = item.cost / item.lifetimeYears;

  return {
    infrastructure,
    investmentItems,
    ownedInfrastructureValue: sumBy(
      infrastructure.filter(item => item.owned),
      item => item.fullCost
    ),
    capex: sumBy(investmentItems, item => item.cost),
    depreciation: sumBy(investmentItems, item => item.yearlyDepreciation),
  };
}

// ===== model/stages/subsidies.js =====
// Area, organic, animal, welfare, ONW and eco-scheme payments.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Subsidies ----------

function computeSubsidies(params, results) {
  const { farmedHa, grasslandHa, usableArableHa, orchardHa, livestockUnitsPerHa, sucklerCows } = results;
  const rates = SUBSIDY_RATES;
  const subsidyItems = {
    basicPayment: rates.basicPayment * farmedHa,
    redistributive: rates.redistributive * Math.min(farmedHa, 30),
    dairyCows: rates.dairyCows * (params.dairyCows + sucklerCows),
    beefCattle:
      rates.beefCattle * Math.floor(results.replacementHeifers + results.finishers + results.beefHeifers),
    sheep: params.sheep >= 10 ? rates.sheep * params.sheep : 0,
    goats: params.goats >= 5 ? rates.goats * params.goats : 0,
    organic: params.organicPayment
      ? rates.organicGrassland * grasslandHa +
        rates.organicArable * usableArableHa +
        rates.organicOrchard * orchardHa +
        rates.organicVegetables * params.marketGardenHa
      : 0,
    livestockBonus:
      params.organicPayment &&
      params.livestockDensityBonus &&
      livestockUnitsPerHa >= 0.5 &&
      livestockUnitsPerHa <= 1.5
        ? rates.livestockBonus * farmedHa
        : 0,
    extensiveGrassland: params.extensiveGrasslandScheme ? rates.extensiveGrasslandScheme * grasslandHa : 0,
    carbonFarming: 0,
    youngFarmer: params.youngFarmerEligible ? rates.youngFarmer * farmedHa : 0,
    lessFavouredArea: params.lessFavouredAreaRate * farmedHa,
    animalWelfare:
      params.otherWelfarePayments +
      (params.welfareCowsGrazing
        ? params.dairyCows * (rates.welfareCowGrazing + rates.welfareCowBedding)
        : 0) +
      (params.welfareCowsSpace ? params.dairyCows * rates.welfareCowSpace : 0) +
      (params.welfareSheepGoats ? params.sheep * rates.welfareEwe + params.goats * rates.welfareGoat : 0) +
      (params.welfareHens ? params.layingHens * rates.welfareHen : 0),
  };

  const carbonFarming = computeCarbonFarmingPoints(params, results);
  if (carbonFarming.qualifies)
    subsidyItems.carbonFarming =
      (carbonFarming.catchCropPoints + carbonFarming.manurePoints + carbonFarming.diversityPoints) *
      params.ecoSchemePointValue;
  // extensive grassland is paid only together with the carbon farming scheme
  else if (params.extensiveGrasslandScheme) subsidyItems.extensiveGrassland = 0;

  return { subsidyItems, carbonFarming, subsidies: sumValues(subsidyItems) };
}

/** Eco-scheme "carbon farming": points earned against the minimum (25% of farmed land × 5). */
function computeCarbonFarmingPoints(params, results) {
  const { catchCropHa, undersownHa, rotation, fieldHa } = results;
  const rules = CARBON_FARMING;
  const catchCropPoints = (catchCropHa + undersownHa) * rules.catchCropPointsPerHa;
  const manurePoints = params.carbonManure ? rotation.manuredFields * fieldHa * rules.manurePointsPerHa : 0;
  const diversityPoints =
    params.carbonCropDiversity && rotation.diversityOk
      ? results.usableArableHa * rules.cropDiversityPointsPerHa
      : 0;
  const extensivePoints = params.extensiveGrasslandScheme
    ? results.grasslandHa * rules.extensiveGrasslandPointsPerHa
    : 0;
  const requiredPoints = rules.minimumShareOfFarmedArea * results.farmedHa * rules.catchCropPointsPerHa;
  const totalPoints = catchCropPoints + manurePoints + diversityPoints + extensivePoints;
  return {
    catchCropPoints,
    manurePoints,
    diversityPoints,
    extensivePoints,
    requiredPoints,
    totalPoints,
    qualifies: totalPoints >= requiredPoints,
  };
}

// ===== model/stages/labour.js =====
// Working hours per year and per month.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Labour (hours per year) ----------

function computeLabour(params, results) {
  const hoursByActivity = hoursPerActivity(params, results);
  addPaddockMoveHours(hoursByActivity, params, results.grazingPlan);
  subtractBaleGrazingManureHours(hoursByActivity, params, results.nitrogen);

  // the pessimistic scenario makes every job take longer
  const hoursMultiplier = params.hoursMultiplier || 1;
  for (const activity in hoursByActivity) hoursByActivity[activity] *= hoursMultiplier;

  const totalHours = sumValues(hoursByActivity);
  const monthlyHours = monthlyHoursByGroup(hoursByActivity);
  const peakMonthHours = Math.max(...monthlyHours.map(month => month.total));
  const availableHours = familyHoursPerYear(params);

  return {
    hoursByActivity,
    totalHours,
    monthlyHours,
    peakMonthHours,
    availableHours,
    labourUtilisation: availableHours > 0 ? totalHours / availableHours : 9,
    weeklyHoursAverage: totalHours / 52,
    weeklyHoursPeak: peakMonthHours / WEEKS_PER_MONTH,
    netPerHour: totalHours > 0 ? results.netIncome / totalHours : 0,
  };
}

/** Hours of fixed work a year for keeping a species at all (feeders, checks, records). */
const FIXED_HOURS = {
  broilers: 30,
  ducks: 15,
  turkeys: 15,
  guineaFowl: 15,
  sheep: 30,
  beefCattle: 20,
  pigs: 15,
};
/** Hours a year per replacement heifer and per bull, on top of the cows. */
const HOURS_PER_HEIFER = 15;
const HOURS_PER_BULL = 20;
/** Hours of making curd with skimming per 100 litres, and of churning per kg of butter. */
const CURD_HOURS_PER_100_LITRES = 1.5;
const BUTTER_HOURS_PER_KG = 0.15;
/** Selling meat boxes: hours per animal sold as meat (calls, handing out), beyond lambs. */
const BOX_SALE_HOURS = { finisher: 6, pig: 3, kid: 1 };

/** Hours per year of every activity, from the herd sizes, areas and hour norms in the params. */
function hoursPerActivity(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, kidsSold, slaughter, beefSystem } = results;
  const tripHours = species => slaughter.trips[species] * 2 * params.abattoirTripHours;
  const finishersAsMeat = (finishers * params.finishersSoldAsMeatShare) / 100;
  return {
    dairyCows:
      params.dairyCows > 0
        ? params.dairyFixedHours +
          params.dairyCows * params.hoursPerCow +
          replacementHeifers * HOURS_PER_HEIFER +
          bulls * HOURS_PER_BULL
        : 0,
    cheese:
      ((results.milkForCheese + results.goatMilkForCheese) / 100) * params.cheeseHoursPer100Litres +
      (results.milkForCurd / 100) * CURD_HOURS_PER_100_LITRES +
      results.butterKg * BUTTER_HOURS_PER_KG,
    layingHens: params.layingHens > 0 ? params.hensFixedHours + params.layingHens * params.hoursPerHen : 0,
    hatching: results.chicks * params.hatchingHoursPerChick,
    broilers: params.broilers > 0 ? FIXED_HOURS.broilers + params.broilers * params.hoursPerBroiler : 0,
    geese: params.geese * params.hoursPerGoose,
    ducks: params.ducks > 0 ? FIXED_HOURS.ducks + params.ducks * params.hoursPerDuck : 0,
    catchCrops: (results.catchCropHa + results.stubbleCropHa) * params.catchCropHoursPerHa,
    beefCattle:
      sucklerCows > 0
        ? FIXED_HOURS.beefCattle +
          sucklerCows * params.hoursPerSucklerCow +
          finishers * Math.max(1, params.hoursPerFinisher + beefSystem.extraHoursPerFinisher) +
          finishersAsMeat * BOX_SALE_HOURS.finisher +
          tripHours('beefCattle')
        : 0,
    turkeys: params.turkeys > 0 ? FIXED_HOURS.turkeys + params.turkeys * params.hoursPerTurkey : 0,
    guineaFowl:
      params.guineaFowl > 0 ? FIXED_HOURS.guineaFowl + params.guineaFowl * params.hoursPerGuineaFowl : 0,
    processedGoods:
      results.processedValue > 0
        ? params.processingFixedHours +
          results.geeseProcessed * params.processingHoursPerGoose +
          results.ducksProcessed * params.processingHoursPerDuck +
          results.lambMeatProcessedKg * params.processingHoursPerLambKg +
          results.porkProcessedKg * params.processingHoursPerPorkKg +
          results.beefProcessedKg * params.processingHoursPerBeefKg +
          (results.processedValueBySpecies.preserves / 1000) * params.preservesHoursPer1000Pln +
          results.parcels * params.hoursPerParcel
        : 0,
    fruit: results.fruitSoldTonnes * params.fruitHoursPerTonne,
    mushrooms: params.mushroomLogs * params.mushroomLogHours,
    rabbits: params.rabbits * params.hoursPerRabbitDoe,
    sheep:
      params.sheep > 0
        ? FIXED_HOURS.sheep +
          params.sheep * params.hoursPerEwe * (0.6 + 0.4 * params.lambingsPerEwe) +
          tripHours('sheep') +
          results.lambsSoldAsMeat * params.lambSalesHoursPerLamb
        : 0,
    horses:
      params.horses * params.hoursPerHorse +
      (params.horses > 0 ? params.ridesPerYear * params.hoursPerRide : 0),
    goats:
      params.goats * params.hoursPerGoat +
      (params.goatMilking ? params.goats * params.hoursPerMilkingGoat : 0) +
      kidsSold * BOX_SALE_HOURS.kid +
      tripHours('goats'),
    pigs:
      params.pigs > 0
        ? FIXED_HOURS.pigs + params.pigs * (params.hoursPerPig + BOX_SALE_HOURS.pig) + tripHours('pigs')
        : 0,
    guardDogs: params.guardDogs * params.hoursPerDog,
    hay:
      (params.meadowHa + results.cloverHa + results.hayFromPasture / Math.max(1, params.meadowYield)) *
      params.hayHoursPerHa,
    cereals: results.cerealHa * params.cerealHoursPerHa,
    rootCrops: results.rootCropHa * params.rootCropHoursPerHa,
    sales:
      ((results.freshMilkSold + results.goatMilkSold) / 100) * params.milkSalesHoursPer100Litres +
      (results.eggsSold / 100) * params.eggSalesHoursPer100 +
      params.salesFixedHours,
    general: params.generalHours,
    garden: (results.orchardHa + params.kitchenGardenHa) * params.gardenHoursPerHa,
    vegetables: params.marketGardenHa * params.vegetableHoursPerHa,
    beehives: params.beehives * params.hiveHours,
  };
}

/** Hours of each labour group in each month, spread by the activities' monthly profiles. */
function monthlyHoursByGroup(hoursByActivity) {
  return Array.from({ length: 12 }, (_, month) => {
    const hoursByGroup = {};
    for (const group of LABOUR_GROUPS)
      hoursByGroup[group.id] = group.activities.reduce(
        (sum, activity) => sum + (hoursByActivity[activity] / 12) * LABOUR_PROFILES[activity][month],
        0
      );
    hoursByGroup.total = sumValues(hoursByGroup);
    return hoursByGroup;
  });
}

/** Working hours the family has in a year: full-time, half-time and quarter-time people. */
function familyHoursPerYear(params) {
  const fullTimeEquivalents =
    params.fullTimeWorkers + 0.5 * params.halfTimeWorkers + 0.25 * params.quarterTimeWorkers;
  return fullTimeEquivalents * params.fullTimeHoursPerYear;
}

/**
 * Moving the fences more or less often than once a day changes the hours of the herd that leads
 * the grazing (the hour norms per animal include one move a day).
 */
function addPaddockMoveHours(hoursByActivity, params, grazingPlan) {
  const herd = leadingHerd(params);
  hoursByActivity[herd] = Math.max(0, hoursByActivity[herd] + grazingPlan.extraMoveHours);
}

/** Daily bedding in the shed that bale grazing saves through the winter (hours a day). */
const BALE_GRAZING_BEDDING_HOURS_PER_DAY = 0.15;

/**
 * With bale grazing the winter dung stays on the field and the animals need little bedding, so
 * there is less manure to load and spread and less straw to put down every day.
 */
function subtractBaleGrazingManureHours(hoursByActivity, params, nitrogen) {
  if (!params.baleGrazing || nitrogen.baleGrazingManureSavedTonnes <= 0) return;
  const winterDays = 365 - params.grazingDays;
  const savedHours =
    nitrogen.baleGrazingManureSavedTonnes * params.manureHoursPerTonne +
    winterDays * BALE_GRAZING_BEDDING_HOURS_PER_DAY;
  const herd = leadingHerd(params);
  hoursByActivity[herd] = Math.max(0, hoursByActivity[herd] - savedHours);
}

/** The herd that leads the grazing and whose hour norms include moving the fences. */
function leadingHerd(params) {
  if (params.dairyCows > 0) return 'dairyCows';
  if (params.sucklerCows > 0) return 'beefCattle';
  if (params.sheep > 0) return 'sheep';
  return params.goats > 0 ? 'goats' : 'dairyCows';
}

// ===== model/stages/enterprises.js =====
// Result of each enterprise: revenue, costs, own feed at production cost, shared buildings, hours and land.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Result per enterprise ----------

/** Share of the energy bill attributed to the dairy and to the laying hens. */
const DAIRY_ENERGY_SHARE = 0.6;
const LAYING_HENS_ENERGY_SHARE = 0.1;

function computeEnterprises(params, results) {
  const feed = ownFeedUnitCosts(params, results);
  const enterprises = listEnterprises(params, results, feed).map(withDefaults);

  const landHa = landUsedByEnterprise(params, results);
  for (const enterprise of enterprises) addPerUnitResults(enterprise, landHa[enterprise.id]);

  // what is not attributed to any enterprise: area payments, fixed costs, garden
  const attributedNet = sumBy(enterprises, enterprise => enterprise.net);
  const attributedHours = sumBy(enterprises, enterprise => enterprise.hours);
  return {
    grainCostPerTonne: feed.grainCostPerTonne,
    forageCostPerTonne: feed.forageCostPerTonne,
    enterprises,
    unallocated: { net: results.netIncome - attributedNet, hours: results.totalHours - attributedHours },
  };
}

/** Own grain and forage valued at their production cost per tonne (purchase price if none is grown). */
function ownFeedUnitCosts(params, results) {
  const grainLandCost =
    results.cerealHa * params.arableCostPerHa +
    results.rootCropHa * (params.arableCostPerHa + params.rootCropCostPerHa);
  const grainCostPerTonne =
    results.grainSupply > 0 ? grainLandCost / results.grainSupply : params.grainPurchasePrice;

  const forageTotal = results.haySupply + results.grazingSupply;
  const forageLandCost =
    params.meadowHa * params.meadowCostPerHa +
    results.cloverHa * params.arableCostPerHa +
    params.pastureHa * params.pastureCostPerHa;
  const forageCostPerTonne = forageTotal > 0 ? forageLandCost / forageTotal : params.hayPurchasePrice;

  return {
    grainCostPerTonne,
    forageCostPerTonne,
    costOf: (grainTonnes, forageTonnes) =>
      grainTonnes * grainCostPerTonne + forageTonnes * forageCostPerTonne,
  };
}

/** Yearly depreciation of one investment, 0 when the farm does not have it. */
function depreciationOf(results, investmentId) {
  const item = results.investmentItems.find(candidate => candidate.id === investmentId);
  return item ? item.yearlyDepreciation : 0;
}

/**
 * Part of the processing (RHD) revenue, costs, depreciation and hours belonging to one species,
 * split by the value of its products.
 */
function processingShare(results, species) {
  const { processedValue, processedMeatValue, processedValueBySpecies, costItems, hoursByActivity } = results;
  const value = processedValueBySpecies[species] || 0;
  const share = processedValue > 0 ? value / processedValue : 0;
  // the smokehouse and cold room serve the meat products; preserves have their own kitchen
  const meatShare = species !== 'preserves' && processedMeatValue > 0 ? value / processedMeatValue : 0;
  return {
    revenue: value,
    cost: costItems.processedGoods * share,
    depreciation: depreciationOf(results, 'processing') * meatShare,
    hours: hoursByActivity.processedGoods * share,
  };
}

/** Places each species takes in the buildings it shares with others. */
function sharedBuildingPlaces(params, results) {
  return {
    ducks: params.ducks / 2,
    turkeys: params.turkeys * 3,
    guineaFowl: params.guineaFowl,
    otherPoultry: Math.max(1, params.ducks / 2 + params.turkeys * 3 + params.guineaFowl),
    beefShed: results.beefShedPlaces,
    cattleShed: Math.max(1, results.cattleShedPlaces),
    sheepAndGoats: Math.max(1, params.sheep + params.goats),
  };
}

/** Fills in the fields most enterprises leave out. */
function withDefaults(enterprise) {
  return { labelKey: enterprise.id, depreciation: 0, subsidy: 0, ...enterprise };
}

/** Net result, result per hour and per hectare of land used. */
function addPerUnitResults(enterprise, landHa) {
  enterprise.net = enterprise.revenue + enterprise.subsidy - enterprise.cost - enterprise.depreciation;
  enterprise.netPerHour = enterprise.hours > 0 ? enterprise.net / enterprise.hours : 0;
  enterprise.landHa = landHa;
  enterprise.netPerHa = landHa > 0.005 ? enterprise.net / landHa : null;
}

/** Revenue, costs (including own feed), depreciation, subsidies and hours of every enterprise. */
function listEnterprises(params, results, feed) {
  const {
    revenueItems: revenue,
    costItems: cost,
    subsidyItems: subsidy,
    hoursByActivity: hours,
    forageNeedByAnimal: forage,
    grainNeedByAnimal: grain,
    homeUse,
    sucklerCows,
    finishers,
    beefHeifers,
  } = results;
  const feedCost = feed.costOf;
  const depreciation = id => depreciationOf(results, id);
  const places = sharedBuildingPlaces(params, results);
  const otherPoultryShelter = species =>
    (depreciation('otherPoultryShelters') * places[species]) / places.otherPoultry;

  const geeseProcessing = processingShare(results, 'geese');
  const duckProcessing = processingShare(results, 'ducks');
  const lambProcessing = processingShare(results, 'sheep');
  const porkProcessing = processingShare(results, 'pigs');
  const beefProcessing = processingShare(results, 'beefCattle');
  const preserves = processingShare(results, 'preserves');
  const milkSalesHours = (results.freshMilkSold / 100) * params.milkSalesHoursPer100Litres;
  const goatMilkSalesHours = (results.goatMilkSold / 100) * params.milkSalesHoursPer100Litres;
  const eggSalesHours = (results.eggsSold / 100) * params.eggSalesHoursPer100;
  const goatShareOfCheeseWork =
    results.milkForCheese + results.goatMilkForCheese > 0
      ? results.goatMilkForCheese / (results.milkForCheese + results.goatMilkForCheese + results.milkForCurd)
      : 0;
  const sheepAndGoatShed = depreciation('sheepShed') / places.sheepAndGoats;

  return [
    {
      id: 'milk',
      active: params.dairyCows > 0,
      revenue:
        revenue.milk +
        revenue.cheese +
        revenue.curd +
        revenue.cream +
        revenue.butter +
        revenue.dairyByproducts +
        revenue.calves,
      cost:
        cost.dairyCows +
        cost.milkPackaging +
        cost.cheese * (1 - goatShareOfCheeseWork) +
        params.energyCosts * DAIRY_ENERGY_SHARE +
        feedCost(grain.dairyCows, forage.dairyCows + forage.replacementHeifers + forage.bull),
      depreciation:
        (depreciation('cattleShed') * results.dairyShedPlaces) / places.cattleShed +
        depreciation('dairy') +
        depreciation('cheeseRoom') * (1 - goatShareOfCheeseWork),
      subsidy:
        subsidy.dairyCows * (params.dairyCows / Math.max(1, params.dairyCows + sucklerCows)) +
        subsidy.beefCattle,
      hours: hours.dairyCows + hours.cheese * (1 - goatShareOfCheeseWork) + milkSalesHours,
    },
    {
      id: 'eggs',
      active: params.layingHens > 0,
      revenue: revenue.eggs + revenue.cockerels,
      cost:
        cost.layingHens +
        params.energyCosts * LAYING_HENS_ENERGY_SHARE +
        feedCost(grain.layingHens + grain.hatching, 0),
      depreciation: depreciation('henHouse') + depreciation('hatching') + depreciation('poultryTunnel'),
      hours: hours.layingHens + hours.hatching + eggSalesHours,
    },
    {
      id: 'broilers',
      active: params.broilers > 0,
      revenue: revenue.broilers,
      cost: cost.broilers + feedCost(grain.broilers, 0),
      depreciation: depreciation('broilerPens'),
      hours: hours.broilers,
    },
    {
      id: 'geese',
      labelKey: params.geeseProcessedShare > 0 ? 'geeseWithProcessing' : 'geese',
      active: params.geese > 0,
      revenue: revenue.geese + geeseProcessing.revenue,
      cost: cost.geese + geeseProcessing.cost + feedCost(grain.geese, forage.geese),
      depreciation: geeseProcessing.depreciation,
      hours: hours.geese + geeseProcessing.hours,
    },
    {
      id: 'ducks',
      labelKey: params.ducksProcessedShare > 0 ? 'ducksWithProcessing' : 'ducks',
      active: params.ducks > 0,
      revenue: revenue.ducks + duckProcessing.revenue,
      cost: cost.ducks + duckProcessing.cost + feedCost(grain.ducks, forage.ducks),
      depreciation: otherPoultryShelter('ducks') + duckProcessing.depreciation,
      hours: hours.ducks + duckProcessing.hours,
    },
    {
      id: 'beefCattle',
      labelKey: params.beefProcessedShare > 0 ? 'beefCattleWithProcessing' : 'beefCattle',
      active: sucklerCows > 0,
      revenue: revenue.beefCattle + beefProcessing.revenue,
      cost: cost.beefCattle + beefProcessing.cost + feedCost(grain.beefCattle, forage.beefCattle),
      depreciation:
        (depreciation('cattleShed') * places.beefShed) / places.cattleShed + beefProcessing.depreciation,
      subsidy:
        SUBSIDY_RATES.dairyCows * sucklerCows +
        SUBSIDY_RATES.beefCattle * Math.floor(finishers + beefHeifers),
      hours: hours.beefCattle + beefProcessing.hours,
    },
    {
      id: 'turkeys',
      active: params.turkeys > 0,
      revenue: revenue.turkeys,
      cost: cost.turkeys + feedCost(grain.turkeys, forage.turkeys),
      depreciation: otherPoultryShelter('turkeys'),
      hours: hours.turkeys,
    },
    {
      id: 'guineaFowl',
      active: params.guineaFowl > 0,
      revenue: revenue.guineaFowl,
      cost: cost.guineaFowl + feedCost(grain.guineaFowl, forage.guineaFowl),
      depreciation: otherPoultryShelter('guineaFowl'),
      hours: hours.guineaFowl,
    },
    {
      id: 'rabbits',
      active: params.rabbits > 0,
      revenue: revenue.rabbits,
      cost: cost.rabbits + feedCost(grain.rabbits, forage.rabbits),
      depreciation: depreciation('rabbitHutches'),
      hours: hours.rabbits,
    },
    {
      id: 'sheep',
      labelKey: params.lambProcessedShare > 0 ? 'sheepWithProcessing' : 'sheep',
      active: params.sheep > 0,
      revenue: revenue.sheep + revenue.lambMeat + lambProcessing.revenue,
      cost: cost.sheep + cost.slaughter + lambProcessing.cost + feedCost(grain.sheep, forage.sheep),
      depreciation: sheepAndGoatShed * params.sheep + lambProcessing.depreciation,
      subsidy: subsidy.sheep,
      hours: hours.sheep + lambProcessing.hours,
    },
    {
      id: 'goats',
      labelKey: params.goatMilking ? 'goatsWithMilk' : 'goats',
      active: params.goats > 0,
      revenue: revenue.goats + revenue.goatMilk + revenue.goatCheese,
      cost: cost.goats + cost.cheese * goatShareOfCheeseWork + feedCost(grain.goats, forage.goats),
      depreciation:
        sheepAndGoatShed * params.goats +
        depreciation('goatDairy') +
        depreciation('cheeseRoom') * goatShareOfCheeseWork,
      subsidy: subsidy.goats,
      hours: hours.goats + hours.cheese * goatShareOfCheeseWork + goatMilkSalesHours,
    },
    {
      id: 'pigs',
      labelKey: params.porkProcessedShare > 0 ? 'pigsWithProcessing' : 'pigs',
      active: params.pigs > 0,
      revenue: revenue.pigs + porkProcessing.revenue,
      cost: cost.pigs + porkProcessing.cost + feedCost(grain.pigs, forage.pigs),
      depreciation: depreciation('pigShelters') + porkProcessing.depreciation,
      hours: hours.pigs + porkProcessing.hours,
      homeValue: homeUse.pork,
    },
    {
      id: 'horses',
      labelKey: params.ridesPerYear > 0 ? 'horsesWithRiding' : 'horses',
      active: params.horses > 0,
      revenue: revenue.horseRiding,
      cost: cost.horses + feedCost(grain.horses, forage.horses),
      depreciation: depreciation('horses') + depreciation('ridingEquipment'),
      hours: hours.horses,
    },
    {
      id: 'guardDogs',
      active: params.guardDogs > 0,
      revenue: 0,
      cost: cost.guardDogs,
      hours: hours.guardDogs,
      homeValue: homeUse.dogFood,
    },
    {
      id: 'vegetables',
      active: params.marketGardenHa > 0,
      revenue: revenue.vegetables,
      cost: cost.vegetables,
      depreciation: depreciation('vegetables'),
      hours: hours.vegetables,
    },
    {
      id: 'fruit',
      active: revenue.fruit > 0,
      revenue: revenue.fruit,
      cost: cost.fruit,
      hours: hours.fruit,
    },
    {
      id: 'preserves',
      active: preserves.revenue > 0,
      revenue: preserves.revenue,
      cost: preserves.cost,
      depreciation: preserves.depreciation + depreciation('preservesKitchen'),
      hours: preserves.hours,
    },
    {
      id: 'mushrooms',
      active: params.mushroomLogs > 0,
      revenue: revenue.mushrooms,
      cost: cost.mushrooms,
      hours: hours.mushrooms,
    },
    {
      id: 'grainForSale',
      active: results.grainSoldTonnes > 0,
      revenue: revenue.grainSales,
      cost: results.grainSoldTonnes * feed.grainCostPerTonne,
      hours: results.grainSupply > 0 ? (hours.cereals * results.grainSoldTonnes) / results.grainSupply : 0,
    },
    {
      id: 'beehives',
      active: params.beehives > 0,
      revenue: revenue.honey,
      cost: cost.beehives,
      depreciation: depreciation('beehives'),
      hours: hours.beehives,
    },
  ];
}

/** Hectares needed for each enterprise's feed (or its own crop) at this farm's yields. */
function landUsedByEnterprise(params, results) {
  const { forageNeedByAnimal: forage, grainNeedByAnimal: grain } = results;
  const forageLandHa = params.pastureHa + params.meadowHa + results.cloverHa;
  const forageYieldPerHa =
    forageLandHa > 0 ? (results.grazingSupply + results.haySupply) / forageLandHa : params.pastureYield;
  const grainHa = tonnes => tonnes / params.cerealYield;
  const forageHa = tonnes => tonnes / forageYieldPerHa;
  return {
    milk: forageHa(forage.dairyCows + forage.replacementHeifers + forage.bull) + grainHa(grain.dairyCows),
    eggs: grainHa(grain.layingHens + grain.hatching),
    broilers: grainHa(grain.broilers),
    geese: forageHa(forage.geese) + grainHa(grain.geese),
    rabbits: forageHa(forage.rabbits) + grainHa(grain.rabbits),
    sheep: forageHa(forage.sheep) + grainHa(grain.sheep),
    goats: forageHa(forage.goats) + grainHa(grain.goats),
    pigs: forageHa(forage.pigs) + grainHa(grain.pigs),
    guardDogs: 0,
    preserves: 0,
    horses: forageHa(forage.horses) + grainHa(grain.horses),
    vegetables: params.marketGardenHa,
    beehives: 0,
    beefCattle: forageHa(forage.beefCattle) + grainHa(grain.beefCattle),
    ducks: forageHa(forage.ducks) + grainHa(grain.ducks),
    turkeys: forageHa(forage.turkeys) + grainHa(grain.turkeys),
    guineaFowl: forageHa(forage.guineaFowl) + grainHa(grain.guineaFowl),
    fruit: (results.orchardHa * params.fruitSoldShare) / 100,
    mushrooms: 0,
    grainForSale: results.grainSoldTonnes / params.cerealYield,
  };
}

// ===== model/stages/market.js =====
// How much of each product has to be sold, and to how many customers.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Market: how much has to be sold ----------

/** Price of one CSA vegetable share for the season (PLN), used to count the shares. */
const CSA_SHARE_PRICE = 1600;
