"meadowHa":{"label":"Hay meadow","unit":"ha"},"rotationFields":{"label":"Crop rotation: number of fields (years)","unit":"fields","hint":"Cereals and clover move one field further every year. Details in the “Crop rotation” section."},"cerealShare":{"label":"Cereals and legumes in the rotation","unit":"%","hint":"The rest of the arable land is clover with grass for hay. In organic farming it is the source of nitrogen, so 100% cereals does not work in the long run."},"rootCrops":{"label":"Root crops in the rotation (potatoes, fodder beet)","hint":"One field of the rotation before the last oats, as in the Norfolk four-course rotation: clover → cereal → root crops → oats with undersown clover. Root crops get the manure, hoeing cleans the field of weeds, and the crop replaces part of the grain fed to cows and pigs. Needs at least two cereal years in the rotation."},"dairyCows":{"label":"Dairy cows","unit":"head"},"milkPerCow":{"label":"Milk per cow","unit":"l/yr","hint":"On grass without much concentrate: Jersey 3,500–4,500 l, dual-purpose 4,500–5,500 l, Holstein 6,000–7,500 l."},"onceADayMilking":{"label":"Once-a-day milking (New Zealand style)","hint":"About 20% less milk, but milking and parlour cleaning once a day: about 35% less work per cow and 40% less fixed work. The cows are in better condition. In New Zealand studies milk falls by 10–30%, and Jerseys lose less than Holsteins."},"milkUsedShare":{"label":"Milk for sale and processing","unit":"%","hint":"The rest: feeding the calves and losses. Milk for the household is taken off separately (the “Household budget” group)."},"cheeseShare":{"label":"Milk for aged cheese","unit":"%"},"milkPrice":{"label":"Price of raw milk sold by the farmer","unit":"PLN/l","hint":"Dairies paid about 1.5–2.6 PLN/l in 2026. Raw milk sold by the farmer usually 3–6 PLN/l; A2A2 Jersey milk can fetch more in town. Selling raw milk is a direct sale (registered with the district vet), not farm retail."},"cheesePrice":{"label":"Aged cheese","unit":"PLN/kg","hint":"An assumption. Aged farmhouse cheeses usually sell for about 60–150 PLN/kg depending on the cheese, its age and the sales channel; current prices could not be confirmed. Enter your own price."},"cheeseYield":{"label":"Aged cheese yield","unit":"kg/100 l","hint":"From Jersey milk about 11–12 kg per 100 l, from Holstein milk about 9–10 kg."},"lactationsPerCow":{"label":"Average number of lactations per cow"},"ownBull":{"label":"Own bull (otherwise AI or a borrowed bull)"},"oatsPerCow":{"label":"Concentrate (grain) per cow","unit":"kg/yr","hint":"Jerseys on grass about 100 kg of oats after calving; Holsteins about 800–1,200 kg of grain a year."},"calfPrice":{"label":"Price of a calf sold","unit":"PLN"},"cullCowPrice":{"label":"Cull cow for slaughter","unit":"PLN","hint":"Slaughter cattle at buyers: 12.55 PLN/kg live weight (July 2026, ZSRIR); cows less. A Jersey weighs about 400 kg."},"layingHens":{"label":"Laying hens","unit":"birds"},"eggsPerHen":{"label":"Laying rate","unit":"eggs/yr","hint":"Green-legged Partridge: about 180–200 eggs a year (a conservation breed); other native breeds 190–230; commercial hybrids on range 250–280."},"eggPrice":{"label":"Price of an egg","unit":"PLN each","hint":"Median of 49 adverts for farm eggs on OLX (Nov 2026): 1.20 PLN each; ŚODR (May 2026): 1.22 PLN on average (0.60–2.00). Free-range Green-legged eggs usually sell higher to regular customers: 1.4–2 PLN."},"eggsSoldShare":{"label":"Eggs fit for sale","unit":"%","hint":"The rest: cracked, dirty or too small. Eggs for the household are taken off separately."},"henFeedGramsPerDay":{"label":"Feed per hen","unit":"g/day","hint":"A Green-legged hen (about 1.6–2 kg) eats about 100–120 g a day, commercial hens 120–130 g; a good range lowers the amount."},"rangeFeedSaving":{"label":"Feed saved by foraging on the range","unit":"%"},"flockReplacementYears":{"label":"Replace the flock every","unit":"years"},"ownHatching":{"label":"Own hatching (cockerels in the flock, incubator)","hint":"Replacement pullets from your own eggs; cockerels reared and sold as soup birds. Vaccinate the chicks against Marek’s disease (agree it with your vet)."},"cockerelPrice":{"label":"Soup cockerel","unit":"PLN each","hint":"An assumption; check locally. Green-legged Partridge: about 16–20 weeks to a carcass of about 1.5 kg."},"cockerelGrainKg":{"label":"Cockerel: grain until slaughter","unit":"kg"},"pulletGrainKg":{"label":"Pullet: grain until laying","unit":"kg"},"hatchingCostPerChick":{"label":"Hatching: vaccination, electricity, losses (per chick)","unit":"PLN"},"hatchingHoursPerChick":{"label":"Hatching and rearing: work per chick","unit":"h","hint":"Counts about 2 chicks for every pullet added to the flock (half are cockerels)."},"winterPolytunnel":{"label":"Poultry in a polytunnel in winter (deep litter)","hint":"The vegetable tunnel from November to March: a place for the poultry during a housing order, compost for spring. Openings covered with netting, a heated drinker, netting dug in along the edges."},"tunnelBeddingCostPerHen":{"label":"Sawdust or wood chips for the tunnel","unit":"PLN/hen/yr"},"pulletPrice":{"label":"Price of a pullet (point of lay)","unit":"PLN"},"broilers":{"label":"Pastured broilers","unit":"birds/yr"},"broilerCarcassKg":{"label":"Carcass weight","unit":"kg"},"broilerPricePerKg":{"label":"Carcass price","unit":"PLN/kg","hint":"Broiler carcasses wholesale: 9.06 PLN/kg (July 2026, ZSRIR). Free-range chicken straight from the farmer: usually about 25–40 PLN/kg."},"broilerFeedKg":{"label":"Feed per broiler","unit":"kg","hint":"Slow-growing breeds on range to a carcass of about 2.3 kg: about 7–9 kg of feed per bird; a grassy range gives the lower end."},"geese":{"label":"Geese (for St Martin’s Day)","unit":"head"},"goosePrice":{"label":"Price of a goose","unit":"PLN each","hint":"Fattened geese at buyers: 16.09 PLN/kg live weight (July 2026, ZSRIR). An oat-fed farm goose has a carcass of about 4–4.5 kg."},"ducks":{"label":"Ducks","unit":"birds/yr","hint":"They need bathing water (a paddling pool) and foul the drinkers badly. Good at eating slugs."},"duckCarcassKg":{"label":"Duck: carcass weight","unit":"kg"},"duckPricePerKg":{"label":"Duck: carcass price","unit":"PLN/kg","hint":"Organic in online shops about 68 PLN/kg (3.2 kg carcass, Wolny Wypas 2026). Usually cheaper from the farmer."},"duckGrainKg":{"label":"Duck: grain","unit":"kg/bird"},"turkeys":{"label":"Turkeys","unit":"birds/yr","hint":"Keep them apart from hens and on different ground: blackhead (histomoniasis), carried by hens, can kill up to 100% of a turkey flock. There is practically no treatment."},"turkeyCarcassKg":{"label":"Turkey: carcass weight","unit":"kg"},"turkeyPricePerKg":{"label":"Turkey: carcass price","unit":"PLN/kg","hint":"Organic in shops about 82 PLN/kg (carcass about 8 kg). Demand rises for Christmas and Thanksgiving."},"turkeyGrainKg":{"label":"Turkey: grain","unit":"kg/bird"},"guineaFowl":{"label":"Guinea fowl","unit":"birds/yr","hint":"Noisy, but they scare off hawks and eat insects. They grow slowly: at least about 5 months."},"guineaFowlCarcassKg":{"label":"Guinea fowl: carcass weight","unit":"kg"},"guineaFowlPricePerKg":{"label":"Guinea fowl: carcass price","unit":"PLN/kg","hint":"Organic about 65 PLN/kg (Wolny Wypas, a farm described by topagrar in 2024)."},"guineaFowlGrainKg":{"label":"Guinea fowl: grain","unit":"kg/bird"},"rabbits":{"label":"Rabbits: does","unit":"head"},"rabbitsRearedPerDoe":{"label":"Young reared per doe","unit":"per year"},"rabbitPrice":{"label":"Price of a rabbit carcass","unit":"PLN each","hint":"Carcass about 1.5–2 kg. Rabbits in the Świętokrzyskie region (May 2026): about 30 PLN/kg on average, from 6.5 to 55 PLN (ŚODR)."},"sucklerCows":{"label":"Suckler cows","unit":"head","hint":"For comparison: in this model the least profitable per hectare, but little work and good on poorer meadows. Needs a quiet bull or AI."},"weanersSoldShare":{"label":"Calves sold as weaners","unit":"%","hint":"Weaners at about 7–8 months, in autumn. The rest stay as finishers until about 2 years."},"weanerWeightKg":{"label":"Weaner: weight","unit":"kg live"},"weanerPricePerKg":{"label":"Weaner: price","unit":"PLN/kg live","hint":"Average price of slaughter cattle in April 2026: 14.13 PLN/kg live weight (KOWR). Beef-breed weaners usually fetch more per kg. An assumption."},"finisherWeightKg":{"label":"Finisher: weight at slaughter","unit":"kg live","hint":"About 20–24 months on grass alone."},"finishersSoldAsMeatShare":{"label":"Finishers sold as boxed meat","unit":"%","hint":"Slaughter at an abattoir, sale under farm retail rules. The rest sold live."},"beefBoxPricePerKg":{"label":"Boxed beef","unit":"PLN/kg carcass","hint":"Average per kg of carcass (mixed cuts). Young-bull quarters at buyers: 27.54 PLN/kg (KOWR, April 2026)."},"finisherLivePricePerKg":{"label":"Finisher sold live","unit":"PLN/kg"},"finisherKillingOut":{"label":"Finisher killing-out percentage","unit":"%"},"beefCattleCostPerHead":{"label":"Vet, ear tags, minerals, hoof care","unit":"PLN/head/yr"},"finisherSlaughterCost":{"label":"Slaughter, butchery, transport of a finisher","unit":"PLN/head"},"hoursPerSucklerCow":{"label":"Work: suckler cow with calf","unit":"h/yr"},"hoursPerFinisher":{"label":"Work: finisher","unit":"h/head"},"sheep":{"label":"Meat sheep (ewes)","unit":"head"},"lambingsPerEwe":{"label":"Lambings per ewe per year","hint":"Dorpers can lamb 3 times in 2 years (1.5 a year). Two lambings a year are impossible: pregnancy lasts about 146–150 days. With more frequent lambing, litter size is often about 25% lower, and more hay and work are needed in winter."},"lambsPerLambing":{"label":"Lambs reared per lambing"},"lambLivePrice":{"label":"Price of a lamb sold live","unit":"PLN each","hint":"An assumption (about 40 kg live weight at about 13–14 PLN/kg). World sheep-meat prices were at record highs in 2026."},"lambsSoldAsMeatShare":{"label":"Lambs sold as meat (farm retail)","unit":"%","hint":"The rest are sold live. Meat: slaughter at an abattoir, a whole carcass or boxes for customers."},"lambLiveWeightKg":{"label":"Lamb weight at sale or slaughter","unit":"kg live"},"lambMeatPricePerKg":{"label":"Price of lamb for customers","unit":"PLN/kg carcass","hint":"Farmers’ adverts: usually 30–60 PLN/kg (median about 40 PLN). Farm shops: 43–52 PLN/kg for a whole carcass."},"lambKillingOut":{"label":"Killing-out percentage (carcass of live weight)","unit":"%","hint":"Meat crossbreds about 46%, Dorper about 50%, native sheep kept extensively as little as about 36%."},"lambSlaughterCost":{"label":"Contract slaughter at an abattoir","unit":"PLN/head","hint":"An assumption. Ask the abattoir for its price list."},"butcheryCostPerKg":{"label":"Butchery and vacuum packing","unit":"PLN/kg"},"abattoirDistanceKm":{"label":"Distance to the abattoir (e.g. Siedlęcin)","unit":"km one way"},"lambsPerAbattoirTrip":{"label":"Trailer places (in lambs)","unit":"places","hint":"A lamb or kid takes 1 place, a fattener 2, a finisher 5. Every batch takes 2 trips: delivering the animals and collecting the chilled carcasses."},"trailerCostPerKm":{"label":"Cost of driving with a trailer","unit":"PLN/km"},"eweReplacementShare":{"label":"Ewes replaced each year","unit":"%"},"goats":{"label":"Goats (does)","unit":"head","hint":"Goats clear scrub and bushes well. They need a higher fence and a roof against the rain."},"kidsSoldShare":{"label":"Kids sold for meat","unit":"%","hint":"The rest stays in the herd or becomes meat for the dogs. Slaughter at an abattoir, sale under farm retail. Kid meat sells mainly at Easter and to customers from the Balkans and the Middle East."},"kidCarcassKg":{"label":"Kid: carcass","unit":"kg","hint":"About 4–5 months old."},"kidMeatPricePerKg":{"label":"Kid meat","unit":"PLN/kg carcass","hint":"An assumption for direct sales; check locally."},"pigCarcassKg":{"label":"Fattener: carcass","unit":"kg","hint":"Outdoor breeds grow more slowly: about 8–10 months to slaughter."},"porkBoxPricePerKg":{"label":"Pork in boxes","unit":"PLN/kg carcass","hint":"Wholesale half carcasses about 7 PLN/kg (July 2026, ZSRIR). Free-range pork in boxes for regular customers: about 18–35 PLN/kg."},"pigSlaughterCost":{"label":"Pig: slaughter, butchery, transport","unit":"PLN/head"},"kidSlaughterCost":{"label":"Kid: slaughter and transport","unit":"PLN/head"},"horses":{"label":"Horses","unit":"head","hint":"A horse eats about 3 t DM of hay and grass a year and about 200 kg of oats in light work."},"horseCost":{"label":"Horse: farrier, vet, minerals","unit":"PLN/yr","hint":"Hoof trimming from about 50 PLN, vaccination 70–90 PLN, worming 40–50 PLN, check-up 200–300 PLN (kb.pl, 2026)."},"hoursPerHorse":{"label":"Horse: work","unit":"h/yr"},"marketGardenHa":{"label":"Vegetables for sale (CSA, market)","unit":"ha","hint":"Land taken from the arable fields. The Dobrzyń Vegetables CSA: about 5 ha and over 530 members paying 1,480–1,740 PLN a season."},"vegetableSalesPerHa":{"label":"Vegetable sales per hectare","unit":"PLN/ha","hint":"An assumption. The Dobrzyń CSA takes about 170,000 PLN per ha in shares. The best small market gardens in the US and Canada sell 100,000 USD per acre; typical CSAs there under 40,000 USD."},"vegetableCostShare":{"label":"Vegetable costs (seeds, compost, water, packaging)","unit":"% of sales"},"vegetableHoursPerHa":{"label":"Work on vegetables","unit":"h/ha","hint":"Hand growing with a tunnel and selling: small market gardens usually need 4,000–6,000 h per hectare (1–1.5 people per half hectare). Less with simpler growing and bigger beds."},"fruitSoldShare":{"label":"Orchard fruit for sale","unit":"% of harvest","hint":"Fresh or as juice from a contract press. The rest for the household. The orchard is set under “Land”."},"orchardYield":{"label":"Orchard yield","unit":"t/ha","hint":"An assumption for an extensive orchard in full bearing. A new orchard starts bearing after about 4–6 years and then crops more heavily every other year."},"fruitPricePerKg":{"label":"Revenue per kg of fruit","unit":"PLN/kg","hint":"An average for fresh fruit and juice. 1 kg of apples gives about 0.6–0.7 l of juice. An assumption."},"fruitCostShare":{"label":"Fruit costs (press, packaging, organic sprays)","unit":"% of sales"},"fruitHoursPerTonne":{"label":"Picking, pressing and selling fruit","unit":"h/t"},"mushroomLogs":{"label":"Logs for oyster mushrooms","unit":"logs","hint":"Sections 30–40 cm long and 20–50 cm across, almost any hardwood. They lie in the shade under trees and take no field space. The harvest is about 20% of the wood’s weight over 2–5 years (Dr M. Siwulski, Poznań University of Life Sciences)."},"mushroomYieldPerLog":{"label":"Mushrooms per log","unit":"kg/yr","hint":"A log of about 20 kg × 20% over about 3 years gives about 1.3 kg a year. Shiitake on oak or beech yields less but sells higher."},"mushroomPrice":{"label":"Mushroom price","unit":"PLN/kg","hint":"An assumption for log-grown oyster mushrooms sold direct."},"mushroomLogCost":{"label":"Log: spawn and wood (per year)","unit":"PLN/yr"},"mushroomLogHours":{"label":"Log: inoculating, soaking, picking, selling","unit":"h/yr"},"beehives":{"label":"Beehives (colonies)","unit":"hives","hint":"They take no land and pollinate the orchard and clover."},"honeyPerHive":{"label":"Honey per hive","unit":"kg/yr","hint":"In Poland about 15–20 kg per hive on average; much less in poor years."},"honeyPrice":{"label":"Honey price in direct sales","unit":"PLN/kg","hint":"Average retail prices in 2025: multifloral about 35.5 PLN/kg, honeydew about 64 PLN, heather about 91 PLN (INHORT)."},"hiveCost":{"label":"Cash cost of a hive (feed, treatments, jars)","unit":"PLN/yr"},"hiveHours":{"label":"Work per hive","unit":"h/yr"},"geeseProcessedShare":{"label":"Geese processed (smoked breast, smoked cuts, lard)","unit":"%"},"processedValuePerGoose":{"label":"Products from one goose","unit":"PLN","hint":"E.g. about 0.8 kg of smoked goose breast at 180–200 PLN plus smoked legs, lard and pâté. Organic smoked breast from pastured geese: 200 PLN/kg (Manufaktura Dobra, 2026)."},"ducksProcessedShare":{"label":"Ducks processed (smoked breasts, confit legs)","unit":"%"},"processedValuePerDuck":{"label":"Products from one duck","unit":"PLN"},"lambProcessedShare":{"label":"Lamb processed (sausages, kabanos, ham)","unit":"% of meat","hint":"From the lambs that go to the abattoir. Meat of hoofed animals must come from an abattoir."},"processedValuePerLambKg":{"label":"Products per kg of lamb carcass","unit":"PLN/kg carcass","hint":"Value of the products per kg of carcass with bones, after losses in butchery and smoking. An assumption."},"processingMaterialsShare":{"label":"Materials: spices, casings, jars, vacuum bags, labels","unit":"% of value"},"processingHoursPerGoose":{"label":"Work: products from a goose","unit":"h/bird"},"processingHoursPerDuck":{"label":"Work: products from a duck","unit":"h/bird"},"processingHoursPerLambKg":{"label":"Work: lamb products","unit":"h/kg carcass"},"processingFixedHours":{"label":"Fixed work: cleaning, paperwork, tests","unit":"h/yr"},"shippedShare":{"label":"Products shipped by courier","unit":"%","hint":"Polish farm retail (RHD) rules allow distance selling to consumers if the right temperature is kept in transport. The rest is collected in person or sold at the market."},"parcelCost":{"label":"Parcel: insulated box, ice packs, courier","unit":"PLN","hint":"An assumption. Ask couriers about chilled food parcels."},"shippingFeeCharged":{"label":"Shipping charged to the customer","unit":"PLN/parcel"},"parcelWeightKg":{"label":"Average parcel","unit":"kg"},"hoursPerParcel":{"label":"Packing and handling an order","unit":"h/parcel"},"grazingDays":{"label":"Grazing days a year","unit":"days","hint":"Set by the location (the list in the header); it can be longer if you leave standing grass for the autumn."},"mixedGrazingBonus":{"label":"Sheep after cows: better use of the pasture","unit":"%","hint":"Grazing cattle and sheep together or one after the other: about 10% more pasture capacity (Nolan and Connolly 1989). Full effect from about 1.5 sheep per head of cattle."},"pastureYield":{"label":"Pasture yield (eaten)","unit":"t DM/ha","hint":"Polish pastures average about 3.4 t of hay/ha (about 2.9 t DM; ITP), but that average includes neglected ones. Rotational grazing with clover in the sward: about 4–6 t DM eaten; potential 2.5–8 t of hay/ha."},"meadowYield":{"label":"Meadow yield (2 cuts)","unit":"t DM/ha","hint":"Polish meadows average about 4.6 t of hay/ha (about 3.9 t DM; ITP, 2005–2009); extensive ones with 1 cut about 2.5 t of hay. A good meadow manured with farmyard manure: 4–6 t DM."},"cloverYield":{"label":"Clover-grass yield","unit":"t DM/ha","hint":"Red clover with grasses, 2–3 cuts: usually 6–9 t DM/ha, on organic farms and poorer soils about 5–7."},"cerealYield":{"label":"Cereal and mixture yield (organic)","unit":"t/ha","hint":"Organic farms: cereals about 1.5–3 t/ha (IUNG). On class IV soil after clover and manure about 2.5–3.5; cereal-legume mixtures in IUNG trials 2.6–4.9 t/ha. Yield for class IV; soil classes are set under “Land”."},"strawYield":{"label":"Straw yield","unit":"t/ha","hint":"Usually about 1–1.2 t of straw per 1 t of grain; rye and triticale more, oats with peas less."},"rootCropYield":{"label":"Root crop yield as grain equivalent","unit":"t/ha","hint":"Organic fodder beet: 40–60 t/ha fresh weight, i.e. about 6–9 t of dry matter; organic potatoes 15–25 t/ha. Counted as feed-grain equivalent, because the energy in beet dry matter is close to barley."},"grazingMoveIntervalDays":{"label":"Move the cows to a new paddock every","unit":"days","hint":"0.5 means twice a day, after morning and evening milking. Moving more often leaves less ungrazed grass and spreads dung more evenly: about +4% grass eaten with moves twice a day, −7% every 3 days, −16% once a week. It takes more work with polywire and water, though. Salatin and Perkins move their cattle daily."},"pastureRestDays":{"label":"Back on the same paddock after","unit":"days","hint":"Paddock rest. In spring 20–30 days are enough, in summer and in drought 40–60 (Salatin: up to 60 days, until the grass rebuilds its roots). Over a season 35–60 days give the most grass; longer rests build soil and drought resilience, but some grass gets old."},"arableCostPerHa":{"label":"Arable land: seed, fuel, combine","unit":"PLN/ha"},"meadowCostPerHa":{"label":"Meadow: fuel, contract baling","unit":"PLN/ha"},"pastureCostPerHa":{"label":"Pasture: upkeep, topping","unit":"PLN/ha"},"costPerCow":{"label":"Cow: vet, minerals, hygiene","unit":"PLN/yr"},"inseminationCost":{"label":"Artificial insemination (no bull)","unit":"PLN/cow"},"bullCost":{"label":"Bull: purchase spread over years, vet","unit":"PLN/yr"},"milkPackagingCostPerLitre":{"label":"Bottles, milk tests","unit":"PLN/l"},"cheeseCostPerKg":{"label":"Cultures, rennet, salt, wax, electricity","unit":"PLN/kg cheese"},"henExtrasCost":{"label":"Hen: minerals, shell grit, supplements","unit":"PLN/yr"},"eggPackagingCost":{"label":"Egg boxes","unit":"PLN/egg"},"costPerBroiler":{"label":"Broiler: chick, supplements, slaughter","unit":"PLN/bird"},"costPerGoose":{"label":"Goose: gosling, vet","unit":"PLN/bird"},"costPerDuck":{"label":"Duck: duckling, vet, slaughter","unit":"PLN/bird"},"costPerTurkey":{"label":"Turkey: poult, vet, slaughter","unit":"PLN/bird"},"costPerGuineaFowl":{"label":"Guinea fowl: keet, vet, slaughter","unit":"PLN/bird"},"costPerRabbitDoe":{"label":"Rabbit: vaccinations, stock replacement","unit":"PLN/doe"},"costPerEwe":{"label":"Ewe: vet, ear tags, ram, hoof care","unit":"PLN/yr"},"costPerGoat":{"label":"Goat: vet, minerals","unit":"PLN/yr"},"costPerPig":{"label":"Pig: piglet, vet","unit":"PLN/head"},"fixedCosts":{"label":"Farmers’ social insurance (KRUS), land tax, insurance, organic certificate","unit":"PLN/yr","hint":"KRUS in 2026: about 256 PLN a month per person (178 PLN pension and disability, 78 PLN accident and sickness), about 6,200 PLN a year for 2 people. Agricultural land tax 2026: 166 PLN per conversion hectare. Plus the organic certificate, liability insurance and building insurance."},"salesCosts":{"label":"Selling: fuel for deliveries, market fees","unit":"PLN/yr"},"energyCosts":{"label":"Electricity and water (cooling, washing, general)","unit":"PLN/yr","hint":"Milk cooling, hot water for washing the milking machine, the cheese room, the pump and henhouse lighting: about 3,000–4,000 kWh a year at about 1 PLN/kWh. Without cows and a cheese room usually about 2,000 PLN."},"grainPurchasePrice":{"label":"Organic grain bought in (when short)","unit":"PLN/t"},"sellSurplusGrain":{"label":"Sell surplus grain after harvest","hint":"Grain beyond what the animals need and the reserve for a poorer year goes to a buyer or a neighbour. Without animals all the grain is sold."},"grainSalePrice":{"label":"Selling price of organic grain","unit":"PLN/t","hint":"Conventional triticale at buyers: about 760–785 PLN/t (KOWR, Sept–Oct 2026), rye about 660–680 PLN/t. Organic grain usually sells 30–50% higher, but small lots have to be delivered or sold to neighbouring organic farms."},"feedReserveShare":{"label":"Grain and straw reserve above needs","unit":"%","hint":"This much above the animals’ yearly needs stays in store for a poorer year. Grain above the reserve is sold and surplus straw is ploughed in."},"hayPurchasePrice":{"label":"Hay bought in (when short)","unit":"PLN/t DM"},"sawdustForStraw":{"label":"Replace missing straw with sawdust or wood chips","hint":"Instead of buying straw, you top up the bedding with sawdust from a sawmill. On an organic farm only from untreated wood. Manure with sawdust rots more slowly: compost it longer before spreading."},"sawdustPrice":{"label":"Sawdust or wood chips","unit":"PLN/t","hint":"About 40–80 PLN/m³ from a sawmill; 1 m³ of sawdust weighs about 0.2–0.25 t. Sometimes free if you collect it."},"sawdustPerStrawTonne":{"label":"Sawdust instead of 1 t of straw","unit":"t","hint":"Sawdust absorbs about as much as straw per kilogram. An assumption."},"strawPurchasePrice":{"label":"Straw bought in (when short)","unit":"PLN/t"},"rootCropCostPerHa":{"label":"Root crops: cost above ordinary arable","unit":"PLN/ha","hint":"Seed potatoes or beet seed, contract planting and lifting, storage. Usually 1,500–4,000 PLN/ha more than a cereal."},"investCattleShed":{"label":"Deep-litter cattle shelter","unit":"PLN/place"},"investSheepShed":{"label":"Shelter for sheep and goats","unit":"PLN/head"},"investHenHouse":{"label":"Mobile henhouse (by the farmyard in winter)","unit":"PLN/hen"},"investBroilerPens":{"label":"Movable broiler pens","unit":"PLN/place"},"investOtherPoultryShelters":{"label":"Movable shelters: ducks, turkeys, guinea fowl","unit":"PLN/place","hint":"A turkey counts as 3 places. Ducks usually in 2 batches a season."},"investRabbitHutches":{"label":"Movable rabbit hutches","unit":"PLN/doe"},"investElectricFencing":{"label":"Electric fencing","unit":"PLN/ha","hint":"With sheep and goats 30% more is counted (more wires, netting)."},"investPastureWater":{"label":"Water for the pastures (pipes, troughs)","unit":"PLN"},"investDairy":{"label":"Milking machine, cooling tank, milk room","unit":"PLN","hint":"Less if you convert the old cowshed."},"investCheeseRoom":{"label":"Cheese room and ageing room","unit":"PLN"},"investMarketGarden":{"label":"Tunnel, irrigation, cold store, tools","unit":"PLN/ha"},"investBeehive":{"label":"Hive with equipment and a colony","unit":"PLN/hive"},"investHatchery":{"label":"Incubator, brooder, rearing house","unit":"PLN"},"investPoultryTunnel":{"label":"Tunnel: netting, heated drinkers, lamps","unit":"PLN","hint":"With an existing tunnel. A new 6 × 20 m tunnel costs much more."},"investHorseStable":{"label":"Shelter or stable for a horse","unit":"PLN/horse"},"investProcessingRoom":{"label":"Smokehouse, cold store, vacuum packer, room","unit":"PLN","hint":"An assumption. The room must meet hygiene requirements and be registered with the district vet."},"investOther":{"label":"Other investments (not counted elsewhere)","unit":"PLN","hint":"Anything not on the list above: a well, a track, a utility connection, a farm building, a van. The amount can also be typed in the investments table."},"investOtherLifetimeYears":{"label":"Other investments: years of use","unit":"years","hint":"Depreciation is the amount divided by this many years."},"organicPayment":{"label":"Organic payment (once in the organic system)"},"livestockDensityBonus":{"label":"Bonus for mixed crop and livestock farming (0.5–1.5 LU/ha)"},"catchCrops":{"label":"Winter catch crops and undersowing (“Carbon farming” eco-scheme, 5 points/ha)","hint":"A mixture of at least 2 species sown by 1 October and kept until 15 February; legumes undersown in oats kept at least 8 weeks after harvest. No plant protection products. The “Crop rotation” section shows where they fit in the rotation."},"carbonManure":{"label":"Manure worked into the soil within 12 h (2 points/ha)","hint":"Geotagged photos in the ARiMR mobile app or a statement with dates within 14 days."},"carbonCropDiversity":{"label":"Diverse crop structure (3 points per ha of arable land)","hint":"At least 3 crops, cereals at most 65%, crops that build organic matter (e.g. clover) at least 20%. Checked against your rotation."},"ecoSchemePointValue":{"label":"Value of an eco-scheme point","unit":"PLN/point","hint":"In 2026 an estimated 92.76 PLN per point (ARiMR advance rates, September 2026); the final rate can differ slightly. Threshold: points at least 25% of farmland × 5 points."},"catchCropCostPerHa":{"label":"Catch crop: organic seed and sowing","unit":"PLN/ha"},"catchCropHoursPerHa":{"label":"Catch crop: work","unit":"h/ha"},"catchCropForageYield":{"label":"Catch crop: grazing in autumn and early spring","unit":"t DM/ha","hint":"Sheep or heifers on the catch crop (rye with vetch) in autumn and March. Be careful with grazing before 15 February."},"catchCropMix":{"label":"Catch crop mixture (chosen in the crop rotation)"},"stubbleCrop":{"label":"Stubble crop as green manure before a winter cereal (no payment)","hint":"After an early harvest, when a winter cereal follows: mustard, phacelia or buckwheat for 6–7 weeks, then ploughed in in September. It does not meet the eco-scheme rules (the cover does not last until 15 February), but it improves the soil and feeds the geese."},"stubbleCropMix":{"label":"Stubble crop mixture (chosen in the crop rotation)"},"stubbleCropForageYield":{"label":"Stubble crop: forage from grazing or a cut","unit":"t DM/ha"},"stubbleCropCostPerHa":{"label":"Stubble crop: seed and sowing","unit":"PLN/ha"},"extensiveGrasslandScheme":{"label":"Eco-scheme: extensive grassland with livestock","hint":"Ask your advisory centre (ODR) whether it can be combined with the organic payment."},"youngFarmerEligible":{"label":"Young farmer payment"},"lessFavouredAreaRate":{"label":"Less-favoured area payment (if the plots are in a zone)","unit":"PLN/ha","hint":"Only for plots in an area with natural constraints (check with ARiMR for your municipality). 2026 rates: lowland zone I 179 PLN, lowland zone II 264 PLN, specific and foothill zones up to about 676 PLN/ha (foothill with at least 0.3 LU/ha)."},"welfareCowsGrazing":{"label":"Animal welfare: cows – grazing and bedding (about 380 PLN/head)"},"welfareCowsSpace":{"label":"Animal welfare: cows – 20% more space in the shelter (about 640 PLN/head)","hint":"Needs a big enough shelter; work out the floor area before building."},"welfareSheepGoats":{"label":"Animal welfare: sheep and goats (about 143 and 138 PLN/head)"},"welfareHens":{"label":"Animal welfare: laying hens (about 13 PLN/head)"},"otherWelfarePayments":{"label":"Other animal welfare practices (amount)","unit":"PLN/yr"},"dairyFixedHours":{"label":"Cows: milking parlour, cleaning (fixed)","unit":"h/yr"},"hoursPerCow":{"label":"Cows: per cow","unit":"h/yr","hint":"Per cow: grazing, moving, bedding, calves, treatment (plus the fixed parlour time). With 5 cows it comes to about 170 h per cow a year in total. Milking alone in large barns is about 20 h per cow (ITP), with a bucket milking machine in a small herd much more."},"cheeseHoursPer100Litres":{"label":"Cheesemaking","unit":"h/100 l","hint":"Hard cheese: about 3–4 h per 100 l batch including cleaning; then care in the ageing room. Enter your own time after a few batches."},"milkSalesHoursPer100Litres":{"label":"Selling milk (bottles, customers)","unit":"h/100 l"},"eggSalesHoursPer100":{"label":"Packing and selling eggs","unit":"h/100 eggs"},"salesFixedHours":{"label":"Selling: market, deliveries, phone (fixed)","unit":"h/yr"},"hensFixedHours":{"label":"Hens: fixed (moving the henhouse)","unit":"h/yr"},"hoursPerHen":{"label":"Hens: per hen","unit":"h/yr","hint":"Feeding, water, collecting eggs, moving the henhouse. With about 100–300 hens usually 1–2 h per hen a year including the fixed time and egg sales."},"hoursPerBroiler":{"label":"Broiler: rearing, slaughter, evisceration","unit":"h/bird","hint":"Missouri Extension (pastured): about 0.3 h per broiler with batches of 100, including slaughter; with 700 about 0.1 h. Here 0.6 h, including selling and learning at the start."},"hoursPerGoose":{"label":"Goose","unit":"h/bird"},"hoursPerDuck":{"label":"Duck: rearing, slaughter, plucking","unit":"h/bird"},"hoursPerTurkey":{"label":"Turkey: rearing, slaughter","unit":"h/bird"},"hoursPerGuineaFowl":{"label":"Guinea fowl: rearing, slaughter","unit":"h/bird"},"hoursPerRabbitDoe":{"label":"Rabbit: per doe with young","unit":"h/yr"},"hoursPerEwe":{"label":"Ewe","unit":"h/yr","hint":"Meat sheep kept extensively: usually 5–10 h per ewe a year (lambing, feet, worming, shearing)."},"abattoirTripHours":{"label":"Trip to the abattoir (there and back)","unit":"h"},"lambSalesHoursPerLamb":{"label":"Selling lamb: phone calls, handing out boxes","unit":"h/lamb"},"hoursPerGoat":{"label":"Goat","unit":"h/yr"},"hoursPerPig":{"label":"Pig","unit":"h/head"},"hayHoursPerHa":{"label":"Hay (with contract baling)","unit":"h/ha"},"cerealHoursPerHa":{"label":"Cereals (with a contract combine)","unit":"h/ha"},"rootCropHoursPerHa":{"label":"Root crops: work","unit":"h/ha","hint":"Planting, hoeing and ridging, lifting, clamping. With contract planting and lifting about 60–120 h/ha, by hand much more."},"paddockMoveHours":{"label":"Moving to a new paddock: work","unit":"h","hint":"Moving the polywire and the trough, checking the fence. With a laneway with water and quick couplings it takes about 10–20 minutes. The work norms per cow assume one move a day, so only the difference counts here."},"generalHours":{"label":"Fencing, repairs, paperwork","unit":"h/yr"},"gardenHoursPerHa":{"label":"Orchard and kitchen garden","unit":"h/ha"},"targetFromHouseholdBudget":{"label":"Work out the minimum net income from the household budget","hint":"When on, the pessimistic threshold is calculated from the spending, margin and savings below, minus the 800+ child benefit. When off, the minimum slider in the “People” group applies."},"householdMonthlySpending":{"label":"Household spending","unit":"PLN/month","hint":"An estimate for 5 people living frugally, with more than half of the food home-grown and their own firewood and water. Without KRUS and land tax, which are in the farm’s costs."},"householdSafetyMargin":{"label":"Margin above spending","unit":"%"},"householdSavings":{"label":"Savings: pension, emergency fund","unit":"PLN/yr","hint":"The KRUS pension will be low, so it is worth saving, e.g. in an IKZE retirement account."},"openingCash":{"label":"Cash in the account on 1 January","unit":"PLN","hint":"The balance in the cash-flow table starts from this amount."},"childBenefitChildren":{"label":"Children with 800+ benefit","unit":"children","hint":"800 PLN a month per child under 18."},"pessimisticPriceDrop":{"label":"Selling prices lower by","unit":"%","hint":"Applies to all prices: milk, cheese, eggs, meat, vegetables, fruit, mushrooms, honey and cured products."},"pessimisticYieldDrop":{"label":"Yields lower by","unit":"%","hint":"Cereals, straw, meadow, pasture, clover, orchard, honey, mushrooms. A drought or a wet year."},"pessimisticAnimalOutputDrop":{"label":"Animal output lower by","unit":"%","hint":"Milk per cow, laying rate, lambs and rabbits reared."},"pessimisticExtraHours":{"label":"Work takes longer by","unit":"%","hint":"All work norms. Illness, breakdowns, learning."},"pessimisticCostIncrease":{"label":"Running costs higher by","unit":"%","hint":"Also the prices of bought grain, hay and straw. Rent is not changed."},"loyalCustomerSpendPerMonth":{"label":"Regular customer family: spending per month","unit":"PLN/month","hint":"A family that buys a large part of its food from the farm: eggs every week, milk, cheese, a chicken, a meat box, a goose for Christmas. A family of 4 spends about 2,000–3,000 PLN a month on food, so 400–700 PLN is about a fifth."},"occasionalCustomerSpendPerMonth":{"label":"Single-product customer: spending per month","unit":"PLN/month","hint":"Someone who only buys eggs or a goose once a year. A few dozen PLN a month on average."},"baleGrazing":{"label":"Bale grazing in winter","hint":"Cattle and sheep winter in the field: hay bales set out in autumn, the polywire moved to the next ones every day. The dung stays where it falls and little bedding is needed, but about 10% of the hay is trampled. Milking cows come back for milking."},"manureHoursPerTonne":{"label":"Manure: loading and spreading","unit":"h/t","hint":"A loader on a C-360 and a small spreader: about 2–3 t per load, about 0.15–0.3 h per tonne."},"riskYieldVolatility":{"label":"Random years: yield variability","unit":"%","hint":"Typical deviation of yields from the average from year to year (drought, a wet summer). On lighter soils and in organic farming usually 12–20%."},"riskPriceVolatility":{"label":"Random years: price and sales variability","unit":"%","hint":"Direct-sale prices are steadier than prices at buyers, but every year some produce may not sell or may need discounting. Usually 5–15%."},"riskAnimalVolatility":{"label":"Random years: animal output variability","unit":"%","hint":"Milk, laying rate, lambs and rabbits reared in ordinary years."},"riskCostVolatility":{"label":"Random years: cost variability","unit":"%","hint":"Fuel, electricity, vet, repairs."},"riskBadYearChance":{"label":"Random years: chance of a bad year for the animals","unit":"%","hint":"Disease in the herd, a poultry housing order during bird flu, or lost customers. In such a year animal output is about 25% lower. 5% means once in 20 years on average."},"location":{"label":"Location"},"arableSoilIIIShare":{"label":"Arable land: class III","unit":"%","hint":"Soil classes separately for arable land, pasture and meadow. Class III: cereals about +20%, grass about +10%. Class V: cereals about −25%, grass about −15%. Class VI: cereals about −45%, grass about −30%. Lighter soils suffer more from drought in regions with little rain."},"arableSoilVShare":{"label":"Arable land: class V","unit":"%"},"arableSoilVIShare":{"label":"Arable land: class VI","unit":"%"},"pastureSoilIIIShare":{"label":"Pasture: class III","unit":"%"},"pastureSoilVShare":{"label":"Pasture: class V","unit":"%"},"pastureSoilVIShare":{"label":"Pasture: class VI","unit":"%"},"meadowSoilIIIShare":{"label":"Hay meadow: class III","unit":"%"},"meadowSoilVShare":{"label":"Hay meadow: class V","unit":"%"},"meadowSoilVIShare":{"label":"Hay meadow: class VI","unit":"%"},"dairyBreed":{"label":"Kind of breed","hint":"The choice sets typical milk yields, concentrates, cheese and cream yields and the prices of calves and cows; the sliders can still be changed. Holsteins need a lot of concentrates and eat more, Jerseys give less but very rich milk, good for cheese.","options":{"intensive":"Intensive (Holstein)","mixed":"Dual-purpose (Simmental)","extensive":"Extensive (Jersey, Polish Red)"}},"curdShare":{"label":"Milk for curd cheese (after skimming)","unit":"%","hint":"The cream is skimmed off first and curd cheese is made from the skimmed milk. Together with cheese not more than 100% of the milk."},"curdPrice":{"label":"Curd cheese","unit":"PLN/kg"},"curdYield":{"label":"Curd yield","unit":"kg/100 l","hint":"About 14–16 kg of curd cheese per 100 l of skimmed milk."},"creamYield":{"label":"Cream from 100 l of milk","unit":"kg","hint":"Cream of about 30–36% fat from setting or a separator: Jersey about 10–12 kg, Holstein about 6–8 kg."},"creamPrice":{"label":"Cream","unit":"PLN/kg"},"butterShare":{"label":"Cream made into butter","unit":"%","hint":"One kilogram of cream gives about 0.45 kg of butter and 0.55 l of buttermilk."},"butterPrice":{"label":"Butter","unit":"PLN/kg","hint":"Farm butter sold directly: usually 60–100 PLN/kg."},"byproductsSoldShare":{"label":"Whey and buttermilk sold","unit":"%","hint":"The rest goes to the pigs and hens as protein feed and replaces some of the grain."},"buttermilkPrice":{"label":"Buttermilk","unit":"PLN/l"},"wheyPrice":{"label":"Whey","unit":"PLN/l"},"beefBreed":{"label":"Kind of breed","hint":"The choice sets typical weaner and finisher weights and the killing-out percentage. Extensive breeds finish well on grass alone.","options":{"intensive":"Intensive (Limousin, Charolais)","mixed":"Dual-purpose (Simmental)","extensive":"Extensive (Angus, Hereford, Highland)"}},"beefSystem":{"label":"Keeping system","hint":"Housed: finishers in the shed all year on grain and haylage. Mixed: pasture in summer, shelter in winter. Outdoors all year: bale grazing and a windbreak in winter instead of a shed, no grain, finishing takes longer.","options":{"housedFinishing":"Housed finishing","mixed":"Mixed","outdoorYearRound":"Outdoors all year"}},"kidsPerDoe":{"label":"Kids per doe","unit":"per year"},"goatMilking":{"label":"I milk the goats (goat milk and cheese)","hint":"Dairy goats (e.g. Saanen) give about 400–800 l per lactation. Milking twice a day, in their own room or in the cows’ dairy."},"milkPerGoat":{"label":"Milk per goat","unit":"l/yr"},"goatMilkPrice":{"label":"Goat milk","unit":"PLN/l"},"goatCheeseShare":{"label":"Goat milk for cheese","unit":"%"},"goatCheesePrice":{"label":"Goat cheese","unit":"PLN/kg"},"goatCheeseYield":{"label":"Goat cheese yield","unit":"kg/100 l"},"hoursPerMilkingGoat":{"label":"Milking a goat","unit":"h/yr"},"pigs":{"label":"Pastured fatteners","unit":"per year","hint":"Breeds for outdoor rearing: Złotnicka, Puławska, Mangalica. Paddocks are changed every 1–2 weeks because pigs root; they return to the same paddock after six months to a year or after reseeding. About 10–14 fatteners per hectare of paddock a year."},"pigGrainKg":{"label":"Grain per fattener","unit":"kg","hint":"Outdoors with grass, beet and whey about 300–400 kg of grain per fattener."},"ridesPerYear":{"label":"Riding for guests","unit":"h/yr","hint":"Hours of riding lessons or rides a year. Check the legal form: see the hint in the results."},"ridePricePerHour":{"label":"Price of a ride","unit":"PLN/h"},"hoursPerRide":{"label":"Work per hour of riding","unit":"h","hint":"Tacking up, leading, cleaning up."},"guardDogs":{"label":"Guardian dogs","unit":"dogs","hint":"Livestock guardian dogs (e.g. Tatra Shepherd Dog) protect sheep and goats from wolves. The dog lives with the flock all year."},"dogMeatKgPerMonth":{"label":"Food per dog","unit":"kg/month","hint":"A large dog about 0.6–1 kg a day."},"dogsFedOwnMeat":{"label":"The dogs eat meat from the farm","hint":"First the unsold kids, then lamb; the rest is bought dog food."},"dogFoodPricePerKg":{"label":"Bought dog food","unit":"PLN/kg"},"costPerDog":{"label":"Dog: vet, vaccinations, tax","unit":"PLN/yr"},"hoursPerDog":{"label":"Dog: care","unit":"h/yr"},"porkProcessedShare":{"label":"Pork made into cured meats","unit":"%"},"processedValuePerPorkKg":{"label":"Pork products: value","unit":"PLN/kg carcass","hint":"Hams, sausages and bacon from 1 kg of carcass: usually 50–90 PLN."},"beefProcessedShare":{"label":"Beef made into products","unit":"%"},"processedValuePerBeefKg":{"label":"Beef products: value","unit":"PLN/kg carcass","hint":"Dried beef, pâtés and burgers from 1 kg of carcass."},"preservesFruitShare":{"label":"Fruit made into preserves","unit":"% of harvest","hint":"Jams, juices, dried fruit. Together with the fruit sold fresh not more than the whole harvest."},"preservesVegetableShare":{"label":"Vegetables made into preserves","unit":"% of production","hint":"Ferments, sauces, vegetables in jars."},"preservesValueFactor":{"label":"Value of preserves","unit":"× raw produce","hint":"How many times more the preserves are worth than the fresh fruit or vegetables they come from."},"processingHoursPerPorkKg":{"label":"Pork products: work","unit":"h/kg"},"processingHoursPerBeefKg":{"label":"Beef products: work","unit":"h/kg"},"preservesHoursPer1000Pln":{"label":"Preserves: work","unit":"h/1,000 PLN"},"boughtForageShare":{"label":"Roughage bought","unit":"% of the need","hint":"Hay or haylage bought instead of grown; this part of the need takes no land."},"boughtConcentrateShare":{"label":"Concentrates bought","unit":"% of the need","hint":"Grain or compound feed bought instead of grown (at the grain purchase price)."},"householdChildren":{"label":"Children at home","unit":"children","hint":"Together with the two parents. A child eats on average about 70% of what an adult eats."},"homeUseFromFarm":{"label":"Take the household’s food off the sales","hint":"Eggs, milk, dairy, meat, fruit and honey for the family by the number of people. Switch off to leave home use out."},"investPigShelter":{"label":"Pig hut (ark)","unit":"PLN/place"},"investRidingEquipment":{"label":"Saddles, arena fencing","unit":"PLN"},"investGoatDairy":{"label":"Goat milking machine and cooler","unit":"PLN"},"investPreservesKitchen":{"label":"Preserves kitchen","unit":"PLN"},"investMeatColdStore":{"label":"Cold store and freezers for meat","unit":"PLN"},"investTractor":{"label":"Second-hand tractor","unit":"PLN","hint":"Not needed when the farm has only a garden, an orchard and poultry."},"investHaymakingSet":{"label":"Mower, tedder, rake","unit":"PLN"},"investArableImplements":{"label":"Plough, cultivator, seed drill","unit":"PLN"},"investManureHandling":{"label":"Muck spreader and loader","unit":"PLN"},"investLivestockTrailer":{"label":"Livestock trailer","unit":"PLN"}},"presets":{"recommended":{"label":"Milk + eggs + sheep","note":"Recommended start"},"milkAndEggs":{"label":"Milk + eggs","note":"No sheep"},"poultryFirst":{"label":"Poultry first","note":"Few cows"},"family":{"label":"Family: 120k target","note":"Horses, sheep, +3 ha"},"diversified":{"label":"Family: diversified","note":"Ducks, guinea fowl, fruit, mushrooms"},"smokehouse":{"label":"Family + smokehouse","note":"Smoked goose, products, shipping"},"minimum":{"label":"Minimum: 12 ha, 3 cows","note":"Little work and investment"},"minimumNoDairy":{"label":"Minimum: 12 ha, no cows","note":"Poultry and sheep"},"maximumProfit":{"label":"Maximum profit","note":"All the family’s time, no weekly limit"},"noMilking":{"label":"No milking","note":"Less work"},"showPessimistic":"Show everything in the pessimistic scenario","lubuskieAngus":{"label":"Lubusz style: Angus on grass","note":"Little work, small income","description":"Beef farming as typical in the Lubusz region: Angus suckler cows on pasture all season, moved once a week, weaners sold in autumn, hay from the meadows in winter. Plus the extensive grassland eco-scheme and cattle payments. About 8 suckler cows fit on 14 ha, so it is a side income. In the region such herds usually farm 50–200 ha, often leased."},"perkinsRidgedale":{"label":"Ridgedale (R. Perkins)","note":"Vegetables, broilers, orchard","description":"Modelled on Richard Perkins’ Ridgedale farm in Sweden: an intensive no-dig market garden, broilers in movable pens, hens in a mobile henhouse, turkeys, sheep and a few beef cows in rotational grazing moved daily. Plus an orchard, oyster mushrooms among the trees and catch crops. A lot of work and direct selling, but many sources of income."},"salatinPolyface":{"label":"Polyface (J. Salatin)","note":"Cattle, then poultry","description":"Modelled on Joel Salatin’s Polyface: cattle moved daily, a paddock grazed again after about 60 days, a mobile henhouse following 3–4 days behind the cattle. Broilers in pens moved daily, turkeys, rabbits and a few pigs. Grass-finished beef sold in boxes. Salatin buys his grain; here it comes from the farm’s own fields."},"grassDairy":{"label":"Grass milk (Voisin, NZ)","note":"Once-a-day milking, cheese","description":"Pasture dairying following André Voisin’s rational grazing and New Zealand practice: Jersey cows almost entirely on grass, a fresh paddock every day, about 35 days’ rest, once-a-day milking, most of the milk made into cheese. The pasture has as many hectares as the cows will eat; winter hay comes from clover-grass leys on the arable land, without a separate meadow. A mobile henhouse behind the cows uses grain from the farm’s own fields. Less milk, but much less time in the parlour."},"sweetSpot":{"label":"Sweet spot","note":"All 14 ha, most PLN per hour","description":"The result of searching thousands of combinations on 14 ha without leased land: the highest income per hour of work with at least 6,500 PLN a month in the pessimistic scenario, all the land in use (every feed with about a 5–10% reserve, no shortages) and a peak below 60 h a week. It came out as laying hens, ducks, a few geese and a flock of sheep, plus grazing moved every 3 days with long paddock rests. No cows: milking takes the most hours, and beef cattle on this area bring little per hour."},"brownsRanch":{"label":"Brown’s Ranch (G. Brown)","note":"Cover crops, cattle, hens","description":"Modelled on Gabe Brown’s farm in North Dakota: five principles of soil health (no bare soil, as little tillage as possible, plant diversity, living roots all year, animals on the land). A five-field rotation with cover-crop cocktails grazed by the cattle, suckler cows and finishers outside all year (bale grazing in winter), sheep, pigs, hens and broilers following the cattle, and meat and eggs sold directly."},"gregJudy":{"label":"Green Pastures (G. Judy)","note":"Mob grazing, sheep, pigs","description":"Modelled on Greg Judy’s farm in Missouri: a dense herd on a small paddock moved twice a day, each paddock grazed again after about 90 days, with tall trampled grass building the soil. Angus cattle and hair sheep on pasture all year, bale grazing on bought bales in winter (the hay brings fertility to the farm), pigs on paddocks among trees, a guardian dog. Few machines and buildings, few hours."}},"assumptionSets":{"realistic":"Realistic","optimistic":"Optimistic"},"labourGroups":{"cattle":"Cows and cheese","poultry":"Poultry and rabbits","smallLivestock":"Sheep, goats, pigs, horses, dogs","fields":"Hay and cereals","produce":"Vegetables, fruit, mushrooms, bees","processing":"Processing and shipping","other":"Selling, repairs, garden"},"format":{"numberLocale":"en-GB","pln":"{amount} PLN"},"warnings":{"landOverAllocated":"Pasture, meadow, farmyard and vegetables take {hectares} ha more than the land you have. Reduce one of these sliders or add leased land.","gardenExceedsFarmyard":"The orchard and kitchen garden do not fit in the farmyard. Make the farmyard bigger.","grainShortage":"About {tonnes} t of grain is missing. That is about {cerealHa} ha more cereals (about {arableHa} ha of arable land in the rotation) or about {hens} fewer hens.","hayShortage":"About {tonnes} t DM of winter hay is missing. That is about {meadowHa} ha more meadow, or fewer animals.","strawShortage":"About {tonnes} t of straw for bedding is missing. More cereals will help, or switch on sawdust instead of straw (the “Costs” group).","sawdustReplacesStraw":"The missing straw is replaced with sawdust: about {tonnes} t (about {cubicMetres} m³) for about {cost} PLN a year.","grainSurplus":"Grain surplus of about {tonnes} t. You could add about {hens} hens or swap some cereals for clover.","haySurplus":"A large hay surplus (about {tonnes} t DM). There is room for more animals, or a reserve for drought.","stockingOutsideBonusRange":"A stocking rate of {density} LU/ha is outside the 0.5–1.5 range, so the 573 PLN/ha bonus does not apply.","grasslandOverstocked":"There are more than 2 LU/ha on the grassland. That is no longer extensive grazing.","notEnoughHours":"{needed} h a year are needed and the family has about {available} h. About {missing} h are missing.","littleSpareTime":"Work takes {percent}% of the family’s time. Little slack for illness and holidays.","muchSpareTime":"Work takes only about {percent}% of the family’s time ({needed} of {available} h). The limit is land and the market, not hands: spare time is best put into cheese, vegetables and direct selling.","peakMonthOverload":"The busiest month needs about {peak} h, while the family has about {monthly} h a month.","weeklyLimitExceeded":"The busiest month comes to about {peak} h a week, above your limit of {limit} h.","manyEggsToSell":"You need to sell about {boxes} boxes of 10 eggs a week. Find regular buyers first.","directSalesTaxThreshold":"Revenue from farm retail sales (cheese, red meat in boxes, cured meats) exceeds 100,000 PLN, so the surplus is subject to the 2% flat tax: about {tax} PLN a year, already included in costs.","turkeysWithHens":"Turkeys and hens: keep them apart, ideally on paddocks the hens have not used in recent years. Hens carry histomoniasis (blackhead), which can kill a whole flock of turkeys.","parcelsSeason":"About {parcels} parcels of products a year, mostly from October to December. Check chilled shipping with the courier before the season.","lambMeatLessThanLive":"A lamb sold as meat brings about {meat} PLN after slaughter and transport costs, less than sold live ({live} PLN). At these prices it is better to sell live.","sheepPaymentMinimum":"The sheep payment is counted from 10 head.","goatPaymentMinimum":"The goat payment is counted from 5 head (with fewer it is left out).","ownHatching":"Own hatching: about {chicks} chicks in spring, about {cockerels} cockerels for the pot. Remember the Marek’s disease vaccination.","carbonFarmingBelowMinimum":"“Carbon farming” eco-scheme: {points} points, and the threshold is {required} points (25% of farmed land × 5). Below the threshold there is no payment. Add practices, e.g. extensive grassland with livestock.","cropDiversityNotMet":"Diversified crop structure: your rotation has {cerealPercent}% cereals and {crops} crops. Requirement: cereals at most 65%, at least 3 crops, clover at least 20%. Change the number of fields in “Crop rotation”.","africanSwineFever":"Pigs: African swine fever is present in many regions of Poland. Before buying piglets, check the zone and the biosecurity rules for outdoor pigs with the county veterinary officer (double fencing, no kitchen scraps).","sucklerCowsNeedBull":"Suckler cows: you need a quiet bull or artificial insemination. Switch on “Own bull” in the dairy group if you keep one.","viewingPessimistic":"You are seeing all the numbers in the pessimistic scenario. Switch back with the button next to the assumptions.","pessimisticBelowTarget":"The pessimistic scenario gives {result}, which is {gap} below your minimum of {target}.","pessimisticAboveTarget":"Even the pessimistic scenario gives {result}, above your minimum of {target}.","pessimisticPeakOverLimit":"In the pessimistic scenario the busiest month is about {peak} h a week for the whole farm, above the limit of {limit} h.","planFits":"Feed, hay and straw fit within {area} ha. Net about {net} a year for about {hours} h of work ({percent}% of the family’s time), plus food for the household worth about {homeValue}.","shortPastureRest":"Paddocks rest for only {days} days. With less than 25 days’ rest the grass cannot rebuild its roots and the pasture yield falls. In summer it is worth extending it to 40–60 days.","rootCropsNoRoom":"Root crops are ticked, but the rotation has too few cereal years (at least two are needed). Increase the cereal share or the number of fields.","grainSold":"The grain surplus is sold: about {tonnes} t at {price} PLN/t, which is about {revenue} PLN. A reserve of {reserve}% above the animals’ needs stays in store.","grainSoldAll":"With no animals all the grain is sold: about {tonnes} t at {price} PLN/t, which is about {revenue} PLN. The straw stays in the field and is ploughed in.","nitrogenOverLimit":"The animals produce about {perHa} kg of nitrogen per hectare of farmed land, and the limit is {limit} kg/ha. More land or fewer animals are needed, or a contract to sell the manure.","soilSharesOver100Arable":"The soil class shares of the arable land add up to more than 100%. Correct the sliders in the “Land” group.","soilSharesOver100Pasture":"The soil class shares of the pasture add up to more than 100%. Correct the sliders in the “Land” group.","soilSharesOver100Meadow":"The soil class shares of the meadow add up to more than 100%. Correct the sliders in the “Land” group.","pigPaddocks":"The pigs need about {hectares} ha of paddock a year (about 12 fatteners per hectare). Move them every 1–2 weeks and come back after six months to a year; the orchard, stubble and a field before a crop work well.","ridingIsABusiness":"Horse riding: for agritourism guests it may count as part of the agritourism services; regular paid lessons for people from outside usually need a registered business and liability insurance. Confirm with an accountant.","dogFoodBought":"The dogs need about {kg} kg of food a year beyond the farm’s own meat; this food is bought.","wolvesNoDogs":"Sheep and goats without guardian dogs: there are wolves in many regions. Shut the flock in at night behind a high electric fence or add a dog (the “Abattoi
