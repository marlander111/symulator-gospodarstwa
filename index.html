 */
const CALENDAR_ROWS = [
  { id: 'dairyCows', isActive: () => params.dairyCows > 0 },
  {
    id: 'cheese',
    isActive: () =>
      (params.dairyCows > 0 && params.cheeseShare + params.curdShare > 0) ||
      (params.goatMilking && params.goats > 0 && params.goatCheeseShare > 0),
  },
  { id: 'sucklerCows', isActive: () => params.sucklerCows > 0 },
  {
    id: 'layingHens',
    isActive: () => params.layingHens > 0,
    monthsKey: () => (params.winterPolytunnel ? 'monthsWithWinterTunnel' : 'months'),
  },
  { id: 'hatching', isActive: () => params.ownHatching && params.layingHens > 0 },
  { id: 'broilers', isActive: () => params.broilers > 0 },
  { id: 'geese', isActive: () => params.geese > 0 },
  { id: 'ducks', isActive: () => params.ducks > 0 },
  { id: 'turkeys', isActive: () => params.turkeys > 0 },
  { id: 'guineaFowl', isActive: () => params.guineaFowl > 0 },
  { id: 'rabbits', isActive: () => params.rabbits > 0 },
  { id: 'sheep', isActive: () => params.sheep > 0 },
  { id: 'goats', isActive: () => params.goats > 0 },
  { id: 'pigs', isActive: () => params.pigs > 0 },
  { id: 'horses', isActive: () => params.horses > 0 },
  {
    id: 'fieldsAndMeadows',
    isActive: () => params.meadowHa > 0 || computeLandUse(params).usableArableHa > 0,
  },
  { id: 'marketGarden', isActive: () => params.marketGardenHa > 0 },
  { id: 'orchard', isActive: () => params.fruitSoldShare > 0 },
  { id: 'mushrooms', isActive: () => params.mushroomLogs > 0 },
  { id: 'bees', isActive: () => params.beehives > 0 },
  { id: 'processing', isActive: results => results.processedValue > 0 },
  { id: 'catchCrops', isActive: () => params.catchCrops },
  { id: 'paperwork', isActive: () => true },
];

const CALENDAR_COLUMNS = ['month', 'tasks', 'hoursPerWeek', 'inflows', 'outflows', 'balance'];
const NUMERIC_CALENDAR_COLUMNS = ['hoursPerWeek', 'inflows', 'outflows', 'balance'];

function renderCalendar(results) {
  if (!results) return;

  const activeRows = CALENDAR_ROWS.filter(row => row.isActive(results)).map(row => ({
    label: t(`calendar.tasks.${row.id}.label`),
    months: messages(`calendar.tasks.${row.id}.${row.monthsKey ? row.monthsKey() : 'months'}`),
  }));
  const monthNames = messages('months.names');

  const header = CALENDAR_COLUMNS.map(column => {
    const className = NUMERIC_CALENDAR_COLUMNS.includes(column) ? ' class="n"' : '';
    return `<th${className}>${t(`calendar.columns.${column}`)}</th>`;
  }).join('');

  const bodyRows = results.cashflow.months.map((cash, month) => {
    const tasks = activeRows
      .filter(row => row.months[month])
      .map(row => `<span class="tk"><b>${row.label}:</b> ${escapeHtml(row.months[month])}</span>`)
      .join('');
    const hoursPerWeek = results.monthlyHours[month].total / WEEKS_PER_MONTH;
    const selected = month === planView.month ? 'sel' : '';

    return `<tr data-calendar-month="${month}" class="${selected}">
      <td>${monthNames[month]}</td>
      <td>${tasks}</td>
      <td class="n">${formatNumber(hoursPerWeek, 0)}</td>
      <td class="n">${formatPln(cash.inflows + cash.subsidy)}</td>
      <td class="n">${formatPln(cash.outflows + cash.household)}</td>
      <td class="n${cash.balance < 0 ? ' neg' : ''}">${formatPln(cash.balance)}</td>
    </tr>`;
  });

  byId('calendar-table').innerHTML = `<thead><tr>${header}</tr></thead><tbody>${bodyRows.join('')}</tbody>`;
}

// ===== ui/pdf/pdf-document.js =====
// A minimal PDF writer: A4 pages with text, lines, rectangles, tables and bar charts in the
// standard PDF fonts, so the report needs no external library. Polish letters are mapped
// into the Windows-1250 positions of a custom WinAnsi encoding.

const PDF_PAGE_WIDTH = 595;
const PDF_PAGE_HEIGHT = 842;
const PDF_MARGIN = 40;
const PDF_CONTENT_WIDTH = PDF_PAGE_WIDTH - 2 * PDF_MARGIN;

/** Font resource names; see `serialize()` for the fonts behind them. */
const PDF_FONTS = { regular: 'F1', bold: 'F2', mono: 'F3', monoBold: 'F4' };

/** RGB fill and stroke colours used in the report. */
const PDF_COLORS = {
  text: '0 0 0',
  dark: '0.2 0.2 0.2',
  body: '0.25 0.25 0.25',
  paragraph: '0.3 0.3 0.3',
  muted: '0.35 0.35 0.35',
  faint: '0.45 0.45 0.45',
  footer: '0.5 0.5 0.5',
  title: '0.1 0.25 0.12',
  heading: '0.1 0.3 0.15',
  accent: '0.17 0.42 0.23',
  negative: '0.7 0.2 0.15',
  note: '0.45 0.3 0.1',
  rule: '0.8 0.8 0.8',
  lightRule: '0.88 0.88 0.88',
  faintRule: '0.9 0.9 0.9',
  axis: '0.5 0.5 0.5',
};

/** Byte codes of characters outside ASCII in the report's font encoding. */
// prettier-ignore
const PDF_CHARACTER_CODES = {
  ą: 200, ć: 201, ę: 202, ł: 203, ń: 204, ś: 205, ź: 206, ż: 207,
  Ą: 192, Ć: 193, Ę: 194, Ł: 195, Ń: 196, Ś: 197, Ź: 198, Ż: 199,
  ó: 243, Ó: 211, é: 233, ü: 252, ö: 246, ä: 228,
  '–': 150, '—': 151, '·': 183, '×': 215, '„': 132, '”': 148, '“': 147,
  '…': 133, '’': 146, '‘': 145, '²': 178, '±': 177,
};

/** Glyph names of codes 192–207, which are remapped to Polish letters. */
const PDF_ENCODING_DIFFERENCES =
  '/Aogonek /Cacute /Eogonek /Lslash /Nacute /Sacute /Zacute /Zdotaccent ' +
  '/aogonek /cacute /eogonek /lslash /nacute /sacute /zacute /zdotaccent';

const NO_BREAK_SPACE = ' ';
const MINUS_SIGN = '−';

/** Encodes text as the contents of a PDF string literal `( … )`. */
function encodePdfText(text) {
  let encoded = '';
  for (const character of String(text)) {
    let code;
    if (character === ' ' || character === NO_BREAK_SPACE) code = 32;
    else if (character === MINUS_SIGN) code = 45;
    else code = PDF_CHARACTER_CODES[character] ?? character.charCodeAt(0);
    if (code > 255) code = 63; // "?"

    const needsBackslash = code === 40 || code === 41 || code === 92; // ( ) \
    if (needsBackslash) encoded += '\\' + character;
    else if (code < 32 || code > 126) encoded += '\\' + code.toString(8).padStart(3, '0');
    else encoded += String.fromCharCode(code);
  }
  return encoded;
}

const pdfCoordinate = value => value.toFixed(1);

class PdfDocument {
  constructor() {
    /** Content-stream operators of each page. */
    this.pages = [];
    this.currentPage = null;
    /** Vertical position of the next element; PDF measures from the bottom of the page. */
    this.y = 0;
  }

  addPage() {
    this.currentPage = [];
    this.pages.push(this.currentPage);
    this.y = PDF_PAGE_HEIGHT - PDF_MARGIN;
  }

  /** Starts a new page unless `height` still fits above the bottom margin. */
  ensureSpace(height) {
    if (!this.currentPage || this.y - height < PDF_MARGIN + 16) this.addPage();
  }

  text(x, y, text, size = 9, font = PDF_FONTS.regular, color = PDF_COLORS.text) {
    const position = `${pdfCoordinate(x)} ${pdfCoordinate(y)}`;
    this.currentPage.push(`BT ${color} rg /${font} ${size} Tf ${position} Td (${encodePdfText(text)}) Tj ET`);
  }

  /** Text ending at `right`; widths are estimated for the monospaced font. */
  textRightAligned(right, y, text, size = 9, font = PDF_FONTS.mono, color = PDF_COLORS.text) {
    this.text(right - String(text).length * 0.6 * size, y, text, size, font, color);
  }

  rect(x, y, width, height, color) {
    const box = [x, y, width, height].map(pdfCoordinate).join(' ');
    this.currentPage.push(`${color} rg ${box} re f`);
  }

  line(x1, y1, x2, y2, color = PDF_COLORS.rule, width = 0.5) {
    const from = `${pdfCoordinate(x1)} ${pdfCoordinate(y1)}`;
    const to = `${pdfCoordinate(x2)} ${pdfCoordinate(y2)}`;
    this.currentPage.push(`${color} RG ${width} w ${from} m ${to} l S`);
  }

  /** Splits text into lines that fit `width`, estimating half the font size per character. */
  static wrapText(text, size, width) {
    const lines = [];
    let line = '';
    for (const word of String(text).split(/\s+/)) {
      const candidate = (line + ' ' + word).trim();
      if (candidate.length * 0.5 * size > width && line) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  paragraph(text, size = 8.5, color = PDF_COLORS.paragraph) {
    for (const line of PdfDocument.wrapText(text, size, PDF_CONTENT_WIDTH)) {
      this.ensureSpace(size + 3);
      this.text(PDF_MARGIN, this.y - size, line, size, PDF_FONTS.regular, color);
      this.y -= size + 3;
    }
    this.y -= 4;
  }

  heading(text) {
    this.ensureSpace(40);
    this.y -= 10;
    this.text(PDF_MARGIN, this.y - 13, text, 13, PDF_FONTS.bold, PDF_COLORS.heading);
    this.y -= 20;
    this.line(PDF_MARGIN, this.y, PDF_PAGE_WIDTH - PDF_MARGIN, this.y, PDF_COLORS.accent, 1);
    this.y -= 6;
  }

  /** Rows of a label on the left and a value on the right. */
  keyValueRows(rows) {
    for (const [label, value] of rows) {
      this.ensureSpace(14);
      this.text(PDF_MARGIN, this.y - 10, label, 9.5, PDF_FONTS.regular, PDF_COLORS.body);
      this.textRightAligned(PDF_PAGE_WIDTH - PDF_MARGIN, this.y - 10, value, 9.5, PDF_FONTS.monoBold);
      this.y -= 14;
      this.line(PDF_MARGIN, this.y + 1, PDF_PAGE_WIDTH - PDF_MARGIN, this.y + 1, PDF_COLORS.faintRule, 0.4);
    }
    this.y -= 6;
  }

  /**
   * A bar per value with a label under it; negative values go below the axis in red.
   * @param {number[]} values
   * @param {string[]} labels
   * @param {string} title
   */
  barChart(values, labels, title, positiveColor = PDF_COLORS.accent) {
    const chartHeight = 90;
    this.ensureSpace(chartHeight + 30);
    this.text(PDF_MARGIN, this.y - 9, title, 8, PDF_FONTS.regular, PDF_COLORS.muted);
    this.y -= 14;

    const highest = Math.max(1, ...values.map(Math.abs));
    const lowest = Math.min(0, ...values);
    const span = highest - Math.min(0, lowest) || 1;
    const columnWidth = PDF_CONTENT_WIDTH / values.length;
    const axisY = this.y - chartHeight + (-lowest / span) * chartHeight;

    values.forEach((value, index) => {
      const barHeight = (Math.abs(value) / span) * chartHeight;
      const left = PDF_MARGIN + index * columnWidth;
      this.rect(
        left + columnWidth * 0.18,
        value >= 0 ? axisY : axisY - barHeight,
        columnWidth * 0.64,
        Math.max(0.5, barHeight),
        value >= 0 ? positiveColor : PDF_COLORS.negative
      );
      const labelX = left + columnWidth / 2 - labels[index].length * 2;
      this.text(labelX, this.y - chartHeight - 10, labels[index], 7, PDF_FONTS.regular, PDF_COLORS.muted);
    });

    this.line(PDF_MARGIN, axisY, PDF_PAGE_WIDTH - PDF_MARGIN, axisY, PDF_COLORS.axis, 0.5);
    this.y -= chartHeight + 20;
  }

  /**
   * A table: the first column left-aligned, the others right-aligned (or left-aligned notes).
   * @param {{header: string[], rows: {isTotal: boolean, cells: string[]}[]}} table
   * @param {{skipColumns?: number[], firstColumnWidth?: number, leftAlignedColumns?: number[]}} [options]
   */
  table({ header, rows }, options = {}) {
    const columnCount = Math.max(header.length, ...rows.map(row => row.cells.length));
    if (!columnCount) return;

    const skipColumns = options.skipColumns || [];
    const leftAligned = options.leftAlignedColumns || [];
    const columns = [...Array(columnCount).keys()].filter(index => !skipColumns.includes(index));
    const firstWidth =
      options.firstColumnWidth || (columns.length <= 2 ? 300 : columns.length <= 4 ? 200 : 140);
    const columnWidth = (PDF_CONTENT_WIDTH - firstWidth) / (columns.length - 1 || 1);
    const columnRight = index => PDF_MARGIN + firstWidth + columnWidth * columns.indexOf(index);
    const fontSize = columns.length > 7 ? 7.2 : 8.3;

    this.ensureSpace(30);
    columns.forEach((index, position) => {
      const title = (header[index] || '').toUpperCase();
      const y = this.y - 9;
      const style = [6.8, PDF_FONTS.bold, PDF_COLORS.muted];
      if (position === 0) this.text(PDF_MARGIN, y, title.slice(0, 40), ...style);
      else if (leftAligned.includes(index))
        this.text(
          columnRight(index) - columnWidth + 6,
          y,
          title.slice(0, Math.floor(columnWidth / 4.6)),
          ...style
        );
      else
        this.textRightAligned(
          columnRight(index),
          y,
          title.slice(0, Math.floor((columnWidth - 6) / 4.2)),
          ...style
        );
    });
    this.y -= 13;
    this.line(PDF_MARGIN, this.y, PDF_PAGE_WIDTH - PDF_MARGIN, this.y);

    for (const row of rows) {
      this.ensureSpace(fontSize + 6);
      const y = this.y - fontSize - 1.5;
      columns.forEach((index, position) => {
        const cell = row.cells[index] || '';
        if (position === 0) {
          const font = row.isTotal ? PDF_FONTS.bold : PDF_FONTS.regular;
          this.text(PDF_MARGIN, y, cell.slice(0, Math.floor(firstWidth / (0.5 * fontSize))), fontSize, font);
        } else if (leftAligned.includes(index)) {
          const text = cell.slice(0, Math.floor((columnWidth - 6) / (0.5 * fontSize)));
          this.text(
            columnRight(index) - columnWidth + 6,
            y,
            text,
            fontSize - 0.8,
            PDF_FONTS.regular,
            PDF_COLORS.note
          );
        } else {
          const font = row.isTotal ? PDF_FONTS.monoBold : PDF_FONTS.mono;
          const text = cell.slice(0, Math.floor((columnWidth - 4) / (0.6 * fontSize)));
          this.textRightAligned(columnRight(index), y, text, fontSize, font);
        }
      });
      this.y -= fontSize + 5;
      if (row.isTotal)
        this.line(PDF_MARGIN, this.y, PDF_PAGE_WIDTH - PDF_MARGIN, this.y, PDF_COLORS.dark, 0.8);
      else this.line(PDF_MARGIN, this.y, PDF_PAGE_WIDTH - PDF_MARGIN, this.y, PDF_COLORS.lightRule, 0.4);
    }
    this.y -= 8;
  }

  /**
   * Returns the finished file as a binary string (one character per byte).
   * @param {(pageNumber: number, pageCount: number) => string} footerText
   */
  serialize(footerText) {
    const objects = [];
    const addObject = body => {
      objects.push(body);
      return objects.length;
    };

    const encoding = addObject(
      `<< /Type /Encoding /BaseEncoding /WinAnsiEncoding /Differences [192 ${PDF_ENCODING_DIFFERENCES}] >>`
    );
    const fonts = ['Helvetica', 'Helvetica-Bold', 'Courier', 'Courier-Bold'].map(baseFont =>
      addObject(`<< /Type /Font /Subtype /Type1 /BaseFont /${baseFont} /Encoding ${encoding} 0 R >>`)
    );
    const fontResources = Object.values(PDF_FONTS)
      .map((name, index) => `/${name} ${fonts[index]} 0 R`)
      .join(' ');

    const pagesObject = addObject(null); // filled in once the page objects exist
    const pageObjects = this.pages.map((operators, index) => {
      const footer = encodePdfText(footerText(index + 1, this.pages.length));
      const stream = [
        ...operators,
        `BT ${PDF_COLORS.footer} rg /F1 7 Tf ${PDF_MARGIN} 22 Td (${footer}) Tj ET`,
      ].join('\n');
      const contents = addObject(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      return addObject(
        `<< /Type /Page /Parent ${pagesObject} 0 R /MediaBox [0 0 ${PDF_PAGE_WIDTH} ${PDF_PAGE_HEIGHT}] ` +
          `/Resources << /Font << ${fontResources} >> >> /Contents ${contents} 0 R >>`
      );
    });
    const kids = pageObjects.map(object => `${object} 0 R`).join(' ');
    objects[pagesObject - 1] = `<< /Type /Pages /Kids [${kids}] /Count ${pageObjects.length} >>`;
    const catalog = addObject(`<< /Type /Catalog /Pages ${pagesObject} 0 R >>`);

    let file = '%PDF-1.4\n';
    const offsets = objects.map((body, index) => {
      const offset = file.length;
      file += `${index + 1} 0 obj\n${body}\nendobj\n`;
      return offset;
    });
    const crossReferenceOffset = file.length;
    file += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
    file += offsets.map(offset => String(offset).padStart(10, '0') + ' 00000 n \n').join('');
    file += `trailer\n<< /Size ${objects.length + 1} /Root ${catalog} 0 R >>\n`;
    file += `startxref\n${crossReferenceOffset}\n%%EOF\n`;
    return file;
  }
}

// ===== ui/pdf/report.js =====
// The PDF report: the chosen sections of the current variant, read from the model results
// and from the tables already shown on the page. Texts: locales/pl.json → pdf.

/** Sections the user can include; `draw` adds the section's content under its heading. */
const PDF_REPORT_SECTIONS = [
  { id: 'summary', draw: drawSummarySection },
  { id: 'money', draw: drawMoneySection },
  { id: 'cashflow', draw: drawCashflowSection },
  { id: 'enterprises', draw: doc => doc.table(readTable('enterprises-table'), { skipColumns: [7, 8, 9] }) },
  { id: 'nextSteps', draw: drawNextStepsSection },
  { id: 'labour', draw: drawLabourSection },
  { id: 'market', draw: drawMarketSection },
  { id: 'investments', draw: doc => doc.table(readTable('investments-table')) },
  { id: 'rotation', draw: drawRotationSection },
  { id: 'household', draw: drawHouseholdSection },
];

/** Animals listed in the report's introduction, with the number kept of each. */
const PDF_ANIMAL_COUNTS = [
  ['dairyCows', params => params.dairyCows],
  ['sucklerCows', params => params.sucklerCows],
  ['layingHens', params => params.layingHens],
  ['broilers', params => params.broilers],
  ['geese', params => params.geese],
  ['ducks', params => params.ducks],
  ['turkeys', params => params.turkeys],
  ['guineaFowl', params => params.guineaFowl],
  ['sheep', params => params.sheep],
  ['goats', params => params.goats],
  ['pigs', params => params.pigs],
  ['horses', params => params.horses],
  ['rabbits', params => params.rabbits],
  ['beehives', params => params.beehives],
];

const isPdfSectionSelected = id => {
  const checkbox = document.querySelector(`[data-pdf-section="${id}"]`);
  return !checkbox || checkbox.checked;
};

/** @returns {string} the PDF file as a binary string */
function buildPdfReport() {
  const results = simulateFarm(params);
  const pessimistic = simulateFarm(applyPessimisticScenario(params));
  const doc = new PdfDocument();
  doc.addPage();

  drawReportIntroduction(doc, results);
  for (const section of PDF_REPORT_SECTIONS) {
    if (!isPdfSectionSelected(section.id)) continue;
    doc.heading(t(`pdf.sections.${section.id}.title`));
    section.draw(doc, results, pessimistic);
  }
  doc.paragraph(t('pdf.disclaimer'), 7.5, PDF_COLORS.faint);

  const variant = currentVariantName();
  return doc.serialize((page, pages) => t('pdf.footer', { variant, page, pages }));
}

function drawReportIntroduction(doc, results) {
  doc.text(PDF_MARGIN, doc.y - 20, t('app.title'), 20, PDF_FONTS.bold, PDF_COLORS.title);
  doc.y -= 30;
  doc.text(PDF_MARGIN, doc.y - 12, t('pdf.variant', { name: currentVariantName() }), 12, PDF_FONTS.bold);
  doc.y -= 18;

  const subtitle = t('pdf.subtitle', {
    date: new Date().toLocaleDateString(t('format.numberLocale')),
    farmedHa: formatNumber(results.farmedHa, 1),
    ownedHa: formatNumber(params.ownedHa, 0),
    leased: params.leasedHa ? t('pdf.leased', { leasedHa: formatNumber(params.leasedHa, 1) }) : '',
  });
  doc.text(PDF_MARGIN, doc.y - 9, subtitle, 8.5, PDF_FONTS.regular, PDF_COLORS.muted);
  doc.y -= 18;

  const animals = PDF_ANIMAL_COUNTS.map(([id, countOf]) => [id, countOf(params)])
    .filter(([, count]) => count)
    .map(([id, count]) => t(`pdf.animals.${id}`, { count }))
    .join(', ');
  const introduction = t('pdf.animalsAndCrops', {
    animals,
    pastureHa: formatNumber(params.pastureHa, 1),
    meadowHa: formatNumber(params.meadowHa, 1),
    arableHa: formatNumber(results.usableArableHa, 1),
    cerealShare: params.cerealShare,
  });
  doc.paragraph(introduction, 8.5, PDF_COLORS.dark);
}

function drawSummarySection(doc, results, pessimistic) {
  const n = formatNumber;
  const row = (id, value) => [t(`pdf.summary.${id}`), value];
  doc.keyValueRows([
    row('netIncome', formatPln(results.netIncome)),
    row('monthlyAverage', formatPln(results.netIncome / 12)),
    row('revenue', formatPln(results.revenue + results.subsidies)),
    row('subsidies', formatPln(results.subsidies)),
    row('costs', formatPln(results.costs + results.depreciation)),
    row('pessimistic', formatPln(pessimistic.netIncome)),
    row(
      'hours',
      t('pdf.summary.hoursValue', { hours: n(results.totalHours, 0), perWeek: n(results.totalHours / 52, 0) })
    ),
    row(
      'peakMonth',
      t('pdf.summary.peakMonthValue', {
        peak: n(pessimistic.weeklyHoursPeak, 0),
        limit: n(params.weeklyHoursLimit, 0),
      })
    ),
    row(
      'investments',
      t('pdf.summary.investmentsValue', {
        capex: formatPln(results.capex),
        depreciation: formatPln(results.depreciation),
      })
    ),
    row(
      'feed',
      t('pdf.summary.feedValue', {
        hay: n(results.hayBalance, 1),
        grain: n(results.grainBalance, 1),
        straw: n(results.strawBalance, 1),
      })
    ),
    row('stocking', t('pdf.summary.stockingValue', { value: n(results.livestockUnitsPerHa, 2) })),
  ]);
}

function drawMoneySection(doc) {
  for (const id of ['revenue-table', 'costs-table', 'subsidies-table', 'home-use-table'])
    doc.table(readTable(id));
}

function drawCashflowSection(doc, results) {
  const monthResults = results.cashflow.months.map(month => month.netIncome - month.household);
  doc.barChart(monthResults, messages('months.numerals'), t('pdf.cashflowChart'));
  doc.table(readTable('cashflow-table'));
  doc.paragraph(byId('cashflow-note').textContent);
}

function drawNextStepsSection(doc) {
  doc.table(readTable('next-steps-table'), {
    skipColumns: [4, 7],
    firstColumnWidth: 120,
    leftAlignedColumns: [6],
  });
  doc.paragraph(byId('next-steps-note').textContent);
}

function drawLabourSection(doc, results) {
  const hours = results.monthlyHours.map(month => month.total);
  doc.barChart(hours, messages('months.numerals'), t('pdf.labourChart'), '0.55 0.45 0.2');
  doc.table(readTable('labour-table'));
}

function drawMarketSection(doc) {
  doc.table(readTable('market'), { firstColumnWidth: 200, leftAlignedColumns: [2, 3] });
}

function drawRotationSection(doc) {
  doc.table(readTable('rotation-table'), { firstColumnWidth: 70 });
  doc.paragraph(byId('rotation-note').textContent);
}

function drawHouseholdSection(doc) {
  doc.table(readTable('household-table'), { skipColumns: [2] });
  doc.paragraph(byId('household-note').textContent);
}

/**
 * Reads a table of the page: header texts and, for each row, the first line of every cell
 * (an editable amount is read from its input).
 */
function readTable(elementId) {
  const table = byId(elementId);
  if (!table) return { header: [], rows: [] };
  const cellText = cell => {
    const input = cell.querySelector('input');
    const text = input ? t('format.pln', { amount: input.value }) : cell.innerText;
    return text.split('\n')[0].trim();
  };
  return {
    header: [...table.querySelectorAll('thead th')].map(cell => cell.textContent.trim()),
    rows: [...table.querySelectorAll('tbody tr')].map(row => ({
      isTotal: row.classList.contains('tot'),
      cells: [...row.cells].map(cellText),
    })),
  };
}

// ===== ui/export.js =====
// Saving the settings to a .json file, loading them back, saving the financial data as JSON
// (model/finance-export.js) and saving the PDF report.
// In claude.ai files are saved through the "downloads" capability; elsewhere (e.g. GitHub
// Pages) through an ordinary browser download.

const SETTINGS_FILE_FORMAT = { app: 'symulator-gospodarstwa', version: 2 };

/** PDF report sections offered as checkboxes; see PDF_REPORT_SECTIONS. */
const PDF_SECTION_CHOICES = [
  'summary',
  'money',
  'cashflow',
  'enterprises',
  'nextSteps',
  'labour',
  'market',
  'investments',
  'rotation',
  'household',
];

/** The active way of saving files, or null when this view cannot save files. */
let fileSaver = null;

const browserDownloadSaver = {
  async save({ filename, data }) {
    // the PDF is built as a binary string: one character per byte
    const bytes =
      typeof data === 'string' && filename.endsWith('.pdf')
        ? Uint8Array.from(data, c => c.charCodeAt(0))
        : data;
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([bytes]));
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
      URL.revokeObjectURL(link.href);
      link.remove();
    }, 1000);
    return { status: 'saved' };
  },
};

async function initFileSaver() {
  if (typeof claude === 'undefined') {
    fileSaver = browserDownloadSaver;
  } else {
    try {
      fileSaver = await claude.use('downloads');
    } catch (error) {
      fileSaver = null;
    }
  }
  document.querySelectorAll('.needs-dl').forEach(element => {
    element.hidden = !fileSaver;
  });
  showExportNote(fileSaver ? '' : t('export.unavailable'));
}

const showExportNote = text => {
  byId('export-note').textContent = text;
};

/** Name of the current settings: the typed name, a matching preset, or "custom settings". */
function currentVariantName() {
  const typedName = byId('saved-variant-name')?.value.trim();
  if (typedName) return typedName;
  const preset = PRESETS.find(candidate => matchesCurrentParams(candidate.params));
  return preset ? t(`presets.${preset.id}.label`) : t('export.customSettings');
}

/** File-name friendly version of a name, e.g. "Mleko + jaja" → "mleko-jaja". */
function slugify(name) {
  const slug = name
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/ł/g, 'l')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 40);
  return slug || t('export.fallbackFileName');
}

async function saveFile(name, data, extension) {
  if (!fileSaver) return;
  showExportNote('');
  try {
    await fileSaver.save({ filename: `${name}.${extension}`, data });
    showExportNote(t('export.saved'));
  } catch (error) {
    showExportNote(t(error?.code === 'declined' ? 'export.cancelled' : 'export.failed'));
  }
}

function exportSettings() {
  const name = currentVariantName();
  const file = {
    ...SETTINGS_FILE_FORMAT,
    name,
    date: new Date().toISOString().slice(0, 10),
    settings: params,
  };
  saveFile(`${t('export.settingsFilePrefix')}-${slugify(name)}`, JSON.stringify(file, null, 1), 'json');
}

/** Loads settings from a file saved by this app (any version); unknown keys are ignored. */
function importSettings(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const { name, settings } = readSettingsFile(JSON.parse(reader.result));
      endHistoryStep();
      let loadedCount = 0;
      for (const [id, value] of Object.entries(settings)) {
        if (id in params && typeof value === typeof params[id]) {
          params[id] = value;
          loadedCount++;
        }
      }
      if (name && byId('saved-variant-name')) byId('saved-variant-name').value = name;
      syncInputs();
      onParamsChanged();
      const nameNote = name ? t('export.loadedName', { name }) : '';
      showExportNote(t('export.loaded', { count: loadedCount, name: nameNote }));
    } catch (error) {
      showExportNote(t('export.notSettingsFile'));
    }
  };
  reader.readAsText(file);
}

/** Financial results (not the settings) as JSON for a budgeting or finance app. */
function exportFinance() {
  const name = currentVariantName();
  const data = buildFinanceExport(params, name);
  saveFile(`${t('export.financeFilePrefix')}-${slugify(name)}`, JSON.stringify(data, null, 1), 'json');
}

function exportPdf() {
  saveFile(`${t('export.reportFilePrefix')}-${slugify(currentVariantName())}`, buildPdfReport(), 'pdf');
}

function buildExport() {
  const sectionCheckboxes = PDF_SECTION_CHOICES.map(
    id =>
      `<label class="sw"><input type="checkbox" data-pdf-section="${id}" checked>` +
      `<span>${t(`pdf.sections.${id}.choice`)}</span></label>`
  ).join('');

  byId('export-row').insertAdjacentHTML(
    'beforeend',
    `<button class="btn needs-dl" type="button" id="export-json">${t('export.saveSettings')}</button>
    <label class="btn" for="import-json">${t('export.loadSettings')}</label>
    <input id="import-json" type="file" accept=".json,application/json" hidden>
    <button class="btn needs-dl" type="button" id="export-finance" title="${t('export.financeTitle')}">${t('export.financeData')}</button>
    <details class="pdf-box needs-dl">
      <summary class="btn">${t('export.pdfReport')}</summary>
      <div class="pdf-pick">
        ${sectionCheckboxes}
        <button class="btn on" type="button" id="export-pdf">${t('export.savePdf')}</button>
      </div>
    </details>
    <span class="small muted" id="export-note"></span>`
  );

  byId('export-json').addEventListener('click', exportSettings);
  byId('import-json').addEventListener('change', event => {
    const file = event.target.files[0];
    if (file) importSettings(file);
    event.target.value = ''; // allow loading the same file again
  });
  byId('export-pdf').addEventListener('click', exportPdf);
  byId('export-finance').addEventListener('click', exportFinance);
  initFileSaver();
}

// ===== ui/theme.js =====
// Colour theme switch: automatic (follows the system), light, dark or eco (soft greens);
// remembered in this browser.

const THEME_STORAGE_KEY = 'gosp-motyw';

/** Themes set explicitly; any other value follows the system setting. */
const EXPLICIT_THEMES = ['light', 'dark', 'eco'];

function setTheme(theme) {
  if (EXPLICIT_THEMES.includes(theme)) document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  document
    .querySelectorAll('[data-theme-option]')
    .forEach(button => button.classList.toggle('on', button.dataset.themeOption === (theme || 'auto')));
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme || 'auto');
  } catch (error) {
    // not remembered
  }
}

function initTheme() {
  let savedTheme = 'auto';
  try {
    savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'auto';
  } catch (error) {
    // use the automatic theme
  }
  setTheme(savedTheme);
  byId('theme-switch').addEventListener('click', event => {
    const button = event.target.closest('[data-theme-option]');
    if (!button) return;
    setTheme(button.dataset.themeOption);
    render(); // chart colours are read from the theme
  });
}

// ===== ui/language.js =====
// Interface language switch (Polish or English); remembered in this browser.
//
// Texts are read once when the page starts, so switching reloads the page. When the browser
// cannot remember the choice, the language is passed in the address instead (?lang=en).

function markCurrentLanguage() {
  document
    .querySelectorAll('[data-language-option]')
    .forEach(button => button.classList.toggle('on', button.dataset.languageOption === currentLanguage()));
}

function rememberLanguage(language) {
  try {
    localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
    return localStorage.getItem(LANGUAGE_STORAGE_KEY) === language;
  } catch (error) {
    return false;
  }
}

function switchLanguage(language) {
  if (language === currentLanguage() || !LANGUAGES.includes(language)) return;
  const address = new URL(location.href);
  const hasLanguageInAddress = address.searchParams.has(LANGUAGE_URL_PARAMETER);
  if (rememberLanguage(language) && !hasLanguageInAddress) {
    location.reload();
    return;
  }
  address.searchParams.set(LANGUAGE_URL_PARAMETER, language);
  location.assign(address.href);
}

function initLanguageSwitch() {
  document.title = t('app.title');
  markCurrentLanguage();
  byId('language-switch').addEventListener('click', event => {
    const button = event.target.closest('[data-language-option]');
    if (button) switchLanguage(button.dataset.languageOption);
  });
}
