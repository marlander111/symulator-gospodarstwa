function computeMarket(params, results) {
  const { revenueItems: revenue } = results;
  const householdSales = salesToHouseholds(revenue, results.beefBoxRevenue);
  return {
    market: {
      milkPerDay: results.freshMilkSold / 365,
      goatMilkPerDay: results.goatMilkSold / 365,
      eggsPerWeek: results.eggsSold / 52,
      csaShares: revenue.vegetables / CSA_SHARE_PRICE,
      honeyKg: results.honeyKg,
      cheesePerWeek: results.cheeseSold / 52,
      curdPerWeek: results.curdSold / 52,
      butterPerWeek: results.butterSold / 52,
      creamPerWeek: results.creamSold / 52,
      // farm retail sales (RHD): dairy products, red meat in boxes, smoked goods, preserves
      directSalesRevenue: results.retailSalesRevenue,
      householdSales,
      loyalFamilies: householdSales / (params.loyalCustomerSpendPerMonth * MONTHS_PER_YEAR),
      occasionalCustomers: householdSales / (params.occasionalCustomerSpendPerMonth * MONTHS_PER_YEAR),
    },
  };
}

const MONTHS_PER_YEAR = 12;

/** Revenue lines bought by households (not by traders, abattoirs or grain buyers). */
const HOUSEHOLD_REVENUE_ITEMS = [
  'milk',
  'goatMilk',
  'cheese',
  'goatCheese',
  'curd',
  'cream',
  'butter',
  'dairyByproducts',
  'horseRiding',
  'eggs',
  'cockerels',
  'broilers',
  'geese',
  'ducks',
  'turkeys',
  'guineaFowl',
  'rabbits',
  'lambMeat',
  'processedGoods',
  'goats',
  'pigs',
  'honey',
  'vegetables',
  'mushrooms',
  'fruit',
];

/**
 * Yearly sales straight to households: the household revenue lines plus the beef sold in boxes
 * (live weaners, finishers, calves and lambs go to traders).
 */
function salesToHouseholds(revenue, beefBoxRevenue) {
  return sumBy(HOUSEHOLD_REVENUE_ITEMS, item => revenue[item] || 0) + beefBoxRevenue;
}

// ===== model/simulate-farm.js =====
// Yearly farm model: from the params it computes land use, feed balance, revenue, costs,
// investments, subsidies, working hours, results per enterprise and the monthly cash flow.
//
// The stages live in model/stages/. Each stage reads the params and what earlier stages
// produced, and adds its own values to one flat `results` object used by every panel.

/**
 * @param {object} inputParams - values of all parameters (see parameters/registry.js)
 * @returns {object} results
 */
function simulateFarm(inputParams) {
  const soilFactors = computeSoilFactors(inputParams);
  const climate = computeClimateFactors(inputParams);
  const grazingPlan = computeGrazingPlan(inputParams);
  const params = adjustForMilkingRoutine(
    adjustPastureForGrazingPlan(adjustYieldsForSoilAndClimate(inputParams, soilFactors, climate), grazingPlan)
  );
  const results = { soilFactors, climate, grazingPlan };

  const stages = [
    computeLandUse,
    computeHerdStructure,
    computeMilkAndDairyProducts,
    computeGoatMilk,
    computeFlockRenewal,
    computeForageBalance,
    computeGrainBalance,
    computeStrawBalance,
    computeLivestockUnits,
    computeNitrogenBalance,
    computeCarbonBalance,
    computeRevenue,
    computeCosts,
    computeInvestments,
    computeSubsidies,
    computeNetIncome,
    computeLabour,
    computeEnterprises,
    computeMarket,
  ];
  for (const stage of stages) Object.assign(results, stage(params, results));

  results.warnings = collectWarnings(params, inputParams, results);
  results.householdBudget = computeHouseholdBudget(params);
  results.incomeTarget = computeIncomeTarget(params);
  results.cashflow = computeMonthlyCashflow(results, params);
  return results;
}

function adjustYieldsForSoilAndClimate(params, soil, climate) {
  const arable = soil.arable * climate.arable;
  return {
    ...params,
    cerealYield: params.cerealYield * arable,
    strawYield: params.strawYield * arable,
    cloverYield: params.cloverYield * arable,
    rootCropYield: params.rootCropYield * arable,
    pastureYield: params.pastureYield * soil.pasture * climate.pasture,
    meadowYield: params.meadowYield * soil.meadow * climate.meadow,
  };
}

/** Grass eaten per hectare depends on how often the herd moves and how long paddocks rest. */
function adjustPastureForGrazingPlan(params, grazingPlan) {
  return { ...params, pastureYield: params.pastureYield * grazingPlan.yieldFactor };
}

/** Milking once a day (New Zealand style): less milk, much less time in the parlour. */
const ONCE_A_DAY_MILK_FACTOR = 0.8;
const ONCE_A_DAY_HOURS_PER_COW_FACTOR = 0.65;
const ONCE_A_DAY_DAIRY_FIXED_HOURS_FACTOR = 0.6;

function adjustForMilkingRoutine(params) {
  if (!params.onceADayMilking) return params;
  return {
    ...params,
    milkPerCow: params.milkPerCow * ONCE_A_DAY_MILK_FACTOR,
    hoursPerCow: params.hoursPerCow * ONCE_A_DAY_HOURS_PER_COW_FACTOR,
    dairyFixedHours: params.dairyFixedHours * ONCE_A_DAY_DAIRY_FIXED_HOURS_FACTOR,
  };
}

/** Result before paying the family for its work, without loans and taxes. */
function computeNetIncome(params, results) {
  return { netIncome: results.revenue + results.subsidies - results.costs - results.depreciation };
}

// ===== model/risk.js =====
// Year-to-year risk: the farm is simulated for many random years in which yields, prices, animal
// output and running costs vary around the set values, with an occasional bad year for the
// animals. The spread of the yearly net income shows how often the farm reaches the income
// target. The random numbers come from a fixed seed, so the same settings always give the same
// picture.

const RISK_YEARS = 500;
const RISK_SEED = 20261108;

/** Limits of the yearly factors, so that one draw cannot produce an impossible year. */
const RISK_FACTOR_LIMITS = {
  yield: [0.45, 1.35],
  price: [0.65, 1.35],
  animalOutput: [0.7, 1.2],
  cost: [0.8, 1.4],
};

/** In a poor harvest bought feed gets dearer: half of the yield shortfall is added to its price. */
const FEED_PRICE_RESPONSE_TO_YIELD = 0.5;

/** A bad year (disease, bird-flu housing order, lost customers) cuts animal output by this share. */
const BAD_YEAR_ANIMAL_OUTPUT_LOSS = 0.25;

/**
 * @param {object} params
 * @param {number} [years]
 * @returns {{incomes: number[], target: number, chanceOfTarget: number,
 *   p10: number, p50: number, p90: number}} incomes sorted from the lowest
 */
function simulateRisk(params, years = RISK_YEARS) {
  const random = seededRandom(RISK_SEED);
  const incomes = [];
  for (let year = 0; year < years; year++) incomes.push(simulateFarm(randomYear(params, random)).netIncome);
  incomes.sort((a, b) => a - b);

  const target = computeIncomeTarget(params);
  const quantile = share => incomes[Math.min(incomes.length - 1, Math.floor(share * incomes.length))];
  return {
    incomes,
    target,
    chanceOfTarget: incomes.filter(income => income >= target).length / incomes.length,
    p10: quantile(0.1),
    p50: quantile(0.5),
    p90: quantile(0.9),
  };
}

/** The params of one random year. */
function randomYear(params, random) {
  const factor = (volatilityPercent, [low, high]) =>
    Math.min(high, Math.max(low, 1 + (volatilityPercent / 100) * normalRandom(random)));
  const yieldFactor = factor(params.riskYieldVolatility, RISK_FACTOR_LIMITS.yield);
  const priceFactor = factor(params.riskPriceVolatility, RISK_FACTOR_LIMITS.price);
  const isBadYear = random() < params.riskBadYearChance / 100;
  const animalFactor =
    factor(params.riskAnimalVolatility, RISK_FACTOR_LIMITS.animalOutput) *
    (isBadYear ? 1 - BAD_YEAR_ANIMAL_OUTPUT_LOSS : 1);
  const costFactor = factor(params.riskCostVolatility, RISK_FACTOR_LIMITS.cost);
  const feedPriceFactor = 1 + Math.max(0, 1 - yieldFactor) * FEED_PRICE_RESPONSE_TO_YIELD;

  const year = { ...params, costMultiplier: costFactor };
  const scale = (ids, by) => ids.forEach(id => (year[id] = params[id] * by));
  scale(CROP_YIELD_PARAMS, yieldFactor);
  scale(PRICE_PARAMS, priceFactor);
  scale(ANIMAL_OUTPUT_PARAMS, animalFactor);
  scale(PURCHASE_PRICE_PARAMS, feedPriceFactor * costFactor);
  return year;
}

/** Deterministic random numbers in [0, 1) from a seed (mulberry32). */
function seededRandom(seed) {
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6d2b79f5) >>> 0;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}

/** A standard normal random number (Box–Muller). */
function normalRandom(random) {
  const u = Math.max(random(), Number.EPSILON);
  const v = random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// ===== model/startup.js =====
// Starting the farm: years 1–3 of building up to the plan, year 4 in full operation.
//
// Each enterprise starts with part of the planned herd, flock or area and grows every year,
// while the customer base grows and the family learns the work. Each year is simulated with
// the scaled params, so its income, hours and investments can be compared with full operation.

/** Number of the year from which the farm runs as planned. */
const FULL_OPERATION_YEAR = 4;

/** Share of the planned size in years 1, 2 and 3 for each kind of enterprise (year 4: all of it). */
const STARTUP_SCALE = {
  dairy: [0.75, 1, 1],
  dairyProcessing: [0.3, 0.7, 1], // cheese, curd, butter and goat cheese
  layingHens: [0.5, 1, 1],
  meatPoultry: [0.3, 0.6, 1],
  beef: [0.5, 0.75, 1],
  smallRuminants: [0.5, 0.75, 1],
  pigs: [0, 0.5, 1],
  horses: [1, 1, 1],
  produce: [0.5, 0.75, 1],
  processing: [0, 0.5, 1], // smoked goods, cured meats, preserves
};

/** The parameters each kind of enterprise scales; counts are rounded to whole animals. */
const STARTUP_SCALED_PARAMS = {
  dairy: { counts: ['dairyCows'], shares: [] },
  dairyProcessing: { counts: [], shares: ['cheeseShare', 'curdShare', 'goatCheeseShare'] },
  layingHens: { counts: ['layingHens'], shares: [] },
  meatPoultry: { counts: ['broilers', 'geese', 'ducks', 'turkeys', 'guineaFowl', 'rabbits'], shares: [] },
  beef: { counts: ['sucklerCows'], shares: [] },
  smallRuminants: { counts: ['sheep', 'goats'], shares: [] },
  pigs: { counts: ['pigs'], shares: [] },
  horses: { counts: ['horses'], shares: ['ridesPerYear'] },
  produce: { counts: ['beehives', 'mushroomLogs'], shares: ['marketGardenHa'] },
  processing: {
    counts: [],
    shares: [
      'geeseProcessedShare',
      'ducksProcessedShare',
      'lambProcessedShare',
      'porkProcessedShare',
      'beefProcessedShare',
      'preservesFruitShare',
      'preservesVegetableShare',
    ],
  },
};

/** Share of the planned sales that find buyers while the customer base grows (years 1–3). */
const STARTUP_SALES_REALISED = [0.75, 0.88, 0.96];
/** Extra working time while learning the jobs (years 1–3). */
const STARTUP_EXTRA_HOURS = [0.15, 0.08, 0.03];

/**
 * The params of one start-up year: the plan scaled down, lower sales and longer hours.
 * @param {object} params - the plan in full operation
 * @param {number} year - 1 to FULL_OPERATION_YEAR
 */
function startupYearParams(params, year) {
  if (year >= FULL_OPERATION_YEAR) return params;
  const index = year - 1;
  const scaled = { ...params };
  for (const [kind, { counts, shares }] of Object.entries(STARTUP_SCALED_PARAMS)) {
    const factor = STARTUP_SCALE[kind][index];
    for (const id of counts) scaled[id] = Math.round(params[id] * factor);
    for (const id of shares) scaled[id] = params[id] * factor;
  }
  for (const id of PRICE_PARAMS) scaled[id] = params[id] * STARTUP_SALES_REALISED[index];
  scaled.hoursMultiplier = (params.hoursMultiplier || 1) * (1 + STARTUP_EXTRA_HOURS[index]);
  return scaled;
}

/**
 * Results of every start-up year and of full operation.
 * @param {object} params
 * @returns {{year: number, params: object, results: object}[]}
 */
function simulateStartupYears(params) {
  return Array.from({ length: FULL_OPERATION_YEAR }, (_, index) => {
    const yearParams = startupYearParams(params, index + 1);
    return { year: index + 1, params: yearParams, results: simulateFarm(yearParams) };
  });
}

// ===== model/finance-export.js =====
// Financial data of the current plan as plain JSON, for budgeting and finance apps: yearly
// results of the realistic and the pessimistic scenario, every revenue, cost and subsidy line,
// the enterprises, investments, the start-up years, the monthly cash flow and the risk spread.
// Keys are English and stable; `label` fields carry the texts in the interface language.

const FINANCE_EXPORT_FORMAT = { format: 'farm-simulator-finance', version: 1, currency: 'PLN' };

/** Years simulated for the risk figures of the export (fewer than the panel, to stay quick). */
const FINANCE_EXPORT_RISK_YEARS = 300;

const roundMoney = value => Math.round(value);

/** Lines of one kind ({id: amount}) as a list with labels, without empty lines. */
function financeLines(items, labelKey) {
  return Object.entries(items)
    .filter(([, amount]) => Math.abs(amount) >= 0.5)
    .map(([id, amount]) => ({ id, label: t(labelKey(id)), amount: roundMoney(amount) }));
}

function financeScenario(results) {
  return {
    netIncome: roundMoney(results.netIncome),
    netIncomePerMonth: roundMoney(results.netIncome / 12),
    revenue: roundMoney(results.revenue),
    subsidies: roundMoney(results.subsidies),
    costs: roundMoney(results.costs),
    depreciation: roundMoney(results.depreciation),
    totalHours: Math.round(results.totalHours),
    netIncomePerHour: Math.round(results.netPerHour * 10) / 10,
    homeFoodValue: roundMoney(results.homeUseTotal),
    revenueLines: financeLines(results.revenueItems, id => `revenueItems.${id}.label`),
    costLines: financeLines(results.costItems, id => `costItems.${id}`),
    subsidyLines: financeLines(results.subsidyItems, id => `subsidyItems.${id}.label`),
    enterprises: results.enterprises
      .filter(enterprise => enterprise.active)
      .map(enterprise => ({
        id: enterprise.id,
        label: t(`enterprises.${enterprise.labelKey}`),
        revenue: roundMoney(enterprise.revenue),
        costs: roundMoney(enterprise.cost),
        depreciation: roundMoney(enterprise.depreciation),
        subsidies: roundMoney(enterprise.subsidy),
        net: roundMoney(enterprise.net),
        hours: Math.round(enterprise.hours),
      })),
  };
}

/**
 * @param {object} params - current settings
 * @param {string} variantName - name shown to the user
 * @returns {object} the JSON document
 */
function buildFinanceExport(params, variantName) {
  const results = simulateFarm(params);
  const pessimistic = simulateFarm(applyPessimisticScenario(params));
  const risk = simulateRisk(params, FINANCE_EXPORT_RISK_YEARS);
  return {
    ...FINANCE_EXPORT_FORMAT,
    createdAt: new Date().toISOString(),
    variant: variantName,
    location: { id: params.location, label: t(`locations.${params.location}`) },
    farm: {
      ownedHa: params.ownedHa,
      leasedHa: params.leasedHa,
      farmedHa: Math.round(results.farmedHa * 100) / 100,
      familyHoursAvailable: Math.round(results.availableHours),
      weeklyHoursLimit: params.weeklyHoursLimit,
    },
    targets: {
      minimumNetIncome: roundMoney(results.incomeTarget),
      householdMonthlySpending: params.householdMonthlySpending,
      householdYearlyNeed: roundMoney(results.householdBudget.required),
      openingCash: params.openingCash,
    },
    scenarios: { realistic: financeScenario(results), pessimistic: financeScenario(pessimistic) },
    risk: {
      years: risk.incomes.length,
      chanceOfMinimum: Math.round(risk.chanceOfTarget * 1000) / 1000,
      poorYear: roundMoney(risk.p10),
      typicalYear: roundMoney(risk.p50),
      goodYear: roundMoney(risk.p90),
    },
    investments: results.investmentItems
      .filter(item => item.cost > 0)
      .map(item => ({
        id: item.id,
        label: t(`investments.${item.id}`),
        cost: roundMoney(item.cost),
        lifetimeYears: item.lifetimeYears,
        yearlyDepreciation: roundMoney(item.yearlyDepreciation),
      })),
    startupYears: simulateStartupYears(params).map(({ year, results: yearResults }) => ({
      year,
      netIncome: roundMoney(yearResults.netIncome),
      revenue: roundMoney(yearResults.revenue),
      subsidies: roundMoney(yearResults.subsidies),
      costs: roundMoney(yearResults.costs),
      investments: roundMoney(yearResults.capex),
      hours: Math.round(yearResults.totalHours),
    })),
    monthlyCashflow: results.cashflow.months.map((month, index) => ({
      month: index + 1,
      sales: roundMoney(month.inflows),
      subsidies: roundMoney(month.subsidy),
      costs: roundMoney(month.outflows),
      result: roundMoney(month.netIncome),
      household: roundMoney(month.household),
      balance: roundMoney(month.balance),
    })),
  };
}
</script>
<script>
(function () {
// ===== ui/last-choice.js =====
// Remembers the last ready-made variant and assumption set chosen in this browser.
//
// On the next visit the app starts from the saved settings. If the user has not changed the
// values a preset set, the current version of that preset is loaded again (presets may have been
// improved since), so it stays selected. On the first visit the app starts from the realistic
// assumptions and the recommended variant.

const LAST_CHOICE_STORAGE_KEY = 'gosp-ostatni-wybor';
const DEFAULTS_VERSION_STORAGE_KEY = 'gosp-wersja-domyslnych';
const FIRST_VISIT_PRESET_ID = 'recommended';
const FIRST_VISIT_ASSUMPTION_SET_ID = 'realistic';

/** {preset: {id, values}, assumption: {id, values}} — what was chosen and the values it set. */
function loadLastChoice() {
  try {
    return JSON.parse(localStorage.getItem(LAST_CHOICE_STORAGE_KEY) || '{}') || {};
  } catch (error) {
    return {};
  }
}

/** Remembers a preset or assumption set right after it was applied. */
function rememberChoice(kind, id, values) {
  const choice = { ...loadLastChoice(), [kind]: { id, values } };
  try {
    localStorage.setItem(LAST_CHOICE_STORAGE_KEY, JSON.stringify(choice));
  } catch (error) {
    // storage unavailable: the choice is simply not remembered
  }
}

const assumptionSetById = id => ASSUMPTION_SETS.find(set => set.id === id);

/** Settings to start with: saved ones (with the last choice refreshed) or the first-visit default. */
function startupParams(saved, savedDefaultsVersion) {
  if (!saved) {
    const assumption = assumptionSetById(FIRST_VISIT_ASSUMPTION_SET_ID);
    const preset = presetById(FIRST_VISIT_PRESET_ID);
    rememberChoice('assumption', assumption.id, assumption.params);
    rememberChoice('preset', preset.id, preset.params);
    return { ...defaultParams(), ...assumption.params, ...preset.params };
  }

  let params = { ...defaultParams(), ...migrateChangedDefaults(saved, savedDefaultsVersion) };
  const lastChoice = loadLastChoice();
  const refresh = (choice, current) => {
    if (!choice || !current || !choice.values) return;
    const untouched = Object.entries(choice.values).every(([id, value]) => params[id] === value);
    if (untouched) {
      params = { ...params, ...current.params };
      rememberChoice(choice === lastChoice.preset ? 'preset' : 'assumption', current.id, current.params);
    }
  };
  refresh(lastChoice.assumption, lastChoice.assumption && assumptionSetById(lastChoice.assumption.id));
  refresh(lastChoice.preset, lastChoice.preset && presetById(lastChoice.preset.id));
  return params;
}

function rememberDefaultsVersion() {
  try {
    localStorage.setItem(DEFAULTS_VERSION_STORAGE_KEY, String(DEFAULTS_VERSION));
  } catch (error) {
    // nothing to do
  }
}

// ===== ui/core.js =====
// Application state and small helpers shared by all panels.

/** Browser storage key of the current settings (kept from the first version of the app). */
const STORAGE_KEY = 'gosp-lwowek-v1';

/** Current values of all parameters; every change re-renders the page. */
let params = loadSavedParams();

function loadSavedParams() {
  let saved = null;
  let savedDefaultsVersion = 1;
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (stored) saved = migrateLegacyParameterIds(stored);
    savedDefaultsVersion = +(localStorage.getItem(DEFAULTS_VERSION_STORAGE_KEY) || 1);
  } catch (error) {
    // storage unavailable (private window, preview): start like a first visit
  }

  const known = defaultParams();
  const loaded = startupParams(saved, savedDefaultsVersion);
  for (const id in loaded) if (!(id in known)) delete loaded[id];
  rememberDefaultsVersion();
  return loaded;
}

function saveParams() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(params));
  } catch (error) {
    // nothing to do: settings simply are not remembered
  }
}

const byId = id => document.getElementById(id);

/** Amount in PLN rounded to hundreds, e.g. "12 300 zł". */
const formatPln = amount => t('format.pln', { amount: formatNumber(Math.round(amount / 100) * 100, 0) });

/** Amount in PLN rounded to whole złoty. */
const formatPlnExact = amount => t('format.pln', { amount: formatNumber(amount, 0) });

const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const escapeHtml = text => String(text).replace(/[&<>"]/g, character => HTML_ESCAPES[character]);

/** Number of decimals of a slider step, e.g. 0.25 → 2. */
function decimalPlaces(step) {
  const text = String(step);
  return text.includes('.') ? text.split('.')[1].length : 0;
}

const parameterText = (parameter, field) => {
  const key = `parameters.${parameter.id}.${field}`;
  return hasMessage(key) ? t(key) : '';
};
const parameterLabel = parameter => parameterText(parameter, 'label');
const parameterUnit = parameter => parameterText(parameter, 'unit');
const parameterHint = parameter => parameterText(parameter, 'hint');

/** Slider value with its unit, e.g. "3 700 l/rok"; empty for switches. */
function formatParameterValue(parameter, value) {
  if (parameter.type === 'boolean') return '';
  const unit = parameterUnit(parameter);
  return formatNumber(value, decimalPlaces(parameter.step)) + (unit ? ' ' + unit : '');
}

// ===== ui/markup.js =====
// Helpers that build HTML and SVG markup strings, so the panels describe elements as data
// instead of long template strings.

/**
 * Markup of one element; attributes that are null, undefined or false are left out.
 * @param {string} name - tag name, e.g. "rect"
 * @param {object} [attributes] - e.g. { x: 10, y: 20, fill: 'var(--ok)' }
 * @param {string} [content] - inner markup, already escaped
 * @returns {string}
 */
function element(name, attributes = {}, content = '') {
  return `<${name}${attributesText(attributes)}>${content}</${name}>`;
}

/** Markup of an element without content or closing tag, e.g. <input>. */
function voidElement(name, attributes = {}) {
  return `<${name}${attributesText(attributes)}>`;
}

function attributesText(attributes) {
  return Object.entries(attributes)
    .filter(([, value]) => value !== null && value !== undefined && value !== false)
    .map(([attribute, value]) => ` ${attribute}="${value}"`)
    .join('');
}

/**
 * Header row of a table.
 * @param {string[]} labels
 * @param {(index: number) => boolean} [isNumeric] - right-aligned columns; by default all but the first
 */
function tableHeader(labels, isNumeric = index => index > 0) {
  const cells = labels.map((label, index) => element('th', { class: isNumeric(index) ? 'n' : null }, label));
  return `<thead><tr>${cells.join('')}</tr></thead>`;
}

/** A right-aligned number cell, red when `isNegative`. */
const numberCell = (content, isNegative = false) =>
  element('td', { class: isNegative ? 'n neg' : 'n' }, content);

/** A table cell; attributes are optional, e.g. { class: 'n' }. */
const cell = (content, attributes = {}) => element('td', attributes, content);

/** A table row built from cell markup. */
const tableRow = (cells, attributes = {}) => element('tr', attributes, cells.join(''));

/** A table body built from row markup. */
const tableBody = rows => element('tbody', {}, rows.join(''));

// ===== ui/controls.js =====
// Controls panel: one collapsible group per parameter group, with collapsible subsections
// (advanced ones start closed), sliders, switches and choice buttons bound to `params`.
// Share sliders of soil classes get a field in hectares, the lease rent a field for the total.

const OPEN_GROUPS = [];

function buildControls() {
  let html = '';
  for (const group of PARAMETER_GROUP_IDS) {
    if (HIDDEN_PARAMETER_GROUPS.has(group)) continue;
    const parameters = PARAMETERS.filter(item => item.group === group && !item.hidden);
    const isOpen = OPEN_GROUPS.includes(group) ? 'open' : '';
    const title = element('span', {}, t(`parameterGroups.${group}`));
    const summary = element('span', { class: 'sumv', id: `summary-${group}` });
    html += `<details class="grp" id="group-${group}" ${isOpen}>
      <summary>${title}${summary}</summary>
      <div class="grp-body">${groupBodyHtml(parameters)}</div></details>`;
  }
  html += `<button class="btn ghost reset" id="reset" type="button">${t('controls.reset')}</button>`;
  byId('controls').innerHTML = html;

  for (const parameter of PARAMETERS) if (!parameter.hidden) bindControl(parameter);
  byId('reset').addEventListener('click', () => {
    endHistoryStep();
    params = defaultParams();
    syncInputs();
    onParamsChanged();
  });
}

/** Controls of one group; a subsection runs until the next one starts or the group ends. */
function groupBodyHtml(parameters) {
  let html = '';
  let inSubsection = false;
  for (const parameter of parameters) {
    const subsection = SUBSECTIONS.get(parameter.id);
    if (subsection) {
      if (inSubsection) html += '</div></details>';
      html += subsectionStartHtml(parameter.id, subsection);
      inSubsection = true;
    }
    html += controlHtml(parameter);
  }
  return inSubsection ? html + '</div></details>' : html;
}

function subsectionStartHtml(id, { advanced }) {
  const tag = advanced ? element('span', { class: 'tag' }, t('controls.advanced')) : '';
  const title = element('span', {}, escapeHtml(t(`subsections.${id}`)) + tag);
  return `<details class="sub${advanced ? ' adv' : ''}" ${advanced ? '' : 'open'}><summary>${title}</summary><div class="sub-body">`;
}

function controlHtml(parameter) {
  const { id } = parameter;
  const label = escapeHtml(parameterLabel(parameter));
  const hint = escapeHtml(parameterHint(parameter));
  let html = '';

  if (parameter.type === 'boolean') {
    const help = hint ? `<br><span class="help muted small">${hint}</span>` : '';
    html += `<label class="sw"><input type="checkbox" id="input-${id}"><span>${label}${help}</span></label>`;
  } else if (parameter.type === 'choice') {
    const buttons = parameter.options
      .map(option =>
        element(
          'button',
          { class: 'btn', type: 'button', 'data-choice': id, 'data-option': option },
          escapeHtml(t(`parameters.${id}.options.${option}`))
        )
      )
      .join('');
    const help = hint ? element('p', { class: 'help' }, hint) : '';
    html += `<div class="ctl ctl-choice">
      <div class="ctl-top"><span>${label}</span></div>
      <div class="seg" role="group" id="input-${id}" aria-label="${label}">${buttons}</div>${help}
    </div>`;
  } else {
    const help = hint ? element('p', { class: 'help' }, hint) : '';
    const slider = voidElement('input', {
      type: 'range',
      id: `input-${id}`,
      min: parameter.min,
      max: parameter.max,
      step: parameter.step,
    });
    html += `<div class="ctl${parameter.advanced ? ' adv' : ''}">
      <div class="ctl-top"><label for="input-${id}">${label}</label><output id="output-${id}"></output></div>
      ${slider}${extraFieldHtml(parameter)}${help}
    </div>`;
  }
  // arable land is what remains after the land uses above it
  if (id === 'meadowHa') html += `<div class="derived" id="derived-arable"></div>`;
  return html;
}

/** A field in hectares next to a share slider, or a field for the total next to a price per hectare. */
function extraFieldHtml(parameter) {
  if (parameter.hectaresOf) {
    const input = voidElement('input', { type: 'number', id: `ha-${parameter.id}`, min: 0, step: 0.05 });
    return element(
      'div',
      { class: 'ctl-extra ctl-ha' },
      `<label>${t('controls.hectaresField')} ${input} ha</label>` +
        element('span', { id: `ha-of-${parameter.id}` })
    );
  }
  if (parameter.totalOf) {
    const input = voidElement('input', { type: 'number', id: `total-${parameter.id}`, min: 0, step: 100 });
    return element(
      'div',
      { class: 'ctl-extra ctl-total' },
      `<label>${t('controls.totalField')} ${input} ${t('controls.totalUnit')}</label>`
    );
  }
  return '';
}

function bindControl(parameter) {
  if (parameter.type === 'choice') {
    byId('input-' + parameter.id).addEventListener('click', event => {
      const button = event.target.closest('[data-option]');
      if (button) chooseOption(parameter, button.dataset.option);
    });
    return;
  }
  const input = byId('input-' + parameter.id);
  if (parameter.type === 'boolean') {
    input.addEventListener('change', () => {
      params[parameter.id] = input.checked;
      onParamsChanged();
    });
    return;
  }
  input.addEventListener('input', () => {
    params[parameter.id] = parseFloat(input.value);
    byId('output-' + parameter.id).textContent = formatParameterValue(parameter, params[parameter.id]);
    onParamsChanged();
  });
  if (parameter.hectaresOf) bindHectaresField(parameter);
  if (parameter.totalOf) bindTotalField(parameter);
}

/** Picks an option of a choice and moves the sliders it sets to their typical values. */
function chooseOption(parameter, option) {
  endHistoryStep();
  params = { ...params, [parameter.id]: option, ...valuesSetByChoice(parameter, option) };
  syncInputs();
  onParamsChanged();
}

/** Hectares of the land use a soil-class share slider belongs to. */
function landUseArea(landUse) {
  if (landUse === 'pasture') return params.pastureHa;
  if (landUse === 'meadow') return params.meadowHa;
  return computeLandUse(params).usableArableHa;
}

function bindHectaresField(parameter) {
  const field = byId('ha-' + parameter.id);
  field.addEventListener('change', () => {
    const area = landUseArea(parameter.hectaresOf);
    const hectares = Math.max(0, parseFloat(field.value) || 0);
    params[parameter.id] = area > 0 ? Math.min(parameter.max, (hectares / area) * 100) : 0;
    syncInputs();
    onParamsChanged();
  });
}

function bindTotalField(parameter) {
  const field = byId('total-' + parameter.id);
  field.addEventListener('change', () => {
    const hectares = params[parameter.totalOf];
    if (hectares <= 0) return;
    const total = Math.max(0, parseFloat(field.value) || 0);
    params[parameter.id] = Math.min(parameter.max, total / hectares);
    syncInputs();
    onParamsChanged();
  });
}

/** Moves every control to the current value in `params`. */
function syncInputs() {
  for (const parameter of PARAMETERS) {
    if (parameter.hidden) continue;
    if (parameter.type === 'choice') {
      byId('input-' + parameter.id)
        .querySelectorAll('[data-option]')
        .forEach(button => button.classList.toggle('on', button.dataset.option === params[parameter.id]));
      continue;
    }
    const input = byId('input-' + parameter.id);
    if (parameter.type === 'boolean') {
      input.checked = !!params[parameter.id];
    } else {
      input.value = params[parameter.id];
      byId('output-' + parameter.id).textContent = formatParameterValue(parameter, params[parameter.id]);
    }
  }
  syncDerivedFields();
}

/**
 * Updates the hectare and total fields, which depend on other sliders too (the area of the land
 * use, the leased hectares). The field being typed in is left alone.
 */
function syncDerivedFields() {
  for (const parameter of PARAMETERS) {
    if (parameter.hectaresOf) {
      const field = byId('ha-' + parameter.id);
      const area = landUseArea(parameter.hectaresOf);
      if (field !== document.activeElement) field.value = ((params[parameter.id] / 100) * area).toFixed(2);
      byId('ha-of-' + parameter.id).textContent = t('controls.hectaresOf', { area: formatNumber(area, 2) });
    }
    if (parameter.totalOf) {
      const field = byId('total-' + parameter.id);
      const hectares = params[parameter.totalOf];
      field.disabled = hectares <= 0;
      if (field !== document.activeElement) field.value = Math.round(params[parameter.id] * hectares);
    }
  }
}

// ---------- Saved variants ----------

const SAVED_VARIANTS_STORAGE_KEY = 'gosp-lwowek-moje-v1';
const savedVariants = loadSavedVariants();

function loadSavedVariants() {
  try {
    const stored = JSON.parse(localStorage.getItem(SAVED_VARIANTS_STORAGE_KEY) || '[]') || [];
    // version 1 stored the settings under `p` with Polish parameter ids
    return stored.map(variant => ({
      name: variant.name,
      params: migrateLegacyParameterIds(variant.params || variant.p),
    }));
  } catch (error) {
    return [];
  }
}

/** @returns {boolean} false when the browser does not allow saving */
function storeSavedVariants() {
  try {
    localStorage.setItem(SAVED_VARIANTS_STORAGE_KEY, JSON.stringify(savedVariants));
    return true;
  } catch (error) {
    return false;
  }
}

function buildSavedVariants() {
  const nameInput = byId('saved-variant-name');
  byId('save-variant').addEventListener('click', () => {
    const name =
      (nameInput.value || '').trim() || t('savedVariants.defaultName', { number: savedVariants.length + 1 });
    const existing = savedVariants.findIndex(variant => variant.name === name);
    const variant = { name, params: { ...params } };
    if (existing >= 0) savedVariants[existing] = variant;
    else savedVariants.push(variant);

    const stored = storeSavedVariants();
    nameInput.value = '';
    byId('saved-variants-note').textContent = stored
      ? t('savedVariants.saved', { name })
      : t('savedVariants.storageUnavailable');
    renderSavedVariants();
    render();
  });
  nameInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') byId('save-variant').click();
  });
  renderSavedVariants();
}

function renderSavedVariants() {
  byId('saved-variants').innerHTML = savedVariants
    .map((variant, index) => {
      const name = escapeHtml(variant.name);
      const deleteLabel = t('savedVariants.delete', { name });
      return (
        `<button class="btn" type="button" data-saved-variant="${index}">${name}` +
        `<span class="x" data-delete-variant="${index}" role="button" aria-label="${deleteLabel}" ` +
        `title="${t('savedVariants.deleteTitle')}">×</span></button>`
      );
    })
    .join('');

  document.querySelectorAll('[data-saved-variant]').forEach(button =>
    button.addEventListener('click', event => {
      const index = +button.dataset.savedVariant;
      if (event.target.closest('[data-delete-variant]')) {
        savedVariants.splice(index, 1);
        storeSavedVariants();
        renderSavedVariants();
        render();
        return;
      }
      endHistoryStep();
      params = { ...defaultParams(), ...savedVariants[index].params };
      syncInputs();
      onParamsChanged();
    })
  );
}

// ---------- Which buttons match the current settings ----------

/** True when every value of the set equals the current one (numbers compared with a tolerance). */
function matchesCurrentParams(values) {
  return Object.entries(values).every(([id, value]) =>
    typeof value === 'number' ? Math.abs(params[id] - value) < 1e-9 : params[id] === value
  );
}

/** True when a saved variant has exactly the current settings. */
function equalsCurrentParams(values) {
  return PARAMETERS.every(
    parameter => values[parameter.id] === undefined || values[parameter.id] === params[parameter.id]
  );
}

function markActivePresets() {
  const highlight = (selector, isActive) =>
    document.querySelectorAll(selector).forEach(button => button.classList.toggle('on', isActive(button)));
  highlight('[data-preset]', button => matchesCurrentParams(presetById(button.dataset.preset).params));
  highlight('[data-assumption]', button =>
    matchesCurrentParams(assumptionSetById(button.dataset.assumption).params)
  );
  highlight('[data-saved-variant]', button =>
    equalsCurrentParams(savedVariants[+button.dataset.savedVariant].params)
  );
}

// ===== ui/history.js =====
// "Previous data": every change of the settings is remembered, so the user can step back.
// Changes that follow each other quickly (dragging a slider) count as one step.

const HISTORY_LIMIT = 30;
/** Pause after which the next change starts a new step. */
const HISTORY_STEP_PAUSE_MS = 800;

const paramsHistory = [];
/** Settings as they were before the change that is going on now. */
let settledParams = { ...params };
let stepTimer = 0;

/** Called on every change of the settings (from onParamsChanged). */
function recordParamsChange() {
  if (!stepTimer && !haveSameValues(settledParams, params)) {
    paramsHistory.push(settledParams);
    if (paramsHistory.length > HISTORY_LIMIT) paramsHistory.shift();
  }
  clearTimeout(stepTimer);
  stepTimer = setTimeout(endHistoryStep, HISTORY_STEP_PAUSE_MS);
  renderUndoButton();
}

/** Closes the current step, so that the next change can be undone on its own. */
function endHistoryStep() {
  clearTimeout(stepTimer);
  stepTimer = 0;
  settledParams = { ...params };
}

/** Restores the settings from before the last step. */
function restorePreviousParams() {
  const previous = paramsHistory.pop();
  if (!previous) return;

  clearTimeout(stepTimer);
  stepTimer = 0;
  params = { ...previous };
  settledParams = { ...previous };
  syncInputs();
  render();
  saveParams();
  renderUndoButton();
}

function renderUndoButton() {
  byId('undo-params').disabled = paramsHistory.length === 0;
}

const haveSameValues = (a, b) => Object.keys(a).every(id => a[id] === b[id]);

// ===== ui/tint.js =====
// Subtle background colours for numbers in tables: from red (weakest) to green (best).

const DECIMAL_SEPARATOR = (1.5).toLocaleString(t('format.numberLocale')).charAt(1);
const NOT_PART_OF_NUMBER = new RegExp(`[^\\d\\-${DECIMAL_SEPARATOR}]`, 'g');

/** Parses a number as displayed ("−12 300 zł", "1,5", "12,300 PLN", "1.5") or returns null. */
function parseDisplayedNumber(text) {
  const normalised = String(text)
    .replace(/−/g, '-')
    .replace(NOT_PART_OF_NUMBER, '')
    .replace(DECIMAL_SEPARATOR, '.');
  const value = parseFloat(normalised);
  return isFinite(value) ? value : null;
}

const mixBackground = (colorVariable, strength) =>
  strength > 0.005
    ? `color-mix(in srgb, var(${colorVariable}) ${Math.round(strength * 100)}%, transparent)`
    : '';

/**
 * Colours selected columns of a table.
 * Modes: "pos" – green by size, "neg" – red by size, "rank" – red to green by value,
 * "low" – like rank but lower is better.
 * @param {string} tableId
 * @param {Object<number, string>} modeByColumn
 */
function tintTable(tableId, modeByColumn) {
  const table = byId(tableId);
  if (!table) return;
  const rows = [...table.querySelectorAll('tbody tr')].filter(row => !row.classList.contains('tot'));
  for (const [column, mode] of Object.entries(modeByColumn)) {
    const cells = rows.map(row => row.cells[+column]).filter(Boolean);
    const values = cells.map(cell => parseDisplayedNumber(cell.textContent));
    const numbers = values.filter(value => value !== null);
    if (!numbers.length) continue;
    const min = Math.min(...numbers);
    const max = Math.max(...numbers);
    const maxAbs = Math.max(...numbers.map(Math.abs)) || 1;
    cells.forEach((cell, index) => {
      const value = values[index];
      cell.style.background = value === null ? '' : cellBackground(mode, value, min, max, maxAbs);
    });
  }
}

function cellBackground(mode, value, min, max, maxAbs) {
  if (mode === 'pos') return mixBackground('--ok', (0.3 * Math.abs(value)) / maxAbs);
  if (mode === 'neg') return mixBackground('--bad', (0.22 * Math.abs(value)) / maxAbs);
  let position = max > min ? (value - min) / (max - min) : 0.5;
  if (mode === 'low') position = 1 - position;
  if (value < 0 && mode !== 'low') return mixBackground('--bad', 0.12 + (0.18 * Math.abs(value)) / maxAbs);
  return position < 0.4
    ? mixBackground('--bad', (0.2 * (0.4 - position)) / 0.4)
    : mixBackground('--ok', (0.34 * (position - 0.4)) / 0.6);
}

function tintTables() {
  tintTable('revenue-table', { 1: 'pos' });
  tintTable('subsidies-table', { 1: 'pos' });
  tintTable('home-use-table', { 1: 'pos' });
  tintTable('costs-table', { 1: 'neg' });
  tintTable('cashflow-table', { 1: 'pos', 2: 'pos', 3: 'neg', 4: 'rank', 6: 'rank' });
  tintTable('enterprises-table', { 1: 'rank', 2: 'rank' });
  tintTable('next-steps-table', { 2: 'rank' });
  tintTable('labour-table', { 1: 'neg', 2: 'neg' });
  tintTable('calendar-table', { 2: 'low', 5: 'rank' });
}

// Helpers for the SVG charts.

/** Round axis step giving about four grid lines up to `max` (1, 2, 2.5, 5 or 10 × a power of ten). */
function niceAxisStep(max) {
  const rawStep = max / 4;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const normalised = rawStep / magnitude;
  const niceNormalised =
    normalised <= 1 ? 1 : normalised <= 2 ? 2 : normalised <= 2.5 ? 2.5 : normalised <= 5 ? 5 : 10;
  return niceNormalised * magnitude;
}

/**
 * Horizontal line across the plot area of a chart.
 * @param {{width: number, padLeft: number, padRight: number}} chart
 */
const horizontalLine = (chart, y, attributes = {}) =>
  element('line', { x1: chart.padLeft, x2: chart.width - chart.padRight, y1: y, y2: y, ...attributes });

/** Small grey text of an axis or a legend. */
const axisText = (x, y, text, anchor = null) =>
  element('text', { x, y, 'text-anchor': anchor, class: 'ax' }, text);

/** A shape with a hover tooltip. */
const withTooltip = (name, attributes, tooltip) => element(name, attributes, element('title', {}, tooltip));

// ===== ui/kpi-bar.js =====
// Summary bar at the top: net income, working hours, revenue, pessimistic result,
// investments, feed balance and stocking density.

/** Below this yearly feed need (tonnes) the feed surplus is not shown as a percentage. */
const MIN_FEED_NEED_FOR_PERCENT = 1;

function renderKpis(results, pessimistic) {
  const target = computeIncomeTarget(params);

  byId('kpi-net').textContent = formatPln(results.netIncome);
  byId('kpi-net').classList.toggle('neg', results.netIncome < 0);
  byId('kpi-net-detail').textContent = t('kpi.netPerMonth', { amount: formatPln(results.netIncome / 12) });

  byId('kpi-hours').textContent = t('units.hours', { value: formatNumber(results.totalHours, 0) });
  byId('kpi-hours-detail').textContent = t('kpi.hoursDetail', {
    weekly: formatNumber(results.totalHours / 52, 0),
    daily: formatNumber(results.totalHours / 365, 1),
    peak: formatNumber(pessimistic.weeklyHoursPeak, 0),
    limit: formatNumber(params.weeklyHoursLimit, 0),
  });
  const overworked = results.labourUtilisation > 1 || pessimistic.weeklyHoursPeak > params.weeklyHoursLimit;
  byId('kpi-hours-detail').style.color = overworked ? 'var(--bad)' : '';

  byId('kpi-revenue').textContent = formatPln(results.revenue + results.subsidies);
  byId('kpi-revenue-detail').title = t('kpi.revenueExplanation');
  byId('kpi-revenue-detail').textContent = t('kpi.revenueDetail', {
    subsidies: formatPln(results.subsidies),
    costs: formatPln(results.costs + results.depreciation),
  });

  const meetsTarget = pessimistic.netIncome >= target;
  byId('kpi-pessimistic').textContent = formatPln(pessimistic.netIncome);
  byId('kpi-pessimistic').style.color = meetsTarget ? 'var(--ok)' : 'var(--bad)';
  byId('kpi-pessimistic-detail').textContent = t(meetsTarget ? 'kpi.aboveTarget' : 'kpi.belowTarget', {
    thousands: formatNumber(target / 1000, 0),
  });

  byId('kpi-investment').textContent = formatPln(results.capex);
  byId('kpi-investment-detail').textContent = t('kpi.perYear', { amount: formatPln(results.depreciation) });

  renderFeedKpi(results);
  byId('kpi-stocking').textContent = formatNumber(results.livestockUnitsPerHa, 2);
}

function renderFeedKpi(results) {
  const tolerance = -0.05;
  const feedOk =
    results.grainBalance >= tolerance && results.hayBalance >= tolerance && results.strawBalance >= tolerance;
  const balances = [
    ['hay', results.hayBalance],
    ['grain', results.grainBalance],
    ['straw', results.strawBalance],
  ];
  if (results.grazingSurplus < tolerance) balances.push(['pasture', results.grazingSurplus]);
  const describe = (items, amount) =>
    items
      .map(([feed, balance]) =>
        t('kpi.feedItem', { feed: t(`feeds.${feed}`), tonnes: formatNumber(amount(balance), 1) })
      )
      .join(', ');
  const grainForSale =
    results.grainSoldTonnes > 0.05
      ? t('kpi.grainForSale', { tonnes: formatNumber(results.grainSoldTonnes, 1) })
      : '';
  const sawdust =
    results.sawdustTonnes > 0.05 ? t('kpi.sawdust', { tonnes: formatNumber(results.sawdustTonnes, 1) }) : '';

  if (feedOk) {
    const need = results.hayNeed + results.grainNeed + results.strawNeed;
    // sold grain is not kept; straw replaced by sawdust counts as covered
    const strawCovered =
      results.strawSupply +
      Math.max(0, -results.strawBalanceBeforeSawdust) * (params.sawdustForStraw ? 1 : 0);
    const supply = results.haySupply + results.grainSupply - results.grainSoldTonnes + strawCovered;
    // without animals there is nothing to feed, so a percentage would mean nothing
    const surplusPercent = Math.max(0, ((supply - need) / Math.max(0.1, need)) * 100);
    byId('kpi-feed').textContent =
      need < MIN_FEED_NEED_FOR_PERCENT
        ? t('kpi.feedNoAnimals')
        : t('kpi.feedSurplus', { percent: formatNumber(surplusPercent, 0) });
    byId('kpi-feed-detail').textContent =
      t('kpi.feedReserve', { items: describe(balances, balance => Math.max(0, balance)) }) +
      sawdust +
      grainForSale;
  } else {
    const shortages = balances.filter(([, balance]) => balance < tolerance);
    const missing = shortages.reduce((sum, [, balance]) => sum - balance, 0);
    byId('kpi-feed').textContent = t('kpi.feedShortage', { tonnes: formatNumber(missing, 1) });
    byId('kpi-feed-detail').textContent =
      t('kpi.feedMissing', { items: describe(shortages, balance => -balance) }) + sawdust;
  }
  byId('kpi-feed').style.color = feedOk ? 'var(--ok)' : 'var(--bad)';
  byId('kpi-feed-detail').title = t('kpi.feedExplanation');
}

// ===== ui/group-summaries.js =====
// One-line summaries next to the titles of the parameter groups, and the derived arable area.

function renderGroupSummaries(results) {

/** Short text per parameter group, e.g. "4 head" for the dairy cows. */
function groupSummaryTexts(results) {
  const none = t('summaries.none');
  const list = items => items.filter(Boolean).join(', ') || none;
  const count = (value, key) => (value ? t(`summaries.${key}`, { count: value }) : '');

    people: t('summaries.people', {
      fullTime: formatNumber(results.availableHours / params.fullTimeHoursPerYear, 2),
      limit: formatNumber(params.weeklyHoursLimit, 0),
    }),
    land:
      t('summaries.land', { farmed: formatNumber(results.farmedHa, 1) }) +
      (params.leasedHa > 0 ? t('summaries.leased', { leased: formatNumber(params.leasedHa, 1) }) : ''),
    dairy: params.dairyCows
      ? t('summaries.dairy', {
          count: params.dairyCows,
          breed: t(`summaries.dairyBreeds.${params.dairyBreed}`),
        })
      : none,
    layingHens: params.layingHens ? t('summaries.head', { count: params.layingHens }) : none,
    poultry: list([
      count(params.broilers, 'broilers'),
      count(params.geese, 'geese'),

// ===== ui/render.js =====
// Re-rendering: every change of the params recomputes the model and redraws all panels.

/** When true, all panels show the pessimistic scenario instead of the current settings. */
let showPessimistic = false;
let pendingFrame = 0;
let slowPanelsTimer = 0;

/** Called after any change of `params`: re-renders once per animation frame and remembers the settings. */
function onParamsChanged() {
  recordParamsChange();
  if (pendingFrame) return;
  pendingFrame = requestAnimationFrame(() => {
    pendingFrame = 0;
    render();
    saveParams();
  });
}

function render() {
  const pessimistic = simulateFarm(applyPessimisticScenario(params));
  const results = showPessimistic ? pessimistic : simulateFarm(params);
  markActivePresets();

  renderKpis(results, pessimistic);
  renderLocation(results);
  renderGroupSummaries(results);
  syncDerivedFields();
  renderWarnings(results, pessimistic);
  renderLandUse(results);
  renderFeedBalance(results);
  renderMoney(results);
  renderHouseholdBudget(results, pessimistic);
  renderCashflow(results);
  renderEnterprises(results);

  // these panels run the model many times, so they wait until the sliders stop moving
  clearTimeout(slowPanelsTimer);
  slowPanelsTimer = setTimeout(() => {
    renderNextSteps();
    renderSensitivity();
    renderRisk();
    renderStartup();
    tintTables();
  }, 220);

  renderLabour(results);
  renderMarket(results);
  renderInfrastructure(results);
  renderInvestments(results);
  renderComparison();
  renderFarmPlan(results);
  renderRotation(results);
  renderNitrogen(results);
  renderCalendar(results);
  tintTables();
}

function renderWarnings(results, pessimistic) {
  const target = computeIncomeTarget(params);
  const warnings = results.warnings.map(warning => ({
    level: warning.level,
    text: t(`warnings.${warning.key}`, warning.values),
  }));
  const add = (atStart, level, key, values) => {
    const warning = { level, text: t(`warnings.${key}`, values) };
    if (atStart) warnings.unshift(warning);
    else warnings.push(warning);
  };

  if (showPessimistic) add(true, 'info', 'viewingPessimistic');
  if (pessimistic.netIncome < target)
    add(true, 'warn', 'pessimisticBelowTarget', {
      result: formatPln(pessimistic.netIncome),
      gap: formatPln(target - pessimistic.netIncome),
      target: formatPln(target),
    });
  else
    add(false, 'ok', 'pessimisticAboveTarget', {
      result: formatPln(pessimistic.netIncome),
      target: formatPln(target),
    });
  if (
    pessimistic.weeklyHoursPeak > params.weeklyHoursLimit &&
    results.weeklyHoursPeak <= params.weeklyHoursLimit
  )
    add(true, 'warn', 'pessimisticPeakOverLimit', {
      peak: formatNumber(pessimistic.weeklyHoursPeak, 0),
      limit: formatNumber(params.weeklyHoursLimit, 0),
    });
  if (!warnings.some(warning => warning.level === 'bad'))
    add(true, 'ok', 'planFits', {
      area: formatNumber(params.ownedHa + params.leasedHa, 1),
      net: formatPln(results.netIncome),
      hours: formatNumber(results.totalHours, 0),
      percent: formatNumber(results.labourUtilisation * 100, 0),
      homeValue: formatPln(results.homeUseTotal),
    });

  byId('warnings').innerHTML = warnings
    .map(warning => `<div class="w ${warning.level}"><span>${escapeHtml(warning.text)}</span></div>`)
    .join('');
}

  ).join('');

/** "20 IV" in Polish, "20 Apr" in English. */
const seasonDate = ([month, day]) =>
  t('location.date', { day, month: messages('months.numerals')[month - 1] });

/** Start and end of the local grazing season, e.g. { start: "20 IV", end: "31 X" }. */
function grazingSeasonDates() {
  const location = locationById(params.location);
  return { start: seasonDate(location.grazingStart), end: seasonDate(location.grazingEnd) };
}

function renderLocation(results) {
  const location = locationById(params.location);
  byId('location-select').value = location.id;

  const [longitude, longitudeMinutes] = location.longitude;
  const pad = minutes => String(minutes).padStart(2, '0');

      latitudeMinutes: pad(latitudeMinutes),
      longitude,
      longitudeMinutes: pad(longitudeMinutes),
    }),

function renderLandUse(results) {
  const totalHa = params.ownedHa + params.leasedHa;
  const segments = [
    { id: 'farmyard', hectares: params.farmyardHa, color: 'var(--color-farmyard)' },
    { id: 'pasture', hectares: params.pastureHa, color: 'var(--color-pasture)' },
    { id: 'meadow', hectares: params.meadowHa, color: 'var(--color-meadow)' },
    { id: 'clover', hectares: results.cloverHa, color: 'var(--color-clover)' },
    { id: 'cereals', hectares: results.cerealHa, color: 'var(--color-cereal)' },
    { id: 'rootCrops', hectares: results.rootCropHa, color: 'var(--color-roots)' },
    { id: 'marketGarden', hectares: params.marketGardenHa, color: 'var(--color-other)' },
  ].filter(segment => segment.hectares > 0.001);
  const barTotal = Math.max(
    totalHa,
    sumBy(segments, segment => segment.hectares)
  );
  const label = segment => escapeHtml(t(`landUse.${segment.id}`));

    element('div', {
      style: `width:${(segment.hectares / barTotal) * 100}%;background:${segment.color}`,
      title: `${label(segment)}: ${hectares(segment)}`,
    });

    element(
      'span',
      {},
      element('i', { style: `background:${segment.color}` }) +

function renderFeedBalance(results) {
  // straw replaced by sawdust or wood chips counts as covered, as in the KPI bar and the model
  const strawReplacedBySawdust = params.sawdustForStraw ? Math.max(0, -results.strawBalanceBeforeSawdust) : 0;
  const rows = [
    {
      id: 'pasture',
      need: results.grazingNeed,
      supply: results.grazingSupply,
      color: 'var(--color-pasture)',
      unit: 'dryMatterTonnes',
    },
    {
      id: 'hay',
      need: results.hayNeed,
      supply: results.haySupply,
      color: 'var(--color-meadow)',
      unit: 'dryMatterTonnes',
    },
    {
      id: 'grain',
      need: results.grainNeed,
      supply: results.grainSupply - results.grainSoldTonnes,
      color: 'var(--color-cereal)',
      unit: 'tonnes',
    },
    {
      id: 'straw',
      need: results.strawNeed,
      supply: results.strawSupply + strawReplacedBySawdust,
      color: 'var(--color-sheep)',
      unit: 'tonnes',
    },
  ];
  const housedDays = 365 - params.grazingDays;
  byId('feed-balance').innerHTML = rows.map(row => feedRowHtml(row, housedDays)).join('');

  const notes = [];
  if (results.hayFromPasture > 0.1)
    notes.push(t('feedBalance.hayFromPasture', { tonnes: formatNumber(results.hayFromPasture, 1) }));
  if (results.grainSoldTonnes > 0.05)
    notes.push(
      t(results.grainNeed < 0.05 ? 'feedBalance.grainSoldAll' : 'feedBalance.grainSold', {
        harvest: formatNumber(results.grainSupply, 1),
        sold: formatNumber(results.grainSoldTonnes, 1),
        reserve: params.feedReserveShare,
      })
    );
  if (results.strawPloughedTonnes > 0.05 && results.grainNeed >= 0.05)
    notes.push(t('feedBalance.strawPloughed', { tonnes: formatNumber(results.strawPloughedTonnes, 1) }));
  if (strawReplacedBySawdust > 0.05)
    notes.push(
      t('feedBalance.sawdustCovers', {
        straw: formatNumber(strawReplacedBySawdust, 1),
        sawdust: formatNumber(results.sawdustTonnes, 1),
      })
    );
  if (results.wheyGrainSaved > 0.005)
    notes.push(t('feedBalance.wheyForPigs', { kg: formatNumber(results.wheyGrainSaved * 1000, 0) }));
  if (results.boughtForageTonnes + results.boughtGrainTonnes > 0.05)
    notes.push(
      t('feedBalance.boughtFeed', {
        forage: formatNumber(results.boughtForageTonnes, 1),
        grain: formatNumber(results.boughtGrainTonnes, 1),
      })
    );
  notes.push(
    t('feedBalance.ownCost', {
      grain: formatNumber(results.grainCostPerTonne, 0),
      forage: formatNumber(results.forageCostPerTonne, 0),
    })
  );
  byId('feed-note').textContent = notes.join(' ');
}

function feedRowHtml(row, housedDays) {
  const scale = Math.max(row.need, row.supply, 0.01);
  const balance = row.supply - row.need;
  const status = balance < -0.05 ? 'bad' : balance < row.need * 0.05 ? 'warn' : 'ok';
  const unit = t(`feedBalance.units.${row.unit}`);
  const amount = value => `${formatNumber(value, 1)} ${unit}`;
  const sign = balance >= 0 ? '+' : '−';
  const bar = (className, widthShare, background) =>
    element('div', {
      class: className,
      style: `width:${widthShare * 100}%` + (background ? `;background:${background}` : ''),
    });
  const label = element(
    'div',
    { class: 'fl' },
    t(`feedBalance.${row.id}.label`) +
      element('span', {}, t(`feedBalance.${row.id}.detail`, { days: housedDays }))
  );
  const numbers = element(
    'div',
    { class: 'fnums' },
    element('span', {}, t('feedBalance.need', { amount: amount(row.need) })) +
      element('span', {}, t('feedBalance.supply', { amount: amount(row.supply) }))
  );
  const bars = element(
    'div',
    { class: 'fbars' },
    bar('fb need', row.need / scale) + bar('fb', row.supply / scale, row.color) + numbers
  );
  const pill = element(
    'div',
    { class: `pill ${status}` },
    sign + t('units.tonnes', { value: formatNumber(Math.abs(balance), 1) })
  );
  return element('div', { class: 'frow' }, label + bars + pill);
}

// Panel "Money": waterfall chart from sales to net income, and tables of revenue, costs,

/** Dashed line carrying the running total from one bar to the next. */
function waterfallConnector(fromX, toX, y) {
  return element('line', {
    x1: fromX,
    x2: toX,
    y1: y,
    y2: y,
    stroke: 'var(--muted)',
    'stroke-dasharray': '3 3',
  });
}

function renderWaterfall(results) {
  const { revenue: sales, subsidies, costs, depreciation, netIncome } = results;
  const chart = { width: 640, height: 250, padLeft: 10, padRight: 10, padTop: 26, padBottom: 36 };
  const top = Math.max(sales + subsidies, 1);
  const bottom = Math.min(0, netIncome);
  const plotHeight = chart.height - chart.padTop - chart.padBottom;
  const y = value => chart.padTop + ((top - value) / (top - bottom)) * plotHeight;

  // each bar runs from `from` to `to`; costs and depreciation show their amount as negative
  const bars = [
    { id: 'sales', from: 0, to: sales, color: 'var(--accent)' },
    { id: 'subsidies', from: sales, to: sales + subsidies, color: 'var(--color-fields)' },
    {
      id: 'costs',
      from: sales + subsidies,
      to: sales + subsidies - costs,
      value: -costs,
      color: 'var(--bad)',
    },
    {
      id: 'depreciation',
      from: sales + subsidies - costs,
      to: netIncome,
      value: -depreciation,
      color: 'var(--warn)',
    },
    { id: 'net', from: 0, to: netIncome, color: netIncome >= 0 ? 'var(--ok)' : 'var(--bad)' },
  ];
  const slot = (chart.width - chart.padLeft - chart.padRight) / bars.length;
  let svg = horizontalLine(chart, y(0), { class: 'grid' });
  bars.forEach((bar, index) => {
    if (bar.value === undefined) bar.value = bar.to - bar.from;
    const label = t(`money.waterfall.${bar.id}`);
    const x = chart.padLeft + index * slot + slot * 0.18;
    const width = slot * 0.64;
    const yTop = y(Math.max(bar.from, bar.to));
    const yBottom = y(Math.min(bar.from, bar.to));
    const thousands = t('units.thousandsPln', { value: formatNumber(Math.abs(bar.value) / 1000, 0) });
    const isLast = index === bars.length - 1;

    svg += withTooltip(
      'rect',
      { x, y: yTop, width, height: Math.max(1, yBottom - yTop), fill: bar.color, rx: 2 },
      `${label}: ${formatPlnExact(bar.value)}`
    );
    if (!isLast) svg += waterfallConnector(x + width, x + slot, y(bar.to));
    svg += element(
      'text',
      { x: x + width / 2, y: yTop - 7, 'text-anchor': 'middle', 'font-size': 13, class: 'num' },
      (bar.value < 0 ? '−' : '') + thousands
    );
    svg += axisText(x + width / 2, chart.height - 12, label, 'middle');
  });
  byId('waterfall').innerHTML = svg;
}

/**
 * Table with one row per item above 0.5 zł and a total row.
 * @param {object} table
 * @param {string} table.header - first column title
 * @param {string} table.valueHeader - amount column title
 * @param {object} table.items - amount per item id
 * @param {(item: string) => string} table.label
 * @param {(item: string) => string} [table.detail] - small text under the label
 * @param {(item: string) => ?string} [table.rowClass] - class of the label cell
 * @param {string} [table.extraRows] - rows added before the total
 * @param {string} table.totalLabel
 * @param {number} table.total
 */
function itemsTableHtml(table) {
  const header = tableHeader([table.header, table.valueHeader]);
  const rows = Object.entries(table.items)
    .filter(([, amount]) => amount > 0.5)
    .map(([item, amount]) => {
      const detail = table.detail && table.detail(item);
      const detailHtml = detail ? '<br>' + element('span', { class: 'small muted' }, detail) : '';
      const rowAttributes = table.rowClass ? { class: table.rowClass(item) } : {};
      return tableRow([
        cell(table.label(item) + detailHtml, rowAttributes),
        numberCell(formatPlnExact(amount)),
      ]);
    });
  const totalRow = tableRow([cell(table.totalLabel), numberCell(formatPlnExact(table.total))], {
    class: 'tot',
  });
  return header + tableBody([...rows, table.extraRows || '', totalRow]);
}

function renderSubsidiesTable(results) {

// ===== ui/panels/household.js =====
// Panel "Household budget": family spending, child benefit, safety margin and how the farm's
// result compares with what the family needs.

function renderHouseholdBudget(results, pessimistic) {
  const budget = results.householdBudget;
  const perMonth = amount => t('household.perMonth', { amount: formatPlnExact(amount) });
  const rows = [
    [
      t('household.spending'),
      budget.spending,
      t('household.spendingDetail', { amount: formatNumber(params.householdMonthlySpending, 0) }),
    ],
    [t('household.margin', { percent: params.householdSafetyMargin }), budget.margin, ''],
    [t('household.savings'), budget.savings, ''],
    [
      t('household.childBenefit'),
      -budget.childBenefit,
      t('household.childBenefitDetail', {
        children: params.childBenefitChildren,
        amount: CHILD_BENEFIT_PER_MONTH,
      }),
    ],
  ];

  const amountCell = (amount, isNegative = amount < 0) => numberCell(formatPlnExact(amount), isNegative);
  const noteCell = note => cell(note, { class: 'small muted' });
  const summaryRow = (label, amount, attributes = {}) =>
    tableRow([cell(label), amountCell(amount, false), noteCell(perMonth(amount / 12))], attributes);

  const header = tableHeader([t('household.item'), t('money.perYear'), ''], index => index === 1);
  const body = [
    ...rows.map(([label, amount, note]) => tableRow([cell(label), amountCell(amount), noteCell(note)])),
    summaryRow(t('household.required'), budget.required, { class: 'tot' }),
    summaryRow(t('household.withoutChildBenefit'), budget.withoutChildBenefit),
    summaryRow(t('household.realisticResult'), results.netIncome),
    tableRow([
      cell(t('household.pessimisticResult')),
      amountCell(pessimistic.netIncome, pessimistic.netIncome < budget.required),
      noteCell(perMonth(pessimistic.netIncome / 12)),
    ]),
  ];
  byId('household-table').innerHTML = header + tableBody(body);

  byId('household-note').textContent = householdNote(results, pessimistic);
}

/** Whether the pessimistic result covers the family's needs, and how the target is set. */
function householdNote(results, pessimistic) {
  const budget = results.householdBudget;
  const surplus = pessimistic.netIncome - budget.required;
  const coverage =
    surplus >= 0
      ? t('household.surplus', { amount: formatPln(surplus) })
      : t('household.shortfall', { amount: formatPln(-surplus) });
  const yearsOfSpending =
    budget.spending > 0
      ? formatNumber((pessimistic.netIncome + budget.childBenefit) / budget.spending, 1)
      : '–';
  const summary = t('household.summary', {
    ratio: yearsOfSpending,
    depreciation: formatPln(results.depreciation),
  });
  const target = t(
    params.targetFromHouseholdBudget ? 'household.targetFromBudget' : 'household.targetSetDirectly'
  );
  return [coverage, summary, target].join(' ');
}

// ===== ui/panels/labour.js =====
// Panel "Working time": hours per month stacked by activity group against the family's time
// and the weekly limit; a click on a month shows an average day of that month split into the
// morning, the day and the evening; and a table of hours per activity.

const LABOUR_CHART = { width: 640, height: 270, padLeft: 44, padRight: 10, padTop: 14, padBottom: 30 };

/** Month shown as an average day (0–11), or null for the busiest month. */
let labourDayMonth = null;
/** Activities listed for each time of day. */
const DAY_PLAN_TOP_ACTIVITIES = 4;
/** Jobs shorter than this a day (h) are not listed. */
const MIN_LISTED_DAILY_HOURS = 0.05;

function renderLabour(results) {
  renderLabourChart(results);
  renderLabourDay(results);

  byId('labour-legend').innerHTML = LABOUR_GROUPS.map(
    group => `<span><i style="background:${group.color}"></i>${t(`labourGroups.${group.id}`)}</span>`
  ).join('');

  byId('labour-summary').textContent = t('labour.summary', {
    average: formatNumber(results.weeklyHoursAverage, 0),
    daily: formatNumber(results.totalHours / 365, 1),
    peak: formatNumber(results.weeklyHoursPeak, 0),
    available: formatNumber(results.availableHours / 52, 0),
  });

  renderLabourTable(results);
}

function renderLabourChart(results) {
  const chart = LABOUR_CHART;
  const familyHoursPerMonth = results.availableHours / 12;
  const limitPerMonth = params.weeklyHoursLimit * WEEKS_PER_MONTH;
  const max = Math.max(results.peakMonthHours, familyHoursPerMonth, limitPerMonth, 1);
  const step = niceAxisStep(max);
  const top = Math.ceil(max / step) * step;
  const y = hours => chart.padTop + (1 - hours / top) * (chart.height - chart.padTop - chart.padBottom);
  const right = chart.width - chart.padRight;
  const monthLabels = messages('months.numerals');

  let svg = '';
  for (let hours = 0; hours <= top + 1e-9; hours += step) {
    svg += horizontalLine(chart, y(hours), { class: 'grid' });
    svg += axisText(chart.padLeft - 6, y(hours) + 4, formatNumber(hours, 0), 'end');
  }

  const slot = (chart.width - chart.padLeft - chart.padRight) / 12;
  const selectedMonth = shownDayMonth(results);
  results.monthlyHours.forEach((month, index) => {
    const x = chart.padLeft + index * slot + slot * 0.16;
    const width = slot * 0.68;
    let stacked = 0;
    let bars = '';
    for (const group of LABOUR_GROUPS) {
      const hours = month[group.id];
      if (hours <= 0) continue;
      const tooltip = t('labour.barTooltip', {
        month: monthLabels[index],
        group: t(`labourGroups.${group.id}`),
        hours: formatNumber(hours, 0),
      });
      const bar = {
        x,
        y: y(stacked + hours),
        width,
        height: Math.max(0.5, y(stacked) - y(stacked + hours)),
        fill: group.color,
      };
      bars += withTooltip('rect', bar, tooltip);
      stacked += hours;
    }
    // the whole column is clickable, also above short bars
    const hitArea = {
      x: x - slot * 0.16,
      y: chart.padTop,
      width: slot,
      height: y(0) - chart.padTop,
      fill: 'transparent',
    };
    const label = element(
      'text',
      {
        x: x + width / 2,
        y: chart.height - 10,
        'text-anchor': 'middle',
        'font-size': 11,
        fill: index === selectedMonth ? 'var(--accent)' : 'var(--muted)',
        'font-weight': index === selectedMonth ? 700 : 400,
      },
      monthLabels[index]
    );
    svg += element('g', { 'data-month': index }, element('rect', hitArea) + bars + label);
  });

  if (familyHoursPerMonth > 0) {
    const familyY = y(familyHoursPerMonth);
    const label = t('labour.familyTime', { hours: formatNumber(familyHoursPerMonth, 0) });
    svg += horizontalLine(chart, familyY, {
      stroke: 'var(--ink)',
      'stroke-width': 1.5,
      'stroke-dasharray': '6 4',
    });
    svg += element('text', { x: right, y: familyY - 5, 'text-anchor': 'end', 'font-size': 12 }, label);
  } else {
    svg += axisText(right, chart.padTop + 12, t('labour.axisLabel'), 'end');
  }

  const limitY = y(limitPerMonth);
  const limitLabel = t('labour.yourLimit', { hours: formatNumber(params.weeklyHoursLimit, 0) });
  svg += horizontalLine(chart, limitY, {
    stroke: 'var(--bad)',
    'stroke-width': 1.5,
    'stroke-dasharray': '2 4',
  });
  svg += element(
    'text',
    { x: chart.padLeft + 6, y: limitY - 5, 'font-size': 12, fill: 'var(--bad)' },
    limitLabel
  );

  byId('labour-chart').innerHTML = svg;
}

/** The month whose average day is shown: the clicked one, else the busiest. */
function shownDayMonth(results) {
  if (labourDayMonth !== null) return labourDayMonth;
  const totals = results.monthlyHours.map(month => month.total);
  return totals.indexOf(Math.max(...totals));
}

/** An average day of the chosen month: a bar of morning, day and evening and the main jobs. */
function renderLabourDay(results) {
  const month = shownDayMonth(results);
  const day = dailyHoursByTimeOfDay(results.hoursByActivity, month, params);
  if (day.total <= 0.05) {
    byId('labour-day').innerHTML = '';
    return;
  }
  const monthName = messages('months.inText')[month];
  const segment = time => {
    const hours = day.byTime[time];
    const width = (hours / day.total) * 100;
    return width > 0.5
      ? element(
          'span',
          { class: time, style: `width:${width}%` },
          width > 9 ? t('units.hours', { value: formatNumber(hours, 1) }) : ''
        )
      : '';
  };
  const column = time => {
    const jobs = Object.entries(day.activities[time])
      .filter(([, hours]) => hours >= MIN_LISTED_DAILY_HOURS)
      .sort((a, b) => b[1] - a[1])
      .slice(0, DAY_PLAN_TOP_ACTIVITIES)
      .map(
        ([activity, hours]) =>
          `${t(`labour.activities.${activity}`)} ${t('units.hours', { value: formatNumber(hours, 1) })}`
      );
    return (
      '<div>' +
      `<i class="${time}" style="background:var(--day-${time})"></i>` +
      element(
        'b',
        {},
        `${t(`labour.timesOfDay.${time}`)}: ${t('units.hours', { value: formatNumber(day.byTime[time], 1) })}`
      ) +
      element('div', { class: 'muted' }, escapeHtml(jobs.join(' · ') || t('labour.nothing'))) +
      '</div>'
    );
  };
  byId('labour-day').innerHTML =
    element('b', {}, t('labour.dayTitle', { month: monthName, hours: formatNumber(day.total, 1) })) +
    element('div', { class: 'day-bar' }, TIMES_OF_DAY.map(segment).join('')) +
    element('div', { class: 'day-times' }, TIMES_OF_DAY.map(column).join('')) +
    element('p', { class: 'small muted' }, t('labour.dayNote'));
}

/** A click on a month of the labour chart shows an average day of that month. */
function bindLabourChart() {
  byId('labour-chart').addEventListener('click', event => {
    const column = event.target.closest('[data-month]');
    if (!column) return;
    labourDayMonth = +column.dataset.month;
    render();
  });
}

function renderLabourTable(results) {
  const activities = Object.entries(results.hoursByActivity)
    .filter(([, hours]) => hours > 0.5)
    .sort((a, b) => b[1] - a[1]);
  const columns = ['activity', 'perYear', 'perWeek', 'perDay', 'share'];
  const percent = value => t('units.percent', { value });

  const rows = activities.map(
    ([activity, hours]) =>
      `<tr><td>${t(`labour.activities.${activity}`)}</td>` +
      numberCell(formatNumber(hours, 0)) +
      numberCell(formatNumber(hours / 52, 1)) +
      numberCell(formatNumber(hours / 365, 1)) +
      numberCell(percent(formatNumber((hours / results.totalHours) * 100, 0))) +
      '</tr>'
  );
  const totalRow =
    `<tr class="tot"><td>${t('money.total')}</td>` +
    numberCell(formatNumber(results.totalHours, 0)) +
    numberCell(formatNumber(results.weeklyHoursAverage, 1)) +
    numberCell(formatNumber(results.totalHours / 365, 1)) +
    numberCell(percent(100)) +
    '</tr>';

  const header = tableHeader(columns.map(column => t(`labour.columns.${column}`)));
  byId('labour-table').innerHTML = `${header}<tbody>${rows.join('')}${totalRow}</tbody>`;
}

// ===== ui/panels/market.js =====
// Panel "What has to be sold": quantities the farm must find buyers for, how often (a day, a
// week, a year) and in which months. Texts: locales → market.

const MARKET_COLUMNS = ['product', 'amount', 'per', 'when'];

function renderMarket(results) {
  const { market } = results;
  const rows = [];
  const n = formatNumber;
  const add = (condition, id, amount, unit, per, values = {}) => {
    if (!condition) return;
    rows.push(
      tableRow([
        cell(escapeHtml(t(`market.products.${id}`, values))),
        numberCell(t(`market.units.${unit}`, { value: amount })),
        cell(t(`market.per.${per}`), { class: 'small' }),
        cell(t(`market.seasons.${id}`), { class: 'small muted' }),
      ])
    );
  };
  const trips = results.slaughter.trips;

  add(results.freshMilkSold > 0, 'milk', n(market.milkPerDay, 0), 'litres', 'day');
  add(results.goatMilkSold > 0, 'goatMilk', n(market.goatMilkPerDay, 1), 'litres', 'day');
  add(results.cheeseSold > 0, 'cheese', n(market.cheesePerWeek, 1), 'kg', 'week');
  add(results.goatCheeseSold > 0, 'goatCheese', n(results.goatCheeseSold / 52, 1), 'kg', 'week');
  add(results.curdSold > 0, 'curd', n(market.curdPerWeek, 1), 'kg', 'week');
  add(results.creamSold > 0, 'cream', n(market.creamPerWeek, 1), 'kg', 'week');
  add(results.butterSold > 0, 'butter', n(market.butterPerWeek, 1), 'kg', 'week');
  add(results.eggsSold > 0, 'eggs', n(market.eggsPerWeek / 10, 0), 'boxes', 'week');
  add(results.lambsSoldLive > 0.05, 'lambsLive', n(results.lambsSoldLive, 0), 'pieces', 'year');
  add(results.lambMeatSoldKg > 0, 'lambMeat', n(results.lambMeatSoldKg, 0), 'kg', 'year', {
    lambs: n(results.lambsSoldAsMeat, 0),
    trips: trips.sheep,
  });
  add(results.cockerels > 0, 'cockerels', n(results.cockerels, 0), 'pieces', 'year');
  add(params.layingHens > 0, 'oldHens', n(results.henReplacements, 0), 'pieces', 'year');
  add(results.calvesSold > 0, 'calves', n(results.calvesSold, 0), 'pieces', 'year');
  add(
    params.broilers > 0,
    'broilers',
    n(results.revenueItems.broilers / (params.broilerCarcassKg * params.broilerPricePerKg), 0),
    'pieces',
    'year'
  );
  add(params.geese > 0, 'geese', n(results.geeseRaised, 0), 'pieces', 'year');
  add(params.ducks > 0, 'ducks', n(results.ducksRaised, 0), 'pieces', 'year');
  add(
    params.turkeys > 0,
    'turkeys',
    n(results.revenueItems.turkeys / (params.turkeyCarcassKg * params.turkeyPricePerKg), 0),
    'pieces',
    'year'
  );
  add(
    params.guineaFowl > 0,
    'guineaFowl',
    n(results.revenueItems.guineaFowl / (params.guineaFowlCarcassKg * params.guineaFowlPricePerKg), 0),
    'pieces',
    'year'
  );
  add(
    params.rabbits > 0,
    'rabbits',
    n(results.revenueItems.rabbits / params.rabbitPrice, 0),
    'pieces',
    'year'
  );
  add(results.porkSoldKg > 0, 'pork', n(results.porkSoldKg, 0), 'kg', 'year', {
    pigs: params.pigs,
    trips: trips.pigs,
  });
  add(results.kidsSold > 0, 'kids', n(results.kidsSold, 0), 'pieces', 'year');
  add(results.weanersSold > 0.05, 'weaners', n(results.weanersSold, 0), 'pieces', 'year');
  add(results.beefBoxKg > 0, 'beefBoxes', n(results.beefBoxKg, 0), 'kg', 'year', { trips: trips.beefCattle });
  add(results.processedValue > 0, 'processedGoods', n(results.processedKg, 0), 'kg', 'year', {
    parcels: n(results.parcels, 0),
  });
  add(results.revenueItems.fruit > 0, 'fruit', n(results.fruitSoldTonnes, 1), 'tonnes', 'year');
  add(
    results.revenueItems.mushrooms > 0,
    'mushrooms',
    n(results.revenueItems.mushrooms / params.mushroomPrice, 0),
    'kg',
    'year'
  );
  add(results.revenueItems.vegetables > 0, 'vegetables', n(market.csaShares, 0), 'families', 'season');
  add(results.revenueItems.honey > 0, 'honey', n(market.honeyKg, 0), 'kg', 'year');
  add(results.revenueItems.horseRiding > 0, 'horseRiding', n(params.ridesPerYear, 0), 'hours', 'year');
  add(results.revenueItems.grainSales > 0, 'grain', n(results.grainSoldTonnes, 1), 'tonnes', 'year');
  rows.push(
    tableRow(
      [
        cell(t('market.products.directSales')),
        numberCell(formatPln(market.directSalesRevenue)),
