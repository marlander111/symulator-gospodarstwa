up","honey harvest (rapeseed)","honey harvest","honey harvest","feeding, varroa treatment","feeding","","","winter treatment"]},"processing":{"label":"Processing","months":["winter shipping","","","","","","","","Christmas orders","smoking, goose breasts","smoking, shipping","Christmas shipping"]},"catchCrops":{"label":"Catch crops","months":["overwintering, leave until 15 Feb","from 15 Feb sheep grazing or mulching","ploughing in before sowing oats","undersowing clover in the oats","","","","sowing after harvest","sowing by 1 October","sheep grazing the catch crop","",""]},"paperwork":{"label":"Paperwork","months":["KRUS (by the end of March), plan","contract with the certification body","payment application (usually from 15 March)","","","KRUS","","","KRUS, agricultural tax","payment advances from 16 Oct","agricultural tax","KRUS, farm retail tax return"]},"horses":{"label":"Horses","months":["farrier, hay","","hoof care, vaccinations","onto the pasture gradually","rides, pasture","rides, hay","rides, holidays","rides, holidays","rides","farrier, worming","into the stable or shelter for winter","hay, mucking out"]}}},"app":{"title":"Family Farm Simulator"},"export":{"saveSettings":"Save settings to a file","loadSettings":"Load from a file","pdfReport":"PDF report","savePdf":"Save PDF","unavailable":"Saving files is not available in this view (open the app in claude.ai).","saved":"File saved.","cancelled":"Saving cancelled.","failed":"The file could not be saved.","loaded":"Loaded {count} settings{name}.","loadedName":" (“{name}”)","notSettingsFile":"This is not a simulator settings file.","customSettings":"Custom settings","fallbackFileName":"variant","settingsFilePrefix":"simulator","reportFilePrefix":"report","financeData":"Financial data (JSON)","financeTitle":"Financial results, monthly cash flow, investments and start-up years in a JSON file, e.g. for a budgeting app.","financeFilePrefix":"finance"},"pdf":{"sections":{"summary":{"choice":"Summary","title":"Summary"},"money":{"choice":"Money","title":"Money"},"cashflow":{"choice":"Cash flow","title":"Cash flow"},"enterprises":{"choice":"Enterprises","title":"Which enterprise pays"},"nextSteps":{"choice":"Next steps","title":"Next steps: what to add"},"labour":{"choice":"Working time","title":"Working time over the year"},"market":{"choice":"What to sell","title":"What needs to be sold"},"investments":{"choice":"Investments","title":"Investments"},"rotation":{"choice":"Crop rotation","title":"Crop rotation"},"household":{"choice":"Household budget","title":"Household budget"}},"variant":"Variant: {name}","subtitle":"{date} · {farmedHa} ha farmed · {ownedHa} ha owned{leased} · assumptions: a year in full operation","leased":" + {leasedHa} ha leased","animals":{"dairyCows":"{count} cows","sucklerCows":"{count} suckler cows","layingHens":"{count} hens","broilers":"{count} broilers","geese":"{count} geese","ducks":"{count} ducks","turkeys":"{count} turkeys","guineaFowl":"{count} guinea fowl","sheep":"{count} ewes","goats":"{count} goats","pigs":"{count} pigs","horses":"{count} horses","rabbits":"{count} rabbit does","beehives":"{count} hives"},"animalsAndCrops":"Animals and crops: {animals}. Pasture {pastureHa} ha, meadow {meadowHa} ha, arable land {arableHa} ha (cereals {cerealShare}%).","summary":{"netIncome":"Net income / year","monthlyAverage":"Monthly average","revenue":"Revenue (sales + payments)","subsidies":"of which payments","costs":"Costs incl. depreciation","pessimistic":"Pessimistic scenario","hours":"Work / year","hoursValue":"{hours} h (avg {perWeek} h/week)","peakMonth":"Busiest month (pessim.)","peakMonthValue":"{peak} h/week (limit {limit})","investments":"Investments","investmentsValue":"{capex} ({depreciation} a year)","feed":"Feed","feedValue":"hay {hay} t, grain {grain} t, straw {straw} t","stocking":"Stocking rate","stockingValue":"{value} LU/ha"},"cashflowChart":"Monthly result after paying the household (PLN)","labourChart":"Hours per month (whole family)","disclaimer":"Rough estimates based on the simulator’s assumptions; prices, yields and work norms are worth checking locally. Payments and regulations change every year.","footer":"Family Farm Simulator · {variant} · page {page} of {pages}"},"page":{"header":{"eyebrow":"Planner for money, work and feed of a family farm","lead":"Move the sliders: the feed balance, working time and money are recalculated straight away."},"theme":{"label":"Theme:","auto":"Automatic","light":"Light","dark":"Dark","groupLabel":"Colour theme","eco":"Eco"},"kpi":{"netIncome":"Income / year","hours":"Work / year","revenue":"Revenue / year","pessimistic":"Pessimistic","investment":"Investments","feed":"Feed","stocking":"Stocking rate","stockingDetail":"LU per ha farmed","regionLabel":"Live result","pessimisticTitle":"Pessimistic scenario"},"presets":{"variant":"Variant","assumptions":"Assumptions","savedVariants":"My variants","saveCurrent":"Save current settings","savedLocally":"Saved only in this browser.","exportAndReport":"Save and report","namePlaceholder":"Name, e.g. Plan 2027","nameLabel":"Variant name","philosophies":"Philosophies"},"results":{"title":"The result","intro":"The balance is calculated for a year in full operation (year 4, see “How to start”)."},"landAndFeed":{"title":"Land and feed","intro":"Need (outline) and production from your own fields (fill)."},"farmPlan":{"title":"Farm layout","intro":"A diagram, not a map: the field proportions change with the sliders. Choose the month, how often you move the cows and after how many days they return to the same paddock; the number of paddocks is recalculated automatically. You choose the rotation year in the “Crop rotation” block below. Click a field to see what is happening on it.","notes":{"buildings":"<h3>Buildings: cheap and light<\/h3><ul><li>Old cowshed: milking parlour, dairy room, cheese room (they need a separate, washable room).<\/li><li>A frame shelter clad with OSB or boards, open to the east, on deep litter: cows and heifers.<\/li><li>A second shelter or an extension: sheep and goats, a night pen against wolves.<\/li><li>Mobile henhouses on skids, pulled by a C-360 tractor; in winter they stand by the farmyard.<\/li><\/ul>","waterAndFencing":"<h3>Water and fencing<\/h3><ul><li>A PE pipe along the laneway with quick couplings every 2–3 paddocks, a portable trough.<\/li><li>Perimeter: 2–3 permanent wires (4–5 for sheep), polywire on portable posts inside.<\/li><li>An energiser with enough spare power, earthed at several points.<\/li><\/ul>","grazingOrderTitle":"Order on the pasture","buildingsTitle":"Buildings: cheap and light","waterAndFencingTitle":"Water and fencing"},"mapLabel":"Farm layout diagram"},"rotation":{"title":"Crop rotation on arable land","intro":"On an organic farm nitrogen comes from clover and manure, so part of the arable land is always under clover with grasses. You choose the number of fields below (or in the “Land” group), the cereal share with the slider. Click a year to see it on the plan.","seedsTitle":"Seed rates","seedsIntro":"Seed for the fields in the rotation year chosen in the table above (approximate rates for organic seed; the supplier gives the exact ones)."},"catchCrops":{"title":"Catch crops and eco-schemes","intro":"A catch crop is green cover between two main crops: it protects the soil in winter, holds nitrogen, feeds soil life and gives the sheep forage. In the “Carbon farming” eco-scheme a winter catch crop or undersowing earns 5 points/ha, about 500 PLN/ha. You switch them on with the buttons by the rotation or in the “Payments” group.","requirements":"Practice requirements (ARiMR, PODR 2025): at least 2 species, not cereals only; a winter catch crop sown by 1 Oct and kept until 15 Feb (mulching allowed after 15 Nov); an undersown legume kept until the next crop is sown or at least 8 weeks after harvest; no plant protection products. On an organic farm, organic seed (or permission for non-organic). Seed rates are approximate: check with the seed supplier. Whether the eco-scheme can be combined with the organic payment on the same plot, confirm with the agricultural advisory centre (ODR) before applying.","grainLegumeMixtures":"In IUNG trials cereal-pulse mixtures gave about 2.6–4.9 t/ha and 16–19% protein (peas with wheat). Pulses make up 40–50% of the seed. It is worth supplementing the hens’ grain with whey from the cheese room (protein) and green forage from the range.","mixesTitle":"Mixtures, seed rates and eco-scheme requirements","brownNote":"Gabe Brown (Brown’s Ranch, North Dakota) sows mixtures of 6–15 species: grasses, legumes, brassicas and flowering plants, and grazes them with cattle. The different roots feed soil life, the legumes add nitrogen and the animals leave manure. In Poland such mixtures can be put together from domestic seed suppliers (rye, oats, vetch, field pea, phacelia, buckwheat, mustard, oilseed radish, clovers, sunflower)."},"money":{"title":"Money","intro":"From sales to the net result.","chartLabel":"Chart: sales, payments, costs, depreciation and result"},"cashflow":{"title":"Cash flow","intro":"A year in full operation, month by month. Without investments, with the household payments.","chartLabel":"Chart: monthly result and account balance"},"enterprises":{"title":"Which enterprise pays","intro":"Feed from the farm’s own fields is valued at its growing cost.","colourNote":"Colours by PLN/ha and PLN/h: from red (weakest) to green (best). Green per hectare is worth scaling up when land is short; green per hour when hands are short. In other tables, a stronger red by costs and hours means more.","perHourNote":"PLN per hour is the enterprise’s surplus divided by its hours (including selling). Food taken for the household is not counted as sales; its value is in the “Food for the household” table. The tractor, machinery and cold store are in the “Shared” row."},"nextSteps":{"title":"Next steps: what to add","intro":"Each step is recalculated with your current settings."},"sensitivity":{"title":"What changes the result most","intro":"Each assumption separately 20% down and up.","chartLabel":"Chart of how sensitive the result is to the assumptions"},"labour":{"title":"Working time over the year","intro":"Hours per month by activity.","chartLabel":"Chart of working hours by month"},"market":{"title":"What needs to be sold","intro":"How much has to be sold, how often and when. Without regular customers none of these numbers will work."},"investments":{"title":"Investments","intro":"What is still missing for the chosen enterprises, spread over the years of use (depreciation). Other investments at the end.","editNote":"The amounts are defaults. Enter your own (e.g. from a quote, or 0 if you already have something) and press Enter: it is converted to a unit price and the slider in the “Investments” group moves. It also works the other way: the slider changes the amount here."},"household":{"title":"Household budget","intro":"Whether the farm’s result is enough to live on."},"comparison":{"title":"Comparing variants","intro":"Each variant is recalculated with your other settings, once with realistic assumptions and once with cautious ones (lower prices and yields, more hours)."},"calendar":{"title":"The farming year","intro":"Calving and lambing in early spring, breeding in summer, hay in June, selling geese and cheese in autumn and before Christmas. The grazing season follows the location chosen in the header.","note":"Work is shown only for the enterprises in your settings. Click a month to see it on the plan."},"stages":{"title":"How to start: building up over 3–4 years","intro":"Each enterprise grows only once the previous one is selling. Choose a year to see roughly what the farm brings while it is being built up.","method":"Assumptions: in year 1 part of the herds and areas (e.g. 3/4 of the cows, half of the hens, no pigs and no products), sales about 75% of the plan and about 15% more hours while learning; in year 2 about 88% of the sales, in year 3 about 96%. Investments are counted for what the farm has in that year."},"regulations":{"title":"Law and formalities","intro":"A summary of the most important matters. Regulations change, so before each start confirm the details with the county veterinary inspectorate (PIW), with ARiMR and with the agricultural advisory centre (ODR).","notes":{"subsidies":"<h3>ARiMR and payments<\/h3><ul><li>A producer number and a herd registration; cattle, sheep, goats and pigs ear-tagged and registered; register the poultry flock too.<\/li><li>Leasing: payments, including the organic one, go to the tenant who actually farms the land. For the organic payment the lease should cover the whole commitment period. Put the lease in writing.<\/li><li>A payment application every year. The sheep payment is counted from 10 head, goats from 5 (check the thresholds).<\/li><li>Rates in the planner: direct and livestock payments are 2026 estimates (advance rates), animal welfare 2024, areas with natural constraints 2026, the organic payment 2023 estimates.<\/li><\/ul>","organic":"<h3>Organic farming<\/h3><ul><li>A contract with a certification body and a conversion period (the payment is also available during conversion).<\/li><li>Hens: at most 6 hens per m² of henhouse, outdoor range, no synthetic amino acids, up to 5% non-organic feed.<\/li><li>Organic broilers: slaughter at the earliest on day 81, or slow-growing breeds.<\/li><\/ul>","milkEggsCheese":"<h3>Milk, eggs, cheese<\/h3><ul><li>Raw milk and eggs: direct sales; notify the county veterinary officer at least 30 days before starting and get a veterinary number.<\/li><li>Eggs at a market: marking with the producer code is usually required (confirm with PIW).<\/li><li>Lamb: slaughter in an approved abattoir (a farm or service abattoir, in your own or a neighbouring county), meat with a health mark. The farm retail limit for red meat was 2,300 kg a year (2016 regulation). Whether you can sell whole carcasses or only after cutting in your own farm retail kitchen, confirm with PIW.<\/li><li>Cheese: farm retail (RHD), quantity limits are set by the veterinary officer’s decision. Farm retail revenue is tax-free up to 100,000 PLN, above that a 2% flat tax.<\/li><li>Do not advertise that milk “heals”: health claims on food are strictly regulated in the EU.<\/li><\/ul>","poultryAndPigs":"<h3>Meat poultry and pigs<\/h3><ul><li>Poultry and rabbits slaughtered on the farm are sold under direct sales (notify the county veterinary officer). To make products from them you also need farm retail registration.<\/li><li>Sheep, goat and pig meat for farm retail products must come from an abattoir; meat from slaughter for own use is not allowed.<\/li><li>Keep turkeys apart from hens (histomoniasis).<\/li><li>Hatching for your own flock does not require registering a hatchery; selling chicks or hatching eggs does (county veterinary officer).<\/li><li>A winter tunnel during a poultry housing order: all openings covered with netting, feed and water inside.<\/li><li>Pigs: check the African swine fever zone with PIW. Biosecurity rules apply, and feeding kitchen scraps is prohibited.<\/li><li>Bird flu: during risk periods poultry must be housed, so mobile henhouses need a netted or closable option.<\/li><\/ul>","produceBeesEducation":"<h3>Vegetables, bees, activities for children<\/h3><ul><li>Vegetables sold directly: ask the county sanitary-epidemiological station about registration.<\/li><li>An apiary must be registered with the county veterinary officer.<\/li><li>Cultivated mushrooms and juice from your own fruit: registration with the sanitary inspectorate (farm retail for plant food).<\/li><li>Activities for children (an educational farm): regular paid activities usually require a business registration (CEIDG), occasional ones may be unregistered; extra liability insurance is needed.<\/li><\/ul>","processingAndShipping":"<h3>Products and shipping (farm retail)<\/h3><ul><li>Farm retail allows selling to consumers at a distance, including by mail order, as long as safe conditions, including temperature, are kept in transport. Selling through intermediaries is not allowed.<\/li><li>Farm retail quantity limits apply only to supplies to shops and restaurants (e.g. meat products 1,400 kg a year). Sales to consumers have no quantity limit.<\/li><li>Tax relief: at least 50% of the ingredients (excluding water) from your own farm; revenue up to 100,000 PLN is tax-free, above that a 2% flat tax.<\/li><li>In 2026 the ministry announced the removal of territorial restrictions and higher limits; the draft was under consultation. Check what has come into force before starting.<\/li><\/ul>","wolvesBuildingsManure":"<h3>Wolves, buildings, manure<\/h3><ul><li>Wolf damage is compensated by the Regional Directorate for Environmental Protection; report it straight away, and shut sheep and goats in at night.<\/li><li>Shelters: ask the county office whether a notification is enough or a building permit is needed.<\/li><li>Manure and deep litter: storage according to the nitrates action programme (ask at the ODR).<\/li><\/ul>","taxesAndInsurance":"<h3>Taxes and insurance<\/h3><ul><li>Selling unprocessed products (raw milk, eggs, live animals) is usually agricultural activity; products under farm retail as above. Confirm with an accountant.<\/li><li>KRUS, building insurance and the farmer’s liability insurance are in the planner’s fixed costs.<\/li><\/ul>"}},"assumptions":{"title":"Assumptions and sources","method":"<h3>How it is calculated<\/h3><ul> <li>A cow eats about 5.5 t of dry matter a year (Jersey), 6 t (dual-purpose) or 6.6 t (Holstein), a heifer 3.3 t, a ewe with lambs 0.8 t, a goat 0.6 t.<\/li> <li>Hen: feed ad lib, about 90% of it the farm’s own grain and pulses, the rest minerals and shell grit (bought).<\/li> <li>Hay: 75% of the meadow yield goes to hay, 25% is regrowth for grazing; 70% of the pasture surplus can be cut.<\/li> <li>Grain and hay from your own fields are valued at their growing cost, without rent for the land. Grain fed to hens could be sold for more, so what the eggs “earn” also includes that profit.<\/li> <li>LU: approximate conversion factors (cow 1, heifer 0.6, sheep and goat 0.1, hen 0.014).<\/li> <li>“Net” is the result before paying yourself for your work, without loan costs and taxes.<\/li> <li>The “pessimistic scenario” is your current settings made worse by the sliders in that group: prices, yields, animal output, hours and costs. Rent stays the same.<\/li> <li>Products are assigned to the species they come from (geese, ducks, sheep), together with a share of the smokehouse and shipping.<\/li> <li>The work norms are my estimates for a small farm with a bucket milking machine. Correct them after the first year from your own records.<\/li><\/ul>","sources":"<h3>Sources<\/h3><ul> <li><a href=\"https://www.farmer.pl/finanse/doplaty-2026-sa-nowe-stawki-na-hektar,182894.html\" target=\"_blank\" rel=\"noopener\">farmer.pl: 2026 direct payment rates (advances)<\/a><\/li> <li><a href=\"https://staszow.pl/files/image/2025/Aktualno%C5%9Bci/ARIMR_stawki_p%C5%82atno%C5%9Bci.pdf\" target=\"_blank\" rel=\"noopener\">ARiMR: payment rates for 2025<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/rolnictwo-ekologiczne-z-wyzszymi-stawkami-w-2023-roku\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: organic payment rates (2023)<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/hodowla/startuja-wyplaty-za-dobrostan-zwierzat-takie-pieniadze-dostana-rolnicy-lista,21487\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: animal welfare rates for 2024<\/a><\/li> <li><a href=\"https://www.gov.pl/web/arimr/platnosc-onw---podstawowe-informacje-2026\" target=\"_blank\" rel=\"noopener\">ARiMR: areas with natural constraints payment 2026<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/stawki-za-ekoschematy-2024-sa-jednak-wieksze-ostateczne-kwoty\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: eco-scheme rates 2024<\/a><\/li> <li><a href=\"https://podr.pl/wp-content/uploads/2025/12/RHD-i-MLO.pdf\" target=\"_blank\" rel=\"noopener\">PODR: farm retail and marginal local activity (December 2025)<\/a><\/li> <li><a href=\"https://poradnikprzedsiebiorcy.pl/-stawka-ryczaltu-w-rolniczym-handlu-detalicznym\" target=\"_blank\" rel=\"noopener\">Poradnik Przedsiębiorcy: flat tax in farm retail<\/a><\/li> <li><a href=\"https://www.kpodr.pl/wp-content/uploads/2024/03/Kiczorowska-B.-Dobre-praktyki-utrzymania-drobiurzeznego-i-kur-niosek.zmieniona.pdf\" target=\"_blank\" rel=\"noopener\">KPODR: good practice in keeping meat poultry and laying hens<\/a><\/li> <li><a href=\"https://www.iung.pl/wp-content/uploads/2023/09/Instrukcja-Mieszanki-roslin-straczkowych-ze-zbozami.pdf\" target=\"_blank\" rel=\"noopener\">IUNG: pulse and cereal mixtures<\/a><\/li> <li><a href=\"https://www.gov.pl/attachment/00bf374e-b258-4c8d-896e-aedf7a17cc2c\" target=\"_blank\" rel=\"noopener\">KOWR: grain market no. 41/2026<\/a><\/li> <li><a href=\"https://www.sodr.pl/pliki/Analiza-cen-2026-06,2096.pdf\" target=\"_blank\" rel=\"noopener\">ŚODR: cattle prices, June 2026<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/drob/produkuje-jajka-od-kur-z-wolnego-wybiegu\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: free-range eggs (prices, 2024)<\/a><\/li> <li><a href=\"https://www.gov.pl/attachment/a63161eb-624b-4fb7-b75e-0f54da2b886f\" target=\"_blank\" rel=\"noopener\">KOWR: meat market, July 2026 (sheep meat prices)<\/a><\/li> <li><a href=\"https://bip2.lasy.gov.pl/pl/bip/px_dg~rdlp_wroclaw~nadl_lwowek_slaski~program_ochrony_przyrody_13_15.pdf\" target=\"_blank\" rel=\"noopener\">Lwówek Śląski Forest District: natural conditions<\/a><\/li> <li><a href=\"https://www.uvm.edu/d10-files/documents/2025-11/2024-COP-article-Sep2025.pdf\" target=\"_blank\" rel=\"noopener\">University of Vermont: costs of grass-based dairy farms (2024)<\/a><\/li> <li><a href=\"https://www.agproud.com/articles/30227-cheese-production-from-jersey-milk-conserves-resources-and-reduces-environmental-impact\" target=\"_blank\" rel=\"noopener\">Cheese yield from Jersey milk<\/a><\/li> <li><a href=\"https://www.olx.pl/rolnictwo/ryneczek/q-jagni%C4%99cina-tusza/\" target=\"_blank\" rel=\"noopener\">OLX: lamb listings from farmers (prices)<\/a><\/li> <li><a href=\"https://owczeklimaty.pl/produkt/tusza-jagnieca/\" target=\"_blank\" rel=\"noopener\">Owcze Klimaty: lamb carcass, 52 PLN/kg<\/a><\/li> <li><a href=\"https://www.iung.pl/wp-content/uploads/2023/10/Zacharzewska_rzeznie-rolnicze-pazdziernik-2023.pdf\" target=\"_blank\" rel=\"noopener\">WIW Kraków (IUNG): farm abattoirs<\/a><\/li> <li><a href=\"https://www.infor.pl/akt-prawny/DZU.2016.252.0002159,rozporzadzenie-ministra-rolnictwa-i-rozwoju-wsi-w-sprawie-maksymalnej-ilosci-zywnosci-zbywanej-w-ramach-rolniczego-handlu-detalicznego-oraz-zakresu-i-sposobu-jej-dokumentowania.html\" target=\"_blank\" rel=\"noopener\">Regulation on farm retail limits (2016)<\/a><\/li> <li><a href=\"https://ksowplus.kpodr.pl/wp-content/uploads/2025/11/Adrianna-Augustyniak-Dobrzynskie-warzywa-prezentacja-dobtych-praktyk.pdf\" target=\"_blank\" rel=\"noopener\">KPODR: the Dobrzyńskie Warzywa CSA (2025)<\/a><\/li> <li><a href=\"https://modernfarmer.com/2016/10/jm-fortier/\" target=\"_blank\" rel=\"noopener\">Modern Farmer: J.M. Fortier and small market gardens<\/a><\/li> <li><a href=\"https://www.inhort.pl/wp-content/uploads/2026/01/8.2_streszczenie-2025.pdf\" target=\"_blank\" rel=\"noopener\">INHORT: honey market 2025<\/a><\/li> <li><a href=\"https://www.lubianka.pl/plik,25306,dzialalnosc-edukacyjna-w-gospodarstwie.pdf\" target=\"_blank\" rel=\"noopener\">DODR: educational activities on the farm<\/a><\/li> <li><a href=\"https://gov.mb.ca/agriculture/livestock/sheep/accelerated-lambing.html\" target=\"_blank\" rel=\"noopener\">Manitoba Agriculture: accelerated lambing<\/a><\/li> <li><a href=\"https://www.flockandherd.net.au/sheep/reader/reproductive-performance-dorper.html\" target=\"_blank\" rel=\"noopener\">Flock and Herd: reproduction in Dorper sheep<\/a><\/li> <li><a href=\"https://www.piwwyszkow.pl/Dokumenty/aktualnosci/RHD/RHD%20-%20pytania%20i%20odpowiedzi%20do%20regulacji%20prawnych.pdf\" target=\"_blank\" rel=\"noopener\">Farm retail: questions and answers (mail order, poultry slaughter)<\/a><\/li> <li><a href=\"https://new.podr.pl/wp-content/uploads/2024/01/rhd-zmniejszone-1.pdf\" target=\"_blank\" rel=\"noopener\">PODR: farm retail after the changes (2024)<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/prawo-i-finanse/koniec-z-ograniczenami-dla-rolnikow-szykuja-sie-przelomowe-zmiany-w-sprzedazy-bezposredniej,30495/\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: announced farm retail changes (April 2026)<\/a><\/li> <li><a href=\"https://manufakturadobra.pl/eko-polgesek-z-gesi-pastwiskowej/\" target=\"_blank\" rel=\"noopener\">Manufaktura Dobra: organic smoked goose breast, 200 PLN/kg<\/a><\/li> <li><a href=\"https://wolnywypas.pl/kaczka/25-tuszka-kaczki-eko.html\" target=\"_blank\" rel=\"noopener\">Wolny Wypas: organic duck<\/a> and <a href=\"https://wolnywypas.pl/perliczka/36-perliczka-tuszka.html\" target=\"_blank\" rel=\"noopener\">organic guinea fowl<\/a><\/li> <li><a href=\"https://lokalnyrolnik.pl/indyk-tuszka-eko-ok-8-kg\" target=\"_blank\" rel=\"noopener\">Lokalny Rolnik: organic turkey, 82.50 PLN/kg<\/a><\/li> <li><a href=\"http://grzyby.grzybnia.pl/files/amatorska-uprawa-boczniak.pdf\" target=\"_blank\" rel=\"noopener\">M. Siwulski: growing oyster mushrooms at home<\/a><\/li> <li><a href=\"https://okfronline.com/2022/07/histomoniasis-blackhead/\" target=\"_blank\" rel=\"noopener\">Histomoniasis in turkeys and hens<\/a><\/li> <li><a href=\"https://www.motherearthnews.com/homesteading-and-livestock/sustainable-farming/joel-salatin-interview/\" target=\"_blank\" rel=\"noopener\">Joel Salatin: grazing and poultry behind cattle<\/a><\/li><\/ul>"},"footer":"Your settings are saved only in this browser. The numbers are an estimate for planning, not a business plan for the bank.","controls":{"label":"Settings"},"coverCropGuide":{"catchCrops":{"columns":["Mixture","Seed rate (approximate)","When and where","What for"],"mixes":{"ryeWithVetch":{"name":"Winter rye with hairy vetch","seeding":"rye 60–80 kg/ha, vetch 25–40 kg/ha","timing":"After harvest, by 1 October. Before oats with peas.","purpose":"The most reliable: it overwinters, the vetch fixes nitrogen, the rye protects the soil. Sheep grazing in autumn and from mid-February, then ploughed in before sowing oats."},"landsberger":{"name":"Landsberger mixture","species":"winter vetch, crimson clover, Italian ryegrass","seeding":"vetch 20–30, clover 15–20, ryegrass 15–20 kg/ha","timing":"Sown August – September. Before a late-sown crop or vegetables.","purpose":"In May it gives a cut of green forage or haylage for the cows, but that is too late for oats. Good before vegetables."},"cloverUndersown":{"name":"Clover undersown in oats","seeding":"red clover 8–12 kg/ha, ryegrass or timothy 4–8 kg/ha","timing":"April, together with the oats and peas or straight after.","purpose":"Counts as an undersown crop (keep at least 8 weeks after harvest). It becomes the clover field in the rotation straight away."},"winterTurnipRapeRye":{"name":"Winter turnip rape with rye","seeding":"turnip rape 6–10 kg/ha, rye 60–80 kg/ha","timing":"After harvest, by the end of August (turnip rape needs time before winter). Before oats.","purpose":"Plenty of forage for autumn grazing by sheep and geese (October–November), overwinters. Turnip rape is a brassica: do not sow it if the rotation has brassica vegetables or oilseed rape."},"multiSpeciesRye":{"name":"Multi-species mixture with rye","species":"oilseed radish, phacelia, vetch, crimson clover, oats or buckwheat","seeding":"ready mixtures usually 25–40 kg/ha plus rye 30–50 kg/ha","timing":"After harvest, August. Before oats or vegetables.","purpose":"The most soil life: different roots, flowers for bees. Part of it is winter-killed, the rye stays green until 15 February. More expensive seed."},"triticaleWinterPea":{"name":"Triticale with winter field pea","seeding":"triticale 80–100 kg/ha, field pea 40–60 kg/ha","timing":"September. Before a late crop or vegetables.","purpose":"In May green forage or haylage rich in protein. Like the Landsberger mixture: too late before oats."},"phaceliaBuckwheatSerradella":{"name":"Phacelia, buckwheat, serradella","seeding":"phacelia 6–8, buckwheat 30–40, serradella 20–30 kg/ha","timing":"After an early harvest, July – August.","purpose":"Fast, good for honey (bees), winter-killed and leaves a mulch. For the eco-scheme add an overwintering species (e.g. rye), because the cover must last until 15 February."},"brownWinterCocktail":{"name":"Multi-species winter cocktail (G. Brown)","species":"rye, triticale, winter vetch, crimson clover, winter turnip rape, oilseed radish","seeding":"rye 35, triticale 30, vetch 20, clover 6, turnip rape 2, radish 2 kg/ha (about 95 kg/ha in all)","timing":"After harvest by 1 October. Before oats or the mixture.","purpose":"Grazing by cattle or sheep in autumn and early spring, soil cover in winter. Radish and turnip rape loosen the soil, vetch and clover fix nitrogen. Meets the eco-scheme rules (stays until 15 February)."}}},"stubbleCrops":{"columns":["Stubble cover crop (before a winter cereal, no payment)","Seed rate (approximate)","When","What for"],"mixes":{"whiteMustard":{"name":"White mustard","seeding":"15–20 kg/ha","timing":"Straight after harvest, July – early August; plough in in September before sowing the winter cereal.","purpose":"The cheapest and fastest, covers the soil quickly. A brassica: take care if you grow brassica vegetables."},"phaceliaBuckwheat":{"name":"Phacelia with buckwheat","seeding":"phacelia 8–10, buckwheat 30–40 kg/ha","timing":"Straight after harvest.","purpose":"Good for honey (bees), improves soil structure, not a brassica. Little forage."},"oatsVetchPea":{"name":"Oats with spring vetch and peas","seeding":"oats 60–80, vetch 30–40, peas 40–60 kg/ha","timing":"After the earliest harvest (July), 7–8 weeks of growth.","purpose":"Green forage for the cows or sheep grazing in September, then ploughed in. The pulses fix nitrogen for the winter cereal."},"brownSummerCocktail":{"name":"Summer cocktail for grazing (G. Brown)","species":"oats, field pea, spring vetch, buckwheat, phacelia, sunflower, oilseed radish, Persian clover","seeding":"oats 30, pea 30, vetch 20, buckwheat 15, sunflower 5, phacelia 4, radish 3, clover 3 kg/ha (about 110 kg/ha)","timing":"Straight after the earliest harvest (July), 7–9 weeks of growth.","purpose":"Plenty of forage for grazing cattle in September, then ploughed in before the winter cereal. Flowers for bees, roots at different depths."}}}},"dataTools":{"groupLabel":"Settings","clearAll":"Clear everything","clearAllTitle":"All animals to 0 and all the land outside the farmyard under cereals. It can be undone with the “Previous settings” button.","previous":"↶ Previous settings","previousTitle":"Undoes the last change to the settings (remembers up to 30 steps)."},"nitrogen":{"title":"Nitrogen and carbon","intro":"How much nitrogen the animals produce, how much they spread themselves on pasture and runs, and how much stays in the manure to haul; the nitrogen cycle of the whole farm and a rough soil carbon balance. Estimates for planning.","baleGrazingNote":"<h3>Bale grazing in winter<\/h3><ul><li>The bales are set out in autumn on a field that goes under a crop in spring, or on a poorer part of the meadow; somewhere different each year.<\/li><li>Not on waterlogged or flood-prone soil, nor by ditches and streams; during a thaw the animals move to a drier spot.<\/li><li>Access to water in winter (a heated trough or a water bowser) and shelter from the wind.<\/li><li>The nitrates action programme restricts fertilising in winter, so the site and the stocking rate are worth discussing with an ODR adviser.<\/li><\/ul>","baleGrazingTitle":"Bale grazing in winter","soilCareTitle":"What to put on the soil in organic farming, and when","soilCare":"<ul><li><b>Soil testing<\/b> every 4–5 years (pH, phosphorus, potassium, magnesium, organic matter) before a fertiliser plan; at the ODR or a soil laboratory.<\/li><li><b>Liming<\/b> when the pH of light soils falls below about 5.5 and of medium soils below 6 (clover needs pH about 6–6.5): ground limestone or dolomite (with magnesium), in autumn after harvest or in early spring on grassland, usually every 4 years.<\/li><li><b>Rock dust<\/b> (basalt, diabase) 1–3 t/ha on the compost or manure: releases trace elements slowly and supports soil life.<\/li><li><b>Soft rock phosphate, kieserite, potassium sulphate (Patentkali)<\/b> are allowed in organic farming when a need is confirmed (soil test); elemental sulphur for a sulphur shortage under clover and brassicas.<\/li><li><b>Compost and compost tea<\/b> in spring on meadows and fields; manure best composted, for root crops and winter cereals.<\/li><li><b>Microbial products and biostimulants<\/b> (EM, Trichoderma, mycorrhizal inoculants, seaweed extracts) only from the list approved for organic farming; best at sowing and on the compost.<\/li><li><b>Orchard sprays<\/b>: sulphur and copper products (copper at most 28 kg/ha over 7 years), nettle and horsetail teas, whey against mildew.<\/li><\/ul>","carbonMethodTitle":"How the carbon is estimated","carbonMethod":"<p>Approximate soil carbon gains per hectare and year: pasture moved often (every 1–3 days) with 40+ days’ rest about 0.5 t C, rotational grazing about 0.3 t, infrequent moves about 0.1 t, hay meadow about 0.2 t, clover-grass ley about 0.5 t, orchard about 0.3 t; cereals without cover lose about 0.2 t, and a cover crop, manure and bale grazing add about 0.25–0.3 t each. A tonne of carbon is 3.67 t of CO₂.<\/p><p>Methane from the ruminants’ digestion (a cow about 110 kg CH₄ a year, a ewe about 8 kg) converted to CO₂ (×27). Soil does not take up carbon for ever: after 20–30 years the gain slows down. This is not a certified balance for selling carbon credits.<\/p>"},"risk":{"title":"Risk in random years","intro":"How often the farm reaches its target when yields, prices, animal output and costs are a little different each year.","chartLabel":"Chart: how many years end with a given income","method":"The model recalculates the farm for 500 random years: each year has different yields, prices, animal output and costs, and roughly once in 20 years there is a bad year for the animals. Green bars are years with an income at least equal to the target, red ones below it. The pessimistic scenario is a single year in which everything goes wrong at once; it happens less often than the worst years on this chart. You set the variability in the “Pessimistic scenario” group."},"language":{"label":"Language:","groupLabel":"Page language","pl":"Polski","en":"English"},"location":{"label":"Location:"},"jump":{"label":"Jump to:","plan":"Farm layout","rotation":"Rotation","nitrogen":"Nitrogen and carbon","money":"Money","cashflow":"Cash flow","labour":"Working time","market":"Sales","infrastructure":"Infrastructure","startup":"How to start","calendar":"Calendar"},"footerLinks":"App: <a href=\"https://symgospodarstwa.netlify.app/\" target=\"_blank\" rel=\"noopener\">symgospodarstwa.netlify.app<\/a> · code: <a href=\"https://github.com/marlander111/symulator-gospodarstwa\" target=\"_blank\" rel=\"noopener\">github.com/marlander111/symulator-gospodarstwa<\/a>","infrastructure":{"title":"Required infrastructure","intro":"What the chosen enterprises need. Tick what the farm already has: it drops out of the investments."}},"customers":{"title":"How many customers you need","familiesValue":"{count} families","customersValue":"{count} customers","loyal":"regular, taking a full basket (about {amount} PLN a month)","occasional":"if each bought only one product (about {amount} PLN a month)","note":"With regular families o2":"CO₂/yr"},"land":{"pasture":"Pasture","meadow":"Hay meadow","clover":"Clover-grass ley","cereals":"Cereals and root crops","coverCrops":"Cover crops and undersowing","manure":"Manure on the fields","orchard":"Orchard","baleGrazing":"Bale grazing"}},"infrastructure":{"categories":{"buildings":"Buildings and shelters","poultry":"Poultry and rabbits","pasture":"Pasture","processing":"Dairy and processing","machinery":"Machinery","produce":"Vegetables and bees"},"owned":"have it","toBuy":"to buy","cost":"about {cost}","quantityCost":"{quantity} × unit price, about {cost}","note":"Items needed: {needed}, of which the farm has {owned} (worth about {value}). Unit prices are in the “Investments” group.","nothing":"The chosen enterprises need no infrastructure."},"startup":{"chooseYear":"Year:","year":"Year {year}","fullYear":"Year {year}: full operation","ofFull":"{percent}% of full operation","perMonth":"Per month","afterCosts":"after costs and depreciation","summary":"In year {year} the farm brings about {percent}% of the income of full operation, about {missing} less than in year 4.","fullSummary":"Year 4: the farm runs as planned; these are the numbers in the bar at the top.","tasksTitle":"To do","items":{"dairyCows":"Dairy cows: {amount} of {full}","cheeseShare":"Milk for cheese: {amount} (plan {full})","curdShare":"Milk for curd: {amount} (plan {full})","layingHens":"Laying hens: {amount} of {full}","broilers":"Broilers: {amount} of {full}","geese":"Geese: {amount} of {full}","ducks":"Ducks: {amount} of {full}","turkeys":"Turkeys: {amount} of {full}","guineaFowl":"Guinea fowl: {amount} of {full}","rabbits":"Rabbit does: {amount} of {full}","sucklerCows":"Suckler cows: {amount} of {full}","sheep":"Ewes: {amount} of {full}","goats":"Goats: {amount} of {full}","pigs":"Fatteners: {amount} of {full}","horses":"Horses: {amount} of {full}","ridesPerYear":"Riding: {amount} h of {full} h","marketGardenHa":"Vegetables: {amount} of {full}","beehives":"Hives: {amount} of {ful <script>
// ===== i18n/translate.js =====
// User-facing texts. All content lives in locales/<language>.json; the code refers to it by key.
//
// The build embeds every locale in the page as <script type="application/json" id="locale-pl">
// (and the default one as LOCALE_MESSAGES for Node), so the app also works when opened from disk.
// The language comes from the address (?lang=en), then from this browser's memory, then the default.

const LANGUAGES = ['pl', 'en'];
const DEFAULT_LANGUAGE = LANGUAGES[0];
const LANGUAGE_STORAGE_KEY = 'gosp-jezyk';
const LANGUAGE_URL_PARAMETER = 'lang';

const CURRENT_LANGUAGE = chooseLanguage();
const MESSAGES = loadMessages(CURRENT_LANGUAGE);

function chooseLanguage() {
  if (typeof LOCALE_MESSAGES !== 'undefined' || typeof document === 'undefined') return DEFAULT_LANGUAGE;
  const fromAddress = new URLSearchParams(location.search).get(LANGUAGE_URL_PARAMETER);
  if (LANGUAGES.includes(fromAddress)) return fromAddress;
  try {
    const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    if (LANGUAGES.includes(saved)) return saved;
  } catch (error) {
    // storage unavailable: use the default language
  }
  return DEFAULT_LANGUAGE;
}

function loadMessages(language) {
  if (typeof LOCALE_MESSAGES !== 'undefined') return LOCALE_MESSAGES;
  const element =
    document.getElementById(`locale-${language}`) || document.getElementById(`locale-${DEFAULT_LANGUAGE}`);
  if (!element) throw new Error('Locale data is missing: build the page with build.py');
  document.documentElement.lang = language;
  return JSON.parse(element.textContent);
}

/** The language the interface is shown in, e.g. "pl". */
function currentLanguage() {
  return CURRENT_LANGUAGE;
}

function lookupMessage(key) {
  return key.split('.').reduce((node, part) => (node == null ? undefined : node[part]), MESSAGES);
}

/** Returns true when the locale has a message (of any type) under the key. */
function hasMessage(key) {
  return lookupMessage(key) !== undefined;
}

/**
 * Returns the text for a key with `{name}` placeholders filled in.
 * @param {string} key - dot-separated path in the locale, e.g. "kpi.netIncome"
 * @param {object} [values] - placeholder values
 * @returns {string}
 */
function t(key, values) {
  const message = lookupMessage(key);
  if (typeof message !== 'string') {
    console.warn(`Missing text: ${key}`);
    return key;
  }
  if (!values) return message;
  return message.replace(/\{(\w+)\}/g, (placeholder, name) => (name in values ? values[name] : placeholder));
}

/**
 * Returns the plural form matching `count` (Polish: one, few, many, other; English: one, other).
 * @param {string} key - group of forms in the locale, e.g. "plurals.years"
 * @param {number} count
 */
function tPlural(key, count, values) {
  const category = new Intl.PluralRules(t('format.numberLocale')).select(count);
  return t(`${key}.${category}`, values);
}

/**
 * Returns a list or a group of texts (e.g. month names) as stored in the locale.
 * @param {string} key
 * @returns {Array|object}
 */
function messages(key) {
  const message = lookupMessage(key);
  if (message === undefined) throw new Error(`Missing texts: ${key}`);
  return message;
}

/**
 * Fills static markup from the locale:
 *   data-i18n="key"           → text content
 *   data-i18n-html="key"      → inner HTML (for texts with links or emphasis)
 *   data-i18n-attr="title:key; aria-label:key2" → attributes
 * @param {ParentNode} root
 */
function applyTranslations(root) {
  root.querySelectorAll('[data-i18n]').forEach(element => {
    element.textContent = t(element.dataset.i18n);
  });
  root.querySelectorAll('[data-i18n-html]').forEach(element => {
    element.innerHTML = t(element.dataset.i18nHtml);
  });
  root.querySelectorAll('[data-i18n-attr]').forEach(element => {
    for (const pair of element.dataset.i18nAttr.split(';')) {
      const [attribute, key] = pair.split(':').map(part => part.trim());
      if (attribute && key) element.setAttribute(attribute, t(key));
    }
  });
}

// ===== model/utils.js =====
// Small numeric helpers shared by the model and the interface.

/** Sum of all values of an object. */
function sumValues(object) {
  return Object.values(object).reduce((sum, value) => sum + value, 0);
}

/** Sum of `select(item)` over a list. */
function sumBy(items, select) {
  return items.reduce((sum, item) => sum + select(item), 0);
}

/** Value limited to the range [low, high]. */
function clamp(value, low, high) {
  return Math.min(high, Math.max(low, value));
}

/** Formats a number for the interface language (Polish: "12 300,5", English: "12,300.5"). */
function formatNumber(value, decimals = 0) {
  if (!isFinite(value)) return '–';
  const roundsToZero = Math.abs(value) < 0.5 / 10 ** decimals;
  return (roundsToZero ? 0 : value).toLocaleString(t('format.numberLocale'), {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}

// Soil classes and climate: yield multipliers for arable land, pasture and hay meadows.
//
// Each land use has its own shares of class III, V and VI soil (the rest is class IV). The
// climate of the chosen location scales the yields against the reference location, more on
// light soils, which hold less water.

/** Land uses with their own soil classes; parameter ids are e.g. `pastureSoilVShare`. */
const SOIL_LAND_USES = ['arable', 'pasture', 'meadow'];

/** Soil classes with their own share slider (class IV is the rest). */
const SOIL_CLASSES_WITH_SHARE = ['III', 'V', 'VI'];

/** Yield relative to class IV soil: arable crops, and grass (pasture and meadow). */
const SOIL_CLASS_YIELD = {
  arable: { III: 1.2, IV: 1, V: 0.75, VI: 0.55 },
  grass: { III: 1.1, IV: 1, V: 0.85, VI: 0.7 },
};

/** How strongly yields follow rainfall on each soil class (lighter soils hold less water). */
const RAINFALL_SENSITIVITY_BY_SOIL_CLASS = { III: 0.6, IV: 0.8, V: 1.1, VI: 1.4 };

/** Relative yield change per relative rainfall change on class IV soil, for grass and for crops. */
const GRASS_RAINFALL_RESPONSE = 0.75;
const CROP_RAINFALL_RESPONSE = 0.4;

/** Limits of the rainfall effect: above about 800 mm water rarely limits yields any more. */
const RAINFALL_FACTOR_RANGE = [0.65, 1.1];

/** Relative change of grass growth per relative change of the grazing season length. */
const GRASS_SEASON_RESPONSE = 0.7;

/** Arable yields fall by this share for every 100 m above 400 m (shorter, cooler summer). */
const CROP_LOSS_PER_100_M_ABOVE_400 = 0.05;
const ALTITUDE_WITHOUT_LOSS_M = 400;

const soilShareId = (landUse, soilClass) => `${landUse}Soil${soilClass}Share`;

/** Shares of class III, IV, V and VI soil (0–1) of one land use. */
function soilClassShares(params, landUse) {
  const shares = {};
  for (const soilClass of SOIL_CLASSES_WITH_SHARE)
    shares[soilClass] = (params[soilShareId(landUse, soilClass)] || 0) / 100;
  const others = sumValues(shares);
  if (others > 1) for (const soilClass in shares) shares[soilClass] /= others;
  shares.IV = Math.max(0, 1 - sumValues(shares));
  return shares;
}

/** Average of a value per soil class, weighted by the shares of the soil classes. */
const weightedBySoil = (shares, valueByClass) =>
  Object.entries(shares).reduce((sum, [soilClass, share]) => sum + share * valueByClass[soilClass], 0);

/**
 * @param {object} params
 * @returns {{arable: number, pasture: number, meadow: number}} yield multipliers from the soil classes
 */
function computeSoilFactors(params) {
  return {
    arable: weightedBySoil(soilClassShares(params, 'arable'), SOIL_CLASS_YIELD.arable),
    pasture: weightedBySoil(soilClassShares(params, 'pasture'), SOIL_CLASS_YIELD.grass),
    meadow: weightedBySoil(soilClassShares(params, 'meadow'), SOIL_CLASS_YIELD.grass),
  };
}

/**
 * Yield multipliers from the climate of the chosen location against the reference location.
 * @param {object} params
 * @returns {{arable: number, pasture: number, meadow: number, seasonDays: number}}
 */
function computeClimateFactors(params) {
  const location = locationById(params.location);
  const reference = LOCATIONS[0];
  const relativeRainfall = location.rainfallMm / reference.rainfallMm - 1;
  const seasonDays = grazingSeasonDays(location);
  const seasonFactor = 1 + GRASS_SEASON_RESPONSE * (seasonDays / grazingSeasonDays(reference) - 1);
  const altitude = (location.altitude[0] + location.altitude[1]) / 2;
  const altitudeFactor =
    1 - Math.max(0, altitude - ALTITUDE_WITHOUT_LOSS_M) * (CROP_LOSS_PER_100_M_ABOVE_400 / 100);

  const rainfallFactor = (landUse, response) => {
    const sensitivity = weightedBySoil(soilClassShares(params, landUse), RAINFALL_SENSITIVITY_BY_SOIL_CLASS);
    return clamp(1 + response * sensitivity * relativeRainfall, ...RAINFALL_FACTOR_RANGE);
  };
  return {
    arable: rainfallFactor('arable', CROP_RAINFALL_RESPONSE) * altitudeFactor,
    pasture: rainfallFactor('pasture', GRASS_RAINFALL_RESPONSE) * seasonFactor,
    meadow: rainfallFactor('meadow', GRASS_RAINFALL_RESPONSE) * seasonFactor,
    seasonDays,
  };
}

// ===== model/parameters/registry.js =====
// Registry of input parameters (sliders, switches and choices) shown in the controls panel.
//
// Every parameter has an `id` (the key in the params object), a `defaultValue` and one of:
// - a numeric range (`min`, `max`, `step`): a slider;
// - `type: 'boolean'`: a switch;
// - `type: 'choice'` with `options` (ids): a row of buttons; `sets` maps an option to the slider
//   values it moves (e.g. a breed sets typical milk yields).
// `advanced: true` marks a slider that is rarely changed; `hidden: true` keeps a parameter out of
// the controls panel (it is set elsewhere on the page). Texts: locales → parameters.<id>.
// Optional `hectaresOf` (a land use) adds a field in hectares next to a share slider, and
// `totalOf` (a parameter in hectares) adds a field for the total next to a price per hectare.

/** All parameters in display order, filled by the group files in this directory. */
const PARAMETERS = [];

/** Parameter group ids in display order (titles: locales → parameterGroups). */
const PARAMETER_GROUP_IDS = [];

/** Groups that are not shown in the controls panel (their parameters are set by other panels). */
const HIDDEN_PARAMETER_GROUPS = new Set(['infrastructure']);

/**
 * Parameters that start a titled, collapsible subsection inside their group (titles: locales →
 * subsections.<id>). Advanced subsections start collapsed.
 */
const SUBSECTIONS = new Map([
  ['cheeseShare', { advanced: true }],
  ['lactationsPerCow', { advanced: true }],
  ['flockReplacementYears', { advanced: true }],
  ['broilers', { advanced: false }],
  ['geese', { advanced: false }],
  ['ducks', { advanced: false }],
  ['turkeys', { advanced: false }],
  ['guineaFowl', { advanced: false }],
  ['rabbits', { advanced: false }],
  ['weanerWeightKg', { advanced: true }],
  ['lambLiveWeightKg', { advanced: true }],
  ['kidsPerDoe', { advanced: true }],
  ['goatMilking', { advanced: true }],
  ['pigGrainKg', { advanced: true }],
  ['horseCost', { advanced: true }],
  ['abattoirDistanceKm', { advanced: false }],
  ['guardDogs', { advanced: false }],
  ['costPerDog', { advanced: true }],
  ['marketGardenHa', { advanced: false }],
  ['fruitSoldShare', { advanced: false }],
  ['mushroomLogs', { advanced: false }],
  ['beehives', { advanced: false }],
  ['geeseProcessedShare', { advanced: false }],
  ['lambProcessedShare', { advanced: false }],
  ['preservesFruitShare', { advanced: false }],
  ['processingMaterialsShare', { advanced: true }],
  ['shippedShare', { advanced: true }],
  ['loyalCustomerSpendPerMonth', { advanced: true }],
  ['organicPayment', { advanced: false }],
  ['catchCrops', { advanced: false }],
  ['extensiveGrasslandScheme', { advanced: false }],
  ['welfareCowsGrazing', { advanced: true }],
  ['arableCostPerHa', { advanced: false }],
  ['costPerCow', { advanced: true }],
  ['fixedCosts', { advanced: false }],
  ['grainPurchasePrice', { advanced: true }],
  ['boughtForageShare', { advanced: true }],
  ['dairyFixedHours', { advanced: false }],
  ['hensFixedHours', { advanced: true }],
  ['hoursPerEwe', { advanced: true }],
  ['hayHoursPerHa', { advanced: true }],
  ['investCattleShed', { advanced: false }],
  ['investElectricFencing', { advanced: true }],
  ['investDairy', { advanced: true }],
  ['investTractor', { advanced: true }],
  ['investMarketGarden', { advanced: true }],
  ['investOther', { advanced: false }],
  ['rotationFields', { advanced: true }],
  ['arableSoilIIIShare', { advanced: true }],
  ['grazingMoveIntervalDays', { advanced: false }],
  ['householdChildren', { advanced: false }],
  ['riskYieldVolatility', { advanced: true }],
]);

/**
 * Registers the parameters of one group.
 * @param {string} group - group id
 * @param {object[]} parameters - parameter definitions in display order
 */
function defineParameterGroup(group, parameters) {
  PARAMETER_GROUP_IDS.push(group);
  for (const parameter of parameters) PARAMETERS.push({ group, ...parameter });
}

/** Returns a params object with every parameter at its default value. */
function defaultParams() {
  const params = {};
  for (const parameter of PARAMETERS) params[parameter.id] = parameter.defaultValue;
  return params;
}

/** Returns the definition of the parameter with this id. */
function parameterById(id) {
  return PARAMETERS.find(parameter => parameter.id === id);
}

/** Slider values a choice moves when this option is picked (empty when it moves none). */
function valuesSetByChoice(parameter, option) {
  const set = parameter.sets && parameter.sets[option];
  return (set && (set.sliders || set)) || {};
}

/**
 * Returns settings keyed by current parameter ids.
 * @param {object} saved - settings that may use the old ids
 * @returns {object}
 */
function migrateLegacyParameterIds(saved) {
  const migrated = {};
  for (const [key, value] of Object.entries(saved || {})) migrated[LEGACY_PARAMETER_IDS[key] || key] = value;
  return mergeSplitParameters(migrated);
}

/**
 * Parameters replaced in version 3: pigs for the household and for sale became one number of
 * pigs, and the soil class shares of the whole farm became shares for each land use.
 */
function mergeSplitParameters(settings) {
  const merged = { ...settings };
  if ('pigsForHome' in merged || 'pigsForSale' in merged) {
    // the old default of two pigs for the household is not a choice the user made
    const pigsForHome = merged.pigsForHome === 2 ? 0 : merged.pigsForHome || 0;
    merged.pigs = pigsForHome + (merged.pigsForSale || 0);
    delete merged.pigsForHome;
    delete merged.pigsForSale;
  }
  const oldSoilShares = { III: 'soilClassIIIShare', V: 'soilClassVShare', VI: 'soilClassVIShare' };
  for (const [soilClass, oldId] of Object.entries(oldSoilShares)) {
    if (!(oldId in merged)) continue;
    // the old default of 20% class V soil is not a choice the user made
    const share = oldId === 'soilClassVShare' && merged[oldId] === 20 ? 0 : merged[oldId];
    for (const landUse of SOIL_LAND_USES) merged[soilShareId(landUse, soilClass)] = share;
    delete merged[oldId];
  }
  return merged;
}

/**
 * Reads the contents of a settings file saved by any version of the app.
 * Version 1 used Polish field names ("nazwa", "ustawienia") and Polish parameter ids.
 * @param {object} contents - parsed JSON of the file
 * @returns {{name: string, settings: object}} settings keyed by current parameter ids
 */
function readSettingsFile(contents) {
  const name = contents.name || contents.nazwa || '';
  const settings = contents.settings || contents.ustawienia || contents;
  return { name, settings: migrateLegacyParameterIds(settings) };
}

/**
 * Returns settings saved with older defaults, with every value the user never changed (still at
 * the old default) moved to the new default.
 * @param {object} saved - settings keyed by current parameter ids
 * @param {number} savedVersion - DEFAULTS_VERSION the settings were saved with (1 if unknown)
 */
function migrateChangedDefaults(saved, savedVersion) {
  const migrated = { ...saved };
  for (const [version, changes] of Object.entries(CHANGED_DEFAULTS_BY_VERSION)) {
    if (savedVersion >= +version) continue;
    for (const [id, [oldDefault, newDefault]] of Object.entries(changes))
      if (migrated[id] === oldDefault) migrated[id] = newDefault;
  }
  return migrated;
}

function completePresetParams(presets) {
  const presetParameterIds = new Set([
    ...PRESET_PRACTICE_IDS,
    ...presets.flatMap(preset => Object.keys(preset.params)),
  ]);
  const defaults = defaultParams();
  for (const preset of presets)
    for (const id of presetParameterIds) if (!(id in preset.params)) preset.params[id] = defaults[id];
}

function normaliseToAverageOne(profiles) {
  const normalised = {};
  for (const [activity, months] of Object.entries(profiles)) {
    const average = months.reduce((sum, weight) => sum + weight, 0) / months.length;
    normalised[activity] = months.map(weight => weight / average);
  }
  return normalised;
}

/** Milking once a day moves the evening milking to the morning. */
const ONCE_A_DAY_MILKING_SHARES = { morning: 0.8, day: 0.2, evening: 0 };

const TIMES_OF_DAY = ['morning', 'day', 'evening'];
const DAYS_IN_MONTH = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

/**
 * Average hours per day in one month, by time of day and activity.
 * @param {object} hoursByActivity - yearly hours of each activity (results.hoursByActivity)
 * @param {number} month - 0–11
 * @param {object} params
 * @returns {{total: number, byTime: {morning: number, day: number, evening: number},
 *   activities: {morning: object, day: object, evening: object}}}
 */
function dailyHoursByTimeOfDay(hoursByActivity, month, params) {
  const activities = { morning: {}, day: {}, evening: {} };
  for (const [activity, yearlyHours] of Object.entries(hoursByActivity)) {
    const perDay = ((yearlyHours / 12) * LABOUR_PROFILES[activity][month]) / DAYS_IN_MONTH[month];
    if (perDay <= 0) continue;
    const shares =
      activity === 'dairyCows' && params.onceADayMilking
        ? ONCE_A_DAY_MILKING_SHARES
        : TIME_OF_DAY_SHARES[activity];
    for (const time of TIMES_OF_DAY) if (shares[time] > 0) activities[time][activity] = perDay * shares[time];
  }
  const byTime = Object.fromEntries(TIMES_OF_DAY.map(time => [time, sumValues(activities[time])]));
  return { total: sumValues(byTime), byTime, activities };
}

// ===== model/rotation.js =====
// Crop rotation: clover with grass for one or more years, then cereals, optionally with one year
// of root crops before the last spring cereal (as in the Norfolk four-course rotation). Every year
// each crop moves one field further. The same layout is drawn in the "Crop rotation" panel.

/** Cereal order after clover for 1–7 cereal years. */
const CEREAL_SEQUENCES = {
  1: ['oats'],
  2: ['triticale', 'oats'],
  3: ['triticale', 'rye', 'oats'],
  4: ['triticale', 'mixedGrain', 'rye', 'oats'],
  5: ['triticale', 'mixedGrain', 'rye', 'triticale', 'oats'],
  6: ['triticale', 'mixedGrain', 'rye', 'triticale', 'mixedGrain', 'oats'],
  7: ['triticale', 'mixedGrain', 'rye', 'triticale', 'mixedGrain', 'rye', 'oats'],
};

/** Root crops (potatoes, fodder beet) need at least this many non-clover years in the rotation. */
const MIN_CEREAL_YEARS_FOR_ROOTS = 2;

const SPRING_SOWN_CROPS = ['oats', 'mixedGrain', 'roots'];

const WINTER_CEREALS = ['triticale', 'rye'];

/** Crops after which a catch crop can grow until the spring-sown crop that follows. */
const isCerealBeforeCatchCrop = (crop, nextCrop) =>
  isWinterCatchCropSlot(crop) && SPRING_SOWN_CROPS.includes(nextCrop);

/** Crops harvested early enough to leave the field free for a cover crop. */
const isWinterCatchCropSlot = crop => crop !== 'clover' && crop !== 'oats' && crop !== 'roots';

/** Crops after which a stubble crop can grow until a winter cereal is sown. */
const isCerealBeforeWinterCereal = (crop, nextCrop) =>
  isWinterCatchCropSlot(crop) && WINTER_CEREALS.includes(nextCrop);

/**
 * @param {object} params
 * @returns {{fieldCount: number, cloverYears: number, cerealYears: number, rootFields: number,
 *   rootCropsFit: boolean, crops: string[],
 *   catchCropFields: number, undersownFields: number, stubbleCropFields: number, manuredFields: number,
 *   distinctCrops: number, cerealShare: number, diversityOk: boolean}}
 */
function computeRotation(params) {
  const fieldCount = Math.round(params.rotationFields);
  const cloverYears = Math.min(
    fieldCount - 1,
    Math.max(1, Math.round((1 - params.cerealShare / 100) * fieldCount))
  );
  const cerealYears = fieldCount - cloverYears;
  const rootCropsFit = cerealYears >= MIN_CEREAL_YEARS_FOR_ROOTS;
  const rootFields = params.rootCrops && rootCropsFit ? 1 : 0;
  const crops = [...Array(cloverYears).fill('clover'), ...cropsAfterClover(cerealYears, rootFields > 0)];

  let catchCropFields = 0;
  let undersownFields = 0;
  let stubbleCropFields = 0;
  let manuredFields = 0;
  crops.forEach((crop, index) => {
    const nextCrop = crops[(index + 1) % fieldCount];
    if (isCerealBeforeCatchCrop(crop, nextCrop)) catchCropFields++;
    if (crop === 'oats') undersownFields++; // clover is undersown in oats
    if (isCerealBeforeWinterCereal(crop, nextCrop)) stubbleCropFields++;
    if (nextCrop === 'triticale' || nextCrop === 'oats' || nextCrop === 'roots') manuredFields++;
  });

  const distinct = [...new Set(crops)];
  const largestShare = Math.max(...distinct.map(crop => crops.filter(c => c === crop).length)) / fieldCount;
  const diversityOk =
    distinct.length >= 3 &&
    cerealYears / fieldCount <= 0.65 &&
    cloverYears / fieldCount >= 0.2 &&
    largestShare <= 0.65;

  return {
    fieldCount,
    cloverYears,
    cerealYears,
    rootFields,
    rootCropsFit,
    crops,
    catchCropFields,
    undersownFields,
    stubbleCropFields,
    manuredFields,
    distinctCrops: distinct.length,
    cerealShare: cerealYears / fieldCount,
    diversityOk,
  };
}

/** Crops after the clover years; with root crops they replace the cereal before the last oats. */
function cropsAfterClover(cerealYears, withRootCrops) {
  const crops = [...CEREAL_SEQUENCES[cerealYears]];
  if (withRootCrops) crops[crops.length - 2] = 'roots';
  return crops;
}

/**
 * Position in `rotation.crops` of the crop growing on a field (1-based) in a rotation year
 * (1-based): every year each crop moves one field further.
 * @param {{fieldCount: number}} rotation
 */
function rotationPosition(rotation, field, year) {
  return (field - 1 + (year - 1)) % rotation.fieldCount;
}

// ===== model/grazing.js =====
// Rotational grazing: how often the cows move to a fresh paddock and after how many days a
// paddock is grazed again. Together they set the number of paddocks, and they change how much
// of the grass the animals actually eat and how many hours moving the fences takes.
//
// The pasture yield and the work norms assume a move once a day and a 35–50 day rest. The share of
// the grass eaten follows the usual figures: about 70% with a move once a day, about 60% with a
// move once a week and 30–40% with set stocking.

/** Share of the grass eaten, relative to one move a day, by days spent in one paddock. */
const UTILISATION_BY_MOVE_INTERVAL = [
  [0.5, 1.04],
  [1, 1],
  [2, 0.96],
  [3, 0.93],
  [4, 0.9],
  [7, 0.84],
];

/**
 * Regrowth relative to a 35–50 day rest: shorter rests weaken the roots, much longer ones leave old,
 * trampled grass. Over a whole season (fast spring, slow summer) 35–60 days is close to the optimum
 * of rational grazing (Voisin); the longest rests of adaptive grazing pay off in soil and drought
 * resilience more than in tonnes of grass in one year.
 */
const REGROWTH_BY_REST_DAYS = [
  [20, 0.88],
  [25, 0.94],
  [30, 0.98],
  [35, 1],
  [50, 1],
  [60, 0.99],
  [75, 0.96],
  [90, 0.92],
];

/** Moves per day that the hour norms per cow already include. */
const BASELINE_MOVE_INTERVAL_DAYS = 1;

/**
 * @param {object} params
 * @returns {{moveIntervalDays: number, restDays: number, paddockCount: number, paddockHa: number,
 *   cycleDays: number, grazingsPerPaddock: number, yieldFactor: number, extraMoveHours: number}}
 */
function computeGrazingPlan(params) {
  const moveIntervalDays = params.grazingMoveIntervalDays;
  const restDays = params.pastureRestDays;
  const paddockCount = Math.ceil(restDays / moveIntervalDays) + 1;
  const cycleDays = paddockCount * moveIntervalDays;

  const movesPerSeason = params.grazingDays / moveIntervalDays;
  const baselineMoves = params.grazingDays / BASELINE_MOVE_INTERVAL_DAYS;
  const hasGrazingHerd = params.dairyCows + params.sucklerCows + params.sheep + params.goats > 0;

  return {
    moveIntervalDays,
    restDays,
    paddockCount,
    paddockHa: params.pastureHa / paddockCount,
    cycleDays,
    grazingsPerPaddock: params.grazingDays / cycleDays,
    yieldFactor:
      interpolate(UTILISATION_BY_MOVE_INTERVAL, moveIntervalDays) *
      interpolate(REGROWTH_BY_REST_DAYS, restDays),
    extraMoveHours: hasGrazingHerd ? (movesPerSeason - baselineMoves) * params.paddockMoveHours : 0,
  };
}

/**
 * Linear interpolation in a table of [x, y] points sorted by x; outside the table the nearest
 * end value is used.
 */
function interpolate(points, x) {
  if (x <= points[0][0]) return points[0][1];
  for (let index = 1; index < points.length; index++) {
    const [x1, y1] = points[index];
    if (x <= x1) {
      const [x0, y0] = points[index - 1];
      return y0 + ((y1 - y0) * (x - x0)) / (x1 - x0);
    }
  }
  return points[points.length - 1][1];
}

/**
 * Returns a copy of the params with lower prices, yields and animal output, more working hours
 * and higher costs. `hoursMultiplier` and `costMultiplier` are read by simulateFarm.
 * @param {object} params
 * @returns {object}
 */
function applyPessimisticScenario(params) {
  const worse = { ...params };
  const scale = (ids, factor) => ids.forEach(id => (worse[id] = params[id] * factor));

  scale(PRICE_PARAMS, 1 - params.pessimisticPriceDrop / 100);
  scale(CROP_YIELD_PARAMS, 1 - params.pessimisticYieldDrop / 100);
  scale(ANIMAL_OUTPUT_PARAMS, 1 - params.pessimisticAnimalOutputDrop / 100);
  scale(PURCHASE_PRICE_PARAMS, 1 + params.pessimisticCostIncrease / 100);

  worse.hoursMultiplier = 1 + params.pessimisticExtraHours / 100;
  worse.costMultiplier = 1 + params.pessimisticCostIncrease / 100;
  return worse;
}

// ===== model/household-budget.js =====
// Household budget: how much the farm has to earn net to cover the family's needs.

/**
 * @param {object} params
 * @returns {{spending: number, margin: number, savings: number, childBenefit: number,
 *            required: number, withoutChildBenefit: number}} yearly amounts in PLN
 */
function computeHouseholdBudget(params) {
  const spending = params.householdMonthlySpending * 12;
  const margin = (spending * params.householdSafetyMargin) / 100;
  const savings = params.householdSavings;
  const childBenefit = params.childBenefitChildren * CHILD_BENEFIT_PER_MONTH * 12;
  const withoutChildBenefit = spending + margin + savings;

  return {
    spending,
    margin,
    savings,
    childBenefit,
    required: Math.max(0, withoutChildBenefit - childBenefit),
    withoutChildBenefit,
  };
}

/** Net income the pessimistic scenario has to reach: from the household budget or set directly. */
function computeIncomeTarget(params) {
  return params.targetFromHouseholdBudget ? computeHouseholdBudget(params).required : params.minimumNetIncome;
}

const EVEN_MONTHS = Array(12).fill(1);

/** Splits a yearly amount into 12 monthly amounts proportional to the profile. */
function spreadOverMonths(total, profile = EVEN_MONTHS) {
  const weightSum = profile.reduce((sum, weight) => sum + weight, 0) || 1;
  return profile.map(weight => (total * weight) / weightSum);
}

/**
 * @param {object} results - output of simulateFarm (revenueItems, costItems, subsidyItems)
 * @param {object} params
 * @returns {{months: object[], minBalance: number, minBalanceMonth: number,
 *   householdDraw: number, closingBalance: number}}
 */
function computeMonthlyCashflow(results, params) {
  const months = Array.from({ length: 12 }, () => ({
    inflows: 0,
    subsidy: 0,
    outflows: 0,
    household: 0,
    netIncome: 0,
    balance: 0,
  }));
  const addToMonths = (field, items, profileOf) => {
    for (const [item, total] of Object.entries(items))
      spreadOverMonths(total, profileOf(item)).forEach((amount, month) => (months[month][field] += amount));
  };
  addToMonths('inflows', results.revenueItems, item => CASHFLOW_PROFILES.revenue[item]);
  addToMonths('outflows', results.costItems, item => CASHFLOW_PROFILES.costs[item]);
  addToMonths('subsidy', results.subsidyItems, item =>
    item === 'animalWelfare' ? CASHFLOW_PROFILES.animalWelfare : CASHFLOW_PROFILES.subsidies
  );

  const childBenefit = params.childBenefitChildren * CHILD_BENEFIT_PER_MONTH;
  const householdDraw = Math.max(0, params.householdMonthlySpending - childBenefit);
  let balance = params.openingCash;
  let minBalance = Infinity;
  let minBalanceMonth = 0;
  months.forEach((month, index) => {
    month.household = householdDraw;
    month.netIncome = month.inflows + month.subsidy - month.outflows;
    balance += month.netIncome - month.household;
    month.balance = balance;
    if (balance < minBalance) {
      minBalance = balance;
      minBalanceMonth = index;
    }
  });

  return { months, minBalance, minBalanceMonth, householdDraw, closingBalance: balance };
}

// ===== model/warnings.js =====
// Warnings and hints about the current plan. Each warning has a level ("bad", "warn", "info"),
// a key of its text in locales → warnings, and the values for the text's placeholders.

/**
 * @param {object} params - params after soil adjustment
 * @param {object} inputParams - params as set by the user
 * @param {object} results - results computed so far
 * @returns {{level: string, key: string, values?: object}[]}
 */
function collectWarnings(params, inputParams, results) {
  const warnings = [];
  const add = (level, key, values) => warnings.push({ level, key, values });

  addLandAndFeedWarnings(params, results, add);
  addStockingWarnings(params, results, add);
  addLabourWarnings(params, results, add);
  addSalesWarnings(params, results, add);
  addEcoSchemeWarnings(params, results, add);
  addGrazingAndRotationWarnings(params, results, add);
  addOtherWarnings(params, inputParams, results, add);
  return warnings;
}

/** Land allocated beyond the farm, feed shortages and surpluses. */
function addLandAndFeedWarnings(params, results, add) {
  const number = formatNumber;
  const { grainBalance, hayBalance, strawBalance } = results;
  const grainPerHen = (params.henFeedGramsPerDay / 1e6) * 365 * 0.9 * (1 - params.rangeFeedSaving / 100);

  if (results.arableHa < -0.001) add('bad', 'landOverAllocated', { hectares: number(-results.arableHa, 1) });
  if (params.orchardHa + params.kitchenGardenHa > params.farmyardHa + 0.001)
    add('bad', 'gardenExceedsFarmyard');
  if (grainBalance < -0.05)
    add('bad', 'grainShortage', {
      tonnes: number(-grainBalance, 1),
      cerealHa: number(-grainBalance / params.cerealYield, 1),
      arableHa: number(-grainBalance / params.cerealYield / (params.cerealShare / 100), 1),
      hens: number(-grainBalance / grainPerHen, 0),
    });
  if (hayBalance < -0.05)
    add('bad', 'hayShortage', {
      tonnes: number(-hayBalance, 1),
      meadowHa: number(-hayBalance / (params.meadowYield * 0.75), 1),
    });
  if (strawBalance < -0.05) add('warn', 'strawShortage', { tonnes: number(-strawBalance, 1) });
  if (results.sawdustTonnes > 0.05)
    add('info', 'sawdustReplacesStraw', {
      tonnes: number(results.sawdustTonnes, 1),
      cubicMetres: number(results.sawdustTonnes / 0.22, 0),
      cost: number(results.sawdustTonnes * params.sawdustPrice, 0),
    });
  if (results.grainSoldTonnes > 0.05)
    add('info', results.grainNeed < 0.05 ? 'grainSoldAll' : 'grainSold', {
      tonnes: number(results.grainSoldTonnes, 1),
      price: number(params.grainSalePrice, 0),
      revenue: number(results.revenueItems.grainSales, 0),
      reserve: number(params.feedReserveShare, 0),
    });
  // grain kept as the reserve after a sale is not a surplus to use up
  else if (grainBalance > 2)
    add('info', 'grainSurplus', {
      tonnes: number(grainBalance, 1),
      hens: number(grainBalance / grainPerHen, 0),
    });
  if (hayBalance > 8) add('info', 'haySurplus', { tonnes: number(hayBalance, 1) });
}

/** Livestock units per hectare outside the subsidy range or too many on grassland. */
function addStockingWarnings(params, results, add) {
  const number = formatNumber;
  const density = results.livestockUnitsPerHa;
  if (params.organicPayment && params.livestockDensityBonus && (density < 0.5 || density > 1.5))
    add('warn', 'stockingOutsideBonusRange', { density: number(density, 2) });
  if (results.grasslandStocking > 2) add('warn', 'grasslandOverstocked');
}

/** Too few or too many hours for the family, peak months and the weekly limit. */
function addLabourWarnings(params, results, add) {
  const number = formatNumber;
  const { labourUtilisation, totalHours, availableHours } = results;

  if (labourUtilisation > 1)
    add('bad', 'notEnoughHours', {
      needed: number(totalHours, 0),
      available: number(availableHours, 0),
      missing: number(totalHours - availableHours, 0),
    });
  else if (labourUtilisation > 0.85)
    add('warn', 'littleSpareTime', { percent: number(labourUtilisation * 100, 0) });
  else if (labourUtilisation < 0.5)
    add('info', 'muchSpareTime', {
      percent: number(labourUtilisation * 100, 0),
      needed: number(totalHours, 0),
      available: number(availableHours, 0),
    });
  if (availableHours > 0 && results.peakMonthHours > (availableHours / 12) * 1.3)
    add('warn', 'peakMonthOverload', {
      peak: number(results.peakMonthHours, 0),
      monthly: number(availableHours / 12, 0),
    });
  if (results.weeklyHoursPeak > params.weeklyHoursLimit)
    add('warn', 'weeklyLimitExceeded', {
      peak: number(results.weeklyHoursPeak, 0),
      limit: number(params.weeklyHoursLimit, 0),
    });
}

/** Sales volumes, tax thresholds and rules for particular species. */
function addSalesWarnings(params, results, add) {
  const number = formatNumber;
  if (results.market.eggsPerWeek > 500)
    add('info', 'manyEggsToSell', { boxes: number(results.market.eggsPerWeek / 10, 0) });
  if (results.costItems.retailTax > 0)
    add('info', 'directSalesTaxThreshold', { tax: number(results.costItems.retailTax, 0) });
  if (params.turkeys > 0 && params.layingHens + params.broilers > 0) add('warn', 'turkeysWithHens');
  if (results.parcels > 0) add('info', 'parcelsSeason', { parcels: number(results.parcels, 0) });
  if (results.lambsSoldAsMeat > 0) {
    const meatIncomePerLamb =
      results.lambCarcassKg * params.lambMeatPricePerKg -
      params.lambSlaughterCost -
      results.lambCarcassKg * params.butcheryCostPerKg -
      (results.slaughter.kmBySpecies.sheep * params.trailerCostPerKm) / results.lambsSoldAsMeat;
    if (meatIncomePerLamb < params.lambLivePrice)
      add('info', 'lambMeatLessThanLive', {
        meat: number(meatIncomePerLamb, 0),
        live: number(params.lambLivePrice, 0),
      });
  }
  if (params.sheep > 0 && params.sheep < 10) add('info', 'sheepPaymentMinimum');
  if (params.goats > 0 && params.goats < 5) add('info', 'goatPaymentMinimum');
  if (params.ownHatching && results.cockerels > 0)
    add('info', 'ownHatching', {
      chicks: number(results.chicks, 0),
      cockerels: number(results.cockerels, 0),
    });
}

/** Eco-scheme practices chosen but not meeting their conditions. */
function addEcoSchemeWarnings(params, results, add) {
  const number = formatNumber;
  const carbon = results.carbonFarming;
  if ((params.catchCrops || params.carbonManure || params.carbonCropDiversity) && !carbon.qualifies)
    add('warn', 'carbonFarmingBelowMinimum', {
      points: number(carbon.totalPoints, 1),
      required: number(carbon.requiredPoints, 1),
    });
  if (params.carbonCropDiversity && !results.rotation.diversityOk)
    add('info', 'cropDiversityNotMet', {
      cerealPercent: Math.round(results.rotation.cerealShare * 100),
      crops: results.rotation.distinctCrops,
    });
}

/** Paddocks resting too short, root crops that do not fit the rotation, too much manure nitrogen. */
function addGrazingAndRotationWarnings(params, results, add) {
  const { grazingPlan } = results;
  const grazesPasture =
    params.pastureHa > 0 && params.dairyCows + params.sucklerCows + params.sheep + params.goats > 0;
  if (grazesPasture && grazingPlan.restDays < 25)
    add('warn', 'shortPastureRest', { days: grazingPlan.restDays });
  if (params.rootCrops && !results.rotation.rootCropsFit) add('info', 'rootCropsNoRoom');
  const { nitrogen } = results;
  if (nitrogen.perFarmedHa > nitrogen.limitPerHa)
    add('bad', 'nitrogenOverLimit', {
      perHa: formatNumber(nitrogen.perFarmedHa, 0),
      limit: nitrogen.limitPerHa,
    });
}

/** Disease rules, breeding, guardian dogs and soil class shares. */
function addOtherWarnings(params, inputParams, results, add) {
  if (params.pigs > 0) add('info', 'africanSwineFever');
  if (params.pigs > 0)
    add('info', 'pigPaddocks', { hectares: formatNumber(params.pigs / PIGS_PER_HA_OF_PADDOCK, 1) });
  if (results.sucklerCows > 0 && !params.ownBull) add('info', 'sucklerCowsNeedBull');
  if (params.ridesPerYear > 0 && params.horses > 0) add('info', 'ridingIsABusiness');
  if (params.guardDogs > 0 && results.dogs.boughtKg > 1)
    add('info', 'dogFoodBought', { kg: formatNumber(results.dogs.boughtKg, 0) });
  if (params.sheep + params.goats > 0 && params.guardDogs === 0) add('info', 'wolvesNoDogs');
  for (const landUse of SOIL_LAND_USES) {
    const total = sumBy(
      SOIL_CLASSES_WITH_SHARE,
      soilClass => inputParams[soilShareId(landUse, soilClass)] || 0
    );
    if (total > 100) add('warn', 'soilSharesOver100' + landUse.charAt(0).toUpperCase() + landUse.slice(1));
  }
}

/** Fattening pigs per hectare of paddock and year (organic rules: about 14 a hectare for 170 kg N). */
const PIGS_PER_HA_OF_PADDOCK = 12;

// ===== model/stages/land-and-animals.js =====
// Land use, herd and flock sizes, and livestock units.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Land ----------

function computeLandUse(params) {
  const arableHa =
    params.ownedHa +
    params.leasedHa -
    params.farmyardHa -
    params.pastureHa -
    params.meadowHa -
    params.marketGardenHa;
  const usableArableHa = Math.max(0, arableHa);
  // root crops take one field of the rotation out of the cereals
  const cerealAndRootHa = (usableArableHa * params.cerealShare) / 100;
  const rotation = computeRotation(params);
  const rootCropHa = Math.min(cerealAndRootHa, (usableArableHa * rotation.rootFields) / rotation.fieldCount);
  const cerealHa = cerealAndRootHa - rootCropHa;
  const cloverHa = usableArableHa - cerealAndRootHa;
  const orchardHa = Math.min(params.orchardHa, params.farmyardHa);
  const farmedHa = params.pastureHa + params.meadowHa + usableArableHa + orchardHa + params.marketGardenHa;
  const grasslandHa = params.pastureHa + params.meadowHa;
  return { arableHa, usableArableHa, cerealHa, rootCropHa, cloverHa, farmedHa, orchardHa, grasslandHa };
}

// ---------- Animals ----------

/** Share of suckler cows that rear a calf each year, and of the cows replaced each year. */
const SUCKLER_CALVING_RATE = 0.9;
const SUCKLER_REPLACEMENT_RATE = 0.15;
/** Beef heifers being reared at any time per replacement needed (they calve at about two years). */
const BEEF_HEIFERS_PER_REPLACEMENT = 2;
/** Shed places of one finisher and one beef heifer, relative to a cow. */
const SHED_PLACES_PER_FINISHER = 0.7;
const SHED_PLACES_PER_BEEF_HEIFER = 0.6;
/** Days of winter housing that the straw norms per head assume. */
const REFERENCE_WINTER_DAYS = 165;

function computeHerdStructure(params) {
  const replacementHeifers = params.dairyCows > 0 ? (2 * params.dairyCows) / params.lactationsPerCow : 0;
  const bulls = params.ownBull && params.dairyCows > 0 ? 1 : 0;
  const kids = params.goats * params.kidsPerDoe;
  const kidsSold = (kids * params.kidsSoldShare) / 100;
  const sucklerCows = params.sucklerCows;
  const beefCalves = sucklerCows * SUCKLER_CALVING_RATE;
  const beefReplacements = sucklerCows * SUCKLER_REPLACEMENT_RATE;
  const beefCalvesKept = Math.max(0, beefCalves - beefReplacements);
  const weanersSold = (beefCalvesKept * params.weanersSoldShare) / 100;
  const finishers = beefCalvesKept - weanersSold;
  const beefHeifers = beefReplacements * BEEF_HEIFERS_PER_REPLACEMENT;
  const lambsPerEwe = params.lambsPerLambing * params.lambingsPerEwe;
  // straw for bedding scales with the length of winter housing
  const winterFactor = (365 - params.grazingDays) / REFERENCE_WINTER_DAYS;
  const beefSystem = BEEF_SYSTEMS[params.beefSystem] || BEEF_SYSTEMS.mixed;
  const beefShedPlaces =
    (sucklerCows + finishers * SHED_PLACES_PER_FINISHER + beefHeifers * SHED_PLACES_PER_BEEF_HEIFER) *
    beefSystem.shedPlacesFactor;
  const dairyShedPlaces = params.dairyCows + replacementHeifers + bulls;
  return {
    replacementHeifers,
    bulls,
    kids,
    kidsSold,
    sucklerCows,
    beefReplacements,
    weanersSold,
    finishers,
    beefHeifers,
    lambsPerEwe,
    winterFactor,
    beefSystem,
    beefShedPlaces,
    dairyShedPlaces,
    cattleShedPlaces: dairyShedPlaces + beefShedPlaces,
  };
}

// ---------- Livestock units (approximate conversion factors) ----------

function computeLivestockUnits(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers, farmedHa, grasslandHa } = results;
  const livestockUnitsByAnimal = {
    dairyCows: params.dairyCows,
