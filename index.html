}

// ===== ui/panels/next-steps.js =====
// Panel "What next": simulates small steps (one more cow, 30 more hens, ...) and shows what each
// adds and which limits it hits. Step labels: locales/pl.json → nextSteps.steps.

const NEXT_STEPS = [
  { key: 'addDairyCow', id: 'dairyCows', change: 1 },
  { key: 'moreCheese', id: 'cheeseShare', change: 10, max: 80 },
  { key: 'addHens', id: 'layingHens', change: 30 },
  { key: 'addBroilers', id: 'broilers', change: 50 },
  { key: 'addGeese', id: 'geese', change: 5 },
  { key: 'addDucks', id: 'ducks', change: 20 },
  { key: 'addGuineaFowl', id: 'guineaFowl', change: 20 },
  { key: 'addRabbitDoe', id: 'rabbits', change: 1 },
  { key: 'addEwes', id: 'sheep', change: 2 },
  { key: 'addPigsForSale', id: 'pigsForSale', change: 2 },
  { key: 'addSucklerCow', id: 'sucklerCows', change: 1 },
  { key: 'addBeehives', id: 'beehives', change: 2 },
  { key: 'addVegetables', id: 'marketGardenHa', change: 0.1 },
  { key: 'addMushroomLogs', id: 'mushroomLogs', change: 50 },
  { key: 'sellMoreFruit', id: 'fruitSoldShare', change: 20, max: 90 },
  { key: 'leaseMeadow', id: 'leasedHa', change: 1, also: { meadowHa: 1 } },
  { key: 'removeHorse', id: 'horses', change: -1, min: 0 },
  { key: 'removeRabbitDoe', id: 'rabbits', change: -1, min: 0 },
];

const roundTo2 = value => +value.toFixed(2);

const feedFromOwnLand = results =>
  results.grainBalance >= -0.05 &&
  results.hayBalance >= -0.05 &&
  results.strawBalance >= -0.05 &&
  results.grazingSurplus >= -0.05;

function describeFeedShortage(results) {
  const n = value => formatNumber(-value, 1);
  return [
    results.grainBalance < -0.05 ? t('comparison.shortage.grain', { tonnes: n(results.grainBalance) }) : '',
    results.hayBalance < -0.05 ? t('comparison.shortage.hay', { tonnes: n(results.hayBalance) }) : '',
    results.strawBalance < -0.05 ? t('comparison.shortage.straw', { tonnes: n(results.strawBalance) }) : '',
    results.grazingSurplus < -0.05 ? t('nextSteps.pastureShortage') : '',
  ]
    .filter(Boolean)
    .join(', ');
}

/** Simulates every step and sorts them: steps within the limits first, then by the pessimistic gain. */
function evaluateNextSteps() {
  const base = simulateFarm(params);
  const basePessimistic = simulateFarm(applyPessimisticScenario(params));
  const options = [];
  for (const step of NEXT_STEPS) {
    const current = params[step.id] || 0;
    const value = roundTo2(current + step.change);
    if (step.change < 0 && current <= (step.min ?? 0)) continue;
    if (step.max !== undefined && value > step.max) continue;

    const changedParams = { ...params, [step.id]: value };
    if (step.also) for (const id in step.also) changedParams[id] = roundTo2(params[id] + step.also[id]);
    const realistic = simulateFarm(changedParams);
    const pessimistic = simulateFarm(applyPessimisticScenario(changedParams));
    const feedOk = feedFromOwnLand(realistic);
    const peakHours = pessimistic.weeklyHoursPeak;
    options.push({
      step,
      changedParams,
      netChange: realistic.netIncome - base.netIncome,
      pessimisticChange: pessimistic.netIncome - basePessimistic.netIncome,
      hoursChange: realistic.totalHours - base.totalHours,
      capexChange: realistic.capex - base.capex,
      peakHours,
      feedOk,
      feedShortage: describeFeedShortage(realistic),
      fits: peakHours <= params.weeklyHoursLimit && feedOk,
    });
  }
  options.sort((a, b) => b.fits - a.fits || b.pessimisticChange - a.pessimisticChange);
  return options;
}

/** Pills naming what stops a step (peak hours, missing feed), or one "fits" pill. */
function nextStepLimitsHtml(option) {
  const limits = [
    option.peakHours > params.weeklyHoursLimit
      ? t('nextSteps.peak', { hours: formatNumber(option.peakHours, 0) })
      : '',
    option.feedOk ? '' : t('comparison.missing', { items: option.feedShortage }),
  ].filter(Boolean);

  if (!limits.length) return element('span', { class: 'pill ok' }, t('nextSteps.fits'));
  return limits.map(limit => element('span', { class: 'pill warn' }, escapeHtml(limit))).join(' ');
}

function nextStepRow(option, index, signed) {
  const perExtraHour = option.hoursChange > 1 ? formatNumber(option.netChange / option.hoursChange, 0) : '–';
  const hoursChange = (option.hoursChange >= 0 ? '+' : '') + formatNumber(option.hoursChange, 0);
  const capexChange = option.capexChange > 0 ? '+' + formatPln(option.capexChange) : '–';
  const applyButton = element(
    'button',
    { class: 'btn', type: 'button', 'data-next-step': index },
    t('nextSteps.apply')
  );

  return tableRow([
    cell(escapeHtml(t(`nextSteps.steps.${option.step.key}`))),
    numberCell(signed(option.netChange), option.netChange < 0),
    numberCell(signed(option.pessimisticChange), option.pessimisticChange < 0),
    numberCell(hoursChange),
    numberCell(perExtraHour),
    numberCell(capexChange),
    cell(nextStepLimitsHtml(option)),
    cell(applyButton),
  ]);
}

function renderNextSteps() {
  const options = evaluateNextSteps();
  const signed = amount => (amount >= 0 ? '+' : '') + formatPln(amount);
  const columns = [
    'change',
    'income',
    'pessimistic',
    'hours',
    'perExtraHour',
    'investments',
    'limits',
    'apply',
  ];
  const header = tableHeader(
    columns.map(column => (column === 'apply' ? '' : t(`nextSteps.columns.${column}`))),
    index => index > 0 && index < 6
  );
  const rows = options.map((option, index) => nextStepRow(option, index, signed));
  byId('next-steps-table').innerHTML = header + tableBody(rows);

  byId('next-steps-table')
    .querySelectorAll('[data-next-step]')
    .forEach(button =>
      button.addEventListener('click', () => {
        const option = options[+button.dataset.nextStep];
        if (!option) return;
        const { step, changedParams } = option;
        params[step.id] = changedParams[step.id];
        if (step.also) for (const id in step.also) params[id] = changedParams[id];
        syncInputs();
        onParamsChanged();
      })
    );

  const best = options.find(option => option.fits && option.pessimisticChange > 0);
  byId('next-steps-note').textContent = best
    ? t('nextSteps.best', {
        step: t(`nextSteps.steps.${best.step.key}`),
        amount: signed(best.pessimisticChange),
      })
    : t('nextSteps.nothingFits');
}

// ===== ui/panels/sensitivity.js =====
// Panel "What changes the result most": each assumption moved by ±20%, as a tornado chart.
// Factor names: locales/pl.json → sensitivity.factors.

const SENSITIVITY_FACTORS = [
  'cheesePrice',
  'milkPrice',
  'milkPerCow',
  'cheeseYield',
  'eggPrice',
  'eggsPerHen',
  'broilerPricePerKg',
  'goosePrice',
  'lambMeatPricePerKg',
  'duckPricePerKg',
  'porkBoxPricePerKg',
  'honeyPrice',
  'pastureYield',
  'meadowYield',
  'cerealYield',
  'cloverYield',
  'fixedCosts',
  'henFeedGramsPerDay',
  'pulletPrice',
  'leaseRentPerHa',
];

const SENSITIVITY_STEP = 0.2;
const SENSITIVITY_MIN_EFFECT_PLN = 200;
const SENSITIVITY_MAX_ROWS = 12;

/** Change of net income when each factor is 20% lower and 20% higher, largest effect first. */
function sensitivityRows() {
  const baseNet = simulateFarm(params).netIncome;
  const netChangeWith = (id, factor) =>
    simulateFarm({ ...params, [id]: params[id] * factor }).netIncome - baseNet;

  const rows = [];
  for (const id of SENSITIVITY_FACTORS) {
    if (!params[id]) continue;

    const lower = netChangeWith(id, 1 - SENSITIVITY_STEP);
    const higher = netChangeWith(id, 1 + SENSITIVITY_STEP);
    if (Math.abs(higher) + Math.abs(lower) < SENSITIVITY_MIN_EFFECT_PLN) continue;

    rows.push({
      label: t(`sensitivity.factors.${id}`),
      lower,
      higher,
      span: Math.abs(higher - lower),
    });
  }

  rows.sort((a, b) => b.span - a.span);
  return { baseNet, rows: rows.slice(0, SENSITIVITY_MAX_ROWS) };
}

function renderSensitivity() {
  const { baseNet, rows } = sensitivityRows();
  const chart = { width: 640, rowHeight: 24, padLeft: 150, padRight: 70, top: 22 };
  const height = chart.top + rows.length * chart.rowHeight + 26;
  const plotWidth = chart.width - chart.padLeft - chart.padRight;
  const largestEffect = row => Math.max(Math.abs(row.lower), Math.abs(row.higher));
  const maxEffect = Math.max(1, ...rows.map(largestEffect));
  const centre = chart.padLeft + plotWidth / 2;
  const scale = plotWidth / 2 / maxEffect;

  let svg = element(
    'text',
    { x: centre, y: 14, 'text-anchor': 'middle', class: 'ax' },
    t('sensitivity.title', { net: formatPln(baseNet) })
  );

  rows.forEach((row, index) => {
    const y = chart.top + index * chart.rowHeight;
    const label = escapeHtml(row.label);
    svg += element(
      'text',
      { x: chart.padLeft - 8, y: y + 16, 'text-anchor': 'end', 'font-size': 12.5 },
      label
    );
    svg += sensitivityBar({ chart, centre, scale, y, label, effect: row.lower, isHigher: false });
    svg += sensitivityBar({ chart, centre, scale, y, label, effect: row.higher, isHigher: true });

    const thousands = formatNumber(Math.round(largestEffect(row) / 100) / 10, 1);
    svg += axisText(
      chart.width - chart.padRight + 6,
      y + 16,
      '±' + t('units.thousandsPln', { value: thousands })
    );
  });

  svg += element('line', {
    x1: centre,
    x2: centre,
    y1: chart.top,
    y2: chart.top + rows.length * chart.rowHeight,
    stroke: 'var(--muted)',
  });

  const chartElement = byId('sensitivity-chart');
  chartElement.setAttribute('viewBox', `0 0 ${chart.width} ${height}`);
  chartElement.innerHTML = svg;
  byId('sensitivity-note').textContent = sensitivityNote(rows);
}

/** One bar of the tornado chart: green to the right when the result improves, red to the left. */
function sensitivityBar({ chart, centre, scale, y, label, effect, isHigher }) {
  const width = Math.abs(effect) * scale;
  const direction = isHigher ? '+20%' : '−20%';
  const sign = effect >= 0 ? '+' : '';
  const tooltip = `${label} ${direction}: ${sign}${formatPln(effect)}`;

  return withTooltip(
    'rect',
    {
      x: effect >= 0 ? centre : centre - width,
      y: y + 4,
      width: Math.max(1, width),
      height: chart.rowHeight - 8,
      rx: 2,
      fill: effect >= 0 ? 'var(--ok)' : 'var(--bad)',
      opacity: isHigher ? 0.75 : 0.5,
    },
    tooltip
  );
}

function sensitivityNote(rows) {
  if (!rows.length) return '';

  const topFactors = rows
    .slice(0, 3)
    .map(row => row.label.toLowerCase())
    .join(', ');
  return t('sensitivity.note', { factors: topFactors });
}

// ===== ui/farm/plan-state.js =====
// View state shared by the farm plan, the rotation table and the calendar.

const planView = {
  /** Selected month, 0–11; starts at the current month. */
  month: new Date().getMonth(),
  /** Selected year of the rotation, 1-based. */
  rotationYear: 1,
  /** Clicked area of the plan: "farmyard", "pasture", "meadow", "garden" or "plot<number>". */
  selectedArea: null,
  /** Results of the last render, used when only the view changes. */
  results: null,
};

const isGrazingMonth = month => month >= 3 && month <= 9;

// ===== ui/farm/crops.js =====
// Crops of the rotation, catch-crop and stubble-crop mixtures, and what happens on a field
// in a given month. Texts: locales/pl.json → crops, catchCropMixes, stubbleCropMixes, fieldStatus.

const CROP_COLORS = {
  clover: 'var(--color-clover)',
  triticale: 'var(--color-cereal)',
  rye: 'var(--color-cereal)',
  mixedGrain: 'var(--color-cereal)',
  oats: 'var(--color-cereal)',
  roots: 'var(--color-roots)',
};

/** Winter catch crops sown after harvest; the `catchCropMix` parameter is an index into this list. */
const CATCH_CROP_MIXES = [
  { id: 'ryeWithVetch', costPerHa: 400, forageYield: 1.0 },
  { id: 'landsberger', costPerHa: 550, forageYield: 2.5, lateSowing: true },
  { id: 'phaceliaBuckwheatRye', costPerHa: 350, forageYield: 0.5 },
  { id: 'winterTurnipRapeRye', costPerHa: 300, forageYield: 2.0 },
  { id: 'multiSpeciesRye', costPerHa: 600, forageYield: 1.0 },
  { id: 'triticaleWinterPea', costPerHa: 450, forageYield: 2.5, lateSowing: true },
];

/** Short stubble crops before a winter cereal; the `stubbleCropMix` parameter is an index into this list. */
const STUBBLE_CROP_MIXES = [
  { id: 'whiteMustard', costPerHa: 150, forageYield: 0.3 },
  { id: 'phaceliaBuckwheat', costPerHa: 250, forageYield: 0.2 },
  { id: 'oatsVetchPea', costPerHa: 350, forageYield: 1.5 },
];

const cropName = id => t(`crops.${id}.name`);
const currentCatchMix = () => CATCH_CROP_MIXES[params.catchCropMix || 0];
const catchMixLabel = () => t(`catchCropMixes.${currentCatchMix().id}`).toLowerCase();
const stubbleMixLabel = () =>
  t(`stubbleCropMixes.${STUBBLE_CROP_MIXES[params.stubbleCropMix || 0].id}`).toLowerCase();

/** The current rotation (see model/rotation.js). */
const currentRotation = () => computeRotation(params);

/**
 * Crop on a field (1-based) in a rotation year (1-based); `note` numbers the clover years
 * when clover stays for more than one year.
 */
function fieldCrop(rotation, field, year) {
  const position = rotationPosition(rotation, field, year);
  const id = rotation.crops[position];
  const note =
    id === 'clover' && rotation.cloverYears > 1 ? t('crops.cloverYear', { year: position + 1 }) : '';
  return { id, note };
}

/** Crop name with the clover year, e.g. "Koniczyna czerwona z trawami (rok 2)". */
const cropWithNote = crop => cropName(crop.id) + (crop.note ? ` (${crop.note})` : '');

/** What happens on a field in a month (0–11) of a rotation year, given the crops before and after. */
function fieldStatus(field, year, month, rotation) {
  const crop = fieldCrop(rotation, field, year).id;
  const next = fieldCrop(rotation, field, year + 1).id;
  const previous = fieldCrop(rotation, field, year - 1 + rotation.fieldCount).id;
  const nextName = cropName(next).toLowerCase();
  const status = (key, index, values) => t(`fieldStatus.${key}.${index}`, values);

  if (month <= 2 && isCerealBeforeCatchCrop(previous, crop))
    return params.catchCrops ? status('catchCropInSpring', month) : messages(`crops.${crop}.months`)[month];
  if (month >= 7 && isCerealBeforeCatchCrop(crop, next))
    return params.catchCrops
      ? status('catchCropAfterHarvest', month - 7, { mix: catchMixLabel() })
      : status('noCatchCropAfterHarvest', month - 7);
  if (month >= 7 && month <= 8 && params.stubbleCrop && isCerealBeforeWinterCereal(crop, next)) {
    const incorporation = t(
      params.stubbleCropMix === 2 ? 'fieldStatus.stubbleCutOrGrazed' : 'fieldStatus.stubblePloughed'
    );
    return status('stubbleCrop', month - 7, { mix: stubbleMixLabel(), incorporation, crop: nextName });
  }
  if (month >= 7 && isCerealBeforeWinterCereal(crop, next))
    return status('beforeWinterCereal', month - 7, { crop: nextName });
  if (month >= 8 && crop === 'clover' && WINTER_CEREALS.includes(next))
    return status('cloverBeforeWinterCereal', month - 8, { crop: nextName });
  if (month >= 8 && isWinterCatchCropSlot(crop) && !WINTER_CEREALS.includes(next))
    return status('stubbleBeforeSpringCrop', month - 8);
  return messages(`crops.${crop}.months`)[month];
}

// ===== ui/farm/plan-map.js =====
// Interactive farm plan: farmyard, pasture paddocks, meadow and rotation fields drawn side by
// side in proportion to their area, showing what happens in the selected month.

const PLAN_SIZE = { width: 1000, height: 540, pad: 14, top: 40, gap: 8, minAreaWidth: 130 };

function renderFarmPlan(results) {
  if (!results) return;
  planView.results = results;

  const rotation = currentRotation();
  if (planView.rotationYear > rotation.fieldCount) planView.rotationYear = 1;

  renderPlanMonthButtons();
  renderGrazingControls(rotation);
  renderGrazingNote(results);

  const { width, height, pad, top, gap } = PLAN_SIZE;
  const areas = [
    { id: 'farmyard', hectares: params.farmyardHa, draw: drawFarmyard },
    { id: 'pasture', hectares: params.pastureHa, draw: drawPasture },
    { id: 'meadow', hectares: params.meadowHa, draw: drawMeadow },
    { id: 'arable', hectares: results.usableArableHa + params.marketGardenHa, draw: drawArable },
  ].filter(area => area.hectares > 0.01);
  const widths = planAreaWidths(areas);

  let svg = element('rect', { x: 0, y: 0, width, height, fill: 'var(--surface)' });
  svg += drawAccessRoad();

  let x = pad;
  areas.forEach((area, index) => {
    const box = { x, y: top, width: widths[index], height: height - top - pad };
    svg += area.draw(box, results, rotation);
    x += box.width + gap;
  });

  byId('plan-svg').innerHTML = svg;
  byId('plan-legend').innerHTML = pastureLegendHtml(results.grazingPlan);
  byId('plan-info').innerHTML = describePlanSelection(results, planView.selectedArea || 'pasture');
}

function renderPlanMonthButtons() {
  document
    .querySelectorAll('[data-month]')
    .forEach(button => button.classList.toggle('on', +button.dataset.month === planView.month));
}

function drawAccessRoad() {
  const { width, pad } = PLAN_SIZE;
  const month = messages('months.names')[planView.month].toLowerCase();
  const road = element('line', {
    x1: pad,
    x2: width - pad,
    y1: 22,
    y2: 22,
    stroke: 'var(--muted)',
    'stroke-width': 2,
    'stroke-dasharray': '10 6',
  });
  return road + element('text', { x: pad, y: 15, class: 'ax' }, t('plan.road', { month }));
}

/** Widths proportional to area, at least `minAreaWidth`, shrinking the wide ones to fit. */
function planAreaWidths(areas) {
  const { width, pad, gap, minAreaWidth } = PLAN_SIZE;
  const available = width - 2 * pad - (areas.length - 1) * gap;
  const totalHa = sumBy(areas, area => area.hectares) || 1;
  let widths = areas.map(area => Math.max(minAreaWidth, (area.hectares / totalHa) * available));

  const overflow = sumBy(widths, w => w) - available;
  if (overflow > 0) {
    const spare = widths.map(w => Math.max(0, w - minAreaWidth));
    const spareTotal = sumBy(spare, w => w) || 1;
    widths = widths.map((w, index) => w - (overflow * spare[index]) / spareTotal);
  }
  return widths;
}

/** Thicker outline of the clicked area. */
const selectionStroke = area => (planView.selectedArea === area ? { 'stroke-width': 3 } : {});

/** Background of a whole plan area, the clickable target of `data-area`. */
const areaBackground = (box, area, color, opacity) =>
  element('rect', {
    x: box.x,
    y: box.y,
    width: box.width,
    height: box.height,
    fill: color,
    opacity,
    stroke: color,
    ...selectionStroke(area),
  });

/** Centred label; clicks go through to the area under it. */
const planLabel = (x, y, text, size = 12, bold = false) =>
  element(
    'text',
    {
      x,
      y,
      'text-anchor': 'middle',
      'font-size': size,
      'font-weight': bold ? 700 : null,
      'pointer-events': 'none',
    },
    escapeHtml(text)
  );

const areaCaption = (box, text) =>
  element('text', { x: box.x + box.width / 2, y: box.y - 6, 'text-anchor': 'middle', class: 'ax' }, text);

/** White box behind a label in the middle of an area. */
const labelBackground = (x, y, width, height, opacity) =>
  element('rect', { x, y, width, height, rx: 6, fill: 'var(--surface)', opacity });

function drawFarmyard(box, results) {
  const winter = !isGrazingMonth(planView.month);
  const label = key => t(`plan.farmyard.${key}`);
  const henHousing = params.winterPolytunnel
    ? label(winter ? 'tunnelWinter' : 'tunnelSummer')
    : label(winter ? 'henHousesWinter' : 'henHousesSummer');

  const blocks = [
    { text: label('house'), share: 0.12 },
    { text: label('oldBarn'), share: 0.14, shown: params.dairyCows > 0 },
    {
      text: label(winter ? 'cattleShedWinter' : 'cattleShedSummer'),
      share: 0.14,
      shown: params.dairyCows + params.sucklerCows > 0,
      occupied: winter,
    },
    {
      text: label(winter ? 'sheepShedWinter' : 'sheepShedSummer'),
      share: 0.1,
      shown: params.sheep + params.goats > 0,
      occupied: winter,
    },
    { text: henHousing, share: 0.09, shown: params.layingHens > 0, occupied: winter },
    {
      text: t('plan.farmyard.orchard', {
        geese: params.geese ? t('planInfo.farmyard.withGeese') : '',
        hectares: formatNumber(results.orchardHa, 1),
      }),
      share: 0.18,
      color: 'var(--color-pasture)',
    },
    {
      text: t('plan.farmyard.kitchenGarden', { hectares: formatNumber(params.kitchenGardenHa, 2) }),
      share: 0.09,
      color: 'var(--color-cereal)',
    },
  ].filter(block => block.shown !== false);

  let svg = areaBackground(box, 'farmyard', 'var(--color-farmyard)', '.18');

  const blockX = box.x + 8;
  const blockWidth = box.width - 16;
  const shareTotal = sumBy(blocks, block => block.share);
  let blockY = box.y + 8;
  for (const block of blocks) {
    const blockHeight = ((box.height - 16 - (blocks.length - 1) * 6) * block.share) / shareTotal;
    svg += element('rect', {
      x: blockX,
      y: blockY,
      width: blockWidth,
      height: blockHeight,
      rx: 3,
      fill: block.color || (block.occupied ? 'var(--color-cattle)' : 'var(--surface)'),
      opacity: block.color ? 0.35 : block.occupied ? 0.3 : 1,
      stroke: 'var(--color-farmyard)',
    });

    // a "|" in the text starts a new line
    const lines = block.text.split('|');
    lines.forEach((line, index) => {
      const lineY = blockY + blockHeight / 2 + 4 + (index - (lines.length - 1) / 2) * 14;
      svg += planLabel(blockX + blockWidth / 2, lineY, line);
    });
    blockY += blockHeight + 6;
  }

  const caption = t('plan.farmyard.caption', { hectares: formatNumber(params.farmyardHa, 1) });
  return element('g', { 'data-area': 'farmyard' }, svg + areaCaption(box, caption));
}

const PADDOCK_FILLS = {
  dairyCows: 'var(--color-cattle)',
  sucklerCows: 'var(--color-cattle)',
  sheep: 'var(--color-sheep)',
  layingHens: 'var(--color-poultry)',
  nextPaddock: 'var(--color-pasture)',
};

/**
 * Which paddock holds which animals this month: cows move forward every few days, sheep
 * follow one paddock behind, the mobile hen house three behind, suckler cows graze apart.
 */
/** Days the sheep and the hens follow the cows. */
const SHEEP_DAYS_BEHIND_COWS = 1;
const HENS_DAYS_BEHIND_COWS = 3;
/** The suckler herd grazes as a separate group, about a third of the way round. */
const SUCKLER_HERD_OFFSET_SHARE = 0.3;

/** Who grazes which paddock in the selected month (index → occupant). */
function paddockOccupants(paddockCount, grazingPlan) {
  const occupants = {};
  if (!isGrazingMonth(planView.month)) return occupants;

  const interval = grazingPlan.moveIntervalDays;
  const daysSinceTurnout = (planView.month - 3) * 30 + 10;
  const position = Math.floor(daysSinceTurnout / interval) % paddockCount;
  const paddockAt = offset => (((position + offset) % paddockCount) + paddockCount) % paddockCount;
  const paddocksBehind = days => -Math.max(1, Math.round(days / interval));

  if (params.dairyCows) occupants[paddockAt(1)] = 'nextPaddock';
  if (params.sheep) occupants[paddockAt(paddocksBehind(SHEEP_DAYS_BEHIND_COWS))] = 'sheep';
  if (params.layingHens) occupants[paddockAt(paddocksBehind(HENS_DAYS_BEHIND_COWS))] = 'layingHens';
  if (params.sucklerCows)
    occupants[paddockAt(Math.round(paddockCount * SUCKLER_HERD_OFFSET_SHARE))] = 'sucklerCows';
  if (params.dairyCows) occupants[position] = 'dairyCows';
  else if (params.sheep) occupants[position] = 'sheep';
  return occupants;
}

function paddockLabel(occupant) {
  if (!occupant) return '';
  if (occupant === 'sheep')
    return t(params.dairyCows ? 'plan.pasture.sheepAfterCows' : 'plan.pasture.sheepToday');
  if (occupant === 'layingHens') return t('plan.pasture.layingHens', { days: HENS_DAYS_BEHIND_COWS });
  return t(`plan.pasture.${occupant}`);
}

/** Pasture as two columns of paddocks with a lane between them. */
/** Paddocks smaller than this on the drawing get no text label. */
const MIN_LABELLED_PADDOCK_HEIGHT = 18;

function drawPasture(box, results) {
  const laneWidth = 16;
  const paddockCount = results.grazingPlan.paddockCount;
  const rows = Math.ceil(paddockCount / 2);
  const paddockWidth = (box.width - laneWidth) / 2;
  const paddockHeight = box.height / rows;
  const gap = paddockHeight > 8 ? 2 : 0.5;
  const occupants = paddockOccupants(paddockCount, results.grazingPlan);

  let svg = areaBackground(box, 'pasture', 'var(--color-pasture)', '.22');

  for (let side = 0; side < 2; side++) {
    for (let row = 0; row < rows; row++) {
      // paddocks are numbered down the left column and back up the right one
      const index = side ? paddockCount - 1 - row : row;
      if (side && index < rows) continue; // odd count: the right column is one shorter
      const occupant = occupants[index];
      const x = box.x + (side ? (box.width + laneWidth) / 2 : 0);
      const y = box.y + row * paddockHeight;
      const isCattle = occupant === 'dairyCows' || occupant === 'sucklerCows';

      svg += element('rect', {
        x: x + gap,
        y: y + gap,
        width: paddockWidth - 2 * gap,
        height: Math.max(0.5, paddockHeight - 2 * gap),
        fill: PADDOCK_FILLS[occupant] || 'none',
        opacity: isCattle ? 0.5 : occupant ? 0.32 : 1,
        stroke: 'var(--color-pasture)',
        'stroke-width': 1,
      });

      const label = paddockHeight >= MIN_LABELLED_PADDOCK_HEIGHT ? paddockLabel(occupant) : '';
      if (label) {
        svg += planLabel(
          x + paddockWidth / 2,
          y + paddockHeight / 2 + 4,
          label,
          11.5,
          occupant === 'dairyCows'
        );
      }
    }
  }

  const centreX = box.x + box.width / 2;
  svg += element('rect', {
    x: box.x + (box.width - laneWidth) / 2,
    y: box.y,
    width: laneWidth,
    height: box.height,
    fill: 'var(--surface)',
    stroke: 'var(--color-pasture)',
  });
  svg += element('line', {
    // water pipe along the lane
    x1: centreX,
    x2: centreX,
    y1: box.y + 4,
    y2: box.y + box.height - 4,
    stroke: 'var(--info)',
    'stroke-width': 2.5,
    'stroke-dasharray': '2 5',
  });

  if (!isGrazingMonth(planView.month)) {
    const centreY = box.y + box.height / 2;
    svg +=
      labelBackground(box.x + 20, centreY - 24, box.width - 40, 48, '.92') +
      planLabel(centreX, centreY - 3, t('plan.pasture.winterTitle'), 13, true) +
      planLabel(centreX, centreY + 15, t('plan.pasture.winterNote'), 11.5);
  }

  const caption = t('plan.pasture.caption', {
    hectares: formatNumber(params.pastureHa, 1),
    paddocks: paddockCount,
    paddockArea: paddockAreaText(results.grazingPlan.paddockHa),
  });
  return element('g', { 'data-area': 'pasture' }, svg + areaCaption(box, caption));
}

function drawMeadow(box) {
  const month = planView.month;
  const isCuttingMonth = month === 5 || month === 7;

  let svg = areaBackground(box, 'meadow', 'var(--color-meadow)', isCuttingMonth ? 0.55 : 0.3);
  for (let y = box.y + 14; y < box.y + box.height; y += 14) {
    svg += element('line', {
      x1: box.x + 6,
      x2: box.x + box.width - 6,
      y1: y,
      y2: y,
      stroke: 'var(--color-meadow)',
      'stroke-width': 1,
      opacity: '.6',
    });
  }

  const centreX = box.x + box.width / 2;
  const centreY = box.y + box.height / 2;
  svg +=
    labelBackground(box.x + 10, centreY - 26, box.width - 20, 44, '.9') +
    planLabel(centreX, centreY - 8, t('plan.meadow.title'), 14, true) +
    planLabel(centreX, centreY + 9, t(`plan.meadow.months.${month}`), 12);

  const caption = t('plan.meadow.caption', { hectares: formatNumber(params.meadowHa, 1) });
  return element('g', { 'data-area': 'meadow' }, svg + areaCaption(box, caption));
}

/** Rotation fields stacked by area, plus the market garden. */
function drawArable(box, results, rotation) {
  const fieldHa = results.usableArableHa / rotation.fieldCount;
  const strips = [];
  for (let field = 1; field <= rotation.fieldCount; field++) {
    const crop = fieldCrop(rotation, field, planView.rotationYear);
    strips.push({
      area: 'plot' + field,
      title: t('plan.arable.field', { field, crop: cropWithNote(crop) }),
      subtitle: t('plan.arable.fieldDetail', {
        hectares: formatNumber(fieldHa, 2),
        status: fieldStatus(field, planView.rotationYear, planView.month, rotation),
      }),
      hectares: fieldHa,
      color: CROP_COLORS[crop.id],
    });
  }
  if (params.marketGardenHa > 0.01) {
    strips.push({
      area: 'garden',
      title: t('plan.arable.marketGarden'),
      subtitle: t('units.hectares', { value: formatNumber(params.marketGardenHa, 2) }),
      hectares: params.marketGardenHa,
      color: 'var(--color-produce)',
    });
  }

  // every strip is at least 54 px high, then all are scaled to fill the box
  const totalHa = sumBy(strips, strip => strip.hectares) || 1;
  const minimumHeights = strips.map(strip => Math.max(54, (box.height * strip.hectares) / totalHa));
  const heightSum = sumBy(minimumHeights, h => h);
  const heights = minimumHeights.map(h => (h * box.height) / heightSum);

  let svg = '';
  let y = box.y;
  strips.forEach((strip, index) => {
    const stripHeight = heights[index];
    const centreX = box.x + box.width / 2;
    const background = element('rect', {
      x: box.x,
      y,
      width: box.width,
      height: stripHeight,
      fill: strip.color,
      opacity: index % 2 ? 0.42 : 0.3,
      stroke: strip.color,
      ...selectionStroke(strip.area),
    });
    const labels =
      planLabel(centreX, y + stripHeight / 2 - 4, strip.title, 12.5, true) +
      planLabel(centreX, y + stripHeight / 2 + 13, strip.subtitle, 11.5);
    svg += element('g', { 'data-area': strip.area }, background + labels);
    y += stripHeight;
  });

  const caption = t('plan.arable.caption', {
    hectares: formatNumber(results.usableArableHa + params.marketGardenHa, 1),
    year: planView.rotationYear,
  });
  return svg + areaCaption(box, caption);
}

/** Colours of the animals on the pasture, needed when paddocks are too small for labels. */
function pastureLegendHtml(grazingPlan) {
  if (!isGrazingMonth(planView.month) || params.pastureHa <= 0) return '';

  const occupants = new Set(Object.values(paddockOccupants(grazingPlan.paddockCount, grazingPlan)));
  const legendItem = occupant =>
    element(
      'span',
      {},
      element('i', { style: `background:${PADDOCK_FILLS[occupant]};opacity:.6` }) + paddockLabel(occupant)
    );
  return [...occupants].map(legendItem).join('');
}

// ===== ui/farm/plan-details.js =====
// Description of the clicked area of the farm plan in the selected month.

function describePlanSelection(results, area) {
  const month = planView.month;
  const monthName = messages('months.names')[month];
  const ha = (value, decimals = 1) => formatNumber(value, decimals);
  const paragraph = (text, className) => `<p${className ? ` class="${className}"` : ''}>${text}</p>`;

  if (area === 'pasture') {
    let html = `<h3>${t('planInfo.pasture.title', { hectares: ha(params.pastureHa) })}</h3>`;
    if (isGrazingMonth(month)) {
      const parts = [
        t('planInfo.pasture.grazing', { month: monthName }),
        params.dairyCows
          ? t('planInfo.pasture.cows', {
              count: params.dairyCows,
              interval: moveIntervalPhrase(params.grazingMoveIntervalDays),
            })
          : '',
        params.sucklerCows ? t('planInfo.pasture.sucklerCows', { count: params.sucklerCows }) : '',
        params.sheep ? t('planInfo.pasture.sheep') : '',
        params.layingHens ? t('planInfo.pasture.hens') : '',
        params.broilers && month >= 4 && month <= 9 ? t('planInfo.pasture.broilers') : '',
      ];
      html += paragraph(parts.filter(Boolean).join(' '));
      html += paragraph(t('planInfo.pasture.rest', { days: params.pastureRestDays }), 'small muted');
    } else {
      const liming = month === 2 ? ' ' + t('planInfo.pasture.liming') : '';
      html += paragraph(t('planInfo.pasture.winter', { month: monthName }) + liming);
    }
    return html;
  }

  if (area === 'meadow')
    return (
      `<h3>${t('planInfo.meadow.title', { hectares: ha(params.meadowHa) })}</h3>` +
      paragraph(
        t('planInfo.monthActivity', { month: monthName, activity: t(`planInfo.meadow.months.${month}`) })
      ) +
      paragraph(t('planInfo.meadow.hay', { tonnes: ha(results.meadowHay) }), 'small muted')
    );

  if (area && area.startsWith('plot')) {
    const field = +area.slice('plot'.length);
    const rotation = currentRotation();
    const crop = fieldCrop(rotation, field, planView.rotationYear);
    const nextCrop = fieldCrop(rotation, field, planView.rotationYear + 1);
    const status = fieldStatus(field, planView.rotationYear, month, rotation);
    return (
      `<h3>${t('planInfo.plot.title', { field, hectares: ha(results.usableArableHa / rotation.fieldCount, 2) })}</h3>` +
      paragraph(
        `<b>${t('planInfo.plot.year', { year: planView.rotationYear, crop: cropWithNote(crop) })}</b>`
      ) +
      paragraph(t('planInfo.monthActivity', { month: monthName, activity: status })) +
      paragraph(
        t('planInfo.plot.cropDetails', {
          sowing: t(`crops.${crop.id}.sowing`),
          harvest: t(`crops.${crop.id}.harvest`),
          usedFor: t(`crops.${crop.id}.usedFor`),
        }),
        'small'
      ) +
      paragraph(t('planInfo.plot.nextYear', { crop: cropWithNote(nextCrop) }), 'small muted')
    );
  }

  if (area === 'garden')
    return (
      `<h3>${t('planInfo.garden.title', { hectares: ha(params.marketGardenHa, 2) })}</h3>` +
      paragraph(
        t('planInfo.monthActivity', { month: monthName, activity: t(`planInfo.garden.months.${month}`) })
      )
    );

  const housing = isGrazingMonth(month)
    ? t('planInfo.farmyard.summer')
    : t('planInfo.farmyard.winter') +
      t(params.winterPolytunnel ? 'planInfo.farmyard.hensInTunnel' : 'planInfo.farmyard.hensAtFarmyard') +
      '.';
  const sheepAtNight = params.sheep ? ' ' + t('planInfo.farmyard.sheepAtNight') : '';
  return (
    `<h3>${t('planInfo.farmyard.title', { hectares: ha(params.farmyardHa) })}</h3>` +
    paragraph(`${monthName}: ${housing}${sheepAtNight}`) +
    paragraph(
      t('planInfo.farmyard.orchardAndGarden', {
        orchard: ha(results.orchardHa),
        geese: params.geese ? t('planInfo.farmyard.withGeese') : '',
        garden: ha(params.kitchenGardenHa, 2),
      }),
      'small muted'
    )
  );
}

// ===== ui/farm/rotation-panel.js =====
// Panel "Crop rotation": rotation length, catch and stubble crops, the field × year table,
// eco-scheme points and advice on where each cover crop fits.

function renderRotation(results) {
  if (!results) return;
  const rotation = currentRotation();
  const fieldHa = results.usableArableHa / rotation.fieldCount;
  byId('rotation-controls').innerHTML = rotationControlsHtml(rotation);
  byId('rotation-table').innerHTML = rotationTableHtml(rotation, fieldHa);
  byId('rotation-note').innerHTML = rotationNoteHtml(rotation, fieldHa);
  byId('catch-crop-summary').innerHTML = ecoSchemeSummaryHtml(results);
  byId('catch-crop-fields').innerHTML = coverCropAdviceHtml(rotation);
  byId('crops-table').innerHTML = cropsTableHtml(rotation);
}

const ROTATION_FIELD_OPTIONS = [3, 4, 5, 6, 7, 8];

const toggleButton = (isOn, attribute, value, text) =>
  `<button class="btn${isOn ? ' on' : ''}" type="button" ${attribute}="${value}">${text}</button>`;

function rotationControlsHtml(rotation) {
  const yesNo = (attribute, enabled) =>
    toggleButton(!enabled, attribute, 0, t('rotation.no')) +
    toggleButton(enabled, attribute, 1, t('rotation.yes'));
  const mixButtons = (mixes, attribute, selected, textKey) =>
    `<span class="lab" style="margin-left:10px">${t('rotation.mix')}</span>` +
    mixes
      .map((mix, index) =>
        toggleButton((selected || 0) === index, attribute, index, t(`${textKey}.${mix.id}`))
      )
      .join('');
  const lineBreak = `<span style="flex-basis:100%"></span>`;
  const length = t('rotation.length', {
    cloverYears: rotation.cloverYears,
    cloverUnit: tPlural('plurals.years', rotation.cloverYears),
    cerealYears: rotation.cerealYears,
    cerealUnit: tPlural('plurals.years', rotation.cerealYears),
  });

  return (
    `<span class="lab">${t('rotation.fieldCount')}</span>` +
    ROTATION_FIELD_OPTIONS.map(count =>
      toggleButton(count === rotation.fieldCount, 'data-rotation-fields', count, count)
    ).join('') +
    `<span class="lab" style="margin-left:10px">${length}</span>` +
    lineBreak +
    `<span class="lab">${t('rotation.rootCrops')}</span>` +
    yesNo('data-root-crops', params.rootCrops) +
    (params.rootCrops && !rotation.rootCropsFit
      ? element('span', { class: 'lab', style: 'margin-left:10px' }, t('rotation.rootCropsNoRoom'))
      : '') +
    lineBreak +
    `<span class="lab">${t('rotation.catchCrops')}</span>` +
    yesNo('data-catch-crops', params.catchCrops) +
    (params.catchCrops
      ? mixButtons(CATCH_CROP_MIXES, 'data-catch-mix', params.catchCropMix, 'catchCropMixes')
      : '') +
    lineBreak +
    `<span class="lab">${t('rotation.stubbleCrop')}</span>` +
    yesNo('data-stubble-crop', params.stubbleCrop) +
    (params.stubbleCrop
      ? mixButtons(STUBBLE_CROP_MIXES, 'data-stubble-mix', params.stubbleCropMix, 'stubbleCropMixes')
      : '')
  );
}

function rotationTableHtml(rotation, fieldHa) {
  const years = Array.from({ length: rotation.fieldCount }, (_, index) => index + 1);
  const isSelected = year => year === planView.rotationYear;

  const yearHeader = year =>
    element(
      'th',
      { class: isSelected(year) ? 'sel' : '' },
      element('button', { type: 'button', 'data-year': year }, t('rotation.year', { year }))
    );
  const header = element(
    'thead',
    {},
    element(
      'tr',
      {},
      element('th', {}, t('rotation.fieldHeader', { hectares: formatNumber(fieldHa, 2) })) +
        years.map(yearHeader).join('')
    )
  );

  const cropCell = (field, year) => {
    const crop = fieldCrop(rotation, field, year);
    const next = fieldCrop(rotation, field, year + 1);
    const note = crop.note ? ' ' + element('span', { class: 'muted' }, `(${crop.note})`) : '';
    return cell(escapeHtml(cropName(crop.id)) + note + coverCropTag(crop.id, next.id), {
      class: isSelected(year) ? 'crop sel' : 'crop',
      style: `border-left-color:${CROP_COLORS[crop.id]}`,
    });
  };
  const fieldRow = field =>
    tableRow([
      cell(element('b', {}, t('rotation.field', { field }))),
      ...years.map(year => cropCell(field, year)),
    ]);

  const fields = Array.from({ length: rotation.fieldCount }, (_, index) => index + 1);
  return header + tableBody(fields.map(fieldRow));
}

/** Tag under a crop: room for a catch crop or stubble crop after it, or clover undersown in oats. */
function coverCropTag(crop, nextCrop) {
  const tag = (isOn, text) => element('span', { class: isOn ? 'mp on' : 'mp' }, text);
  if (crop === 'oats')
    return tag(
      params.catchCrops,
      t('rotation.undersownClover') + (params.catchCrops ? t('rotation.undersownPoints') : '')
    );
  if (isCerealBeforeWinterCereal(crop, nextCrop))
    return tag(
      params.stubbleCrop,
      t(params.stubbleCrop ? 'rotation.stubbleCropSown' : 'rotation.stubbleCropRoom')
    );
  if (isCerealBeforeCatchCrop(crop, nextCrop))
    return tag(
      params.catchCrops,
      params.catchCrops ? t('rotation.catchCropSown', { mix: catchMixLabel() }) : t('rotation.catchCropRoom')
    );
  return '';
}

function rotationNoteHtml(rotation, fieldHa) {
  const rotationCerealPercent = Math.round((rotation.cerealYears / rotation.fieldCount) * 100);
  let html = t('rotation.note', {
    clover: formatNumber(rotation.cloverYears * fieldHa, 2),
    cereals: formatNumber(rotation.cerealYears * fieldHa, 2),
    rotationPercent: rotationCerealPercent,
    sliderPercent: params.cerealShare,
  });
  if (Math.abs(rotationCerealPercent - params.cerealShare) >= 3)
    html +=
      ' ' +
      element(
        'button',
        { class: 'btn', type: 'button', 'data-cereal-share': rotationCerealPercent },
        t('rotation.matchSlider', { percent: rotationCerealPercent })
      );
  return html;
}

function ecoSchemeSummaryHtml(results) {
  const points = results.carbonFarming;
  const n = (value, decimals = 1) => formatNumber(value, decimals);
  const payment = results.subsidyItems.carbonFarming;
  const practisesChosen = params.catchCrops || params.carbonManure || params.carbonCropDiversity;
  const items = [
    t('ecoScheme.possibleArea', {
      catchCropHa: n(results.rotation.catchCropFields * results.fieldHa, 2),
      undersownHa: n(results.rotation.undersownFields * results.fieldHa, 2),
    }),
    t('ecoScheme.points', {
      total: n(points.totalPoints),
      catchCrops: n(points.catchCropPoints),
      manure: n(points.manurePoints),
      diversity: n(points.diversityPoints),
      extensive: n(points.extensivePoints),
      required: n(points.requiredPoints),
    }),
    t('ecoScheme.payment', {
      amount: formatPln(payment),
      belowMinimum: payment === 0 && practisesChosen ? t('ecoScheme.belowMinimum') : '',
      enableHint: params.catchCrops ? '' : t('ecoScheme.enableCatchCrops'),
    }),
    t('ecoScheme.costAndForage', {
      andStubble: params.stubbleCrop ? t('ecoScheme.andStubbleCrops') : '',
      cost: formatPln(results.costItems.catchCrops || 0),
      forage: n(results.coverCropForage),
      stubbleArea:
        results.stubbleCropHa > 0
          ? t('ecoScheme.stubbleArea', { hectares: n(results.stubbleCropHa, 2) })
          : '',
    }),
    results.rotation.diversityOk
      ? t('ecoScheme.diversityMet')
      : t('ecoScheme.diversityNotMet', { percent: Math.round(results.rotation.cerealShare * 100) }),
  ];
  return `<h3>${t('ecoScheme.title')}</h3><ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>`;
}

function coverCropAdviceHtml(rotation) {
  const advice = rotation.crops
    .map((crop, index) => {
      const next = rotation.crops[(index + 1) % rotation.fieldCount];
      const values = { crop: t(`crops.${crop}.locative`), next: t(`crops.${next}.instrumental`) };
      if (crop === 'oats') return t('coverCropAdvice.undersown');
      if (crop === 'clover') return next === 'clover' ? '' : t('coverCropAdvice.afterClover', values);
      if (next === 'oats' || next === 'mixedGrain') {
        const lateWarning =
          params.catchCrops && currentCatchMix().lateSowing
            ? ' ' + t('coverCropAdvice.lateMix', { mix: catchMixLabel() })
            : '';
        const mix = params.catchCrops ? catchMixLabel() : t('coverCropAdvice.recommendedMix');
        return t('coverCropAdvice.catchCrop', { ...values, mix }) + lateWarning;
      }
      return params.stubbleCrop
        ? t('coverCropAdvice.stubbleCrop', { ...values, mix: stubbleMixLabel() })
        : t('coverCropAdvice.noRoom', values);
    })
    .filter(Boolean);
  return `<h3>${t('coverCropAdvice.title')}</h3><ul>${advice.map(item => `<li>${item}</li>`).join('')}</ul>`;
}

function cropsTableHtml(rotation) {
  const columns = ['crop', 'sowing', 'harvest', 'usedFor'];
  const crops = [...new Set(rotation.crops)];
  const cropRow = crop =>
    tableRow([
      cell(element('b', {}, cropName(crop))),
      cell(t(`crops.${crop}.sowing`)),
      cell(t(`crops.${crop}.harvest`)),
      cell(t(`crops.${crop}.usedFor`)),
    ]);
  const header = tableHeader(
    columns.map(column => t(`cropsTable.${column}`)),
    () => false
  );
  return header + tableBody(crops.map(cropRow));
}

// ===== ui/farm/grazing-controls.js =====
// Rotational grazing in the farm plan: how often the cows move, after how many days they come
// back to a paddock, the resulting paddocks (the fourth note under the plan), and the rotation
// year, which is chosen in the "Crop rotation" panel.

/** Move intervals offered as buttons (days in one paddock); 0.5 = twice a day. */
const MOVE_INTERVAL_OPTIONS = [0.5, 1, 2, 3, 4, 7];

/** Rest periods offered as buttons, up to Salatin's 60 days. */
const REST_DAYS_OPTIONS = [20, 25, 30, 35, 40, 45, 50, 60];

const SQUARE_METRES_PER_HECTARE = 10000;

/** Locale key of a named move interval; other intervals use the generic "every N days". */
const NAMED_MOVE_INTERVALS = { 0.5: 'twiceDaily', 1: 'daily', 7: 'weekly' };

/** Button text for a move interval, e.g. "co 2 dni". */
const moveIntervalLabel = days =>
  NAMED_MOVE_INTERVALS[days]
    ? t(`plan.grazing.intervalButtons.${NAMED_MOVE_INTERVALS[days]}`)
    : t('plan.grazing.everyDays', { days: formatNumber(days, Number.isInteger(days) ? 0 : 1) });

/** Move interval inside a sentence, e.g. "dwa razy dziennie". */
const moveIntervalPhrase = days =>
  NAMED_MOVE_INTERVALS[days]
    ? t(`plan.grazing.intervalPhrases.${NAMED_MOVE_INTERVALS[days]}`)
    : t('plan.grazing.everyDays', { days: formatNumber(days, Number.isInteger(days) ? 0 : 1) });

/** Paddock area as hectares, or square metres when under half a hectare. */
function paddockAreaText(hectares) {
  if (hectares >= 0.5) return t('units.hectares', { value: formatNumber(hectares, 2) });
  const squareMetres = Math.round((hectares * SQUARE_METRES_PER_HECTARE) / 10) * 10;
  return t('plan.grazing.squareMetres', { value: formatNumber(squareMetres, 0) });
}

function renderGrazingControls(rotation) {
  const option = (attribute, value, isOn, text) =>
    element('button', { class: isOn ? 'btn on' : 'btn', type: 'button', [attribute]: value }, text);
  const moveButtons = MOVE_INTERVAL_OPTIONS.map(days =>
    option('data-move-interval', days, days === params.grazingMoveIntervalDays, moveIntervalLabel(days))
  );
  const restButtons = REST_DAYS_OPTIONS.map(days =>
    option('data-rest-days', days, days === params.pastureRestDays, t('plan.grazing.days', { days }))
  );
  const lineBreak = element('span', { style: 'flex-basis:100%' });
  const rotationYear = t('plan.grazing.rotationYear', {
    year: planView.rotationYear,
    count: rotation.fieldCount,
  });

  byId('plan-grazing').innerHTML =
    element('span', { class: 'lab' }, t('plan.grazing.moveLabel')) +
    moveButtons.join('') +
    lineBreak +
    element('span', { class: 'lab' }, t('plan.grazing.restLabel')) +
    restButtons.join('') +
    lineBreak +
    element('span', { class: 'lab' }, rotationYear);
}

/** Fourth note under the plan: paddocks, their size, and what the choice changes. */
function renderGrazingNote(results) {
  const plan = results.grazingPlan;
  const title = element('h3', {}, t('plan.grazing.noteTitle'));
  if (params.pastureHa <= 0) {
    byId('grazing-note').innerHTML = title + element('p', {}, t('plan.grazing.noPasture'));
    return;
  }

  const squareSide = Math.sqrt(plan.paddockHa * SQUARE_METRES_PER_HECTARE);
  const yieldChange = Math.round((plan.yieldFactor - 1) * 100);
  const hoursChange = Math.round(plan.extraMoveHours);
  const signed = value => (value > 0 ? '+' : value < 0 ? '−' : '±') + formatNumber(Math.abs(value), 0);

  const summary = t('plan.grazing.noteSummary', {
    interval: moveIntervalPhrase(plan.moveIntervalDays),
    rest: plan.restDays,
    paddocks: plan.paddockCount,
    area: paddockAreaText(plan.paddockHa),
    side: formatNumber(squareSide, 0),
    grazings: formatNumber(plan.grazingsPerPaddock, 1),
  });
  const effects = [
    t('plan.grazing.noteYield', { change: signed(yieldChange) }),
    t('plan.grazing.noteHours', { change: signed(hoursChange) }),
    t('plan.grazing.noteSalatin'),
  ];
  byId('grazing-note').innerHTML =
    title +
    element('p', {}, summary) +
    element('ul', {}, effects.map(effect => element('li', {}, effect)).join(''));
}

// ===== ui/farm/plan-controls.js =====
// Event handlers of the farm plan, rotation and calendar: month buttons, grazing, rotation year
// and length, root crops, catch and stubble crops, and clicks on plan areas.

function buildPlanControls() {
  const monthNames = messages('months.names');
  byId('plan-months').innerHTML =
    `<span class="lab">${t('plan.month')}</span>` +
    messages('months.numerals')
      .map(
        (numeral, index) =>
          `<button class="btn" type="button" data-month="${index}" aria-label="${monthNames[index]}">${numeral}</button>`
      )
      .join('');

  const selectMonth = month => {
    planView.month = month;
    renderFarmPlan(planView.results);
    renderCalendar(planView.results);
  };
  const selectYear = year => {
    planView.rotationYear = year;
    renderFarmPlan(planView.results);
    renderRotation(planView.results);
  };
  const setParams = values => {
    Object.assign(params, values);
    syncInputs();
    onParamsChanged();
  };
  const onClick = (elementId, selector, handler) =>
    byId(elementId).addEventListener('click', event => {
      const target = event.target.closest(selector);
      if (target) handler(target.dataset);
    });

  onClick('plan-months', '[data-month]', data => selectMonth(+data.month));
  onClick('calendar-table', '[data-calendar-month]', data => selectMonth(+data.calendarMonth));
  onClick('plan-grazing', '[data-move-interval]', data =>
    setParams({ grazingMoveIntervalDays: +data.moveInterval })
  );
  onClick('plan-grazing', '[data-rest-days]', data => setParams({ pastureRestDays: +data.restDays }));
  onClick('rotation-table', '[data-year]', data => selectYear(+data.year));
  onClick('plan-svg', '[data-area]', data => {
    planView.selectedArea = data.area;
    renderFarmPlan(planView.results);
  });
  onClick('rotation-note', '[data-cereal-share]', data => setParams({ cerealShare: +data.cerealShare }));
  onClick('rotation-controls', '[data-rotation-fields]', data =>
    setParams({ rotationFields: +data.rotationFields })
  );
  onClick('rotation-controls', '[data-root-crops]', data => setParams({ rootCrops: data.rootCrops === '1' }));
  onClick('rotation-controls', '[data-catch-crops]', data =>
    setParams({ catchCrops: data.catchCrops === '1' })
  );
  onClick('rotation-controls', '[data-stubble-crop]', data =>
    setParams({ stubbleCrop: data.stubbleCrop === '1' })
  );
  onClick('rotation-controls', '[data-catch-mix]', data => {
    const mix = CATCH_CROP_MIXES[+data.catchMix];
    setParams({
      catchCropMix: +data.catchMix,
      catchCropCostPerHa: mix.costPerHa,
      catchCropForageYield: mix.forageYield,
    });
  });
  onClick('rotation-controls', '[data-stubble-mix]', data => {
    const mix = STUBBLE_CROP_MIXES[+data.stubbleMix];
    setParams({
      stubbleCropMix: +data.stubbleMix,
      stubbleCropCostPerHa: mix.costPerHa,
      stubbleCropForageYield: mix.forageYield,
    });
  });
}

// ===== ui/cover-crop-guide.js =====
// Static reference tables of catch-crop and stubble-crop mixtures (seed rates, timing, purpose).
// Texts: locales/pl.json → page.coverCropGuide.

function renderCoverCropGuide() {
  renderMixGuideTable('catch-mix-table', messages('page.coverCropGuide.catchCrops'));
  renderMixGuideTable('stubble-mix-table', messages('page.coverCropGuide.stubbleCrops'));
}

function renderMixGuideTable(elementId, guide) {
  const header = guide.columns.map(column => `<th>${column}</th>`).join('');
  const rows = Object.values(guide.mixes).map(mix => {
    const name = `<b>${mix.name}</b>` + (mix.species ? `: ${mix.species}` : '');
    return `<tr><td>${name}</td><td>${mix.seeding}</td><td>${mix.timing}</td><td>${mix.purpose}</td></tr>`;
  });
  byId(elementId).innerHTML = `<thead><tr>${header}</tr></thead><tbody>${rows.join('')}</tbody>`;
}

// Calendar of the year: tasks of the enterprises the farm actually runs, with the hours
// and cash of each month. Texts: locales/pl.json → calendar.
