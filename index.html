const EVEN_MONTHS = Array(12).fill(1);

/** Splits a yearly amount into 12 monthly amounts proportional to the profile. */
function spreadOverMonths(total, profile = EVEN_MONTHS) {
  const weightSum = profile.reduce((sum, weight) => sum + weight, 0) || 1;
  return profile.map(weight => (total * weight) / weightSum);
}

/**
 * @param {object} results - output of simulateFarm (revenueItems, costItems, subsidyItems)
 * @param {object} params
 * @returns {{months: object[], minBalance: number, minBalanceMonth: number,
 *   householdDraw: number, closingBalance: number}}
 */
function computeMonthlyCashflow(results, params) {
  const months = Array.from({ length: 12 }, () => ({
    inflows: 0,
    subsidy: 0,
    outflows: 0,
    household: 0,
    netIncome: 0,
    balance: 0,
  }));
  const addToMonths = (field, items, profileOf) => {
    for (const [item, total] of Object.entries(items))
      spreadOverMonths(total, profileOf(item)).forEach((amount, month) => (months[month][field] += amount));
  };
  addToMonths('inflows', results.revenueItems, item => CASHFLOW_PROFILES.revenue[item]);
  addToMonths('outflows', results.costItems, item => CASHFLOW_PROFILES.costs[item]);
  addToMonths('subsidy', results.subsidyItems, item =>
    item === 'animalWelfare' ? CASHFLOW_PROFILES.animalWelfare : CASHFLOW_PROFILES.subsidies
  );

  const childBenefit = params.childBenefitChildren * CHILD_BENEFIT_PER_MONTH;
  const householdDraw = Math.max(0, params.householdMonthlySpending - childBenefit);
  let balance = params.openingCash;
  let minBalance = Infinity;
  let minBalanceMonth = 0;
  months.forEach((month, index) => {
    month.household = householdDraw;
    month.netIncome = month.inflows + month.subsidy - month.outflows;
    balance += month.netIncome - month.household;
    month.balance = balance;
    if (balance < minBalance) {
      minBalance = balance;
      minBalanceMonth = index;
    }
  });

  return { months, minBalance, minBalanceMonth, householdDraw, closingBalance: balance };
}

// ===== model/warnings.js =====
// Warnings and hints about the current plan. Each warning has a level ("bad", "warn", "info"),
// a key of its text in locales/pl.json → warnings, and the values for the text's placeholders.

/**
 * @param {object} params - params after soil adjustment
 * @param {object} inputParams - params as set by the user
 * @param {object} results - results computed so far
 * @returns {{level: string, key: string, values?: object}[]}
 */
function collectWarnings(params, inputParams, results) {
  const warnings = [];
  const add = (level, key, values) => warnings.push({ level, key, values });

  addLandAndFeedWarnings(params, results, add);
  addStockingWarnings(params, results, add);
  addLabourWarnings(params, results, add);
  addSalesWarnings(params, results, add);
  addEcoSchemeWarnings(params, results, add);
  addGrazingAndRotationWarnings(params, results, add);
  addOtherWarnings(params, inputParams, results, add);
  return warnings;
}

/** Land allocated beyond the farm, feed shortages and surpluses. */
function addLandAndFeedWarnings(params, results, add) {
  const number = formatNumber;
  const { grainBalance, hayBalance, strawBalance } = results;
  const grainPerHen = (params.henFeedGramsPerDay / 1e6) * 365 * 0.9 * (1 - params.rangeFeedSaving / 100);

  if (results.arableHa < -0.001) add('bad', 'landOverAllocated', { hectares: number(-results.arableHa, 1) });
  if (params.orchardHa + params.kitchenGardenHa > params.farmyardHa + 0.001)
    add('bad', 'gardenExceedsFarmyard');
  if (grainBalance < -0.05)
    add('bad', 'grainShortage', {
      tonnes: number(-grainBalance, 1),
      cerealHa: number(-grainBalance / params.cerealYield, 1),
      arableHa: number(-grainBalance / params.cerealYield / (params.cerealShare / 100), 1),
      hens: number(-grainBalance / grainPerHen, 0),
    });
  if (hayBalance < -0.05)
    add('bad', 'hayShortage', {
      tonnes: number(-hayBalance, 1),
      meadowHa: number(-hayBalance / (params.meadowYield * 0.75), 1),
    });
  if (strawBalance < -0.05) add('warn', 'strawShortage', { tonnes: number(-strawBalance, 1) });
  if (results.sawdustTonnes > 0.05)
    add('info', 'sawdustReplacesStraw', {
      tonnes: number(results.sawdustTonnes, 1),
      cubicMetres: number(results.sawdustTonnes / 0.22, 0),
      cost: number(results.sawdustTonnes * params.sawdustPrice, 0),
    });
  if (results.grainSoldTonnes > 0.05)
    add('info', results.grainNeed < 0.05 ? 'grainSoldAll' : 'grainSold', {
      tonnes: number(results.grainSoldTonnes, 1),
      price: number(params.grainSalePrice, 0),
      revenue: number(results.revenueItems.grainSales, 0),
      reserve: number(params.feedReserveShare, 0),
    });
  // grain kept as the reserve after a sale is not a surplus to use up
  else if (grainBalance > 2)
    add('info', 'grainSurplus', {
      tonnes: number(grainBalance, 1),
      hens: number(grainBalance / grainPerHen, 0),
    });
  if (hayBalance > 8) add('info', 'haySurplus', { tonnes: number(hayBalance, 1) });
}

/** Livestock units per hectare outside the subsidy range or too many on grassland. */
function addStockingWarnings(params, results, add) {
  const number = formatNumber;
  const density = results.livestockUnitsPerHa;
  if (params.organicPayment && params.livestockDensityBonus && (density < 0.5 || density > 1.5))
    add('warn', 'stockingOutsideBonusRange', { density: number(density, 2) });
  if (results.grasslandStocking > 2) add('warn', 'grasslandOverstocked');
}

/** Too few or too many hours for the family, peak months and the weekly limit. */
function addLabourWarnings(params, results, add) {
  const number = formatNumber;
  const { labourUtilisation, totalHours, availableHours } = results;

  if (labourUtilisation > 1)
    add('bad', 'notEnoughHours', {
      needed: number(totalHours, 0),
      available: number(availableHours, 0),
      missing: number(totalHours - availableHours, 0),
    });
  else if (labourUtilisation > 0.85)
    add('warn', 'littleSpareTime', { percent: number(labourUtilisation * 100, 0) });
  else if (labourUtilisation < 0.5)
    add('info', 'muchSpareTime', {
      percent: number(labourUtilisation * 100, 0),
      needed: number(totalHours, 0),
      available: number(availableHours, 0),
    });
  if (availableHours > 0 && results.peakMonthHours > (availableHours / 12) * 1.3)
    add('warn', 'peakMonthOverload', {
      peak: number(results.peakMonthHours, 0),
      monthly: number(availableHours / 12, 0),
    });
  if (results.weeklyHoursPeak > params.weeklyHoursLimit)
    add('warn', 'weeklyLimitExceeded', {
      peak: number(results.weeklyHoursPeak, 0),
      limit: number(params.weeklyHoursLimit, 0),
    });
}

/** Sales volumes, tax thresholds and rules for particular species. */
function addSalesWarnings(params, results, add) {
  const number = formatNumber;
  if (results.market.eggsPerWeek > 500)
    add('info', 'manyEggsToSell', { boxes: number(results.market.eggsPerWeek / 10, 0) });
  if (results.market.directSalesRevenue > 100000) add('info', 'directSalesTaxThreshold');
  if (params.turkeys > 0 && params.layingHens + params.broilers > 0) add('warn', 'turkeysWithHens');
  if (results.parcels > 0) add('info', 'parcelsSeason', { parcels: number(results.parcels, 0) });
  if (results.lambsSoldAsMeat > 0) {
    const meatIncomePerLamb =
      results.lambCarcassKg * params.lambMeatPricePerKg -
      params.lambSlaughterCost -
      results.lambCarcassKg * params.butcheryCostPerKg -
      (results.abattoirKm * params.trailerCostPerKm) / results.lambsSoldAsMeat;
    if (meatIncomePerLamb < params.lambLivePrice)
      add('info', 'lambMeatLessThanLive', {
        meat: number(meatIncomePerLamb, 0),
        live: number(params.lambLivePrice, 0),
      });
  }
  if (params.sheep > 0 && params.sheep < 10) add('info', 'sheepPaymentMinimum');
  if (params.goats > 0 && params.goats < 5) add('info', 'goatPaymentMinimum');
  if (params.ownHatching && results.cockerels > 0)
    add('info', 'ownHatching', {
      chicks: number(results.chicks, 0),
      cockerels: number(results.cockerels, 0),
    });
}

/** Eco-scheme practices chosen but not meeting their conditions. */
function addEcoSchemeWarnings(params, results, add) {
  const number = formatNumber;
  const carbon = results.carbonFarming;
  if ((params.catchCrops || params.carbonManure || params.carbonCropDiversity) && !carbon.qualifies)
    add('warn', 'carbonFarmingBelowMinimum', {
      points: number(carbon.totalPoints, 1),
      required: number(carbon.requiredPoints, 1),
    });
  if (params.carbonCropDiversity && !results.rotation.diversityOk)
    add('info', 'cropDiversityNotMet', {
      cerealPercent: Math.round(results.rotation.cerealShare * 100),
      crops: results.rotation.distinctCrops,
    });
}

/** Paddocks resting too short, root crops that do not fit the rotation. */
function addGrazingAndRotationWarnings(params, results, add) {
  const { grazingPlan } = results;
  const grazesPasture = params.pastureHa > 0 && params.dairyCows + params.sucklerCows + params.sheep > 0;
  if (grazesPasture && grazingPlan.restDays < 25)
    add('warn', 'shortPastureRest', { days: grazingPlan.restDays });
  if (params.rootCrops && !results.rotation.rootCropsFit) add('info', 'rootCropsNoRoom');
}

/** Disease rules, breeding and soil class shares. */
function addOtherWarnings(params, inputParams, results, add) {
  if (params.pigsForSale > 0) add('info', 'africanSwineFever');
  if (results.sucklerCows > 0 && !params.ownBull) add('info', 'sucklerCowsNeedBull');
  if (inputParams.soilClassIIIShare + inputParams.soilClassVShare + inputParams.soilClassVIShare > 100)
    add('warn', 'soilSharesOver100');
}

// ===== model/stages/land-and-animals.js =====
// Land use, herd and flock sizes, and livestock units.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Land ----------

function computeLandUse(params) {
  const arableHa =
    params.ownedHa +
    params.leasedHa -
    params.farmyardHa -
    params.pastureHa -
    params.meadowHa -
    params.marketGardenHa;
  const usableArableHa = Math.max(0, arableHa);
  // root crops take one field of the rotation out of the cereals
  const cerealAndRootHa = (usableArableHa * params.cerealShare) / 100;
  const rotation = computeRotation(params);
  const rootCropHa = Math.min(cerealAndRootHa, (usableArableHa * rotation.rootFields) / rotation.fieldCount);
  const cerealHa = cerealAndRootHa - rootCropHa;
  const cloverHa = usableArableHa - cerealAndRootHa;
  const orchardHa = Math.min(params.orchardHa, params.farmyardHa);
  const farmedHa = params.pastureHa + params.meadowHa + usableArableHa + orchardHa + params.marketGardenHa;
  const grasslandHa = params.pastureHa + params.meadowHa;
  return { arableHa, usableArableHa, cerealHa, rootCropHa, cloverHa, farmedHa, orchardHa, grasslandHa };
}

// ---------- Animals ----------

function computeHerdStructure(params) {
  const replacementHeifers = params.dairyCows > 0 ? (2 * params.dairyCows) / params.lactationsPerCow : 0;
  const bulls = params.ownBull && params.dairyCows > 0 ? 1 : 0;
  const kids = params.goats * 1.5;
  const kidsSold = (kids * params.kidsSoldShare) / 100;
  const sucklerCows = params.sucklerCows;
  const beefCalves = sucklerCows * 0.9;
  const beefReplacements = sucklerCows * 0.15;
  const beefCalvesKept = Math.max(0, beefCalves - beefReplacements);
  const weanersSold = (beefCalvesKept * params.weanersSoldShare) / 100;
  const finishers = beefCalvesKept - weanersSold;
  const beefHeifers = beefReplacements * 2;
  const lambsPerEwe = params.lambsPerLambing * params.lambingsPerEwe;
  // straw for bedding scales with the length of winter housing (165 days = 1)
  const winterFactor = (365 - params.grazingDays) / 165;
  return {
    replacementHeifers,
    bulls,
    kids,
    kidsSold,
    sucklerCows,
    beefReplacements,
    weanersSold,
    finishers,
    beefHeifers,
    lambsPerEwe,
    winterFactor,
  };
}

// ---------- Livestock units (approximate conversion factors) ----------

function computeLivestockUnits(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers, farmedHa, grasslandHa } = results;
  const livestockUnitsByAnimal = {
    dairyCows: params.dairyCows,
    replacementHeifers: replacementHeifers * 0.6,
    bull: bulls,
    sheep: params.sheep * 0.1,
    goats: params.goats * 0.1,
    horses: params.horses * 0.8,
    beefCattle: sucklerCows + finishers * 0.9 + beefHeifers * 0.6,
    layingHens: params.layingHens * 0.014,
    broilers: (params.broilers / 4) * 0.007,
    geese: params.geese * 0.02 * 0.5,
    ducks: (params.ducks / 2) * 0.004,
    turkeys: params.turkeys * 0.6 * 0.03,
    guineaFowl: params.guineaFowl * 0.5 * 0.004,
    pigs: (params.pigsForHome + params.pigsForSale) * 0.3 * 0.6,
    rabbits: params.rabbits * 0.02,
  };
  const units = livestockUnitsByAnimal;
  const livestockUnits = sumValues(units);
  const grazingUnits = units.dairyCows + units.replacementHeifers + units.bull + units.sheep + units.goats;
  return {
    livestockUnitsByAnimal,
    livestockUnits,
    livestockUnitsPerHa: farmedHa > 0 ? livestockUnits / farmedHa : 0,
    grasslandStocking: grasslandHa > 0 ? (grazingUnits + units.horses + units.beefCattle) / grasslandHa : 0,
  };
}

// ===== model/stages/feed-balance.js =====
// Feed balance: forage, grain and straw produced on the farm against what the animals need.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Forage (tonnes of dry matter per year) ----------

function computeForageBalance(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers, lambsPerEwe } = results;
  const forageNeedByAnimal = {
    dairyCows: params.dairyCows * 5.5,
    replacementHeifers: replacementHeifers * 3.3,
    bull: bulls * 5.0,
    sheep: params.sheep * (0.55 + 0.15 * lambsPerEwe),
    goats: params.goats * 0.6,
    rabbits: params.rabbits * 0.3,
    geese: params.geese * 0.05,
    horses: params.horses * 3.2,
    beefCattle: sucklerCows * 4.8 + finishers * 3.5 + beefHeifers * 2.5,
    ducks: params.ducks * 0.01,
    turkeys: params.turkeys * 0.04,
    guineaFowl: params.guineaFowl * 0.005,
  };
  const forageNeed = sumValues(forageNeedByAnimal);
  const grazingNeed = (forageNeed * params.grazingDays) / 365;
  const winterNeed = forageNeed - grazingNeed;

  // sheep grazing after cattle use the pasture better
  const dairyHerd = params.dairyCows + replacementHeifers + bulls;
  const mixedGrazingFactor =
    params.sheep > 0 && dairyHerd > 0 ? Math.min(1, params.sheep / (1.5 * dairyHerd)) : 0;
  const pastureProduction =
    params.pastureHa * params.pastureYield * (1 + (params.mixedGrazingBonus / 100) * mixedGrazingFactor);
  const mixedGrazingGain =
    ((params.pastureHa * params.pastureYield * params.mixedGrazingBonus) / 100) * mixedGrazingFactor;

  const meadowHay = params.meadowHa * params.meadowYield * 0.75;
  const meadowGrazing = params.meadowHa * params.meadowYield * 0.25;
  const cloverHay = results.cloverHa * params.cloverYield;

  const rotation = computeRotation(params);
  const fieldHa = results.usableArableHa / rotation.fieldCount;
  const catchCropHa = params.catchCrops ? rotation.catchCropFields * fieldHa : 0;
  const undersownHa = params.catchCrops ? rotation.undersownFields * fieldHa : 0;
  const stubbleCropHa = params.stubbleCrop ? rotation.stubbleCropFields * fieldHa : 0;
  const coverCropForage =
    catchCropHa * params.catchCropForageYield + stubbleCropHa * params.stubbleCropForageYield;

  const grazingSupply = pastureProduction + meadowGrazing + coverCropForage;
  const grazingSurplus = grazingSupply - grazingNeed;
  const hayFromPasture = Math.max(0, grazingSurplus) * 0.7;
  const haySupply = meadowHay + cloverHay + hayFromPasture;
  const grazingDeficit = Math.max(0, -grazingSurplus);
  const hayNeed = winterNeed + grazingDeficit;

  return {
    forageNeedByAnimal,
    forageNeed,
    grazingNeed,
    winterNeed,
    mixedGrazingGain,
    grazingSupply,
    grazingSurplus,
    hayFromPasture,
    haySupply,
    hayNeed,
    hayBalance: haySupply - hayNeed,
    meadowHay,
    cloverHay,
    rotation,
    fieldHa,
    catchCropHa,
    undersownHa,
    stubbleCropHa,
    coverCropForage,
  };
}

// ---------- Grain and straw (tonnes per year) ----------

function computeGrainBalance(params, results) {
  const { henReplacements, cockerels, wheyLitres } = results;
  const grainNeedByAnimal = {
    layingHens:
      ((params.layingHens * params.henFeedGramsPerDay) / 1e6) *
      365 *
      (1 - params.rangeFeedSaving / 100) *
      0.9,
    hatching: params.ownHatching
      ? (henReplacements * params.pulletGrainKg + cockerels * params.cockerelGrainKg) / 1000
      : 0,
    broilers: ((params.broilers * params.broilerFeedKg) / 1000) * 0.9,
    geese: params.geese * 0.012,
    ducks: ((params.ducks * params.duckGrainKg) / 1000) * 0.9,
    turkeys: ((params.turkeys * params.turkeyGrainKg) / 1000) * 0.85,
    guineaFowl: ((params.guineaFowl * params.guineaFowlGrainKg) / 1000) * 0.85,
    dairyCows: (params.dairyCows * params.oatsPerCow) / 1000,
    pigs: (params.pigsForHome + params.pigsForSale) * 0.35,
    rabbits: (params.rabbits * (params.rabbitsRearedPerDoe * 3 + 40)) / 1000,
    sheep: params.sheep * 0.01 * params.lambingsPerEwe,
    horses: params.horses * 0.2,
  };

  // whey from cheese replaces up to 30% of the pigs' grain
  const wheyDryMatter = (wheyLitres * 0.06) / 1000;
  const pigGrainWithoutWhey = grainNeedByAnimal.pigs;
  grainNeedByAnimal.pigs = Math.max(pigGrainWithoutWhey * 0.7, pigGrainWithoutWhey - wheyDryMatter);

  const grainNeed = sumValues(grainNeedByAnimal);
  // fodder beet and potatoes replace grain in the rations at about their dry-matter energy
  const grainSupply = results.cerealHa * params.cerealYield + results.rootCropHa * params.rootCropYield;
  const grainSoldTonnes = surplusGrainForSale(params, grainSupply, grainNeed);
  return {
    grainNeedByAnimal,
    wheyGrainSaved: pigGrainWithoutWhey - grainNeedByAnimal.pigs,
    grainNeed,
    grainSupply,
    grainSoldTonnes,
    grainBalance: grainSupply - grainSoldTonnes - grainNeed,
  };
}

/**
 * Grain sold after harvest: everything above the animals' need plus a reserve for a poor year
 * (`feedReserveShare` percent of the need). Without animals all the grain is sold.
 */
function surplusGrainForSale(params, grainSupply, grainNeed) {
  if (!params.sellSurplusGrain) return 0;
  const kept = grainNeed * (1 + params.feedReserveShare / 100);
  return Math.max(0, grainSupply - kept);
}

function computeStrawBalance(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers, winterFactor } = results;
  const strawNeedByAnimal = {
    dairyCows: params.dairyCows * 1.2 * winterFactor,
    replacementHeifers: replacementHeifers * 0.6 * winterFactor,
    bull: bulls * 0.8 * winterFactor,
    sheep: params.sheep * 0.12 * winterFactor * (0.7 + 0.3 * params.lambingsPerEwe),
    goats: params.goats * 0.1 * winterFactor,
    horses: params.horses * 1.2 * winterFactor,
    beefCattle: (sucklerCows * 1.0 + finishers * 0.8 + beefHeifers * 0.6) * winterFactor,
    layingHens: params.winterPolytunnel ? 0 : params.layingHens * 0.006,
    broilers: params.broilers * 0.002,
    geese: params.geese * 0.01,
    ducks: params.ducks * 0.005,
    turkeys: params.turkeys * 0.015,
    guineaFowl: params.guineaFowl * 0.002,
    pigs: (params.pigsForHome + params.pigsForSale) * 0.6,
    rabbits: params.rabbits * 0.05,
  };
  const strawNeed = sumValues(strawNeedByAnimal);
  // straw beyond the need and the reserve stays on the field and is ploughed in
  const strawHarvest = results.cerealHa * params.strawYield;
  const strawPloughedTonnes = Math.max(0, strawHarvest - strawNeed * (1 + params.feedReserveShare / 100));
  const strawSupply = strawHarvest - strawPloughedTonnes;
  const strawBalanceBeforeSawdust = strawSupply - strawNeed;
  const sawdustTonnes =
    params.sawdustForStraw && strawBalanceBeforeSawdust < 0
      ? -strawBalanceBeforeSawdust * params.sawdustPerStrawTonne
      : 0;
  const strawBalance = params.sawdustForStraw
    ? Math.max(0, strawBalanceBeforeSawdust)
    : strawBalanceBeforeSawdust;
  return {
    strawNeedByAnimal,
    strawNeed,
    strawHarvest,
    strawPloughedTonnes,
    strawSupply,
    strawBalance,
    strawBalanceBeforeSawdust,
    sawdustTonnes,
  };
}

// ===== model/stages/products.js =====
// Milk and cheese volumes and the renewal of the laying flock.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Milk, cheese, eggs ----------

function computeMilkAndCheese(params) {
  const milkTotal = params.dairyCows * params.milkPerCow;
  const milkUsed = (milkTotal * params.milkUsedShare) / 100;
  const milkForCheese = params.dairyCows > 0 ? (milkUsed * params.cheeseShare) / 100 : 0;
  const freshMilkSold = milkUsed - milkForCheese;
  const cheeseKg = (milkForCheese / 100) * params.cheeseYield;
  const cheeseSold = cheeseKg * 0.9;
  const wheyLitres = milkForCheese * 0.85;
  return { milkTotal, milkUsed, milkForCheese, freshMilkSold, cheeseKg, cheeseSold, wheyLitres };
}

function computeFlockRenewal(params) {
  const henReplacements = params.layingHens / params.flockReplacementYears;
  const cockerels = params.ownHatching ? henReplacements * 0.9 : 0;
  const chicks = params.ownHatching ? henReplacements * 2 : 0;
  return { henReplacements, cockerels, chicks };
}

// ===== model/stages/revenue.js =====
// Yearly sales by product, including lambs and processed goods (RHD).
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Revenue ----------

function computeRevenue(params, results) {
  const { cowReplacements, calvesSold } = calfSales(params);
  const eggs = params.layingHens * params.eggsPerHen;
  const eggsSold = (eggs * params.eggsSoldShare) / 100;
  const lambs = computeLambSales(params, results);
  const processing = computeProcessing(params, lambs.lambMeatKg);

  const fruitTonnes = results.orchardHa * params.orchardYield;
  const fruitSoldTonnes = (fruitTonnes * params.fruitSoldShare) / 100;
  const mushroomsKg = params.mushroomLogs * params.mushroomYieldPerLog;
  const { finishers, weanersSold, beefReplacements, kidsSold, kids, cockerels, henReplacements } = results;
  const finisherMeatShare = params.finishersSoldAsMeatShare / 100;

  const revenueItems = {
    milk: results.freshMilkSold * params.milkPrice,
    grainSales: results.grainSoldTonnes * params.grainSalePrice,
    cheese: results.cheeseSold * params.cheesePrice,
    calves: calvesSold * params.calfPrice + cowReplacements * params.cullCowPrice,
    eggs: eggsSold * params.eggPrice + henReplacements * 10,
    cockerels: cockerels * params.cockerelPrice,
    goats: kidsSold * params.kidCarcassKg * params.kidMeatPricePerKg,
    pigs: params.pigsForSale * params.pigCarcassKg * params.porkBoxPricePerKg,
    beefCattle:
      weanersSold * params.weanerWeightKg * params.weanerPricePerKg +
      finishers *
        (((finisherMeatShare * params.finisherWeightKg * params.finisherKillingOut) / 100) *
          params.beefBoxPricePerKg +
          (1 - finisherMeatShare) * params.finisherWeightKg * params.finisherLivePricePerKg) +
      beefReplacements * params.cullCowPrice * 1.3,
    broilers: params.broilers * 0.95 * params.broilerCarcassKg * params.broilerPricePerKg,
    geese: (processing.geeseRaised - processing.geeseProcessed) * params.goosePrice,
    ducks:
      (processing.ducksRaised - processing.ducksProcessed) * params.duckCarcassKg * params.duckPricePerKg,
    turkeys: params.turkeys * 0.9 * params.turkeyCarcassKg * params.turkeyPricePerKg,
    guineaFowl: params.guineaFowl * 0.9 * params.guineaFowlCarcassKg * params.guineaFowlPricePerKg,
    rabbits: params.rabbits * params.rabbitsRearedPerDoe * 0.9 * params.rabbitPrice,
    sheep: lambs.lambsSoldLive * params.lambLivePrice + lambs.ewesReplaced * 250,
    lambMeat: (lambs.lambMeatKg - processing.lambMeatProcessedKg) * params.lambMeatPricePerKg,
    processedGoods: processing.processedValue,
    fruit: fruitSoldTonnes * 1000 * params.fruitPricePerKg,
    mushrooms: mushroomsKg * 0.9 * params.mushroomPrice,
    vegetables: params.marketGardenHa * params.vegetableSalesPerHa,
    honey: params.beehives * params.honeyPerHive * params.honeyPrice * 0.95,
  };

  // value of what the family eats itself (not cash)
  const dogFoodKg = (kids - kidsSold) * 10;
  const homeUse = {
    pigs: params.pigsForHome * 85 * 25,
    dogFood: dogFoodKg * 15,
    eggs: (eggs - eggsSold) * params.eggPrice,
    milk: (results.milkTotal - results.milkUsed) * 0.4 * params.milkPrice,
    cheese: (results.cheeseKg - results.cheeseSold) * params.cheesePrice,
    fruit: Math.min(fruitTonnes - fruitSoldTonnes, 1.5) * 1000 * 1.5,
    mushrooms: mushroomsKg * 0.1 * params.mushroomPrice,
  };

  return {
    calves: params.dairyCows * 0.95,
    calvesSold,
    cowReplacements,
    eggs,
    eggsSold,
    ...lambs,
    ...processing,
    fruitTonnes,
    fruitSoldTonnes,
    mushroomsKg,
    revenueItems,
    revenue: sumValues(revenueItems),
    homeUse,
    homeUseTotal: sumValues(homeUse),
    dogFoodKg,
  };
}

function calfSales(params) {
  const calves = params.dairyCows * 0.95;
  const cowReplacements = params.dairyCows / params.lactationsPerCow;
  return { cowReplacements, calvesSold: Math.max(0, calves - cowReplacements) };
}

function computeLambSales(params, results) {
  const lambs = params.sheep * results.lambsPerEwe;
  const ewesReplaced = (params.sheep * params.eweReplacementShare) / 100;
  const lambsSold = Math.max(0, lambs - ewesReplaced);
  const lambsSoldAsMeat = (lambsSold * params.lambsSoldAsMeatShare) / 100;
  const lambCarcassKg = (params.lambLiveWeightKg * params.lambKillingOut) / 100;
  const abattoirTrips =
    lambsSoldAsMeat > 0 ? Math.ceil(lambsSoldAsMeat / params.lambsPerAbattoirTrip - 1e-9) : 0;
  return {
    lambs,
    ewesReplaced,
    lambsSold,
    lambsSoldAsMeat,
    lambsSoldLive: lambsSold - lambsSoldAsMeat,
    lambCarcassKg,
    lambMeatKg: lambsSoldAsMeat * lambCarcassKg,
    abattoirTrips,
    // two trips per batch (delivery and pick-up), there and back
    abattoirKm: abattoirTrips * 2 * 2 * params.abattoirDistanceKm,
  };
}

function computeProcessing(params, lambMeatKg) {
  const geeseRaised = params.geese * 0.9;
  const geeseProcessed = (geeseRaised * params.geeseProcessedShare) / 100;
  const ducksRaised = params.ducks * 0.93;
  const ducksProcessed = (ducksRaised * params.ducksProcessedShare) / 100;
  const lambMeatProcessedKg = (lambMeatKg * params.lambProcessedShare) / 100;
  const processedValueBySpecies = {
    geese: geeseProcessed * params.processedValuePerGoose,
    ducks: ducksProcessed * params.processedValuePerDuck,
    sheep: lambMeatProcessedKg * params.processedValuePerLambKg,
  };
  const processedKg = geeseProcessed * 2.5 + ducksProcessed * 1.2 + lambMeatProcessedKg * 0.6;
  return {
    geeseRaised,
    geeseProcessed,
    ducksRaised,
    ducksProcessed,
    lambMeatProcessedKg,
    processedValueBySpecies,
    processedValue: sumValues(processedValueBySpecies),
    processedKg,
    parcels: (processedKg * params.shippedShare) / 100 / params.parcelWeightKg,
  };
}

// ===== model/stages/costs.js =====
// Running costs per year.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Running costs ----------

function computeCosts(params, results) {
  const {
    replacementHeifers,
    bulls,
    sucklerCows,
    finishers,
    beefHeifers,
    kidsSold,
    chicks,
    henReplacements,
  } = results;
  const sellsDirectly =
    results.freshMilkSold > 0 ||
    results.eggsSold > 0 ||
    params.broilers > 0 ||
    params.ducks > 0 ||
    params.guineaFowl > 0 ||
    params.turkeys > 0;

  const costItems = {
    arable: results.usableArableHa * params.arableCostPerHa,
    rootCrops: results.rootCropHa * params.rootCropCostPerHa,
    meadow: params.meadowHa * params.meadowCostPerHa,
    pasture: params.pastureHa * params.pastureCostPerHa,
    dairyCows:
      params.dairyCows > 0
        ? params.dairyCows * params.costPerCow +
          replacementHeifers * params.costPerCow * 0.3 +
          (bulls ? params.bullCost : params.dairyCows * params.inseminationCost)
        : 0,
    milkPackaging: results.freshMilkSold * params.milkPackagingCostPerLitre,
    cheese: results.cheeseKg * params.cheeseCostPerKg,
    layingHens:
      (params.ownHatching ? chicks * params.hatchingCostPerChick : henReplacements * params.pulletPrice) +
      params.layingHens * params.henExtrasCost +
      results.eggsSold * params.eggPackagingCost +
      (params.winterPolytunnel ? params.layingHens * params.tunnelBeddingCostPerHen : 0),
    broilers: params.broilers * params.costPerBroiler,
    geese: params.geese * params.costPerGoose,
    ducks: params.ducks * params.costPerDuck,
    catchCrops:
      results.catchCropHa * params.catchCropCostPerHa + results.stubbleCropHa * params.stubbleCropCostPerHa,
    beefCattle:
      (sucklerCows + finishers + beefHeifers) * params.beefCattleCostPerHead +
      ((finishers * params.finishersSoldAsMeatShare) / 100) * params.finisherSlaughterCost,
    turkeys: params.turkeys * params.costPerTurkey,
    guineaFowl: params.guineaFowl * params.costPerGuineaFowl,
    processedGoods:
      (results.processedValue * params.processingMaterialsShare) / 100 +
      results.parcels * Math.max(0, params.parcelCost - params.shippingFeeCharged),
    fruit: (results.fruitSoldTonnes * 1000 * params.fruitPricePerKg * params.fruitCostShare) / 100,
    mushrooms: params.mushroomLogs * params.mushroomLogCost,
    rabbits: params.rabbits * params.costPerRabbitDoe,
    vegetables: (params.marketGardenHa * params.vegetableSalesPerHa * params.vegetableCostShare) / 100,
    beehives: params.beehives * params.hiveCost,
    sheep: params.sheep * params.costPerEwe,
    slaughter:
      results.lambsSoldAsMeat * params.lambSlaughterCost +
      results.lambMeatKg * params.butcheryCostPerKg +
      results.abattoirKm * params.trailerCostPerKm,
    goats: params.goats * params.costPerGoat + kidsSold * params.kidSlaughterCost,
    horses: params.horses * params.horseCost,
    landLease: params.leasedHa * params.leaseRentPerHa,
    pigs:
      (params.pigsForHome + params.pigsForSale) * params.costPerPig +
      params.pigsForSale * params.pigSlaughterCost,
    fixed: params.fixedCosts,
    sales: sellsDirectly ? params.salesCosts : 0,
    energy: params.energyCosts,
  };

  // the pessimistic scenario raises every running cost except the lease
  const costMultiplier = params.costMultiplier || 1;
  for (const item in costItems) if (item !== 'landLease') costItems[item] *= costMultiplier;

  const purchases = {
    grain: Math.max(0, -results.grainBalance) * params.grainPurchasePrice,
    hay: Math.max(0, -results.hayBalance) * params.hayPurchasePrice,
    straw: Math.max(0, -results.strawBalance) * params.strawPurchasePrice,
    sawdust: results.sawdustTonnes * params.sawdustPrice,
  };
  costItems.purchases = sumValues(purchases);
  return { costItems, purchases, costs: sumValues(costItems) };
}

// ===== model/stages/investments.js =====
// Investments: one-off cost of each item and its yearly depreciation.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Investments ----------

function computeInvestments(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers } = results;
  const hasGrazingAnimals = params.dairyCows + params.sheep + params.goats + params.sucklerCows > 0;
  // sheep and goats need more fence wires
  const fenceFactor = params.sheep + params.goats > 0 ? 1.3 : 1;
  const oneIf = condition => (condition ? 1 : 0);
  const cattleShedPlaces =
    params.dairyCows + replacementHeifers + bulls + sucklerCows + finishers * 0.7 + beefHeifers * 0.6;

  // quantity × unit price from the investment parameters, written off over the lifetime
  const investmentItems = [
    { id: 'cattleShed', priceParam: 'investCattleShed', quantity: cattleShedPlaces, lifetimeYears: 20 },
    {
      id: 'sheepShed',
      priceParam: 'investSheepShed',
      quantity: params.sheep + params.goats,
      lifetimeYears: 20,
    },
    { id: 'horses', priceParam: 'investHorseStable', quantity: params.horses, lifetimeYears: 20 },
    { id: 'henHouse', priceParam: 'investHenHouse', quantity: params.layingHens, lifetimeYears: 12 },
    {
      id: 'hatching',
      priceParam: 'investHatchery',
      quantity: oneIf(params.ownHatching && params.layingHens > 0),
      lifetimeYears: 8,
    },
    {
      id: 'poultryTunnel',
      priceParam: 'investPoultryTunnel',
      quantity: oneIf(params.winterPolytunnel && params.layingHens > 0),
      lifetimeYears: 10,
    },
    { id: 'broilerPens', priceParam: 'investBroilerPens', quantity: params.broilers / 4, lifetimeYears: 8 },
    {
      id: 'otherPoultryShelters',
      priceParam: 'investOtherPoultryShelters',
      quantity: params.ducks / 2 + params.turkeys * 3 + params.guineaFowl,
      lifetimeYears: 8,
    },
    {
      id: 'processing',
      priceParam: 'investProcessingRoom',
      quantity: oneIf(results.processedValue > 0),
      lifetimeYears: 12,
    },
    { id: 'rabbitHutches', priceParam: 'investRabbitHutches', quantity: params.rabbits, lifetimeYears: 10 },
    {
      id: 'fencing',
      priceParam: 'investElectricFencing',
      quantity: hasGrazingAnimals ? results.grasslandHa * fenceFactor : 0,
      lifetimeYears: 15,
    },
    { id: 'water', priceParam: 'investPastureWater', quantity: oneIf(hasGrazingAnimals), lifetimeYears: 15 },
    { id: 'dairy', priceParam: 'investDairy', quantity: oneIf(params.dairyCows > 0), lifetimeYears: 12 },
    {
      id: 'cheeseRoom',
      priceParam: 'investCheeseRoom',
      quantity: oneIf(params.dairyCows > 0 && params.cheeseShare > 0),
      lifetimeYears: 12,
    },
    { id: 'machinery', priceParam: 'investMachinery', quantity: 1, lifetimeYears: 15 },
    {
      id: 'vegetables',
      priceParam: 'investMarketGarden',
      quantity: params.marketGardenHa,
      lifetimeYears: 10,
    },
    { id: 'beehives', priceParam: 'investBeehive', quantity: params.beehives, lifetimeYears: 15 },
    // anything the list above leaves out, typed in by the user
    {
      id: 'other',
      priceParam: 'investOther',
      quantity: 1,
      lifetimeYears: params.investOtherLifetimeYears,
      lifetimeParam: 'investOtherLifetimeYears',
    },
  ];
  for (const item of investmentItems) {
    item.cost = item.quantity * params[item.priceParam];
    item.yearlyDepreciation = item.cost / item.lifetimeYears;
  }
  return {
    investmentItems,
    capex: sumBy(investmentItems, item => item.cost),
    depreciation: sumBy(investmentItems, item => item.yearlyDepreciation),
  };
}

// ===== model/stages/subsidies.js =====
// Area, organic, animal, welfare, ONW and eco-scheme payments.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Subsidies ----------

function computeSubsidies(params, results) {
  const { farmedHa, grasslandHa, usableArableHa, orchardHa, livestockUnitsPerHa, sucklerCows } = results;
  const rates = SUBSIDY_RATES;
  const subsidyItems = {
    basicPayment: rates.basicPayment * farmedHa,
    redistributive: rates.redistributive * Math.min(farmedHa, 30),
    dairyCows: rates.dairyCows * (params.dairyCows + sucklerCows),
    beefCattle:
      rates.beefCattle * Math.floor(results.replacementHeifers + results.finishers + results.beefHeifers),
    sheep: params.sheep >= 10 ? rates.sheep * params.sheep : 0,
    goats: params.goats >= 5 ? rates.goats * params.goats : 0,
    organic: params.organicPayment
      ? rates.organicGrassland * grasslandHa +
        rates.organicArable * usableArableHa +
        rates.organicOrchard * orchardHa +
        rates.organicVegetables * params.marketGardenHa
      : 0,
    livestockBonus:
      params.organicPayment &&
      params.livestockDensityBonus &&
      livestockUnitsPerHa >= 0.5 &&
      livestockUnitsPerHa <= 1.5
        ? rates.livestockBonus * farmedHa
        : 0,
    extensiveGrassland: params.extensiveGrasslandScheme ? rates.extensiveGrasslandScheme * grasslandHa : 0,
    carbonFarming: 0,
    youngFarmer: params.youngFarmerEligible ? rates.youngFarmer * farmedHa : 0,
    lessFavouredArea: params.lessFavouredAreaRate * farmedHa,
    animalWelfare:
      params.otherWelfarePayments +
      (params.welfareCowsGrazing
        ? params.dairyCows * (rates.welfareCowGrazing + rates.welfareCowBedding)
        : 0) +
      (params.welfareCowsSpace ? params.dairyCows * rates.welfareCowSpace : 0) +
      (params.welfareSheepGoats ? params.sheep * rates.welfareEwe + params.goats * rates.welfareGoat : 0) +
      (params.welfareHens ? params.layingHens * rates.welfareHen : 0),
  };

  const carbonFarming = computeCarbonFarmingPoints(params, results);
  if (carbonFarming.qualifies)
    subsidyItems.carbonFarming =
      (carbonFarming.catchCropPoints + carbonFarming.manurePoints + carbonFarming.diversityPoints) *
      params.ecoSchemePointValue;
  // extensive grassland is paid only together with the carbon farming scheme
  else if (params.extensiveGrasslandScheme) subsidyItems.extensiveGrassland = 0;

  return { subsidyItems, carbonFarming, subsidies: sumValues(subsidyItems) };
}

/** Eco-scheme "carbon farming": points earned against the minimum (25% of farmed land × 5). */
function computeCarbonFarmingPoints(params, results) {
  const { catchCropHa, undersownHa, rotation, fieldHa } = results;
  const rules = CARBON_FARMING;
  const catchCropPoints = (catchCropHa + undersownHa) * rules.catchCropPointsPerHa;
  const manurePoints = params.carbonManure ? rotation.manuredFields * fieldHa * rules.manurePointsPerHa : 0;
  const diversityPoints =
    params.carbonCropDiversity && rotation.diversityOk
      ? results.usableArableHa * rules.cropDiversityPointsPerHa
      : 0;
  const extensivePoints = params.extensiveGrasslandScheme
    ? results.grasslandHa * rules.extensiveGrasslandPointsPerHa
    : 0;
  const requiredPoints = rules.minimumShareOfFarmedArea * results.farmedHa * rules.catchCropPointsPerHa;
  const totalPoints = catchCropPoints + manurePoints + diversityPoints + extensivePoints;
  return {
    catchCropPoints,
    manurePoints,
    diversityPoints,
    extensivePoints,
    requiredPoints,
    totalPoints,
    qualifies: totalPoints >= requiredPoints,
  };
}

// ===== model/stages/labour.js =====
// Working hours per year and per month.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Labour (hours per year) ----------

function computeLabour(params, results) {
  const hoursByActivity = hoursPerActivity(params, results);
  addPaddockMoveHours(hoursByActivity, params, results.grazingPlan);

  // the pessimistic scenario makes every job take longer
  const hoursMultiplier = params.hoursMultiplier || 1;
  for (const activity in hoursByActivity) hoursByActivity[activity] *= hoursMultiplier;

  const totalHours = sumValues(hoursByActivity);
  const monthlyHours = monthlyHoursByGroup(hoursByActivity);
  const peakMonthHours = Math.max(...monthlyHours.map(month => month.total));
  const availableHours = familyHoursPerYear(params);

  return {
    hoursByActivity,
    totalHours,
    monthlyHours,
    peakMonthHours,
    availableHours,
    labourUtilisation: availableHours > 0 ? totalHours / availableHours : 9,
    weeklyHoursAverage: totalHours / 52,
    weeklyHoursPeak: peakMonthHours / WEEKS_PER_MONTH,
    netPerHour: totalHours > 0 ? results.netIncome / totalHours : 0,
  };
}

/** Hours per year of every activity, from the herd sizes, areas and hour norms in the params. */
function hoursPerActivity(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, kidsSold } = results;
  return {
    dairyCows:
      params.dairyCows > 0
        ? params.dairyFixedHours +
          params.dairyCows * params.hoursPerCow +
          replacementHeifers * 15 +
          bulls * 20
        : 0,
    cheese: (results.milkForCheese / 100) * params.cheeseHoursPer100Litres,
    layingHens: params.layingHens > 0 ? params.hensFixedHours + params.layingHens * params.hoursPerHen : 0,
    hatching: results.chicks * params.hatchingHoursPerChick,
    broilers: params.broilers > 0 ? 30 + params.broilers * params.hoursPerBroiler : 0,
    geese: params.geese * params.hoursPerGoose,
    ducks: params.ducks > 0 ? 15 + params.ducks * params.hoursPerDuck : 0,
    catchCrops: (results.catchCropHa + results.stubbleCropHa) * params.catchCropHoursPerHa,
    beefCattle:
      sucklerCows > 0
        ? 20 +
          sucklerCows * params.hoursPerSucklerCow +
          finishers * params.hoursPerFinisher +
          ((finishers * params.finishersSoldAsMeatShare) / 100) * 6
        : 0,
    turkeys: params.turkeys > 0 ? 15 + params.turkeys * params.hoursPerTurkey : 0,
    guineaFowl: params.guineaFowl > 0 ? 15 + params.guineaFowl * params.hoursPerGuineaFowl : 0,
    processedGoods:
      results.processedValue > 0
        ? params.processingFixedHours +
          results.geeseProcessed * params.processingHoursPerGoose +
          results.ducksProcessed * params.processingHoursPerDuck +
          results.lambMeatProcessedKg * params.processingHoursPerLambKg +
          results.parcels * params.hoursPerParcel
        : 0,
    fruit: results.fruitSoldTonnes * params.fruitHoursPerTonne,
    mushrooms: params.mushroomLogs * params.mushroomLogHours,
    rabbits: params.rabbits * params.hoursPerRabbitDoe,
    sheep:
      params.sheep > 0
        ? 30 +
          params.sheep * params.hoursPerEwe * (0.6 + 0.4 * params.lambingsPerEwe) +
          results.abattoirTrips * 2 * params.abattoirTripHours +
          results.lambsSoldAsMeat * params.lambSalesHoursPerLamb
        : 0,
    horses: params.horses * params.hoursPerHorse,
    goats: params.goats * params.hoursPerGoat + kidsSold * 1,
    pigs: (params.pigsForHome + params.pigsForSale) * params.hoursPerPig + params.pigsForSale * 3,
    hay:
      (params.meadowHa + results.cloverHa + results.hayFromPasture / Math.max(1, params.meadowYield)) *
      params.hayHoursPerHa,
    cereals: results.cerealHa * params.cerealHoursPerHa,
    rootCrops: results.rootCropHa * params.rootCropHoursPerHa,
    sales:
      (results.freshMilkSold / 100) * params.milkSalesHoursPer100Litres +
      (results.eggsSold / 100) * params.eggSalesHoursPer100 +
      params.salesFixedHours,
    general: params.generalHours,
    garden: (results.orchardHa + params.kitchenGardenHa) * params.gardenHoursPerHa,
    vegetables: params.marketGardenHa * params.vegetableHoursPerHa,
    beehives: params.beehives * params.hiveHours,
  };
}

/** Hours of each labour group in each month, spread by the activities' monthly profiles. */
function monthlyHoursByGroup(hoursByActivity) {
  return Array.from({ length: 12 }, (_, month) => {
    const hoursByGroup = {};
    for (const group of LABOUR_GROUPS)
      hoursByGroup[group.id] = group.activities.reduce(
        (sum, activity) => sum + (hoursByActivity[activity] / 12) * LABOUR_PROFILES[activity][month],
        0
      );
    hoursByGroup.total = sumValues(hoursByGroup);
    return hoursByGroup;
  });
}

/** Working hours the family has in a year: full-time, half-time and quarter-time people. */
function familyHoursPerYear(params) {
  const fullTimeEquivalents =
    params.fullTimeWorkers + 0.5 * params.halfTimeWorkers + 0.25 * params.quarterTimeWorkers;
  return fullTimeEquivalents * params.fullTimeHoursPerYear;
}

/**
 * Moving the fences more or less often than once a day changes the hours of the herd that leads
 * the grazing (the hour norms per animal include one move a day).
 */
function addPaddockMoveHours(hoursByActivity, params, grazingPlan) {
  const leadingHerd = params.dairyCows > 0 ? 'dairyCows' : params.sucklerCows > 0 ? 'beefCattle' : 'sheep';
  hoursByActivity[leadingHerd] = Math.max(0, hoursByActivity[leadingHerd] + grazingPlan.extraMoveHours);
}

// ===== model/stages/enterprises.js =====
// Result of each enterprise: revenue, costs, own feed at production cost, shared buildings, hours and land.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Result per enterprise ----------

/** Share of the cattle shed taken by one finisher and one beef heifer, relative to a cow. */
const SHED_PLACES_PER_FINISHER = 0.7;
const SHED_PLACES_PER_BEEF_HEIFER = 0.6;

/** Share of the energy bill attributed to the dairy and to the laying hens. */
const DAIRY_ENERGY_SHARE = 0.6;
const LAYING_HENS_ENERGY_SHARE = 0.1;

function computeEnterprises(params, results) {
  const feed = ownFeedUnitCosts(params, results);
  const enterprises = listEnterprises(params, results, feed).map(withDefaults);

  const landHa = landUsedByEnterprise(params, results);
  for (const enterprise of enterprises) addPerUnitResults(enterprise, landHa[enterprise.id]);

  // what is not attributed to any enterprise: area payments, fixed costs, garden
  const attributedNet = sumBy(enterprises, enterprise => enterprise.net);
  const attributedHours = sumBy(enterprises, enterprise => enterprise.hours);
  return {
    grainCostPerTonne: feed.grainCostPerTonne,
    forageCostPerTonne: feed.forageCostPerTonne,
    enterprises,
    unallocated: { net: results.netIncome - attributedNet, hours: results.totalHours - attributedHours },
  };
}

/** Own grain and forage valued at their production cost per tonne (purchase price if none is grown). */
function ownFeedUnitCosts(params, results) {
  const grainLandCost =
    results.cerealHa * params.arableCostPerHa +
    results.rootCropHa * (params.arableCostPerHa + params.rootCropCostPerHa);
  const grainCostPerTonne =
    results.grainSupply > 0 ? grainLandCost / results.grainSupply : params.grainPurchasePrice;

  const forageTotal = results.haySupply + results.grazingSupply;
  const forageLandCost =
    params.meadowHa * params.meadowCostPerHa +
    results.cloverHa * params.arableCostPerHa +
    params.pastureHa * params.pastureCostPerHa;
  const forageCostPerTonne = forageTotal > 0 ? forageLandCost / forageTotal : params.hayPurchasePrice;

  return {
    grainCostPerTonne,
    forageCostPerTonne,
    costOf: (grainTonnes, forageTonnes) =>
      grainTonnes * grainCostPerTonne + forageTonnes * forageCostPerTonne,
  };
}

/** Yearly depreciation of one investment, 0 when the farm does not have it. */
function depreciationOf(results, investmentId) {
  const item = results.investmentItems.find(candidate => candidate.id === investmentId);
  return item ? item.yearlyDepreciation : 0;
}

/**
 * Part of the processing (RHD) revenue, costs, depreciation and hours belonging to one species,
 * split by the value of its products.
 */
function processingShare(results, species) {
  const { processedValue, processedValueBySpecies, costItems, hoursByActivity } = results;
  const share = processedValue > 0 ? processedValueBySpecies[species] / processedValue : 0;
  return {
    revenue: processedValueBySpecies[species] || 0,
    cost: costItems.processedGoods * share,
    depreciation: depreciationOf(results, 'processing') * share,
    hours: hoursByActivity.processedGoods * share,
  };
}

/** Places each species takes in the buildings it shares with others. */
function sharedBuildingPlaces(params, results) {
  const { replacementHeifers, bulls, sucklerCows, finishers, beefHeifers } = results;
  const beefShed =
    sucklerCows + finishers * SHED_PLACES_PER_FINISHER + beefHeifers * SHED_PLACES_PER_BEEF_HEIFER;
  return {
    ducks: params.ducks / 2,
    turkeys: params.turkeys * 3,
    guineaFowl: params.guineaFowl,
    otherPoultry: Math.max(1, params.ducks / 2 + params.turkeys * 3 + params.guineaFowl),
    beefShed,
    cattleShed: Math.max(
      1,
      params.dairyCows +
        replacementHeifers +
        bulls +
        sucklerCows +
        finishers * SHED_PLACES_PER_FINISHER +
        beefHeifers * SHED_PLACES_PER_BEEF_HEIFER
    ),
    sheepAndGoats: Math.max(1, params.sheep + params.goats),
  };
}

/** Fills in the fields most enterprises leave out. */
function withDefaults(enterprise) {
  return { labelKey: enterprise.id, depreciation: 0, subsidy: 0, ...enterprise };
}

/** Net result, result per hour and per hectare of land used. */
function addPerUnitResults(enterprise, landHa) {
  enterprise.net = enterprise.revenue + enterprise.subsidy - enterprise.cost - enterprise.depreciation;
  enterprise.netPerHour = enterprise.hours > 0 ? enterprise.net / enterprise.hours : 0;
  enterprise.landHa = landHa;
  enterprise.netPerHa = landHa > 0.005 ? enterprise.net / landHa : null;
}

/** Revenue, costs (including own feed), depreciation, subsidies and hours of every enterprise. */
function listEnterprises(params, results, feed) {
  const {
    revenueItems: revenue,
    costItems: cost,
    subsidyItems: subsidy,
    hoursByActivity: hours,
    forageNeedByAnimal: forage,
    grainNeedByAnimal: grain,
    homeUse,
    sucklerCows,
    finishers,
    beefHeifers,
  } = results;
  const feedCost = feed.costOf;
  const depreciation = id => depreciationOf(results, id);
  const places = sharedBuildingPlaces(params, results);
  const otherPoultryShelter = species =>
    (depreciation('otherPoultryShelters') * places[species]) / places.otherPoultry;

  const geeseProcessing = processingShare(results, 'geese');
  const duckProcessing = processingShare(results, 'ducks');
  const lambProcessing = processingShare(results, 'sheep');
  const milkSalesHours = (results.freshMilkSold / 100) * params.milkSalesHoursPer100Litres;
  const eggSalesHours = (results.eggsSold / 100) * params.eggSalesHoursPer100;

  return [
    {
      id: 'milk',
      active: params.dairyCows > 0,
      revenue: revenue.milk + revenue.cheese + revenue.calves,
      cost:
        cost.dairyCows +
        cost.milkPackaging +
        cost.cheese +
        params.energyCosts * DAIRY_ENERGY_SHARE +
        feedCost(grain.dairyCows, forage.dairyCows + forage.replacementHeifers + forage.bull),
      depreciation: depreciation('cattleShed') + depreciation('dairy') + depreciation('cheeseRoom'),
      subsidy: subsidy.dairyCows + subsidy.beefCattle,
      hours: hours.dairyCows + hours.cheese + milkSalesHours,
    },
    {
      id: 'eggs',
      active: params.layingHens > 0,
      revenue: revenue.eggs + revenue.cockerels,
      cost:
        cost.layingHens +
        params.energyCosts * LAYING_HENS_ENERGY_SHARE +
        feedCost(grain.layingHens + grain.hatching, 0),
      depreciation: depreciation('henHouse') + depreciation('hatching') + depreciation('poultryTunnel'),
      hours: hours.layingHens + hours.hatching + eggSalesHours,
    },
    {
      id: 'broilers',
      active: params.broilers > 0,
      revenue: revenue.broilers,
      cost: cost.broilers + feedCost(grain.broilers, 0),
      depreciation: depreciation('broilerPens'),
      hours: hours.broilers,
    },
    {
      id: 'geese',
      labelKey: params.geeseProcessedShare > 0 ? 'geeseWithProcessing' : 'geese',
      active: params.geese > 0,
      revenue: revenue.geese + geeseProcessing.revenue,
      cost: cost.geese + geeseProcessing.cost + feedCost(grain.geese, forage.geese),
      depreciation: geeseProcessing.depreciation,
      hours: hours.geese + geeseProcessing.hours,
    },
    {
      id: 'ducks',
      labelKey: params.ducksProcessedShare > 0 ? 'ducksWithProcessing' : 'ducks',
      active: params.ducks > 0,
      revenue: revenue.ducks + duckProcessing.revenue,
      cost: cost.ducks + duckProcessing.cost + feedCost(grain.ducks, forage.ducks),
      depreciation: otherPoultryShelter('ducks') + duckProcessing.depreciation,
      hours: hours.ducks + duckProcessing.hours,
    },
    {
      id: 'beefCattle',
      active: sucklerCows > 0,
      revenue: revenue.beefCattle,
      cost: cost.beefCattle + feedCost(0, forage.beefCattle),
      depreciation: (depreciation('cattleShed') * places.beefShed) / places.cattleShed,
      subsidy:
        SUBSIDY_RATES.dairyCows * sucklerCows +
        SUBSIDY_RATES.beefCattle * Math.floor(finishers + beefHeifers),
      hours: hours.beefCattle,
    },
    {
      id: 'turkeys',
      active: params.turkeys > 0,
      revenue: revenue.turkeys,
      cost: cost.turkeys + feedCost(grain.turkeys, forage.turkeys),
      depreciation: otherPoultryShelter('turkeys'),
      hours: hours.turkeys,
    },
    {
      id: 'guineaFowl',
      active: params.guineaFowl > 0,
      revenue: revenue.guineaFowl,
      cost: cost.guineaFowl + feedCost(grain.guineaFowl, forage.guineaFowl),
      depreciation: otherPoultryShelter('guineaFowl'),
      hours: hours.guineaFowl,
    },
    {
      id: 'rabbits',
      active: params.rabbits > 0,
      revenue: revenue.rabbits,
      cost: cost.rabbits + feedCost(grain.rabbits, forage.rabbits),
      depreciation: depreciation('rabbitHutches'),
      hours: hours.rabbits,
    },
    {
      id: 'sheep',
      labelKey: params.lambProcessedShare > 0 ? 'sheepWithProcessing' : 'sheep',
      active: params.sheep > 0,
      revenue: revenue.sheep + revenue.lambMeat + lambProcessing.revenue,
      cost: cost.sheep + cost.slaughter + lambProcessing.cost + feedCost(grain.sheep, forage.sheep),
      depreciation:
        depreciation('sheepShed') * (params.sheep / places.sheepAndGoats) + lambProcessing.depreciation,
      subsidy: subsidy.sheep,
      hours: hours.sheep + lambProcessing.hours,
    },
    {
      id: 'goats',
      labelKey: params.kidsSoldShare > 0 ? 'goatsWithMeat' : 'goats',
      active: params.goats > 0,
      revenue: revenue.goats,
      cost: cost.goats + feedCost(0, forage.goats),
      depreciation: depreciation('sheepShed') * (params.goats / places.sheepAndGoats),
      subsidy: subsidy.goats,
      hours: hours.goats,
      homeValue: homeUse.dogFood,
    },
    {
      id: 'pigs',
      labelKey: params.pigsForSale > 0 ? 'pigsForSale' : 'pigs',
      active: params.pigsForHome + params.pigsForSale > 0,
      revenue: revenue.pigs,
      cost: cost.pigs + feedCost(grain.pigs, 0),
      hours: hours.pigs,
      homeValue: homeUse.pigs,
    },
    {
      id: 'horses',
      active: params.horses > 0,
      revenue: 0,
      cost: cost.horses + feedCost(grain.horses, forage.horses),
      depreciation: depreciation('horses'),
      hours: hours.horses,
    },
    {
      id: 'vegetables',
      active: params.marketGardenHa > 0,
      revenue: revenue.vegetables,
      cost: cost.vegetables,
      depreciation: depreciation('vegetables'),
      hours: hours.vegetables,
    },
    {
      id: 'fruit',
      active: revenue.fruit > 0,
      revenue: revenue.fruit,
      cost: cost.fruit,
      hours: hours.fruit,
    },
    {
      id: 'mushrooms',
      active: params.mushroomLogs > 0,
      revenue: revenue.mushrooms,
      cost: cost.mushrooms,
      hours: hours.mushrooms,
    },
    {
      id: 'grainForSale',
      active: results.grainSoldTonnes > 0,
      revenue: revenue.grainSales,
      cost: results.grainSoldTonnes * feed.grainCostPerTonne,
      hours: results.grainSupply > 0 ? (hours.cereals * results.grainSoldTonnes) / results.grainSupply : 0,
    },
    {
      id: 'beehives',
      active: params.beehives > 0,
      revenue: revenue.honey,
      cost: cost.beehives,
      depreciation: depreciation('beehives'),
      hours: hours.beehives,
    },
  ];
}

/** Hectares needed for each enterprise's feed (or its own crop) at this farm's yields. */
function landUsedByEnterprise(params, results) {
  const { forageNeedByAnimal: forage, grainNeedByAnimal: grain } = results;
  const forageLandHa = params.pastureHa + params.meadowHa + results.cloverHa;
  const forageYieldPerHa =
    forageLandHa > 0 ? (results.grazingSupply + results.haySupply) / forageLandHa : params.pastureYield;
  const grainHa = tonnes => tonnes / params.cerealYield;
  const forageHa = tonnes => tonnes / forageYieldPerHa;
  return {
    milk: forageHa(forage.dairyCows + forage.replacementHeifers + forage.bull) + grainHa(grain.dairyCows),
    eggs: grainHa(grain.layingHens + grain.hatching),
    broilers: grainHa(grain.broilers),
    geese: forageHa(forage.geese) + grainHa(grain.geese),
    rabbits: forageHa(forage.rabbits) + grainHa(grain.rabbits),
    sheep: forageHa(forage.sheep) + grainHa(grain.sheep),
    goats: forageHa(forage.goats),
    pigs: grainHa(grain.pigs),
    horses: forageHa(forage.horses) + grainHa(grain.horses),
    vegetables: params.marketGardenHa,
    beehives: 0,
    beefCattle: forageHa(forage.beefCattle),
    ducks: forageHa(forage.ducks) + grainHa(grain.ducks),
    turkeys: forageHa(forage.turkeys) + grainHa(grain.turkeys),
    guineaFowl: forageHa(forage.guineaFowl) + grainHa(grain.guineaFowl),
    fruit: (results.orchardHa * params.fruitSoldShare) / 100,
    mushrooms: 0,
    grainForSale: results.grainSoldTonnes / params.cerealYield,
  };
}

// ===== model/stages/market.js =====
// How much of each product has to be sold, and to how many customers.
// A stage of simulateFarm() (simulate-farm.js): reads params and earlier results, returns new results.

// ---------- Market: how much has to be sold ----------

function computeMarket(params, results) {
  const { revenueItems: revenue, finishers } = results;
  const beefBoxRevenue =
    ((((finishers * params.finishersSoldAsMeatShare) / 100) *
      params.finisherWeightKg *
      params.finisherKillingOut) /
      100) *
    params.beefBoxPricePerKg;
  return {
    market: {
      milkPerDay: results.freshMilkSold / 365,
      eggsPerWeek: results.eggsSold / 52,
      csaShares: revenue.vegetables / 1600,
      honeyKg: params.beehives * params.honeyPerHive * 0.95,
      cheesePerWeek: results.cheeseSold / 52,
      // farm retail sales (RHD): cheese, red meat in boxes, smoked goods
      directSalesRevenue:
        revenue.cheese +
        revenue.lambMeat +
        revenue.processedGoods +
        revenue.goats +
        revenue.pigs +
        beefBoxRevenue,
    },
  };
}

// ===== model/simulate-farm.js =====
// Yearly farm model: from the params it computes land use, feed balance, revenue, costs,
// investments, subsidies, working hours, results per enterprise and the monthly cash flow.
//
// The stages live in model/stages/. Each stage reads the params and what earlier stages
// produced, and adds its own values to one flat `results` object used by every panel.

/**
 * @param {object} inputParams - values of all parameters (see parameters/registry.js)
 * @returns {object} results
 */
function simulateFarm(inputParams) {
  const soilFactors = computeSoilFactors(inputParams);
  const grazingPlan = computeGrazingPlan(inputParams);
  const params = adjustForMilkingRoutine(
    adjustPastureForGrazingPlan(adjustYieldsForSoil(inputParams, soilFactors), grazingPlan)
  );
  const results = { soilFactors, grazingPlan };

  const stages = [
    computeLandUse,
    computeHerdStructure,
    computeForageBalance,
    computeMilkAndCheese,
    computeFlockRenewal,
    computeGrainBalance,
    computeStrawBalance,
    computeLivestockUnits,
    computeRevenue,
    computeCosts,
    computeInvestments,
    computeSubsidies,
    computeNetIncome,
    computeLabour,
    computeEnterprises,
    computeMarket,
  ];
  for (const stage of stages) Object.assign(results, stage(params, results));

  results.warnings = collectWarnings(params, inputParams, results);
  results.householdBudget = computeHouseholdBudget(params);
  results.incomeTarget = computeIncomeTarget(params);
  results.cashflow = computeMonthlyCashflow(results, params);
  return results;
}

function adjustYieldsForSoil(params, soilFactors) {
  return {
    ...params,
    cerealYield: params.cerealYield * soilFactors.arable,
    strawYield: params.strawYield * soilFactors.arable,
    cloverYield: params.cloverYield * soilFactors.arable,
    rootCropYield: params.rootCropYield * soilFactors.arable,
    pastureYield: params.pastureYield * soilFactors.grassland,
    meadowYield: params.meadowYield * soilFactors.grassland,
  };
}

/** Grass eaten per hectare depends on how often the herd moves and how long paddocks rest. */
function adjustPastureForGrazingPlan(params, grazingPlan) {
  return { ...params, pastureYield: params.pastureYield * grazingPlan.yieldFactor };
}

/** Milking once a day (New Zealand style): less milk, much less time in the parlour. */
const ONCE_A_DAY_MILK_FACTOR = 0.8;
const ONCE_A_DAY_HOURS_PER_COW_FACTOR = 0.65;
const ONCE_A_DAY_DAIRY_FIXED_HOURS_FACTOR = 0.6;

function adjustForMilkingRoutine(params) {
  if (!params.onceADayMilking) return params;
  return {
    ...params,
    milkPerCow: params.milkPerCow * ONCE_A_DAY_MILK_FACTOR,
    hoursPerCow: params.hoursPerCow * ONCE_A_DAY_HOURS_PER_COW_FACTOR,
    dairyFixedHours: params.dairyFixedHours * ONCE_A_DAY_DAIRY_FIXED_HOURS_FACTOR,
  };
}

/** Result before paying the family for its work, without loans and taxes. */
function computeNetIncome(params, results) {
  return { netIncome: results.revenue + results.subsidies - results.costs - results.depreciation };
}
</script>
<script>
(function () {
// ===== ui/last-choice.js =====
// Remembers the last ready-made variant and assumption set chosen in this browser.
//
// On the next visit the app starts from the saved settings. If the user has not changed the
// values a preset set, the current version of that preset is loaded again (presets may have been
// improved since), so it stays selected. On the first visit the app starts from the realistic
// assumptions and the recommended variant.

const LAST_CHOICE_STORAGE_KEY = 'gosp-ostatni-wybor';
const DEFAULTS_VERSION_STORAGE_KEY = 'gosp-wersja-domyslnych';
const FIRST_VISIT_PRESET_ID = 'recommended';
const FIRST_VISIT_ASSUMPTION_SET_ID = 'realistic';

/** {preset: {id, values}, assumption: {id, values}} — what was chosen and the values it set. */
function loadLastChoice() {
  try {
    return JSON.parse(localStorage.getItem(LAST_CHOICE_STORAGE_KEY) || '{}') || {};
  } catch (error) {
    return {};
  }
}

/** Remembers a preset or assumption set right after it was applied. */
function rememberChoice(kind, id, values) {
  const choice = { ...loadLastChoice(), [kind]: { id, values } };
  try {
    localStorage.setItem(LAST_CHOICE_STORAGE_KEY, JSON.stringify(choice));
  } catch (error) {
    // storage unavailable: the choice is simply not remembered
  }
}

const assumptionSetById = id => ASSUMPTION_SETS.find(set => set.id === id);

/** Settings to start with: saved ones (with the last choice refreshed) or the first-visit default. */
function startupParams(saved, savedDefaultsVersion) {
  if (!saved) {
    const assumption = assumptionSetById(FIRST_VISIT_ASSUMPTION_SET_ID);
    const preset = presetById(FIRST_VISIT_PRESET_ID);
    rememberChoice('assumption', assumption.id, assumption.params);
    rememberChoice('preset', preset.id, preset.params);
    return { ...defaultParams(), ...assumption.params, ...preset.params };
  }

  let params = { ...defaultParams(), ...migrateChangedDefaults(saved, savedDefaultsVersion) };
  const lastChoice = loadLastChoice();
  const refresh = (choice, current) => {
    if (!choice || !current || !choice.values) return;
    const untouched = Object.entries(choice.values).every(([id, value]) => params[id] === value);
    if (untouched) {
      params = { ...params, ...current.params };
      rememberChoice(choice === lastChoice.preset ? 'preset' : 'assumption', current.id, current.params);
    }
  };
  refresh(lastChoice.assumption, lastChoice.assumption && assumptionSetById(lastChoice.assumption.id));
  refresh(lastChoice.preset, lastChoice.preset && presetById(lastChoice.preset.id));
  return params;
}

function rememberDefaultsVersion() {
  try {
    localStorage.setItem(DEFAULTS_VERSION_STORAGE_KEY, String(DEFAULTS_VERSION));
  } catch (error) {
    // nothing to do
  }
}

// ===== ui/core.js =====
// Application state and small helpers shared by all panels.

/** Browser storage key of the current settings (kept from the first version of the app). */
const STORAGE_KEY = 'gosp-lwowek-v1';

/** Current values of all parameters; every change re-renders the page. */
let params = loadSavedParams();

function loadSavedParams() {
  let saved = null;
  let savedDefaultsVersion = 1;
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (stored) saved = migrateLegacyParameterIds(stored);
    savedDefaultsVersion = +(localStorage.getItem(DEFAULTS_VERSION_STORAGE_KEY) || 1);
  } catch (error) {
    // storage unavailable (private window, preview): start like a first visit
  }

  const known = defaultParams();
  const loaded = startupParams(saved, savedDefaultsVersion);
  for (const id in loaded) if (!(id in known)) delete loaded[id];
  rememberDefaultsVersion();
  return loaded;
}

function saveParams() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(params));
  } catch (error) {
    // nothing to do: settings simply are not remembered
  }
}

const byId = id => document.getElementById(id);

/** Amount in PLN rounded to hundreds, e.g. "12 300 zł". */
const formatPln = amount => t('format.pln', { amount: formatNumber(Math.round(amount / 100) * 100, 0) });

/** Amount in PLN rounded to whole złoty. */
const formatPlnExact = amount => t('format.pln', { amount: formatNumber(amount, 0) });

const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const escapeHtml = text => String(text).replace(/[&<>"]/g, character => HTML_ESCAPES[character]);

/** Number of decimals of a slider step, e.g. 0.25 → 2. */
function decimalPlaces(step) {
  const text = String(step);
  return text.includes('.') ? text.split('.')[1].length : 0;
}

const parameterText = (parameter, field) => {
  const key = `parameters.${parameter.id}.${field}`;
  return hasMessage(key) ? t(key) : '';
};
const parameterLabel = parameter => parameterText(parameter, 'label');
const parameterUnit = parameter => parameterText(parameter, 'unit');
const parameterHint = parameter => parameterText(parameter, 'hint');

/** Slider value with its unit, e.g. "3 700 l/rok"; empty for switches. */
function formatParameterValue(parameter, value) {
  if (parameter.type === 'boolean') return '';
  const unit = parameterUnit(parameter);
  return formatNumber(value, decimalPlaces(parameter.step)) + (unit ? ' ' + unit : '');
}

// ===== ui/markup.js =====
// Helpers that build HTML and SVG markup strings, so the panels describe elements as data
// instead of long template strings.

/**
 * Markup of one element; attributes that are null, undefined or false are left out.
 * @param {string} name - tag name, e.g. "rect"
 * @param {object} [attributes] - e.g. { x: 10, y: 20, fill: 'var(--ok)' }
 * @param {string} [content] - inner markup, already escaped
 * @returns {string}
 */
function element(name, attributes = {}, content = '') {
  return `<${name}${attributesText(attributes)}>${content}</${name}>`;
}

/** Markup of an element without content or closing tag, e.g. <input>. */
function voidElement(name, attributes = {}) {
  return `<${name}${attributesText(attributes)}>`;
}

function attributesText(attributes) {
  return Object.entries(attributes)
    .filter(([, value]) => value !== null && value !== undefined && value !== false)
    .map(([attribute, value]) => ` ${attribute}="${value}"`)
    .join('');
}

/**
 * Header row of a table.
 * @param {string[]} labels
 * @param {(index: number) => boolean} [isNumeric] - right-aligned columns; by default all but the first
 */
function tableHeader(labels, isNumeric = index => index > 0) {
  const cells = labels.map((label, index) => element('th', { class: isNumeric(index) ? 'n' : null }, label));
  return `<thead><tr>${cells.join('')}</tr></thead>`;
}

/** A right-aligned number cell, red when `isNegative`. */
const numberCell = (content, isNegative = false) =>
  element('td', { class: isNegative ? 'n neg' : 'n' }, content);

/** A table cell; attributes are optional, e.g. { class: 'n' }. */
const cell = (content, attributes = {}) => element('td', attributes, content);

/** A table row built from cell markup. */
const tableRow = (cells, attributes = {}) => element('tr', attributes, cells.join(''));

/** A table body built from row markup. */
const tableBody = rows => element('tbody', {}, rows.join(''));

// ===== ui/controls.js =====
// Controls panel: one collapsible group per parameter group, with subsection titles,
// sliders and switches bound to `params`.

const OPEN_GROUPS = [];

function buildControls() {
  let html = '';
  for (const group of PARAMETER_GROUP_IDS) {
    const isOpen = OPEN_GROUPS.includes(group) ? 'open' : '';
    const title = element('span', {}, t(`parameterGroups.${group}`));
    const summary = element('span', { class: 'sumv', id: `summary-${group}` });
    html += `<details class="grp" id="group-${group}" ${isOpen}>
      <summary>${title}${summary}</summary>
      <div class="grp-body">`;
    for (const parameter of PARAMETERS.filter(item => item.group === group)) html += controlHtml(parameter);
    html += `</div></details>`;
  }
  html += `<button class="btn ghost reset" id="reset" type="button">${t('controls.reset')}</button>`;
  byId('controls').innerHTML = html;

  for (const parameter of PARAMETERS) bindControl(parameter);
  byId('reset').addEventListener('click', () => {
    endHistoryStep();
    params = defaultParams();
    syncInputs();
    onParamsChanged();
  });
}

function controlHtml(parameter) {
  const { id } = parameter;
  const label = escapeHtml(parameterLabel(parameter));
  const hint = escapeHtml(parameterHint(parameter));
  let html = '';
  if (SUBSECTION_START_IDS.has(id))
    html += `<div class="ctl-sep" role="presentation">${escapeHtml(t(`subsections.${id}`))}</div>`;

  if (parameter.type === 'boolean') {
    const help = hint ? `<br><span class="help muted small">${hint}</span>` : '';
    html += `<label class="sw"><input type="checkbox" id="input-${id}"><span>${label}${help}</span></label>`;
  } else {
    const help = hint ? element('p', { class: 'help' }, hint) : '';
    const slider = voidElement('input', {
      type: 'range',
      id: `input-${id}`,
      min: parameter.min,
      max: parameter.max,
      step: parameter.step,
    });
    html += `<div class="ctl${parameter.advanced ? ' adv' : ''}">
      <div class="ctl-top"><label for="input-${id}">${label}</label><output id="output-${id}"></output></div>
      ${slider}${help}
    </div>`;
  }
  // arable land is what remains after the land uses above it
  if (id === 'meadowHa') html += `<div class="derived" id="derived-arable"></div>`;
  return html;
}

function bindControl(parameter) {
  const input = byId('input-' + parameter.id);
  if (parameter.type === 'boolean') {
    input.addEventListener('change', () => {
      params[parameter.id] = input.checked;
      onParamsChanged();
    });
  } else {
    input.addEventListener('input', () => {
      params[parameter.id] = parseFloat(input.value);
      byId('output-' + parameter.id).textContent = formatParameterValue(parameter, params[parameter.id]);
      onParamsChanged();
    });
  }
}

/** Moves every control to the current value in `params`. */
function syncInputs() {
  for (const parameter of PARAMETERS) {
    const input = byId('input-' + parameter.id);
    if (parameter.type === 'boolean') {
      input.checked = !!params[parameter.id];
    } else {
      input.value = params[parameter.id];
      byId('output-' + parameter.id).textContent = formatParameterValue(parameter, params[parameter.id]);
    }
  }
}

/** Applies an assumption set (prices, yields, work norms) and remembers it. */

function applyParams(values) {

// ---------- Saved variants ----------

const SAVED_VARIANTS_STORAGE_KEY = 'gosp-lwowek-moje-v1';
const savedVariants = loadSavedVariants();

function loadSavedVariants() {
  try {
    const stored = JSON.parse(localStorage.getItem(SAVED_VARIANTS_STORAGE_KEY) || '[]') || [];
    // version 1 stored the settings under `p` with Polish parameter ids
    return stored.map(variant => ({
      name: variant.name,
      params: migrateLegacyParameterIds(variant.params || variant.p),
    }));
  } catch (error) {
    return [];
  }
}

/** @returns {boolean} false when the browser does not allow saving */
function storeSavedVariants() {
  try {
    localStorage.setItem(SAVED_VARIANTS_STORAGE_KEY, JSON.stringify(savedVariants));
    return true;
  } catch (error) {
    return false;
  }
}

function buildSavedVariants() {
  const nameInput = byId('saved-variant-name');
  byId('save-variant').addEventListener('click', () => {
    const name =
      (nameInput.value || '').trim() || t('savedVariants.defaultName', { number: savedVariants.length + 1 });
    const existing = savedVariants.findIndex(variant => variant.name === name);
    const variant = { name, params: { ...params } };
    if (existing >= 0) savedVariants[existing] = variant;
    else savedVariants.push(variant);

    const stored = storeSavedVariants();
    nameInput.value = '';
    byId('saved-variants-note').textContent = stored
      ? t('savedVariants.saved', { name })
      : t('savedVariants.storageUnavailable');
    renderSavedVariants();
    render();
  });
  nameInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') byId('save-variant').click();
  });
  renderSavedVariants();
}

function renderSavedVariants() {
  byId('saved-variants').innerHTML = savedVariants
    .map((variant, index) => {
      const name = escapeHtml(variant.name);
      const deleteLabel = t('savedVariants.delete', { name });
      return (
        `<button class="btn" type="button" data-saved-variant="${index}">${name}` +
        `<span class="x" data-delete-variant="${index}" role="button" aria-label="${deleteLabel}" ` +
        `title="${t('savedVariants.deleteTitle')}">×</span></button>`
      );
    })
    .join('');

  document.querySelectorAll('[data-saved-variant]').forEach(button =>
    button.addEventListener('click', event => {
      const index = +button.dataset.savedVariant;
      if (event.target.closest('[data-delete-variant]')) {
        savedVariants.splice(index, 1);
        storeSavedVariants();
        renderSavedVariants();
        render();
        return;
      }
      endHistoryStep();
      params = { ...defaultParams(), ...savedVariants[index].params };
      syncInputs();
      onParamsChanged();
    })
  );
}

// ---------- Which buttons match the current settings ----------

/** True when every value of the set equals the current one (numbers compared with a tolerance). */
function matchesCurrentParams(values) {
  return Object.keys(values).every(id => Math.abs(+params[id] - values[id]) < 1e-9);
}

/** True when a saved variant has exactly the current settings. */
function equalsCurrentParams(values) {
  return PARAMETERS.every(
    parameter => values[parameter.id] === undefined || values[parameter.id] === params[parameter.id]
  );
}

function markActivePresets() {
  const highlight = (selector, isActive) =>
    document.querySelectorAll(selector).forEach(button => button.classList.toggle('on', isActive(button)));
  highlight('[data-preset]', button => matchesCurrentParams(presetById(button.dataset.preset).params));
  highlight('[data-assumption]', button =>
    matchesCurrentParams(assumptionSetById(button.dataset.assumption).params)
  );
  highlight('[data-saved-variant]', button =>
    equalsCurrentParams(savedVariants[+button.dataset.savedVariant].params)
  );
}

// ===== ui/history.js =====
// "Previous data": every change of the settings is remembered, so the user can step back.
// Changes that follow each other quickly (dragging a slider) count as one step.

const HISTORY_LIMIT = 30;
/** Pause after which the next change starts a new step. */
const HISTORY_STEP_PAUSE_MS = 800;

const paramsHistory = [];
/** Settings as they were before the change that is going on now. */
let settledParams = { ...params };
let stepTimer = 0;

/** Called on every change of the settings (from onParamsChanged). */
function recordParamsChange() {
  if (!stepTimer && !haveSameValues(settledParams, params)) {
    paramsHistory.push(settledParams);
    if (paramsHistory.length > HISTORY_LIMIT) paramsHistory.shift();
  }
  clearTimeout(stepTimer);
  stepTimer = setTimeout(endHistoryStep, HISTORY_STEP_PAUSE_MS);
  renderUndoButton();
}

/** Closes the current step, so that the next change can be undone on its own. */
function endHistoryStep() {
  clearTimeout(stepTimer);
  stepTimer = 0;
  settledParams = { ...params };
}

/** Restores the settings from before the last step. */
function restorePreviousParams() {
  const previous = paramsHistory.pop();
  if (!previous) return;

  clearTimeout(stepTimer);
  stepTimer = 0;
  params = { ...previous };
  settledParams = { ...previous };
  syncInputs();
  render();
  saveParams();
  renderUndoButton();
}

function renderUndoButton() {
  byId('undo-params').disabled = paramsHistory.length === 0;
}

const haveSameValues = (a, b) => Object.keys(a).every(id => a[id] === b[id]);
