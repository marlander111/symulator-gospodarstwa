<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Symulator gospodarstwa rodzinnego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@500;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Wygląd aplikacji: kolory (jasny i ciemny motyw), układ, panele, tabele, suwaki. */

/* Układ: tablica gospodarza — pasek wyników przyklejony u góry, po lewej suwaki, po prawej bilanse; niżej plan pól i kalendarz */
:root {
  --bg: #eef1ea;
  --surface: #fbfcf9;
  --surface2: #e3e8dd;
  --ink: #1b261e;
  --muted: #58665b;
  --line: #cfd8cb;
  --accent: #2c6a3b;
  --accent-ink: #ffffff;
  --color-pasture: #4f8f4a;
  --color-meadow: #9bb859;
  --color-clover: #9a5f8c;
  --color-cereal: #c39a35;
  --color-roots: #a0522d;
  --color-farmyard: #8a7560;
  --color-cattle: #2c6a3b;
  --color-poultry: #c39a35;
  --color-sheep: #8a6143;
  --color-fields: #7f9a3c;
  --color-other: #6b7f93;
  --color-produce: #9a5f8c;
  --color-processing: #b0563a;
  --ok: #2b7a4b;
  --warn: #a86a10;
  --bad: #b0392e;
  --info: #3f6c93;
  --ok-bg: #e1f0e5;
  --warn-bg: #f6ead3;
  --bad-bg: #f6dfdc;
  --info-bg: #e0eaf3;
  --f-disp: 'Rokkitt', 'Rockwell', Georgia, serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #121713;
    --surface: #192019;
    --surface2: #222b23;
    --ink: #e4ebe2;
    --muted: #9aa89c;
    --line: #2f3a30;
    --accent: #6dbb7e;
    --accent-ink: #0e1a10;
    --color-pasture: #6aaa63;
    --color-meadow: #adc96a;
    --color-clover: #c08ab4;
    --color-cereal: #d9b04c;
    --color-roots: #d08a5c;
    --color-farmyard: #ad9479;
    --color-cattle: #6dbb7e;
    --color-poultry: #d9b04c;
    --color-sheep: #b88a66;
    --color-fields: #a5c25a;
    --color-other: #8fa6bb;
    --color-produce: #c08ab4;
    --color-processing: #d98466;
    --ok: #62c48b;
    --warn: #e2a64a;
    --bad: #e8786c;
    --info: #7fb0da;
    --ok-bg: #1d3324;
    --warn-bg: #3a2d17;
    --bad-bg: #3d1f1c;
    --info-bg: #1b2c3b;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #121713;
  --surface: #192019;
  --surface2: #222b23;
  --ink: #e4ebe2;
  --muted: #9aa89c;
  --line: #2f3a30;
  --accent: #6dbb7e;
  --accent-ink: #0e1a10;
  --color-pasture: #6aaa63;
  --color-meadow: #adc96a;
  --color-clover: #c08ab4;
  --color-cereal: #d9b04c;
  --color-roots: #d08a5c;
  --color-farmyard: #ad9479;
  --color-cattle: #6dbb7e;
  --color-poultry: #d9b04c;
  --color-sheep: #b88a66;
  --color-fields: #a5c25a;
  --color-other: #8fa6bb;
  --color-produce: #c08ab4;
  --color-processing: #d98466;
  --ok: #62c48b;
  --warn: #e2a64a;
  --bad: #e8786c;
  --info: #7fb0da;
  --ok-bg: #1d3324;
  --warn-bg: #3a2d17;
  --bad-bg: #3d1f1c;
  --info-bg: #1b2c3b;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1,
h2,
h3 {
  font-family: var(--f-disp);
  font-weight: 700;
  text-wrap: balance;
  margin: 0;
  letter-spacing: 0.005em;
}
h1 {
  font-size: clamp(30px, 4.6vw, 46px);
  line-height: 1.05;
}
h2 {
  font-size: 26px;
  line-height: 1.15;
}
h3 {
  font-size: 19px;
}
p {
  margin: 0;
}
a {
  color: var(--accent);
}
.num {
  font-family: var(--f-num);
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13px;
}
.eyebrow {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  font-weight: 600;
}

/* Nagłówek */
header.top {
  padding-block: 28px 18px;
  display: grid;
  gap: 10px;
}
header.top .lead {
  max-width: 70ch;
  color: var(--muted);
}
.loc {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 13px;
  color: var(--muted);
}
.loc span {
  font-family: var(--f-num);
}
.top-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 0 18px;
  align-items: center;
}
.top-tools .seg {
  margin: 0;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

/* Pasek wyników */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
}
.bar .wrap {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px 18px;
  padding-block: 10px;
}
.kpi {
  min-width: 0;
}
.kpi .k {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kpi .v {
  font-family: var(--f-num);
  font-size: 20px;
  font-weight: 500;
  white-space: nowrap;
}
.kpi .s {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.kpi.main .v {
  color: var(--accent);
  font-size: 22px;
}
@media (max-width: 1100px) {
  .bar .wrap {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
@media (max-width: 900px) {
  .bar .wrap {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .kpi .v {
    font-size: 17px;
  }
  .kpi.main .v {
    font-size: 18px;
  }
}
@media (max-width: 480px) {
  .bar .wrap {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .kpi.hide-s {
    display: none;
  }
}

/* Warianty */
.presets {
  display: grid;
  gap: 12px;
  padding-block: 18px 6px;
}
.prow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.prow .lbl {
  font-size: 13px;
  color: var(--muted);
  margin-right: 4px;
  min-width: 84px;
}
.btn {
  font: inherit;
  font-size: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
  display: inline-flex;
  gap: 6px;
  align-items: baseline;
}
.btn small {
  color: var(--muted);
  font-size: 12px;
}
.btn:hover {
  border-color: var(--accent);
}
.btn:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn.on {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.btn.on small {
  color: var(--accent-ink);
  opacity: 0.8;
}
.btn.ghost {
  border-style: dashed;
}
.res .plan-grid {
  grid-template-columns: 1fr;
}
.panel .intro {
  color: var(--muted);
  font-size: 14px;
  max-width: 72ch;
}
.ctl-sep {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 6px;
}
.grp-body > .ctl-sep:first-child {
  border-top: 0;
  padding-top: 0;
  margin-top: 0;
}
.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin: 4px 0 10px;
}
.seg .lab {
  font-size: 13px;
  color: var(--muted);
  margin-right: 4px;
}
.seg .btn {
  padding: 4px 10px;
  font-size: 13px;
}
.plan-grid {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(220px, 1fr);
  gap: 14px;
  align-items: start;
}
@media (max-width: 900px) {
  .plan-grid {
    grid-template-columns: 1fr;
  }
}
#plan-svg [data-a] {
  cursor: pointer;
}
#plan-svg [data-a]:hover {
  stroke-width: 3;
}
.sub-h {
  font-size: 20px;
  margin: 22px 0 4px;
}
.rot .mp {
  display: block;
  font-size: 12px;
  color: var(--muted);
}
.rot .mp.on {
  color: var(--accent);
  font-weight: 600;
}
.rot td.crop {
  font-size: 13px;
  border-left: 4px solid transparent;
}
.rot th.sel,
.rot td.sel {
  background: var(--surface2);
}
.rot th button {
  all: unset;
  cursor: pointer;
  text-decoration: underline;
  font-weight: 600;
}
.cal tr.sel td {
  background: var(--surface2);
}
.cal tbody tr {
  cursor: pointer;
}
.cal .tk {
  display: block;
}
.cal .tk b {
  font-weight: 600;
}
.pdf-box {
  position: relative;
  display: inline-block;
}
.pdf-box > summary {
  list-style: none;
  cursor: pointer;
}
.pdf-box > summary::-webkit-details-marker {
  display: none;
}
.pdf-pick {
  position: absolute;
  z-index: 30;
  top: calc(100% + 6px);
  left: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;
  display: grid;
  gap: 6px;
  min-width: 230px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}
.inv-in {
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  text-align: right;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 6px;
  padding: 3px 6px;
  width: 110px;
}
.inv-in.ov {
  border-color: var(--accent);
  font-weight: 600;
}
.inv-rs {
  border: 0;
  background: none;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  padding: 0 4px;
  text-decoration: underline;
}
.mine-name {
  font: inherit;
  font-size: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  min-width: 0;
  width: 200px;
  max-width: 100%;
}
.btn .x {
  margin-left: 4px;
  color: var(--muted);
  font-family: var(--f-num);
}
.btn.on .x {
  color: var(--accent-ink);
}

/* Układ główny */
.layout {
  display: grid;
  grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
  gap: 24px;
  padding-block: 14px 30px;
  align-items: start;
}
@media (max-width: 960px) {
  .layout {
    grid-template-columns: minmax(0, 1fr);
  }
}
aside.ctrls {
  display: grid;
  gap: 10px;
  min-width: 0;
}
details.grp {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
details.grp > summary {
  list-style: none;
  cursor: pointer;
  padding: 11px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}
details.grp > summary::-webkit-details-marker {
  display: none;
}
details.grp > summary::after {
  content: '+';
  font-family: var(--f-num);
  color: var(--muted);
}
details.grp[open] > summary::after {
  content: '–';
}
details.grp > summary .sumv {
  font-family: var(--f-num);
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
  margin-left: auto;
  margin-right: 10px;
}
.grp-body {
  padding: 2px 14px 14px;
  display: grid;
  gap: 12px;
}
.ctl {
  display: grid;
  gap: 3px;
}
.ctl-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}
.ctl label {
  font-size: 13.5px;
}
.ctl output {
  font-family: var(--f-num);
  font-size: 13.5px;
  white-space: nowrap;
}
.ctl .help {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}
.ctl.adv label {
  color: var(--muted);
}
input[type='range'] {
  width: 100%;
  accent-color: var(--accent);
  margin: 2px 0;
}
.sw {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  font-size: 13.5px;
  cursor: pointer;
}
.sw input {
  margin-top: 3px;
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
  flex: none;
}
.derived {
  background: var(--surface2);
  border-radius: var(--r);
  padding: 8px 10px;
  font-size: 13px;
}
.derived b {
  font-family: var(--f-num);
  font-weight: 500;
}
.reset {
  justify-self: start;
}

/* Panele wyników */
.res {
  display: grid;
  gap: 18px;
  min-width: 0;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.panel-h {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
  flex-wrap: wrap;
}
.panel-h p {
  font-size: 13px;
  color: var(--muted);
}
.warns {
  display: grid;
  gap: 6px;
}
.w {
  border-radius: var(--r);
  padding: 8px 12px;
  font-size: 14px;
  display: flex;
  gap: 10px;
  align-items: baseline;
}
.w::before {
  font-family: var(--f-num);
  font-size: 12px;
  font-weight: 500;
  flex: none;
}
.w.bad {
  background: var(--bad-bg);
  color: var(--ink);
}
.w.bad::before {
  content: 'BRAK';
  color: var(--bad);
}
.w.warn {
  background: var(--warn-bg);
}
.w.warn::before {
  content: 'UWAGA';
  color: var(--warn);
}
.w.info {
  background: var(--info-bg);
}
.w.info::before {
  content: 'INFO';
  color: var(--info);
}
.w.ok {
  background: var(--ok-bg);
}
.w.ok::before {
  content: 'OK';
  color: var(--ok);
}

/* Pasek ziemi */
.landbar {
  display: flex;
  height: 30px;
  border-radius: var(--r);
  overflow: hidden;
  border: 1px solid var(--line);
}
.landbar div {
  height: 100%;
  transition: width 0.25s;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 13px;
}
.legend i {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: -1px;
}
.legend b {
  font-family: var(--f-num);
  font-weight: 500;
}

/* Bilans pasz */
.feed {
  display: grid;
  gap: 12px;
}
.frow {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) 92px;
  gap: 12px;
  align-items: center;
}
.frow .fl {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.25;
}
.frow .fl span {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}
.fbars {
  display: grid;
  gap: 4px;
}
.fb {
  height: 12px;
  border-radius: 3px;
  position: relative;
  transition: width 0.25s;
  min-width: 2px;
}
.fb.need {
  background: transparent;
  border: 1.5px solid var(--muted);
  height: 12px;
}
.fnums {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--f-num);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.pill {
  font-family: var(--f-num);
  font-size: 12.5px;
  border-radius: 999px;
  padding: 3px 9px;
  text-align: center;
  white-space: nowrap;
}
.pill.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.pill.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.pill.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
@media (max-width: 560px) {
  .frow {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .frow .fbars {
    grid-column: 1 / -1;
    grid-row: 2;
  }
}

/* Tabele */
.tw {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}
th,
td {
  padding: 7px 8px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
th {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 600;
}
td.n,
th.n {
  text-align: right;
  font-family: var(--f-num);
  white-space: nowrap;
}
tr.tot td {
  font-weight: 700;
  border-top: 2px solid var(--ink);
  border-bottom: none;
}
tr.sub td {
  color: var(--muted);
}
.neg {
  color: var(--bad);
}
.twocol {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
@media (max-width: 700px) {
  .twocol {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Wykresy */
svg.chart {
  width: 100%;
  height: auto;
  display: block;
}
svg text {
  fill: var(--ink);
  font-family: var(--f-body);
}
svg .ax {
  fill: var(--muted);
  font-size: 12px;
}
svg .grid {
  stroke: var(--line);
  stroke-width: 1;
}

/* Rynek */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.card {
  background: var(--surface2);
  border-radius: var(--r);
  padding: 10px 12px;
  display: grid;
  gap: 2px;
}
.card .v {
  font-family: var(--f-num);
  font-size: 20px;
}
.card .k {
  font-size: 12.5px;
  color: var(--muted);
}

/* Sekcje pełnej szerokości */
section.full {
  padding-block: 30px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 16px;
}
section.full .intro {
  max-width: 72ch;
  color: var(--muted);
}
.plan-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;

ch cen: mleka, sera, jaj, mięsa, warzyw, owoców, grzybów, miodu i wędlin."},"pessimisticYieldDrop":{"label":"Plony niższe o","unit":"%","hint":"Zboża, słoma, łąka, pastwisko, koniczyna, sad, miód, grzyby. Susza lub mokry rok."},"pessimisticAnimalOutputDrop":{"label":"Wydajność zwierząt niższa o","unit":"%","hint":"Mleko od krowy, nieśność, odchów jagniąt i królików."},"pessimisticExtraHours":{"label":"Praca zajmuje więcej o","unit":"%","hint":"Wszystkie normy czasu pracy. Choroby, awarie, uczenie się."},"pessimisticCostIncrease":{"label":"Koszty bieżące wyższe o","unit":"%","hint":"Też ceny dokupowanego ziarna, siana i słomy. Czynszu nie zmieniam."}},"presets":{"recommended":{"label":"Mleko + jaja + owce","note":"Zalecany start"},"milkAndEggs":{"label":"Mleko + jaja","note":"Bez owiec"},"poultryFirst":{"label":"Drób na pierwszym planie","note":"Mało krów"},"family":{"label":"Rodzina: cel 120 tys.","note":"Konie, owce, +3 ha"},"diversified":{"label":"Rodzina: różnorodnie","note":"Kaczki, perliczki, owoce, grzyby"},"smokehouse":{"label":"Rodzina + wędzarnia","note":"Półgęsek, wyroby, wysyłka"},"minimum":{"label":"Minimum: 12 ha, 3 krowy","note":"Mało pracy i inwestycji"},"minimumNoDairy":{"label":"Minimum: 12 ha bez krów","note":"Drób i owce"},"maximumProfit":{"label":"Maksimum zysku","note":"Cały czas rodziny, bez limitu tygodnia"},"noMilking":{"label":"Bez dojenia","note":"Mniej pracy"},"showPessimistic":"Pokaż wszystko w wariancie pesymistycznym","lubuskieAngus":{"label":"Lubuskie: angusy na trawie","note":"Mało pracy, mały dochód","description":"Typowy w Lubuskiem chów bydła mięsnego: krowy mamki angus cały sezon na pastwisku, przesuwane raz w tygodniu, odsadki sprzedawane jesienią, zimą siano z łąk. Do tego ekoschemat ekstensywnych użytków zielonych i dopłaty do bydła. Na 14 ha mieści się ok. 8 mamek, więc to dochód uzupełniający. W regionie takie stada gospodarują zwykle na 50–200 ha, często dzierżawionych."},"perkinsRidgedale":{"label":"Ridgedale (R. Perkins)","note":"Warzywa, kurczaki, sad","description":"Na wzór gospodarstwa Ridgedale Richarda Perkinsa w Szwecji: intensywny ogród warzywny bez przekopywania, kurczaki w przenośnych zagrodach, kury w mobilnym kurniku, indyki, owce i kilka krów mięsnych w wypasie rotacyjnym z codziennym przesuwaniem. Do tego sad i boczniaki w zadrzewieniach oraz międzyplony. Dużo pracy i sprzedaży bezpośredniej, za to wiele źródeł dochodu."},"salatinPolyface":{"label":"Polyface (J. Salatin)","note":"Bydło, a za nim drób","description":"Na wzór Polyface Joela Salatina: bydło przesuwane codziennie, kwatera wraca do wypasu po ok. 60 dniach, 3–4 dni za bydłem jedzie mobilny kurnik. Kurczaki w zagrodach przesuwanych codziennie, indyki, króliki i kilka tuczników. Wołowina z opasu na trawie sprzedawana w paczkach. Salatin kupuje ziarno, a tutaj pochodzi ono z własnych pól."},"grassDairy":{"label":"Mleko z trawy (Voisin, NZ)","note":"Dój 1× dziennie, sery","description":"Mleczarstwo pastwiskowe według zasad wypasu racjonalnego André Voisina i praktyki nowozelandzkiej: krowy jersey prawie wyłącznie na trawie, codziennie świeża kwatera, odpoczynek ok. 35 dni, dój raz dziennie, większość mleka na sery. Pastwisko ma tyle hektarów, ile krowy zjedzą; siano na zimę daje koniczyna z trawami na gruntach ornych, bez osobnej łąki. Za krowami mobilny kurnik zjada ziarno z własnych pól. Mniej mleka, ale dużo mniej pracy przy dojarce."},"sweetSpot":{"label":"Sweet spot","note":"Całe 14 ha, najwięcej zł/h","description":"Wynik przeszukania tysięcy kombinacji na 14 ha bez dzierżawy: najwyższy dochód na godzinę pracy przy co najmniej 6,5 tys. zł miesięcznie w wariancie pesymistycznym, całej ziemi w użyciu (każda pasza z ok. 5–10% zapasu, bez braków) i szczycie poniżej 60 h tygodniowo. Wyszły kury nieśne, kaczki, trochę gęsi i kilka mamek z opasem sprzedawanym w paczkach, do tego wypas co 3 dni z długim odpoczynkiem kwater. Krów mlecznych nie ma, bo dojenie zabiera najwięcej godzin."}},"assumptionSets":{"realistic":"Realnie","optimistic":"Optymistycznie"},"labourGroups":{"cattle":"Krowy i sery","poultry":"Drób i króliki","smallLivestock":"Owce, kozy, świnie, konie","fields":"Siano i zboża","produce":"Warzywa, owoce, grzyby, pszczoły","processing":"Przetwórstwo i wysyłka","other":"Sprzedaż, naprawy, ogród"},"format":{"numberLocale":"pl-PL","pln":"{amount} zł"},"warnings":{"landOverAllocated":"Pastwisko, łąka, obejście i warzywa zajmują o {hectares} ha więcej, niż macie ziemi. Zmniejsz któryś z tych suwaków albo dodaj dzierżawę.","gardenExceedsFarmyard":"Sad i warzywnik nie mieszczą się w obejściu. Zwiększ obejście.","grainShortage":"Brakuje ok. {tonnes} t ziarna. To ok. {cerealHa} ha zbóż więcej (ok. {arableHa} ha gruntów ornych w płodozmianie) albo ok. {hens} kur mniej.","hayShortage":"Brakuje ok. {tonnes} t s.m. siana na zimę. To ok. {meadowHa} ha łąki więcej albo mniej zwierząt.","strawShortage":"Brakuje ok. {tonnes} t słomy na ściółkę. Pomoże więcej zbóż albo włącz trociny zamiast słomy (grupa „Koszty”).","sawdustReplacesStraw":"Brakującą słomę zastępujesz trocinami: ok. {tonnes} t (ok. {cubicMetres} m³) za ok. {cost} zł rocznie.","grainSurplus":"Nadwyżka ziarna ok. {tonnes} t. Możesz dołożyć ok. {hens} kur albo zamienić część zbóż na koniczynę.","haySurplus":"Dużo nadwyżki siana (ok. {tonnes} t s.m.). Jest miejsce na kolejne zwierzęta albo zapas na suszę.","stockingOutsideBonusRange":"Obsada {density} DJP/ha jest poza przedziałem 0,5–1,5, więc premia 573 zł/ha nie przysługuje.","grasslandOverstocked":"Na użytkach zielonych jest ponad 2 DJP/ha. To już nie jest wypas ekstensywny.","notEnoughHours":"Potrzeba {needed} h rocznie, a rodzina ma ok. {available} h. Brakuje ok. {missing} h.","littleSpareTime":"Praca zajmuje {percent}% czasu rodziny. Mało zapasu na choroby i urlopy.","muchSpareTime":"Praca zajmuje tylko ok. {percent}% czasu rodziny ({needed} z {available} h). Ograniczeniem jest ziemia i rynek, nie ręce: wolny czas najlepiej włożyć w sery, warzywa i sprzedaż bezpośred a / rok","hoursValue":"{hours} h (śr. {perWeek} h/tydz.)","peakMonth":"Najcięższy miesiąc (pesym.)","peakMonthValue":"{peak} h/tydz. (limit {limit})","investments":"Inwestycje","investmentsValue":"{capex} ({depreciation} rocznie)","feed":"Pasze","feedValue":"siano {hay} t, ziarno {grain} t, słoma {straw} t","stocking":"Obsada","stockingValue":"{value} DJP/ha"},"cashflowChart":"Wynik miesiąca po wypłacie na dom (zł)","labourChart":"Godziny w miesiącu (cała rodzina)","disclaimer":"Wyliczenia orientacyjne na podstawie założeń z symulatora; ceny, plony i normy pracy warto sprawdzić lokalnie. Dopłaty i przepisy zmieniają się co roku.","footer":"Symulator gospodarstwa rodzinnego · {variant} · strona {page} z {pages}"},"page":{"header":{"eyebrow":"Planer finansów, pracy i pasz · 14 ha pod Lwówkiem Śląskim","lead":"14 ha, krowy jersey na trawie, kury w mobilnym kurniku, owce i drób na pastwisku. Wszystkie pasze, siano i słoma z własnych pól. Przesuwaj suwaki: bilans pasz, czas pracy i pieniądze przeliczają się od razu.","locationFacts":"<span>51°07′N 15°35′E<\/span><span>ok. 250–400 m n.p.m.<\/span><span>ok. 680 mm opadów/rok<\/span><span>średnio ok. 7,6–8 °C<\/span><span>wypas ok. 20 IV – 31 X<\/span>"},"theme":{"label":"Motyw:","auto":"Automatyczny","light":"Jasny","dark":"Ciemny","groupLabel":"Motyw kolorów"},"kpi":{"netIncome":"Dochód / rok","hours":"Praca / rok","revenue":"Przychód / rok","pessimistic":"Pesymistycznie","investment":"Inwestycje","feed":"Pasze","stocking":"Obsada","stockingDetail":"DJP na ha użytków","regionLabel":"Wynik na bieżąco","pessimisticTitle":"Wariant pesymistyczny"},"presets":{"variant":"Wariant","assumptions":"Założenia","savedVariants":"Moje warianty","saveCurrent":"Zapisz obecne ustawienia","savedLocally":"Zapisane tylko w tej przeglądarce.","exportAndReport":"Zapis i raport","namePlaceholder":"Nazwa, np. Plan 2027","nameLabel":"Nazwa wariantu","philosophies":"Filozofie"},"results":{"title":"Co wychodzi","intro":"Bilans liczony na rok w pełnym działaniu (rok 3)."},"landAndFeed":{"title":"Ziemia i pasze","intro":"Potrzeba (obrys) i produkcja z własnych pól (wypełnienie)."},"farmPlan":{"title":"Plan rozmieszczenia","intro":"Schemat, nie mapa: proporcje pól zmieniają się razem z suwakami. Wybierz miesiąc, jak często przesuwasz krowy i po ilu dniach wracają na tę samą kwaterę; liczba kwater przeliczy się sama. Rok płodozmianu wybierasz w bloku „Płodozmian” poniżej. Kliknij pole, żeby zobaczyć, co się na nim dzieje.","notes":{"grazingOrder":"<h3>Kolejność na pastwisku<\/h3><p>Krowy wchodzą pierwsze i zjadają górę runi. 1–3 dni później owce dojadają niższe trawy i zioła. 3–4 dni po krowach przyjeżdża mobilny kurnik: kury rozgrzebują placki, zjadają larwy much i nawożą. Krowy i owce mają w większości różne pasożyty, więc taka kolejność przerywa ich cykl.<\/p>","buildings":"<h3>Budynki: tanio i lekko<\/h3><ul><li>Stara obora: dojarnia, mleczarnia, serownia (wymagają osobnego, zmywalnego pomieszczenia).<\/li><li>Wiata szkieletowa z OSB lub deskami, otwarta od wschodu, z głęboką ściółką: krowy i jałówki.<\/li><li>Druga wiata lub przedłużenie: owce i kozy, nocna zagroda przed wilkami.<\/li><li>Kurniki mobilne na płozach, ciągnięte C-360; zimą stoją przy obejściu.<\/li><\/ul>","waterAndFencing":"<h3>Woda i ogrodzenie<\/h3><ul><li>Rura PE wzdłuż alei z szybkozłączkami co 2–3 kwatery, poidło przenośne.<\/li><li>Obwód: 2–3 druty stałe (przy owcach 4–5), wewnątrz taśmy na przenośnych słupkach.<\/li><li>Elektryzator z odpowiednim zapasem mocy, uziemienie w kilku punktach.<\/li><\/ul>"},"mapLabel":"Schemat rozmieszczenia gospodarstwa"},"rotation":{"title":"Płodozmian na gruntach ornych","intro":"W gospodarstwie ekologicznym azot daje koniczyna i obornik, więc część gruntów ornych zawsze jest pod koniczyną z trawami. Liczbę pól wybierasz niżej (lub w grupie „Ziemia”), udział zbóż suwakiem. Kliknij rok, żeby zobaczyć go na planie."},"catchCrops":{"title":"Międzyplony i ekoschematy","intro":"Międzyplon to zielona okrywa między dwiema uprawami głównymi: chroni glebę zimą, wiąże azot, karmi życie glebowe i daje paszę owcom. W ekoschemacie „Rolnictwo węglowe” międzyplon ozimy lub wsiewka to 5 pkt/ha, ok. 500 zł/ha. Włączasz je przyciskami przy płodozmianie albo w grupie „Dopłaty”.","requirements":"Wymogi praktyki (ARiMR, PODR 2025): min. 2 gatunki, nie same zboża; międzyplon ozimy wysiany do 1 X i utrzymany do 15 II (mulczowanie dopuszczalne po 15 XI); wsiewka bobowatych utrzymana do siewu następnej uprawy lub min. 8 tygodni po zbiorze; bez środków ochrony roślin. W gospodarstwie ekologicznym nasiona eko (lub zgoda na nieekologiczne). Ilości wysiewu orientacyjne: sprawdź u dostawcy nasion. Czy ekoschemat łączy się z płatnością ekologiczną na tej samej działce, potwierdź w ODR przed złożeniem wniosku.","grainLegumeMixtures":"Mieszanki zbożowo-strączkowe dawały w doświadczeniach IUNG ok. 2,6–4,9 t/ha i 16–19% białka (groch z pszenicą). Udział strączkowych w siewie 40–50%. Ziarno kur warto uzupełnić serwatką z serowarni (białko) i zielonką z wybiegu."},"money":{"title":"Pieniądze","intro":"Od sprzedaży do wyniku na czysto.","chartLabel":"Wykres: sprzedaż, dopłaty, koszty, amortyzacja i wynik"},"cashflow":{"title":"Przepływy gotówki","intro":"Rok w pełnym działaniu, miesiąc po miesiącu. Bez inwestycji, z wypłatą na dom.","chartLabel":"Wykres: wynik miesiąca i saldo konta"},"enterprises":{"title":"Który kierunek się opłaca","intro":"Pasza z własnych pól liczona po koszcie uprawy.","colourNote":"Kolory przy zł/ha i zł/h: od czerwonego (najsłabiej) do zielonego (najlepiej). Zielone z hektara warto skalować, gdy brakuje ziemi; zielone za godzinę, gdy brakuje rąk. W innych tabelach przy kosztach i godzinach mocniejszy czerwony znaczy więcej.","perHourNote":"Zł za godzinę to nadwyżka kierunku podzielona przez jego godziny (ze sprzedażą). Kozy i świnie są dla domu, więc ich „zarobek” to wartość mięsa w ostatniej kolumnie tabeli „Dla domu”."},"nextSteps":{"title":"Co dalej: co dołożyć","intro":"Każdy krok przeliczony przy Twoich obecnych ustawieniach."},"sensitivity":{"title":"Co najbardziej zmienia wynik","intro":"Każde założenie osobno o 20% w dół i w górę.","chartLabel":"Wykres wrażliwości wyniku na założenia"},"labour":{"title":"Czas pracy w roku","intro":"Godziny w miesiącu według zajęć.","chartLabel":"Wykres godzin pracy w miesiącach"},"market":{"title":"Co trzeba sprzedać","intro":"Bez stałych klientów żadna z tych liczb nie zadziała."},"investments":{"title":"Inwestycje","intro":"Rozłożone na lata użytkowania (amortyzacja).","editNote":"Kwoty są domyślne. Wpisz własną (np. z oferty albo 0, gdy coś już masz) i naciśnij Enter: przeliczę ją na cenę jednostkową i przestawię suwak w grupie „Inwestycje”. Działa też w drugą stronę: suwak zmienia kwotę tutaj."},"household":{"title":"Budżet domu","intro":"Czy wynik gospodarstwa wystarcza na życie."},"comparison":{"title":"Porównanie wariantów","intro":"Każdy wariant przeliczony przy Twoich pozostałych ustawieniach, raz z założeniami realnymi, raz ostrożnymi (niższe ceny i plony, więcej godzin)."},"calendar":{"title":"Kalendarz roku","intro":"Wycielenia i wykoty wczesną wiosną, krycie latem, siano w czerwcu, sprzedaż gęsi i serów jesienią i przed świętami. Terminy dla okolic Lwówka (wypas od ok. 20 kwietnia).","note":"Prace pokazuję tylko dla kierunków, które masz w ustawieniach. Kliknij miesiąc, żeby zobaczyć go na planie."},"stages":{"title":"Jak zacząć: trzy lata","intro":"Każdy nowy kierunek dopiero wtedy, gdy poprzedni się sprzedaje. Wynik u góry dotyczy roku 3, kiedy wszystko działa.","year1":"<div class=\"eyebrow\">Rok 1<\/div><h3>Krowy, kury, ogrodzenie<\/h3><ul> <li>4 krowy, 100 kur w jednym kurniku mobilnym, kilka gęsi.<\/li> <li>Ogrodzenie elektryczne pastwiska, woda w alei, wiata dla bydła.<\/li> <li>Mleczarnia w starej oborze; zgłoszenie sprzedaży mleka i jaj w PIW.<\/li> <li>Umowa z jednostką certyfikującą eko przed wnioskiem o dopłaty.<\/li> <li>Badanie gleby i siana; pierwszy płodozmian.<\/li> <li>Zapisuj: litry, jaja, godziny, wydatki.<\/li><\/ul>","year2":"<div class=\"eyebrow\">Rok 2<\/div><h3>Owce i sery<\/h3><ul> <li>Kury do 200 (drugi kurnik), jeśli jaja się sprzedają.<\/li> <li>10–15 owiec, nocna zagroda, pies pasterski.<\/li> <li>Serownia i wpis do RHD; sery z letniego mleka.<\/li> <li>Pełny płodozmian trzypolowy, własne ziarno dla kur.<\/li><\/ul>","year3":"<div class=\"eyebrow\">Rok 3<\/div><h3>Drób mięsny i decyzje<\/h3><ul> <li>Próbna partia 100 kurczaków pastwiskowych, gdy jest gdzie je legalnie ubić.<\/li> <li>Kozy na zarośla; świnie dla domu, jeśli pozwala sytuacja z ASF.<\/li> <li>Piąta krowa lub więcej owiec według tego, co lepiej się sprzedaje i ile zostaje siana.<\/li> <li>Własne jałówki od najlepszych krów.<\/li><\/ul>"},"regulations":{"title":"Prawo i formalności","intro":"Skrót najważniejszych spraw. Przepisy się zmieniają, więc przed każdym startem potwierdź szczegóły w powiatowym inspektoracie weterynarii (PIW) w Lwówku, w ARiMR i w ODR.","notes":{"subsidies":"<h3>ARiMR i dopłaty<\/h3><ul><li>Numer producenta i siedziba stada; bydło, owce, kozy i świnie kolczykowane i zgłaszane; stado drobiu też zgłoś.<\/li><li>Dzierżawa: dopłaty, także ekologiczną, dostaje dzierżawca, który faktycznie użytkuje ziemię. Przy płatności ekologicznej umowa powinna obejmować cały okres zobowiązania. Umowę spisz na piśmie.<\/li><li>Wniosek o dopłaty co roku. Płatność do owiec liczę od 10 sztuk, do kóz od 5 (sprawdź progi).<\/li><li>Stawki w planerze: płatności bezpośrednie i do zwierząt za 2025 r., dobrostan za 2024 r., ONW 2026, płatność ekologiczna według szacunków na 2023 r.<\/li><\/ul>","organic":"<h3>Rolnictwo ekologiczne<\/h3><ul><li>Umowa z jednostką certyfikującą i okres konwersji (płatność przysługuje także w konwersji).<\/li><li>Kury: najwyżej 6 kur na m² kurnika, wybieg, zakaz syntetycznych aminokwasów, do 5% pasz nieekologicznych.<\/li><li>Kurczaki eko: ubój najwcześniej w 81. dniu życia albo rasy wolno rosnące.<\/li><\/ul>","milkEggsCheese":"<h3>Mleko, jaja, sery<\/h3><ul><li>Mleko surowe i jaja: sprzedaż bezpośrednia; zgłoszenie do powiatowego lekarza weterynarii co najmniej 30 dni przed startem i numer weterynaryjny.<\/li><li>Jaja na targowisku: zwykle wymagane znakowanie kodem producenta (potwierdź w PIW).<\/li><li>Jagnięcina: ubój w zatwierdzonej rzeźni (rolniczej lub usługowej, w swoim albo sąsiednim powiecie), mięso ze znakiem weterynaryjnym. Limit RHD dla mięsa czerwonego wynosił 2300 kg rocznie (rozporządzenie z 2016 r.). Czy możesz sprzedawać całe tusze, czy tylko po rozbiorze w swojej kuchni RHD, potwierdź w PIW.<\/li><li>Sery: rolniczy handel detaliczny (RHD), limity ilościowe ustala decyzja lekarza weterynarii. Przychód z RHD zwolniony z podatku do 100 tys. zł, powyżej 2% ryczałtu.<\/li><li>Nie reklamuj, że mleko „leczy”: oświadczenia zdrowotne na żywności są w UE ściśle regulowane.<\/li><\/ul>","poultryAndPigs":"<h3>Drób mięsny i świnie<\/h3><ul><li>Drób i króliki ubite w gospodarstwie sprzedajesz w ramach sprzedaży bezpośredniej (zgłoszenie do powiatowego lekarza weterynarii). Żeby z nich robić przetwory, potrzebujesz też wpisu do RHD.<\/li><li>Mięso owiec, kóz i świń do wyrobów w RHD musi pochodzić z rzeźni; z uboju na własny użytek nie wolno.<\/li><li>Indyki trzymaj osobno od kur (histomonoza).<\/li><li>Własny wylęg na potrzeby stada nie wymaga rejestracji wylęgarni; sprzedaż piskląt lub jaj wylęgowych już tak (powiatowy lekarz weterynarii).<\/li><li>Tunel zimowy przy nakazie zamknięcia drobiu: wszystkie otwory zasłonięte siatką, karma i woda w środku.<\/li><li>Świnie: sprawdź strefę ASF w PIW. Obowiązuje bioasekuracja, a karmienie resztkami z kuchni jest zabronione.<\/li><li>Ptasia grypa: w okresach zagrożenia trzeba zamknąć drób, więc kurniki mobilne potrzebują wariantu z siatką lub zamknięciem.<\/li><\/ul>","produceBeesEducation":"<h3>Warzywa, pszczoły, zajęcia dla dzieci<\/h3><ul><li>Warzywa sprzedawane bezpośrednio: zapytaj w powiatowej stacji sanitarno-epidemiologicznej o wpis do rejestru.<\/li><li>Pasiekę trzeba zarejestrować u powiatowego lekarza weterynarii.<\/li><li>Grzyby uprawne i soki z własnych owoców: wpis do rejestru w sanepidzie (RHD dla żywności roślinnej).<\/li><li>Zajęcia dla dzieci (zagroda edukacyjna): regularne płatne zajęcia zwykle wymagają działalności w CEIDG, okazjonalne mogą być nierejestrowe; potrzebne dodatkowe OC.<\/li><\/ul>","processingAndShipping":"<h3>Przetwory i wysyłka (RHD)<\/h3><ul><li>RHD pozwala sprzedawać konsumentom na odległość, także wysyłkowo, jeśli w transporcie zachowasz bezpieczne warunki, w tym temperaturę. Nie wolno sprzedawać przez pośredników.<\/li><li>Limity ilościowe RHD dotyczą tylko dostaw do sklepów i restauracji (np. wyroby mięsne 1400 kg rocznie). Sprzedaż konsumentom nie ma limitu ilości.<\/li><li>Ulga podatkowa: co najmniej 50% składników (bez wody) z własnego gospodarstwa; przychód do 100 tys. zł zwolniony, powyżej 2% ryczałtu.<\/li><li>Ministerstwo zapowiedziało w 2026 r. zniesienie ograniczeń terytorialnych i wyższe limity; projekt był w konsultacjach. Przed startem sprawdź, co weszło w życie.<\/li><\/ul>","wolvesBuildingsManure":"<h3>Wilki, budowy, obornik<\/h3><ul><li>Szkody od wilków wypłaca Regionalna Dyrekcja Ochrony Środowiska; zgłaszaj od razu, a owce i kozy zamykaj na noc.<\/li><li>Wiaty: zapytaj w starostwie, czy wystarczy zgłoszenie, czy potrzebne jest pozwolenie na budowę.<\/li><li>Obornik i głęboka ściółka: przechowywanie według programu azotanowego (zapytaj w ODR).<\/li><\/ul>","taxesAndInsurance":"<h3>Podatki i ubezpieczenia<\/h3><ul><li>Sprzedaż nieprzetworzonych produktów (mleko surowe, jaja, żywe zwierzęta) to zwykle działalność rolnicza; przetwory w RHD jak wyżej. Potwierdź z księgowym.<\/li><li>KRUS, ubezpieczenie budynków i OC rolnika są w kosztach stałych w planerze.<\/li><\/ul>"}},"assumptions":{"title":"Założenia i źródła","method":"<h3>Jak liczę<\/h3><ul> <li>Krowa jersey zjada ok. 15 kg suchej masy dziennie (5,5 t rocznie), jałówka 3,3 t, owca z jagniętami 0,8 t, koza 0,6 t.<\/li> <li>Kura: pasza do woli, z czego ok. 90% to własne ziarno i strączkowe, reszta to minerały i muszle (kupowane).<\/li> <li>Siano: 75% plonu łąki idzie na siano, 25% to odrosty do wypasu; nadwyżka pastwiska w 70% do koszenia.<\/li> <li>Ziarno i siano z własnych pól liczę po koszcie uprawy, bez czynszu za ziemię. Ziarno skarmione kurom można by sprzedać drożej, więc „zarobek” na jajach zawiera też ten zysk.<\/li> <li>DJP: przeliczniki orientacyjne (krowa 1, jałówka 0,6, owca i koza 0,1, kura 0,014).<\/li> <li>„Na czysto” to wynik przed zapłaceniem sobie za pracę, bez kosztów kredytu i podatków.<\/li> <li>„Wariant pesymistyczny” to Twoje bieżące ustawienia pogorszone o suwaki z tej grupy: ceny, plony, wydajność zwierząt, godziny i koszty. Czynsz zostaje bez zmian.<\/li> <li>Przetwory przypisuję do gatunku, z którego są (gęsi, kaczki, owce), razem z częścią wędzarni i wysyłki.<\/li> <li>Normy czasu pracy to moje szacunki dla małego gospodarstwa z dojarką konwiową. Popraw je po pierwszym roku na własnych zapiskach.<\/li><\/ul>","sources":"<h3>Źródła<\/h3><ul> <li><a href=\"https://staszow.pl/files/image/2025/Aktualno%C5%9Bci/ARIMR_stawki_p%C5%82atno%C5%9Bci.pdf\" target=\"_blank\" rel=\"noopener\">ARiMR: stawki płatności za 2025 r.<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/rolnictwo-ekologiczne-z-wyzszymi-stawkami-w-2023-roku\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: stawki płatności ekologicznych (2023)<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/hodowla/startuja-wyplaty-za-dobrostan-zwierzat-takie-pieniadze-dostana-rolnicy-lista,21487\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: stawki dobrostanu zwierząt za 2024 r.<\/a><\/li> <li><a href=\"https://www.gov.pl/web/arimr/platnosc-onw---podstawowe-informacje-2026\" target=\"_blank\" rel=\"noopener\">ARiMR: płatność ONW 2026<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/stawki-za-ekoschematy-2024-sa-jednak-wieksze-ostateczne-kwoty\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: stawki ekoschematów 2024<\/a><\/li> <li><a href=\"https://podr.pl/wp-content/uploads/2025/12/RHD-i-MLO.pdf\" target=\"_blank\" rel=\"noopener\">PODR: RHD i MLO (grudzień 2025)<\/a><\/li> <li><a href=\"https://www.kpodr.pl/wp-content/uploads/2024/03/Kiczorowska-B.-Dobre-praktyki-utrzymania-drobiurzeznego-i-kur-niosek.zmieniona.pdf\" target=\"_blank\" rel=\"noopener\">KPODR: dobre praktyki w chowie drobiu i kur nieśnych<\/a><\/li> <li><a href=\"https://www.iung.pl/wp-content/uploads/2023/09/Instrukcja-Mieszanki-roslin-straczkowych-ze-zbozami.pdf\" target=\"_blank\" rel=\"noopener\">IUNG: mieszanki roślin strączkowych ze zbożami<\/a><\/li> <li><a href=\"https://www.gov.pl/attachment/00bf374e-b258-4c8d-896e-aedf7a17cc2c\" target=\"_blank\" rel=\"noopener\">KOWR: rynek zbóż nr 41/2026<\/a><\/li> <li><a href=\"https://www.sodr.pl/pliki/Analiza-cen-2026-06,2096.pdf\" target=\"_blank\" rel=\"noopener\">ŚODR: ceny bydła, czerwiec 2026<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/drob/produkuje-jajka-od-kur-z-wolnego-wybiegu\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: jaja z wolnego wybiegu (ceny, 2024)<\/a><\/li> <li><a href=\"https://www.gov.pl/attachment/a63161eb-624b-4fb7-b75e-0f54da2b886f\" target=\"_blank\" rel=\"noopener\">KOWR: rynek mięsa, lipiec 2026 (ceny mięsa owczego)<\/a><\/li> <li><a href=\"https://bip2.lasy.gov.pl/pl/bip/px_dg~rdlp_wroclaw~nadl_lwowek_slaski~program_ochrony_przyrody_13_15.pdf\" target=\"_blank\" rel=\"noopener\">Nadleśnictwo Lwówek Śląski: warunki przyrodnicze<\/a><\/li> <li><a href=\"https://www.uvm.edu/d10-files/documents/2025-11/2024-COP-article-Sep2025.pdf\" target=\"_blank\" rel=\"noopener\">University of Vermont: koszty farm mleka z trawy (2024)<\/a><\/li> <li><a href=\"https://www.agproud.com/articles/30227-cheese-production-from-jersey-milk-conserves-resources-and-reduces-environmental-impact\" target=\"_blank\" rel=\"noopener\">Wydajność sera z mleka jersey<\/a><\/li> <li><a href=\"https://www.olx.pl/rolnictwo/ryneczek/q-jagni%C4%99cina-tusza/\" target=\"_blank\" rel=\"noopener\">OLX: ogłoszenia jagnięciny od rolników (ceny)<\/a><\/li> <li><a href=\"https://owczeklimaty.pl/produkt/tusza-jagnieca/\" target=\"_blank\" rel=\"noopener\">Owcze Klimaty: tusza jagnięca, 52 zł/kg<\/a><\/li> <li><a href=\"https://www.iung.pl/wp-content/uploads/2023/10/Zacharzewska_rzeznie-rolnicze-pazdziernik-2023.pdf\" target=\"_blank\" rel=\"noopener\">WIW Kraków (IUNG): rzeźnie rolnicze<\/a><\/li> <li><a href=\"https://www.infor.pl/akt-prawny/DZU.2016.252.0002159,rozporzadzenie-ministra-rolnictwa-i-rozwoju-wsi-w-sprawie-maksymalnej-ilosci-zywnosci-zbywanej-w-ramach-rolniczego-handlu-detalicznego-oraz-zakresu-i-sposobu-jej-dokumentowania.html\" target=\"_blank\" rel=\"noopener\">Rozporządzenie o limitach RHD (2016)<\/a><\/li> <li><a href=\"https://ksowplus.kpodr.pl/wp-content/uploads/2025/11/Adrianna-Augustyniak-Dobrzynskie-warzywa-prezentacja-dobtych-praktyk.pdf\" target=\"_blank\" rel=\"noopener\">KPODR: RWS Dobrzyńskie Warzywa (2025)<\/a><\/li> <li><a href=\"https://modernfarmer.com/2016/10/jm-fortier/\" target=\"_blank\" rel=\"noopener\">Modern Farmer: J.M. Fortier i małe gospodarstwa warzywne<\/a><\/li> <li><a href=\"https://www.inhort.pl/wp-content/uploads/2026/01/8.2_streszczenie-2025.pdf\" target=\"_blank\" rel=\"noopener\">INHORT: rynek miodu 2025<\/a><\/li> <li><a href=\"https://www.lubianka.pl/plik,25306,dzialalnosc-edukacyjna-w-gospodarstwie.pdf\" target=\"_blank\" rel=\"noopener\">DODR: działalność edukacyjna w gospodarstwie<\/a><\/li> <li><a href=\"https://gov.mb.ca/agriculture/livestock/sheep/accelerated-lambing.html\" target=\"_blank\" rel=\"noopener\">Manitoba Agriculture: przyspieszone wykoty owiec<\/a><\/li> <li><a href=\"https://www.flockandherd.net.au/sheep/reader/reproductive-performance-dorper.html\" target=\"_blank\" rel=\"noopener\">Flock and Herd: rozród owiec dorper<\/a><\/li> <li><a href=\"https://www.piwwyszkow.pl/Dokumenty/aktualnosci/RHD/RHD%20-%20p  wyką kosmatą","seeding":"żyto 60–80 kg/ha, wyka 25–40 kg/ha","timing":"Po żniwach, do 1 października. Przed owsem z grochem.","purpose":"Najpewniejsza: zimuje, wyka wiąże azot, żyto chroni glebę. Wypas owiec jesienią i od połowy lutego, potem przyoranie przed siewem owsa."},"landsberger":{"name":"Mieszanka landsberska","species":"wyka ozima, koniczyna krwistoczerwona, życica wielokwiatowa","seeding":"wyka 20–30, koniczyna 15–20, życica 15–20 kg/ha","timing":"Siew sierpień – wrzesień. Przed późno sianą uprawą lub warzywami.","purpose":"W maju daje pokos zielonki lub sianokiszonki dla krów, ale dla owsa to za późno. Dobra przed warzywami."},"cloverUndersown":{"name":"Wsiewka koniczyny w owies","seeding":"koniczyna czerwona 8–12 kg/ha, życica lub tymotka 4–8 kg/ha","timing":"Kwiecień, razem z owsem z grochem lub zaraz po nim.","purpose":"Liczy się jako wsiewka śródplonowa (utrzymać min. 8 tygodni po zbiorze). Od razu staje się polem koniczyny w płodozmianie."},"winterTurnipRapeRye":{"name":"Rzepik ozimy z żytem","seeding":"rzepik 6–10 kg/ha, żyto 60–80 kg/ha","timing":"Po żniwach, do końca sierpnia (rzepik potrzebuje czasu przed zimą). Przed owsem.","purpose":"Dużo paszy na jesienny wypas owiec i gęsi (październik–listopad), zimuje. Rzepik to kapustowate: nie wysiewaj, jeśli w płodozmianie są kapustne warzywa lub rzepak."},"multiSpeciesRye":{"name":"Mieszanka wielogatunkowa z żytem","species":"rzodkiew oleista, facelia, wyka, koniczyna krwistoczerwona, owies lub gryka","seeding":"gotowe mieszanki zwykle 25–40 kg/ha plus żyto 30–50 kg/ha","timing":"Po żniwach, sierpień. Przed owsem lub warzywami.","purpose":"Najwięcej życia w glebie: różne korzenie, kwiaty dla pszczół. Część przemarza, żyto zostaje zielone do 15 lutego. Droższe nasiona."},"triticaleWinterPea":{"name":"Pszenżyto z peluszką ozimą","seeding":"pszenżyto 80–100 kg/ha, peluszka 40–60 kg/ha","timing":"Wrzesień. Przed późną uprawą lub warzywami.","purpose":"W maju zielonka lub sianokiszonka bogata w białko. Ja <script>
// ===== i18n/translate.js =====
// User-facing texts. All Polish content lives in locales/pl.json; the code refers to it by key.
//
// The build embeds the JSON file in the page as <script type="application/json" id="locale-pl">
// (and as LOCALE_MESSAGES for Node), so the app also works when opened straight from disk.

const MESSAGES = loadMessages();

function loadMessages() {
  if (typeof LOCALE_MESSAGES !== 'undefined') return LOCALE_MESSAGES;
  const element = typeof document !== 'undefined' && document.getElementById('locale-pl');
  if (!element) throw new Error('Locale data is missing: build the page with build.py');
  return JSON.parse(element.textContent);
}

function lookupMessage(key) {
  return key.split('.').reduce((node, part) => (node == null ? undefined : node[part]), MESSAGES);
}

/** Returns true when the locale has a message (of any type) under the key. */
function hasMessage(key) {
  return lookupMessage(key) !== undefined;
}

/**
 * Returns the text for a key with `{name}` placeholders filled in.
 * @param {string} key - dot-separated path in the locale, e.g. "kpi.netIncome"
 * @param {object} [values] - placeholder values
 * @returns {string}
 */
function t(key, values) {
  const message = lookupMessage(key);
  if (typeof message !== 'string') {
    console.warn(`Missing text: ${key}`);
    return key;
  }
  if (!values) return message;
  return message.replace(/\{(\w+)\}/g, (placeholder, name) => (name in values ? values[name] : placeholder));
}

/**
 * Returns the plural form matching `count` (Polish: one, few, many, other), e.g. 1 rok, 2 lata, 5 lat.
 * @param {string} key - group of forms in the locale, e.g. "plurals.years"
 * @param {number} count
 */
function tPlural(key, count, values) {
  const category = new Intl.PluralRules(t('format.numberLocale')).select(count);
  return t(`${key}.${category}`, values);
}

/**
 * Returns a list or a group of texts (e.g. month names) as stored in the locale.
 * @param {string} key
 * @returns {Array|object}
 */
function messages(key) {
  const message = lookupMessage(key);
  if (message === undefined) throw new Error(`Missing texts: ${key}`);
  return message;
}

/**
 * Fills static markup from the locale:
 *   data-i18n="key"           → text content
 *   data-i18n-html="key"      → inner HTML (for texts with links or emphasis)
 *   data-i18n-attr="title:key; aria-label:key2" → attributes
 * @param {ParentNode} root
 */
function applyTranslations(root) {
  root.querySelectorAll('[data-i18n]').forEach(element => {
    element.textContent = t(element.dataset.i18n);
  });
  root.querySelectorAll('[data-i18n-html]').forEach(element => {
    element.innerHTML = t(element.dataset.i18nHtml);
  });
  root.querySelectorAll('[data-i18n-attr]').forEach(element => {
    for (const pair of element.dataset.i18nAttr.split(';')) {
      const [attribute, key] = pair.split(':').map(part => part.trim());
      if (attribute && key) element.setAttribute(attribute, t(key));
    }
  });
}

/** Sum of all values of an object. */
function sumValues(object) {
  return Object.values(object).reduce((sum, value) => sum + value, 0);
}

/** Sum of `select(item)` over a list. */
function sumBy(items, select) {
  return items.reduce((sum, item) => sum + select(item), 0);
}

/** Formats a number the Polish way (space every three digits, decimal comma). */
function formatNumber(value, decimals = 0) {
  if (!isFinite(value)) return '–';
  return value.toLocaleString(t('format.numberLocale'), {
    minimumFractionDigits: decimals,

}

/**
 * Returns settings keyed by current parameter ids.
 * @param {object} saved - settings that may use the old ids
 * @returns {object}
 */
function migrateLegacyParameterIds(saved) {
  const migrated = {};
  for (const [key, value] of Object.entries(saved || {})) migrated[LEGACY_PARAMETER_IDS[key] || key] = value;
  return migrated;
}

/**
 * Reads the contents of a settings file saved by any version of the app.
 * Version 1 used Polish field names ("nazwa", "ustawienia") and Polish parameter ids.
 * @param {object} contents - parsed JSON of the file
 * @returns {{name: string, settings: object}} settings keyed by current parameter ids
 */
function readSettingsFile(contents) {
  const name = contents.name || contents.nazwa || '';
  const settings = contents.settings || contents.ustawienia || contents;
  return { name, settings: migrateLegacyParameterIds(settings) };
}

/** Version of the default values; settings saved before it are moved to the new defaults below. */
const DEFAULTS_VERSION = 2;

/** Defaults changed in version 2: id → [old default, new default]. */
const CHANGED_DEFAULTS = {
  fullTimeWorkers: [2, 1],
  halfTimeWorkers: [2, 1],
  quarterTimeWorkers: [3, 0],
  householdMonthlySpending: [5100, 5000],
  pessimisticYieldDrop: [17, 20],
  minimumNetIncome: [120000, 60000],
};

/**
 * Returns settings saved with older defaults, with every value the user never changed (still at
 * the old default) moved to the new default.
 * @param {object} saved - settings keyed by current parameter ids
 * @param {number} savedVersion - DEFAULTS_VERSION the settings were saved with (1 if unknown)
 */
function migrateChangedDefaults(saved, savedVersion) {
  if (savedVersion >= DEFAULTS_VERSION) return saved;
  const migrated = { ...saved };
  for (const [id, [oldDefault, newDefault]] of Object.entries(CHANGED_DEFAULTS))
    if (migrated[id] === oldDefault) migrated[id] = newDefault;
  return migrated;
}

function normaliseToAverageOne(profiles) {
  const normalised = {};
  for (const [activity, months] of Object.entries(profiles)) {
    const average = months.reduce((sum, weight) => sum + weight, 0) / months.length;
    normalised[activity] = months.map(weight => weight / average);
  }
  return normalised;
}

// ===== model/soil.js =====
// Soil classes: yield multipliers relative to class IV soil (the rest of the land).

/**
 * @param {object} params
 * @returns {{arable: number, grassland: number}} yield multipliers for arable land and grassland
 */
function computeSoilFactors(params) {
  const classIII = params.soilClassIIIShare / 100;
  const classV = params.soilClassVShare / 100;
  const classVI = params.soilClassVIShare / 100;
  const classIV = Math.max(0, 1 - classIII - classV - classVI);
  const total = classIII + classIV + classV + classVI || 1;

  return {
    arable: (classIII * 1.2 + classIV + classV * 0.75 + classVI * 0.55) / total,
    grassland: (classIII * 1.1 + classIV + classV * 0.85 + classVI * 0.7) / total,
  };
}

// ===== model/rotation.js =====
// Crop rotation: clover with grass for one or more years, then cereals, optionally with one year
// of root crops before the last spring cereal (as in the Norfolk four-course rotation). Every year
// each crop moves one field further. The same layout is drawn in the "Crop rotation" panel.

/** Cereal order after clover for 1–7 cereal years. */
const CEREAL_SEQUENCES = {
  1: ['oats'],
  2: ['triticale', 'oats'],
  3: ['triticale', 'rye', 'oats'],
  4: ['triticale', 'mixedGrain', 'rye', 'oats'],
  5: ['triticale', 'mixedGrain', 'rye', 'triticale', 'oats'],
  6: ['triticale', 'mixedGrain', 'rye', 'triticale', 'mixedGrain', 'oats'],
  7: ['triticale', 'mixedGrain', 'rye', 'triticale', 'mixedGrain', 'rye', 'oats'],
};

/** Root crops (potatoes, fodder beet) need at least this many non-clover years in the rotation. */
const MIN_CEREAL_YEARS_FOR_ROOTS = 2;

const SPRING_SOWN_CROPS = ['oats', 'mixedGrain', 'roots'];

const WINTER_CEREALS = ['triticale', 'rye'];

/** Crops after which a catch crop can grow until the spring-sown crop that follows. */
const isCerealBeforeCatchCrop = (crop, nextCrop) =>
  isWinterCatchCropSlot(crop) && SPRING_SOWN_CROPS.includes(nextCrop);

/** Crops harvested early enough to leave the field free for a cover crop. */
const isWinterCatchCropSlot = crop => crop !== 'clover' && crop !== 'oats' && crop !== 'roots';

/** Crops after which a stubble crop can grow until a winter cereal is sown. */
const isCerealBeforeWinterCereal = (crop, nextCrop) =>
  isWinterCatchCropSlot(crop) && WINTER_CEREALS.includes(nextCrop);

/**
 * @param {object} params
 * @returns {{fieldCount: number, cloverYears: number, cerealYears: number, rootFields: number,
 *   rootCropsFit: boolean, crops: string[],
 *   catchCropFields: number, undersownFields: number, stubbleCropFields: number, manuredFields: number,
 *   distinctCrops: number, cerealShare: number, diversityOk: boolean}}
 */
function computeRotation(params) {
  const fieldCount = Math.round(params.rotationFields);
  const cloverYears = Math.min(
    fieldCount - 1,
    Math.max(1, Math.round((1 - params.cerealShare / 100) * fieldCount))
  );
  const cerealYears = fieldCount - cloverYears;
  const rootCropsFit = cerealYears >= MIN_CEREAL_YEARS_FOR_ROOTS;
  const rootFields = params.rootCrops && rootCropsFit ? 1 : 0;
  const crops = [...Array(cloverYears).fill('clover'), ...cropsAfterClover(cerealYears, rootFields > 0)];

  let catchCropFields = 0;
  let undersownFields = 0;
  let stubbleCropFields = 0;
  let manuredFields = 0;
  crops.forEach((crop, index) => {
    const nextCrop = crops[(index + 1) % fieldCount];
    if (isCerealBeforeCatchCrop(crop, nextCrop)) catchCropFields++;
    if (crop === 'oats') undersownFields++; // clover is undersown in oats
    if (isCerealBeforeWinterCereal(crop, nextCrop)) stubbleCropFields++;
    if (nextCrop === 'triticale' || nextCrop === 'oats' || nextCrop === 'roots') manuredFields++;
  });

  const distinct = [...new Set(crops)];
  const largestShare = Math.max(...distinct.map(crop => crops.filter(c => c === crop).length)) / fieldCount;
  const diversityOk =
    distinct.length >= 3 &&
    cerealYears / fieldCount <= 0.65 &&
    cloverYears / fieldCount >= 0.2 &&
    largestShare <= 0.65;

  return {
    fieldCount,
    cloverYears,
    cerealYears,
    rootFields,
    rootCropsFit,
    crops,
    catchCropFields,
    undersownFields,
    stubbleCropFields,
    manuredFields,
    distinctCrops: distinct.length,
    cerealShare: cerealYears / fieldCount,
    diversityOk,
  };
}

/** Crops after the clover years; with root crops they replace the cereal before the last oats. */
function cropsAfterClover(cerealYears, withRootCrops) {
  const crops = [...CEREAL_SEQUENCES[cerealYears]];
  if (withRootCrops) crops[crops.length - 2] = 'roots';
  return crops;
}

/**
 * Position in `rotation.crops` of the crop growing on a field (1-based) in a rotation year
 * (1-based): every year each crop moves one field further.
 * @param {{fieldCount: number}} rotation
 */
function rotationPosition(rotation, field, year) {
  return (field - 1 + (year - 1)) % rotation.fieldCount;
}

// ===== model/grazing.js =====
// Rotational grazing: how often the cows move to a fresh paddock and after how many days a
// paddock is grazed again. Together they set the number of paddocks, and they change how much
// of the grass the animals actually eat and how many hours moving the fences takes.
//
// The pasture yield and the work norms assume a move once a day and a 30–45 day rest.

/** Share of the grass eaten, relative to one move a day, by days spent in one paddock. */
const UTILISATION_BY_MOVE_INTERVAL = [
  [0.5, 1.04],
  [1, 1],
  [2, 0.96],
  [3, 0.93],
  [4, 0.9],
  [7, 0.84],
];

/** Regrowth relative to a 30–45 day rest: shorter rests weaken the grass, longer ones age it. */
const REGROWTH_BY_REST_DAYS = [
  [20, 0.9],
  [25, 0.95],
  [30, 0.99],
  [35, 1],
  [45, 1],
  [60, 0.97],
];

/** Moves per day that the hour norms per cow already include. */
const BASELINE_MOVE_INTERVAL_DAYS = 1;

/**
 * @param {object} params
 * @returns {{moveIntervalDays: number, restDays: number, paddockCount: number, paddockHa: number,
 *   cycleDays: number, grazingsPerPaddock: number, yieldFactor: number, extraMoveHours: number}}
 */
function computeGrazingPlan(params) {
  const moveIntervalDays = params.grazingMoveIntervalDays;
  const restDays = params.pastureRestDays;
  const paddockCount = Math.ceil(restDays / moveIntervalDays) + 1;
  const cycleDays = paddockCount * moveIntervalDays;

  const movesPerSeason = params.grazingDays / moveIntervalDays;
  const baselineMoves = params.grazingDays / BASELINE_MOVE_INTERVAL_DAYS;
  const hasGrazingHerd = params.dairyCows + params.sucklerCows + params.sheep > 0;

  return {
    moveIntervalDays,
    restDays,
    paddockCount,
    paddockHa: params.pastureHa / paddockCount,
    cycleDays,
    grazingsPerPaddock: params.grazingDays / cycleDays,
    yieldFactor:
      interpolate(UTILISATION_BY_MOVE_INTERVAL, moveIntervalDays) *
      interpolate(REGROWTH_BY_REST_DAYS, restDays),
    extraMoveHours: hasGrazingHerd ? (movesPerSeason - baselineMoves) * params.paddockMoveHours : 0,
  };
}

/**
 * Linear interpolation in a table of [x, y] points sorted by x; outside the table the nearest
 * end value is used.
 */
function interpolate(points, x) {
  if (x <= points[0][0]) return points[0][1];
  for (let index = 1; index < points.length; index++) {
    const [x1, y1] = points[index];
    if (x <= x1) {
      const [x0, y0] = points[index - 1];
      return y0 + ((y1 - y0) * (x - x0)) / (x1 - x0);
    }
  }
  return points[points.length - 1][1];
}

/**
 * Returns a copy of the params with lower prices, yields and animal output, more working hours
 * and higher costs. `hoursMultiplier` and `costMultiplier` are read by simulateFarm.
 * @param {object} params
 * @returns {object}
 */
function applyPessimisticScenario(params) {
  const worse = { ...params };
  const scale = (ids, factor) => ids.forEach(id => (worse[id] = params[id] * factor));

  scale(PRICE_PARAMS, 1 - params.pessimisticPriceDrop / 100);
  scale(CROP_YIELD_PARAMS, 1 - params.pessimisticYieldDrop / 100);
  scale(ANIMAL_OUTPUT_PARAMS, 1 - params.pessimisticAnimalOutputDrop / 100);
  scale(PURCHASE_PRICE_PARAMS, 1 + params.pessimisticCostIncrease / 100);

  worse.hoursMultiplier = 1 + params.pessimisticExtraHours / 100;
  worse.costMultiplier = 1 + params.pessimisticCostIncrease / 100;
  return worse;
}

// ===== model/household-budget.js =====
// Household budget: how much the farm has to earn net to cover the family's needs.

/**
 * @param {object} params
 * @returns {{spending: number, margin: number, savings: number, childBenefit: number,
 *            required: number, withoutChildBenefit: number}} yearly amounts in PLN
 */
function computeHouseholdBudget(params) {
  const spending = params.householdMonthlySpending * 12;
  const margin = (spending * params.householdSafetyMargin) / 100;
  const savings = params.householdSavings;
  const childBenefit = params.childBenefitChildren * CHILD_BENEFIT_PER_MONTH * 12;
  const withoutChildBenefit = spending + margin + savings;

  return {
    spending,
    margin,
    savings,
    childBenefit,
    required: Math.max(0, withoutChildBenefit - childBenefit),
    withoutChildBenefit,
  };
}

/** Net income the pessimistic scenario has to reach: from the household budget or set directly. */
function computeIncomeTarget(params) {
  return params.targetFromHouseholdBudget ? computeHouseholdBudget(params).required : params.minimumNetIncome;
}
