<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Symulator gospodarstwa rodzinnego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@500;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Wygląd aplikacji: kolory (jasny i ciemny motyw), układ, panele, tabele, suwaki. */

/* Układ: tablica gospodarza — pasek wyników przyklejony u góry, po lewej suwaki, po prawej bilanse; niżej plan pól i kalendarz */
:root {
  --bg: #eef1ea;
  --surface: #fbfcf9;
  --surface2: #e3e8dd;
  --ink: #1b261e;
  --muted: #58665b;
  --line: #cfd8cb;
  --accent: #2c6a3b;
  --accent-ink: #ffffff;
  --color-pasture: #4f8f4a;
  --color-meadow: #9bb859;
  --color-clover: #9a5f8c;
  --color-cereal: #c39a35;
  --color-roots: #a0522d;
  --color-farmyard: #8a7560;
  --color-cattle: #2c6a3b;
  --color-poultry: #c39a35;
  --color-sheep: #8a6143;
  --color-fields: #7f9a3c;
  --color-other: #6b7f93;
  --color-produce: #9a5f8c;
  --color-processing: #b0563a;
  --ok: #2b7a4b;
  --warn: #a86a10;
  --bad: #b0392e;
  --info: #3f6c93;
  --ok-bg: #e1f0e5;
  --warn-bg: #f6ead3;
  --bad-bg: #f6dfdc;
  --info-bg: #e0eaf3;
  --f-disp: 'Rokkitt', 'Rockwell', Georgia, serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']):not([data-theme='eco']) {
    --bg: #121713;
    --surface: #192019;
    --surface2: #222b23;
    --ink: #e4ebe2;
    --muted: #9aa89c;
    --line: #2f3a30;
    --accent: #6dbb7e;
    --accent-ink: #0e1a10;
    --color-pasture: #6aaa63;
    --color-meadow: #adc96a;
    --color-clover: #c08ab4;
    --color-cereal: #d9b04c;
    --color-roots: #d08a5c;
    --color-farmyard: #ad9479;
    --color-cattle: #6dbb7e;
    --color-poultry: #d9b04c;
    --color-sheep: #b88a66;
    --color-fields: #a5c25a;
    --color-other: #8fa6bb;
    --color-produce: #c08ab4;
    --color-processing: #d98466;
    --ok: #62c48b;
    --warn: #e2a64a;
    --bad: #e8786c;
    --info: #7fb0da;
    --ok-bg: #1d3324;
    --warn-bg: #3a2d17;
    --bad-bg: #3d1f1c;
    --info-bg: #1b2c3b;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #121713;
  --surface: #192019;
  --surface2: #222b23;
  --ink: #e4ebe2;
  --muted: #9aa89c;
  --line: #2f3a30;
  --accent: #6dbb7e;
  --accent-ink: #0e1a10;
  --color-pasture: #6aaa63;
  --color-meadow: #adc96a;
  --color-clover: #c08ab4;
  --color-cereal: #d9b04c;
  --color-roots: #d08a5c;
  --color-farmyard: #ad9479;
  --color-cattle: #6dbb7e;
  --color-poultry: #d9b04c;
  --color-sheep: #b88a66;
  --color-fields: #a5c25a;
  --color-other: #8fa6bb;
  --color-produce: #c08ab4;
  --color-processing: #d98466;
  --ok: #62c48b;
  --warn: #e2a64a;
  --bad: #e8786c;
  --info: #7fb0da;
  --ok-bg: #1d3324;
  --warn-bg: #3a2d17;
  --bad-bg: #3d1f1c;
  --info-bg: #1b2c3b;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1,
h2,
h3 {
  font-family: var(--f-disp);
  font-weight: 700;
  text-wrap: balance;
  margin: 0;
  letter-spacing: 0.005em;
}
h1 {
  font-size: clamp(30px, 4.6vw, 46px);
  line-height: 1.05;
}
h2 {
  font-size: 26px;
  line-height: 1.15;
}
h3 {
  font-size: 19px;
}
p {
  margin: 0;
}
a {
  color: var(--accent);
}
.num {
  font-family: var(--f-num);
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13px;
}
.eyebrow {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  font-weight: 600;
}

/* Nagłówek */
header.top {
  padding-block: 28px 18px;
  display: grid;
  gap: 10px;
}
header.top .lead {
  max-width: 70ch;
  color: var(--muted);
}
.loc {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 13px;
  color: var(--muted);
}
.loc span {
  font-family: var(--f-num);
}
.top-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 0 18px;
  align-items: center;
}
.top-tools .seg {
  margin: 0;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

/* Pasek wyników */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
}
.bar .wrap {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px 18px;
  padding-block: 10px;
}
.kpi {
  min-width: 0;
}
.kpi .k {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kpi .v {
  font-family: var(--f-num);
  font-size: 20px;
  font-weight: 500;
  white-space: nowrap;
}
.kpi .s {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.kpi.main .v {
  color: var(--accent);
  font-size: 22px;
}
@media (max-width: 1100px) {
  .bar .wrap {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
@media (max-width: 900px) {
  .bar .wrap {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .kpi .v {
    font-size: 17px;
  }
  .kpi.main .v {
    font-size: 18px;
  }
}
@media (max-width: 480px) {
  .bar .wrap {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .kpi.hide-s {
    display: none;
  }
}

/* Warianty */
.presets {
  display: grid;
  gap: 12px;
  padding-block: 18px 6px;
}
.prow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.prow .lbl {
  font-size: 13px;
  color: var(--muted);
  margin-right: 4px;
  min-width: 84px;
}
.btn {
  font: inherit;
  font-size: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
  display: inline-flex;
  gap: 6px;
  align-items: baseline;
}
.btn small {
  color: var(--muted);
  font-size: 12px;
}
.btn:hover {
  border-color: var(--accent);
}
.btn:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn.on {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.btn.on small {
  color: var(--accent-ink);
  opacity: 0.8;
}
.btn.ghost {
  border-style: dashed;
}
.res .plan-grid {
  grid-template-columns: 1fr;
}
.panel .intro {
  color: var(--muted);
  font-size: 14px;
  max-width: 72ch;
}
.ctl-sep {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 6px;
}
.grp-body > .ctl-sep:first-child {
  border-top: 0;
  padding-top: 0;
  margin-top: 0;
}
.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin: 4px 0 10px;
}
.seg .lab {
  font-size: 13px;
  color: var(--muted);
  margin-right: 4px;
}
.seg .btn {
  padding: 4px 10px;
  font-size: 13px;
}
.plan-grid {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(220px, 1fr);
  gap: 14px;
  align-items: start;
}
@media (max-width: 900px) {
  .plan-grid {
    grid-template-columns: 1fr;
  }
}
#plan-svg [data-a] {
  cursor: pointer;
}
#plan-svg [data-a]:hover {
  stroke-width: 3;
}
.sub-h {
  font-size: 20px;
  margin: 22px 0 4px;
}
.rot .mp {
  display: block;
  font-size: 12px;
  color: var(--muted);
}
.rot .mp.on {
  color: var(--accent);
  font-weight: 600;
}
.rot td.crop {
  font-size: 13px;
  border-left: 4px solid transparent;
}
.rot th.sel,
.rot td.sel {
  background: var(--surface2);
}
.rot th button {
  all: unset;
  cursor: pointer;
  text-decoration: underline;
  font-weight: 600;
}
.cal tr.sel td {
  background: var(--surface2);
}
.cal tbody tr {
  cursor: pointer;
}
.cal .tk {
  display: block;
}
.cal .tk b {
  font-weight: 600;
}
.pdf-box {
  position: relative;
  display: inline-block;
}
.pdf-box > summary {
  list-style: none;
  cursor: pointer;
}
.pdf-box > summary::-webkit-details-marker {
  display: none;
}
.pdf-pick {
  position: absolute;
  z-index: 30;
  top: calc(100% + 6px);
  left: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;
  display: grid;
  gap: 6px;
  min-width: 230px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}
.inv-in {
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  text-align: right;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 6px;
  padding: 3px 6px;
  width: 110px;
}
.inv-in.ov {
  border-color: var(--accent);
  font-weight: 600;
}
.inv-rs {
  border: 0;
  background: none;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  padding: 0 4px;
  text-decoration: underline;
}
.mine-name {
  font: inherit;
  font-size: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  min-width: 0;
  width: 200px;
  max-width: 100%;
}
.btn .x {
  margin-left: 4px;
  color: var(--muted);
  font-family: var(--f-num);
}
.btn.on .x {
  color: var(--accent-ink);
}

/* Układ główny */
.layout {
  display: grid;
  grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
  gap: 24px;
  padding-block: 14px 30px;
  align-items: start;
}
@media (max-width: 960px) {
  .layout {
    grid-template-columns: minmax(0, 1fr);
  }
}
aside.ctrls {
  display: grid;
  gap: 10px;
  min-width: 0;
}
details.grp {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
details.grp > summary {
  list-style: none;
  cursor: pointer;
  padding: 11px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}
details.grp > summary::-webkit-details-marker {
  display: none;
}
details.grp > summary::after {
  content: '+';
  font-family: var(--f-num);
  color: var(--muted);
}
details.grp[open] > summary::after {
  content: '–';
}
details.grp > summary .sumv {
  font-family: var(--f-num);
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
  margin-left: auto;
  margin-right: 10px;
}
.grp-body {
  padding: 2px 14px 14px;
  display: grid;
  gap: 12px;
}
.ctl {
  display: grid;
  gap: 3px;
}
.ctl-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}
.ctl label {
  font-size: 13.5px;
}
.ctl output {
  font-family: var(--f-num);
  font-size: 13.5px;
  white-space: nowrap;
}
.ctl .help {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}
.ctl.adv label {
  color: var(--muted);
}
input[type='range'] {
  width: 100%;
  accent-color: var(--accent);
  margin: 2px 0;
}
.sw {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  font-size: 13.5px;
  cursor: pointer;
}
.sw input {
  margin-top: 3px;
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
  flex: none;
}
.derived {
  background: var(--surface2);
  border-radius: var(--r);
  padding: 8px 10px;
  font-size: 13px;
}
.derived b {
  font-family: var(--f-num);
  font-weight: 500;
}
.reset {
  justify-self: start;
}

/* Panele wyników */
.res {
  display: grid;
  gap: 18px;
  min-width: 0;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.panel-h {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
  flex-wrap: wrap;
}
.panel-h p {
  font-size: 13px;
  color: var(--muted);
}
.warns {
  display: grid;
  gap: 6px;
}
.w {
  border-radius: var(--r);
  padding: 8px 12px;
  font-size: 14px;
  display: flex;
  gap: 10px;
  align-items: baseline;
}
.w::before {
  font-family: var(--f-num);
  font-size: 12px;
  font-weight: 500;
  flex: none;
}
.w.bad {
  background: var(--bad-bg);
  color: var(--ink);
}
.w.bad::before {
  content: 'BRAK';
  color: var(--bad);
}
.w.warn {
  background: var(--warn-bg);
}
.w.warn::before {
  content: 'UWAGA';
  color: var(--warn);
}
.w.info {
  background: var(--info-bg);
}
.w.info::before {
  content: 'INFO';
  color: var(--info);
}
.w.ok {
  background: var(--ok-bg);
}
.w.ok::before {
  content: 'OK';
  color: var(--ok);
}

/* Pasek ziemi */
.landbar {
  display: flex;
  height: 30px;
  border-radius: var(--r);
  overflow: hidden;
  border: 1px solid var(--line);
}
.landbar div {
  height: 100%;
  transition: width 0.25s;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 13px;
}
.legend i {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: -1px;
}
.legend b {
  font-family: var(--f-num);
  font-weight: 500;
}

/* Bilans pasz */
.feed {
  display: grid;
  gap: 12px;
}
.frow {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) 92px;
  gap: 12px;
  align-items: center;
}
.frow .fl {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.25;
}
.frow .fl span {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}
.fbars {
  display: grid;
  gap: 4px;
}
.fb {
  height: 12px;
  border-radius: 3px;
  position: relative;
  transition: width 0.25s;
  min-width: 2px;
}
.fb.need {
  background: transparent;
  border: 1.5px solid var(--muted);
  height: 12px;
}
.fnums {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--f-num);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.pill {
  font-family: var(--f-num);
  font-size: 12.5px;
  border-radius: 999px;
  padding: 3px 9px;
  text-align: center;
  white-space: nowrap;
}
.pill.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.pill.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.pill.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
@media (max-width: 560px) {
  .frow {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .frow .fbars {
    grid-column: 1 / -1;
    grid-row: 2;
  }
}

/* Tabele */
.tw {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}
th,
td {
  padding: 7px 8px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
th {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 600;
}
td.n,
th.n {
  text-align: right;
  font-family: var(--f-num);
  white-space: nowrap;
}
tr.tot td {
  font-weight: 700;
  border-top: 2px solid var(--ink);
  border-bottom: none;
}
tr.sub td {
  color: var(--muted);
}
.neg {
  color: var(--bad);
}
.twocol {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
@media (max-width: 700px) {
  .twocol {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Wykresy */
svg.chart {
  width: 100%;
  height: auto;
  display: block;
}
svg text {
  fill: var(--ink);
  font-family: var(--f-body);
}
svg .ax {
  fill: var(--muted);
  font-size: 12px;
}
svg .grid {
  stroke: var(--line);
  stroke-width: 1;
}

/* Rynek */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.card {
  background: var(--surface2);
  border-radius: var(--r);
  padding: 10px 12px;
  display: grid;
  gap: 2px;
}
.card .v {
  font-family: var(--f-num);
  font-size: 20px;
}
.card .k {
  font-size: 12.5px;
  color: var(--muted);
}

/* Sekcje pełnej szerokości */
section.full {
  padding-block: 30px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 16px;
}
section.full .intro {
  max-width: 72ch;
  color: var(--muted);
}
.plan-wrap {
  background: var(--surface);
  border: 1px solid var(--line);

/* Eco theme: a light theme in soft leaf and moss greens */
:root[data-theme='eco'] {
  --bg: #dde9d3;

  --surface2: #cfe1c0;
  --ink: #1a2b19;
  --muted: #4d6448;
  --line: #b3cba3;
  --accent: #2f7a39;
  --accent-ink: #ffffff;
  --color-pasture: #3f8f3c;
  --color-meadow: #8db84a;
  --color-clover: #8f5a86;
  --color-cereal: #b9922c;
  --color-roots: #9a5530;
  --color-farmyard: #7e7056;
  --color-cattle: #2f7a39;
  --color-poultry: #b9922c;
  --color-sheep: #80603f;
  --color-fields: #6f9a2f;
  --color-other: #5f7d86;
  --color-produce: #8f5a86;
  --color-processing: #a7573a;
  --ok: #24773f;
  --warn: #9a640e;
  --bad: #a8382c;
  --info: #3a6a8a;
  --ok-bg: #d3ead6;
  --warn-bg: #efe4c8;
  --bad-bg: #f1d9d3;
  --info-bg: #d6e6ec;
  --glow: rgba(47, 122, 57, 0.32);
}

  background: linear-gradient(180deg, rgba(47, 122, 57, 0.1), transparent);
  border-radius: 0 0 var(--r) var(--r);
}

/* Interactive elements: a soft glow on hover so it is clear what can be clicked */
:root {
  --glow: rgba(44, 106, 59, 0.28);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']):not([data-theme='eco']) {
    --glow: rgba(109, 187, 126, 0.35);
  }
}
:root[data-theme='dark'] {
  --glow: rgba(109, 187, 126, 0.35);
}
.btn,
.clickable,
details > summary,
.rot th button,
.cal tbody tr,
#plan-svg [data-a],
#labour-chart [data-month],
.infra label {
  transition:
    box-shadow 0.15s ease,
    border-color 0.15s ease,
    background-color 0.15s ease;
}
.btn:hover,
.clickable:hover,
.infra label:hover,
details.grp > summary:hover,
details.sub > summary:hover,
details.fold > summary:hover,
details.fold-block > summary:hover {
  box-shadow: 0 0 0 3px var(--glow);
}

}

}

}

}

/* Collapsible notes and blocks */
details.fold > summary,
details.fold-block > summary,
details.sub > summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
  border-radius: var(--r);
}
details.fold > summary::-webkit-details-marker,
details.fold-block > summary::-webkit-details-marker,
details.sub > summary::-webkit-details-marker {
  display: none;
}
details.fold > summary::after,
details.fold-block > summary::after,
details.sub > summary::after {
  content: '+';

  color: var(--muted);
}

details[open].fold-block > summary::after,

  font-size: 17px;

  display: none;
}

  padding: 10px 14px;

  min-width: 0;
  gap: 10px;

.day-plan:not(:empty) {

ów","unit":"zł/samicę"},"investElectricFencing":{"label":"Ogrodzenie elektryczne","unit":"zł/ha","hint":"Przy owcach i kozach liczę o 30% więcej (więcej drutów, siatki)."},"investPastureWater":{"label":"Woda na pastwiska (rury, poidła)","unit":"zł"},"investDairy":{"label":"Dojarka, schładzalnik, mleczarnia","unit":"zł","hint":"Mniej, jeśli przerobisz starą oborę."},"investCheeseRoom":{"label":"Serownia i dojrzewalnia","unit":"zł"},"investMarketGarden":{"label":"Tunel, nawadnianie, chłodnia, narzędzia","unit":"zł/ha"},"investBeehive":{"label":"Ul z wyposażeniem i rodziną","unit":"zł/szt."},"investHatchery":{"label":"Inkubator, ogrzewacz, odchowalnia","unit":"zł"},"investPoultryTunnel":{"label":"Tunel: siatki, poidła z grzałką, lampy","unit":"zł","hint":"Przy istniejącym tunelu. Nowy tunel 6 × 20 m to dużo więcej."},"investHorseStable":{"label":"Wiata lub boks dla konia","unit":"zł/szt."},"investProcessingRoom":{"label":"Wędzarnia, chłodnia, pakowarka, pomieszczenie","unit":"zł","hint":"Założenie. Pomieszczenie musi spełniać wymagania higieniczne i być zgłoszone do powiatowego lekarza weterynarii."},"investOther":{"label":"Inne inwestycje (wcześniej nieuwzględnione)","unit":"zł","hint":"Wszystko, czego nie ma na liście powyżej: studnia, droga, przyłącze, budynek gospodarczy, samochód dostawczy. Kwotę można też wpisać w tabeli inwestycji."},"investOtherLifetimeYears":{"label":"Inne inwestycje: lata użytkowania","unit":"lat","hint":"Amortyzacja to kwota podzielona przez tyle lat."},"organicPayment":{"label":"Płatność ekologiczna (po wejściu w system eko)"},"livestockDensityBonus":{"label":"Premia za produkcję roślinno-zwierzęcą (0,5–1,5 DJP/ha)"},"catchCrops":{"label":"Międzyplony ozime i wsiewki (ekoschemat „Rolnictwo węglowe”, 5 pkt/ha)","hint":"Mieszanka min. 2 gatunków wysiana do 1 X i utrzymana do 15 II; wsiewka bobowatych w owies utrzymana min. 8 tygodni po zbiorze. Bez środków ochrony roślin. Gdzie wypadają w płodozmianie, zobaczysz w sekcji „Płodozmian”."},"carbonManure":{"label":"Wymieszanie obornika z glebą w 12 h (2 pkt/ha)","hint":"Zdjęcia geotagowane w aplikacji Mobilna ARiMR albo oświadczenie z datami w ciągu 14 dni."},"carbonCropDiversity":{"label":"Zróżnicowana struktura upraw (3 pkt/ha gruntów ornych)","hint":"Min. 3 uprawy, zboża najwyżej 65%, uprawy poprawiające materię organiczną (np. koniczyna) min. 20%. Sprawdzam to w Twoim płodozmianie."},"ecoSchemePointValue":{"label":"Wartość punktu ekoschematu","unit":"zł/pkt","hint":"W 2026 r. szacunkowo 92,76 zł za punkt (stawki zaliczek ARiMR, wrzesień 2026); ostateczna stawka bywa nieco inna. Próg: punkty co najmniej 25% UR × 5 pkt."},"catchCropCostPerHa":{"label":"Międzyplon: nasiona eko i siew","unit":"zł/ha"},"catchCropHoursPerHa":{"label":"Międzyplon: praca","unit":"h/ha"},"catchCropForageYield":{"label":"Międzyplon: wypas jesienią i wczesną wiosną","unit":"t s.m./ha","hint":"Owce lub jałówki na międzyplonie (żyto z wyką) jesienią i w marcu. Ostrożnie z wypasem przed 15 II."},"catchCropMix":{"label":"Mieszanka międzyplonu (wybór przy płodozmianie)"},"stubbleCrop":{"label":"Poplon ścierniskowy na zielony nawóz przed oziminą (bez dopłaty)","hint":"Po wczesnych żniwach, gdy następne jest zboże ozime: gorczyca, facelia lub gryka na 6–7 tygodni, potem przyoranie we wrześniu. Nie spełnia wymogów ekoschematu (okrywa nie trwa do 15 II), ale poprawia glebę i daje paszę gęsiom."},"stubbleCropMix":{"label":"Mieszanka poplonu ścierniskowego (wybór przy płodozmianie)"},"stubbleCropForageYield":{"label":"Poplon ścierniskowy: pasza z wypasu lub pokosu","unit":"t s.m./ha"},"stubbleCropCostPerHa":{"label":"Poplon ścierniskowy: nasiona i siew","unit":"zł/ha"},"extensiveGrasslandScheme":{"label":"Ekoschemat: ekstensywne użytki zielone z obsadą","hint":"Sprawdź w ODR, czy da się go łączyć z płatnością ekologiczną."},"youngFarmerEligible":{"label":"Płatność dla młodego rolnika"},"lessFavouredAreaRate":{"label":"ONW (jeśli działki są w strefie)","unit":"zł/ha","hint":"Tylko dla działek , z ubojem; przy 700 szt. ok. 0,1 h. Tu 0,6 h razem ze sprzedażą i nauką na początku."},"hoursPerGoose":{"label":"Gęś","unit":"h/szt."},"hoursPerDuck":{"label":"Kaczka: odchów, ubój, skubanie","unit":"h/szt."},"hoursPerTurkey":{"label":"Indyk: odchów, ubój","unit":"h/szt."},"hoursPerGuineaFowl":{"label":"Perliczka: odchów, ubój","unit":"h/szt."},"hoursPerRabbitDoe":{"label":"Królik: na samicę z młodymi","unit":"h/rok"},"hoursPerEwe":{"label":"Owca","unit":"h/rok","hint":"Owce mięsne ekstensywnie: zwykle 5–10 h na matkę rocznie (wykoty, racice, odrobaczanie, strzyża)."},"abattoirTripHours":{"label":"Kurs do rzeźni (tam i z powrotem)","unit":"h"},"lambSalesHoursPerLamb":{"label":"Sprzedaż jagnięciny: telefony, wydawanie paczek","unit":"h/jagnię"},"hoursPerGoat":{"label":"Koza","unit":"h/rok"},"hoursPerPig":{"label":"Świnia","unit":"h/szt."},"hayHoursPerHa":{"label":"Siano (z usługowym prasowaniem)","unit":"h/ha"},"cerealHoursPerHa":{"label":"Zboża (z usługowym kombajnem)","unit":"h/ha"},"rootCropHoursPerHa":{"label":"Okopowe: praca","unit":"h/ha","hint":"Sadzenie, pielenie i obsypywanie, zbiór, kopcowanie. Przy usługowym sadzeniu i kopaniu ok. 60–120 h/ha, ręcznie znacznie więcej."},"paddockMoveHours":{"label":"Przestawienie kwatery: praca","unit":"h","hint":"Przeniesienie taśmy i poidła, sprawdzenie ogrodzenia. Przy alei z wodą i szybkozłączkach zajmuje ok. 10–20 minut. Normy pracy na krowę zakładają jedno przestawienie dziennie, więc tu liczy się tylko różnica."},"generalHours":{"label":"Ogrodzenia, naprawy, papiery","unit":"h/rok"},"gardenHoursPerHa":{"label":"Sad i warzywnik","unit":"h/ha"},"targetFromHouseholdBudget":{"label":"Licz minimum na czysto z budżetu domu","hint":"Gdy włączone, próg wariantu pesymistycznego liczy się sam z wydatków, zapasu i oszczędzania poniżej, pomniejszonych o 800+. Gdy wyłączone, obowiązuje suwak minimum w grupie „Ludzie”."},"householdMonthlySpending":{"label":"Wydatki domu","unit":"zł/mies.","hint":"Szacunek dla 5 osób, oszczędnie, e jesienią, codziennie taśma przesuwana do kolejnych. Obornik zostaje tam, gdzie powstał, ścielenia jest mało, za to ok. 10% siana zostaje wdeptane. Krowy dojne wracają na dój."},"manureHoursPerTonne":{"label":"Obornik: ładowanie i rozrzucanie","unit":"h/t","hint":"Ładowacz na C-360 i mały rozrzutnik: ok. 2–3 t na kurs, ok. 0,15–0,3 h na tonę."},"riskYieldVolatility":{"label":"Losowe lata: zmienność plonów","unit":"%","hint":"Typowe odchylenie plonów od średniej z roku na rok (susza, mokre lato). Na lżejszych glebach i w eko zwykle 12–20%."},"riskPriceVolatility":{"label":"Losowe lata: zmienność cen i sprzedaży","unit":"%","hint":"Ceny w sprzedaży bezpośredniej są stabilniejsze niż w skupie, ale co roku część towaru może nie zejść albo trzeba go przecenić. Zwykle 5–15%."},"riskAnimalVolatility":{"label":"Losowe lata: zmienność wydajności zwierząt","unit":"%","hint":"Mleko, nieśność, odchów jagniąt i królików w zwykłych latach."},"riskCostVolatility":{"label":"Losowe lata: zmienność kosztów","unit":"%","hint":"Paliwo, prąd, weterynarz, naprawy."},"riskBadYearChance":{"label":"Losowe lata: szansa na zły rok dla zwierząt","unit":"%","hint":"Choroba w stadzie, nakaz zamknięcia drobiu przy ptasiej grypie albo utrata klientów. W takim roku produkcja zwierzęca jest niższa o ok. 25%. 5% to średnio raz na 20 lat."},"location":{"label":"Lokalizacja"},"arableSoilIIIShare":{"label":"Grunty orne: klasa III","unit":"%","hint":"Klasy gleby osobno dla gruntów ornych, pastwisk i łąk. Klasa III: zboża ok. +20%, trawy ok. +10%. Klasa V: zboża ok. −25%, trawy ok. −15%. Klasa VI: zboża ok. −45%, trawy ok. −30%. Lżejsze gleby mocniej odczuwają suszę w regionach z małymi opadami."},"arableSoilVShare":{"label":"Grunty orne: klasa V","unit":"%"},"arableSoilVIShare":{"label":"Grunty orne: klasa VI","unit":"%"},"pastureSoilIIIShare":{"label":"Pastwisko: klasa III","unit":"%"},"pastureSoilVShare":{"label":"Pastwisko: klasa V","unit":"%"},"pastureSoilVIShare":{"label":"Pastwisko: klasa VI","unit":"%"},"meadowSoilIIIShare":{"label":"Łąka kośna: klasa III","unit":"%"},"meadowSoilVShare":{"label":"Łąka kośna: klasa V","unit":"%"},"meadowSoilVIShare":{"label":"Łąka kośna: klasa VI","unit":"%"},"dairyBreed":{"label":"Typ rasy","hint":"Wybór ustawia typową wydajność, paszę treściwą, wydajność sera i śmietany oraz ceny cieląt i krów; suwaki można dalej zmieniać. HF potrzebuje dużo paszy treściwej i zjada więcej, jersey daje mniej mleka, ale bardzo tłuste i dobre na sery.","options":{"intensive":"Intensywne (HF)","mixed":"Dwukierunkowe (simentaler, ZR)","extensive":"Ekstensywne (jersey, RP)"}},"curdShare":{"label":"Mleko na twaróg (po odebraniu śmietany)","unit":"%","hint":"Z mleka najpierw zbiera się śmietanę, z chudego robi twaróg. Razem z serami nie więcej niż 100% mleka."},"curdPrice":{"label":"Twaróg","unit":"zł/kg"},"curdYield":{"label":"Wydajność twarogu","unit":"kg/100 l","hint":"Z chudego mleka ok. 14–16 kg twarogu półtłustego ze 100 l."},"creamYield":{"label":"Śmietana ze 100 l mleka","unit":"kg","hint":"Śmietana ok. 30–36% przy zbieraniu odstojowym lub wirówką: jersey ok. 10–12 kg, HF ok. 6–8 kg."},"creamPrice":{"label":"Śmietana","unit":"zł/kg"},"butterShare":{"label":"Śmietana na masło","unit":"%","hint":"Z 1 kg śmietany wychodzi ok. 0,45 kg masła i 0,55 l maślanki."},"butterPrice":{"label":"Masło","unit":"zł/kg","hint":"Masło z gospodarstwa w sprzedaży bezpośredniej: zwykle 60–100 zł/kg."},"byproductsSoldShare":{"label":"Serwatka i maślanka na sprzedaż","unit":"%","hint":"Reszta idzie dla świń i kur jako pasza białkowa i zastępuje część ziarna."},"buttermilkPrice":{"label":"Maślanka","unit":"zł/l"},"wheyPrice":{"label":"Serwatka","unit":"zł/l"},"beefBreed":{"label":"Typ rasy","hint":"Wybór ustawia typowe wagi odsadków i opasów oraz wydajność rzeźną. Rasy ekstensywne dobrze tyją na samej trawie.","options":{"intensive":"Intensywne (limousine, charolaise)","mixed":"Dwukierunkowe (simentaler)","extensive":"Ekstensywne (angus, hereford, highland)"}},"beefSystem":{"label":"System chowu","hint":"Alkierz: opasy cały rok w budynku na ziarnie i sianokiszonce. Mieszany: latem pastwisko, zimą wiata. Cały rok na zewnątrz: zimą wypas na belach i osłona od wiatru zamiast obory, bez ziarna, tucz trwa dłużej.","options":{"housedFinishing":"Tucz w alkierzu","mixed":"Mieszany","outdoorYearRound":"Cały rok na zewnątrz"}},"kidsPerDoe":{"label":"Koźlęta od kozy","unit":"szt./rok"},"goatMilking":{"label":"Doję kozy (mleko i sery kozie)","hint":"Kozy mleczne (np. saaneńska, biała uszlachetniona) dają ok. 400–800 l w laktacji. Dojenie dwa razy dziennie, osobne pomieszczenie lub mleczarnia krów."},"milkPerGoat":{"label":"Mleko od kozy","unit":"l/rok"},"goatMilkPrice":{"label":"Mleko kozie","unit":"zł/l"},"goatCheeseShare":{"label":"Mleko kozie na sery","unit":"%"},"goatCheesePrice":{"label":"Ser kozi","unit":"zł/kg"},"goatCheeseYield":{"label":"Wydajność sera koziego","unit":"kg/100 l"},"hoursPerMilkingGoat":{"label":"Dojenie kozy","unit":"h/rok"},"pigs":{"label":"Tuczniki pastwiskowe","unit":"szt./rok","hint":"Rasy do chowu na wybiegu: złotnicka, puławska, mangalica. Kwatery zmienia się co 1–2 tygodnie, bo świnie ryją; na tę samą kwaterę wracają po pół roku do roku albo po podsiewie. Obsada ok. 10–14 tuczników na hektar wybiegu w roku."},"pigGrainKg":{"label":"Ziarno na tucznika","unit":"kg","hint":"Na wybiegu z trawą, burakami i serwatką ok. 300–400 kg ziarna na tucznika."},"ridesPerYear":{"label":"Jazdy konne dla gości","unit":"h/rok","hint":"Godziny jazd lub przejażdżek w roku. Sprawdź formę prawną: patrz wskazówka w wynikach."},"ridePricePerHour":{"label":"Cena jazdy","unit":"zł/h"},"hoursPerRide":{"label":"Praca na godzinę jazdy","unit":"h","hint":"Przygotowanie konia, prowadzenie, sprzątanie."},"guardDogs":{"label":"Psy stróżujące","unit":"szt.","hint":"Psy pasterskie (np. owczarek podhalański) chronią owce i kozy przed wilkami. Pies żyje ze stadem cały rok."},"dogMeatKgPerMonth":{"label":"Karma na psa","unit":"kg/mies.","hint":"Duży pies ok. 0,6–1 kg dziennie."},"dogsFedOwnMeat":{"label":"Psy jedzą mięso z gospodarstwa","hint":"Najpierw koźlęta niesprzedane, potem jagnięcina; reszta to kupiona karma."},"dogFoodPricePerKg":{"label":"Kupiona karma","unit":"zł/kg"},"costPerDog":{"label":"Pies: weterynarz, szczepienia, podatek","unit":"zł/rok"},"hoursPerDog":{"label":"Pies: opieka","unit":"h/rok"},"porkProcessedShare":{"label":"Wieprzowina na wędliny","unit":"%"},"processedValuePerPorkKg":{"label":"Wędliny wieprzowe: wartość","unit":"zł/kg tuszy","hint":"Szynki, kiełbasy, boczek z 1 kg tuszy: zwykle 50–90 zł."},"beefProcessedShare":{"label":"Wołowina na wyroby","unit":"%"},"processedValuePerBeefKg":{"label":"Wyroby wołowe: wartość","unit":"zł/kg tuszy","hint":"Suszona wołowina, pasztety, burgery z 1 kg tuszy."},"preservesFruitShare":{"label":"Owoce na przetwory","unit":"% zbioru","hint":"Dżemy, soki, susz. Razem z owocami na sprzedaż nie więcej niż cały zbiór."},"preservesVegetableShare":{"label":"Warzywa na przetwory","unit":"% produkcji","hint":"Kiszonki, sosy, warzywa w słoikach."},"preservesValueFactor":{"label":"Wartość przetworów","unit":"× surowiec","hint":"Ile razy więcej warte są przetwory niż świeże owoce lub warzywa, z których powstały."},"processingHoursPerPorkKg":{"label":"Wędliny wieprzowe: praca","unit":"h/kg"},"processingHoursPerBeefKg":{"label":"Wyroby wołowe: praca","unit":"h/kg"},"preservesHoursPer1000Pln":{"label":"Przetwory: praca","unit":"h/1000 zł"},"boughtForageShare":{"label":"Pasza objętościowa kupowana","unit":"% potrzeb","hint":"Siano lub sianokiszonka kupowane zamiast własnych; ta część potrzeb nie zajmuje ziemi."},"boughtConcentrateShare":{"label":"Pasza treściwa kupowana","unit":"% potrzeb","hint":"Ziarno lub mieszanki kupowane zamiast własnych (cena jak przy dokupowaniu ziarna)."},"householdChildren":{"label":"Dzieci w domu","unit":"os.","hint":"Razem z dwojgiem rodziców. Dziecko je średnio ok. 70% tego co dorosły."},"homeUseFromFarm":{"label":"Odliczaj żywność dla domu od sprzedaży","hint":"Jaja, mleko, nabiał, mięso, owoce i miód dla rodziny według liczby osób. Wyłącz, żeby pominąć użytek własny."},"investPigShelter":{"label":"Budka dla świń (arka)","unit":"zł/miejsce"},"investRidingEquipment":{"label":"Siodła, ogrodzenie ujeżdżalni","unit":"zł"},"investGoatDairy":{"label":"Dojarka i schładzalnik dla kóz","unit":"zł"},"investPreservesKitchen":{"label":"Kuchnia do przetworów","unit":"zł"},"investMeatColdStore":{"label":"Chłodnia i zamrażarki na mięso","unit":"zł"},"investTractor":{"label":"Ciągnik używany (np. C-360)","unit":"zł","hint":"Nie jest potrzebny, gdy gospodarstwo ma tylko ogród, sad i drób."},"investHaymakingSet":{"label":"Kosiarka, przetrząsacz, zgrabiarka","unit":"zł"},"investArableImplements":{"label":"Pług, agregat, siewnik","unit":"zł"},"investManureHandling":{"label":"Rozrzutnik i ładowacz","unit":"zł"},"investLivestockTrailer":{"label":"Przyczepa do przewozu zwierząt","unit":"zł"}},"presets":{"recommended":{"label":"Mleko + jaja + owce","note":"Zalecany start"},"milkAndEggs":{"label":"Mleko + jaja","note":"Bez owiec"},"poultryFirst":{"label":"Drób na pierwszym planie","note":"Mało krów"},"family":{"label":"Rodzina: cel 120 tys.","note":"Konie, owce, +3 ha"},"diversified":{"label":"Rodzina: różnorodnie","note":"Kaczki, perliczki, owoce, grzyby"},"smokehouse":{"label":"Rodzina + wędzarnia","note":"Półgęsek, wyroby, wysyłka"},"minimum":{"label":"Minimum: 12 ha, 3 krowy","note":"Mało pracy i inwestycji"},"minimumNoDairy":{"label":"Minimum: 12 ha bez krów","note":"Drób i owce"},"maximumProfit":{"label":"Maksimum zysku","note":"Cały czas rodziny, bez limitu tygodnia"},"noMilking":{"label":"Bez dojenia","note":"Mniej pracy"},"showPessimistic":"Pokaż wszystko w wariancie pesymistycznym","lubuskieAngus":{"label":"Lubuskie: angusy na trawie","note":"Mało pracy, mały dochód","description":"Typowy w Lubuskiem chów bydła mięsnego: krowy mamki angus cały sezon na pastwisku, przesuwane raz w tygodniu, odsadki sprzedawane jesienią, zimą siano z łąk. Do tego ekoschemat ekstensywnych użytków zielonych i dopłaty do bydła. Na 14 ha mieści się ok. 8 mamek, więc to dochód uzupełniający. W regionie takie stada gospodarują zwykle na 50–200 ha, często dzierżawionych."},"perkinsRidgedale":{"label":"Ridgedale (R. Perkins)","note":"Warzywa, kurczaki, sad","description":"Na wzór gospodarstwa Ridgedale Richarda Perkinsa w Szwecji: intensywny ogród warzywny bez przekopywania, kurczaki w przenośnych zagrodach, kury w mobilnym kurniku, indyki, owce i kilka krów mięsnych w wypasie rotacyjnym z codziennym przesuwaniem. Do tego sad i boczniaki w zadrzewieniach oraz międzyplony. Dużo pracy i sprzedaży bezpośredniej, za to wiele źródeł dochodu."},"salatinPolyface":{"label":"Polyface (J. Salatin)","note":"Bydło, a za nim drób","description":"Na wzór Polyface Joela Salatina: bydło przesuwane codziennie, kwatera wraca do wypasu po ok. 60 dniach, 3–4 dni za bydłem jedzie mobilny kurnik. Kurczaki w zagrodach przesuwanych codziennie, indyki, króliki i kilka tuczników. Wołowina z opasu na trawie sprzedawana w paczkach. Salatin kupuje ziarno, a tutaj pochodzi ono z własnych pól."},"grassDairy":{"label":"Mleko z trawy (Voisin, NZ)","note":"Dój 1× dziennie, sery","description":"Mleczarstwo pastwiskowe według zasad wypasu racjonalnego André Voisina i praktyki nowozelandzkiej: krowy jersey prawie wyłącznie na trawie, codziennie świeża kwatera, odpoczynek ok. 35 dni, dój raz dziennie, większość mleka na sery. Pastwisko ma tyle hektarów, ile krowy zjedzą; siano na zimę daje koniczyna z trawami na gruntach ornych, bez osobnej łąki. Za krowami mobilny kurnik zjada ziarno z własnych pól. Mniej mleka, ale dużo mniej pracy przy dojarce."},"sweetSpot":{"label":"Sweet spot","note":"Całe 14 ha, najwięcej zł/h","description":"Wynik przeszukania tysięcy kombinacji na 14 ha bez dzierżawy: najwyższy dochód na godzinę pracy przy co najmniej 6,5 tys. zł miesięcznie w wariancie pesymistycznym, całej ziemi w użyciu (każda pasza z zapasem ok. 5–10%, bez braków) i szczycie poniżej 60 h tygodniowo. Wyszły z tego kury nieśne, kaczki, kilka gęsi i stado owiec, a do tego wypas przesuwany co 3 dni z długim odpoczynkiem kwater. Bez krów: dojenie zajmuje najwięcej godzin, a bydło mięsne na tej powierzchni daje mało z godziny."},"brownsRanch":{"label":"Brown’s Ranch (G. Brown)","note":"Międzyplony, bydło, kury","description":"Na wzór farmy Gabe’a Browna z Dakoty Północnej: pięć zasad zdrowia gleby (bez gołej ziemi, jak najmniej uprawy, różnorodność roślin, żywe korzenie cały rok, zwierzęta na polu). Płodozmian z pięciu pól z koktajlami międzyplonowymi wypasanymi przez bydło, krowy mamki z opasami cały rok na zewnątrz (zimą na belach), owce, świnie, kury i kurczaki za bydłem, sprzedaż bezpośrednia mięsa i jaj."},"gregJudy":{"label":"Green Pastures (G. Judy)","note":"Mob grazing, owce, świnie","description":"Na wzór farmy Grega Judy’ego z Missouri: duża obsada na małej kwaterze przesuwana dwa razy dziennie, kwatera wraca do wypasu po ok. 90 dniach, a wysoka, zdeptana trawa buduje glebę. Bydło angus i owce bez strzyży cały rok na pastwisku, zimą wypas na kupionych belach (siano przywozi żyzność na farmę), świnie na kwaterach w zadrzewieniach, pies stróżujący. Mało maszyn i budynków, mało godzin."}},"assumptionSets":{"realistic":"Realnie","optimistic":"Optymistycznie"},"labourGroups":{"cattle":"Krowy i sery","poultry":"Drób i króliki","smallLivestock":"Owce, kozy, świnie, konie, psy","fields":"Siano i zboża","produce":"Warzywa, owoce, grzyby, pszczoły","processing":"Przetwórstwo i wysyłka","other":"Sprzedaż, naprawy, ogród"},"format":{"numberLocale":"pl-PL","pln":"{amount} zł"},"warnings":{"landOverAllocated":"Pastwisko, łąka, obejście i warzywa zajmują o {hectares} ha więcej, niż macie ziemi. Zmniejsz któryś z tych suwaków albo dodaj dzierżawę.","gardenExceedsFarmyard":"Sad i warzywnik nie mieszczą się w obejściu. Zwiększ obejście.","grainShortage":"Brakuje ok. {tonnes} t ziarna. To ok. {cerealHa} ha zbóż więcej (ok. {arableHa} ha gruntów ornych w płodozmianie) albo ok. {hens} kur mniej.","hayShortage":"Brakuje ok. {tonnes} t s.m. siana na zimę. To ok. {meadowHa} ha łąki więcej albo mniej zwierząt.","strawShortage":"Brakuje ok. {tonnes} t słomy na ściółkę. Pomoże więcej zbóż albo włącz trociny zamiast słomy (grupa „Koszty”).","sawdustReplacesStraw":"Brakującą słomę zastępujesz trocinami: ok. {tonnes} t (ok. {cubicMetres} m³) za ok. {cost} zł rocznie.","grainSurplus":"Nadwyżka ziarna ok. {tonnes} t. Możesz dołożyć ok. {hens} kur albo zamienić część zbóż na koniczynę.","haySurplus":"Dużo nadwyżki siana (ok. {tonnes} t s.m.). Jest miejsce na kolejne zwierzęta albo zapas na suszę.","stockingOutsideBonusRange":"Obsada {density} DJP/ha jest poza przedziałem 0,5–1,5, więc premia 573 zł/ha nie przysługuje.","grasslandOverstocked":"Na użytkach zielonych jest ponad 2 DJP/ha. To już nie jest wypas ekstensywny.","notEnoughHours":"Potrzeba {needed} h rocznie, a rodzina ma ok. {available} h. Brakuje ok. {missing} h.","littleSpareTime":"Praca zajmuje {percent}% czasu rodziny. Mało zapasu na choroby i urlopy.","muchSpareTime":"Praca zajmuje tylko ok. {percent}% czasu rodziny ({needed} z {available} h). Ograniczeniem jest ziemia i rynek, nie ręce: wolny czas najlepiej włożyć w sery, warzywa i sprzedaż bezpośrednią.","peakMonthOverload":"W najcięższym miesiącu potrzeba ok. {peak} h, a miesięcznie rodzina ma ok. {monthly} h.","weeklyLimitExceeded":"W najcięższym miesiącu wychodzi ok. {peak} h tygodniowo, powyżej Twojego limitu {limit} h.","manyEggsToSell":"Musisz sprzedawać ok. {boxes} opakowań po 10 jaj tygodniowo. Najpierw znajdź stałych odbiorców.","directSalesTaxThreshold":"Przychód z RHD (sery, mięso czerwone w paczkach, wędliny) przekracza 100 tys. zł, więc nadwyżka podlega 2% ryczałtowi: ok. {tax} zł rocznie, już doliczone do kosztów.","turkeysWithHens":"Indyki i kury: trzymaj je osobno i najlepiej na innych kwaterach niż kury w ostatnich latach. Kury przenoszą histomonozę (c ed":"Plik zapisany.","cancelled":"Zapis anulowany.","failed":"Nie udało się zapisać pliku.","loaded":"Wczytano {count} ustawień{name}.","loadedName":" („{name}”)","notSettingsFile":"To nie jest plik z ustawieniami symulatora.","customSettings":"Własne ustawienia","fallbackFileName":"wariant","settingsFilePrefix":"symulator","reportFilePrefix":"raport","financeData":"Dane finansowe (JSON)","financeTitle":"Wyniki finansowe, przepływy miesięczne, inwestycje i lata startu w pliku JSON, np. dla aplikacji do budżetu.","financeFilePrefix":"finanse"},"pdf":{"sections":{"summary":{"choice":"Podsumowanie","title":"Podsumowanie"},"money":{"choice":"Pieniądze","title":"Pieniądze"},"cashflow":{"choice":"Przepływy gotówki","title":"Przepływy gotówki"},"enterprises":{"choice":"Kierunki","title":"Który kierunek się opłaca"},"nextSteps":{"choice":"Co dalej","title":"Co dalej: co dołożyć"},"labour":{"choice":"Czas pracy","title":"Czas pracy w roku"},"market":{"choice":"Co sprzedać","title":"Co trzeba sprzedać"},"investments":{"choice":"Inwestycje","title":"Inwestycje"},"rotation":{"choice":"Płodozmian","title":"Płodozmian"},"household":{"choice":"Budżet domu","title":"Budżet domu"}},"variant":"Wariant: {name}","subtitle":"{date} · {farmedHa} ha użytków · {ownedHa} ha własnych{leased} · założenia: rok w pełnym działaniu","leased":" + {leasedHa} ha dzierżawy","animals":{"dairyCows":"{count} krów","sucklerCows":"{count} mamek","layingHens":"{count} kur","broilers":"{count} kurczaków","geese":"{count} gęsi","ducks":"{count} kaczek","turkeys":"{count} indyków","guineaFowl":"{count} perliczek","sheep":"{count} owiec","goats":"{count} kóz","pigs":"{count} świń","horses":"{count} konie","rabbits":"{count} samic królików","beehives":"{count} uli"},"animalsAndCrops":"Zwierzęta i uprawy: {animals}. Pastwisko {pastureHa} ha, łąka {meadowHa} ha, grunty orne {arableHa} ha (zboża {cerealShare}%).","summary":{"netIncome":"Dochód na czysto / rok","monthlyAverage":"Średnio miesięcznie","revenue":"Przychód (sprzedaż + dopłaty)","subsidies":"w tym dopłaty","costs":"Koszty z amortyzacją","pessimistic":"Wariant pesymistyczny","hours":"Praca / rok","hoursValue":"{hours} h (śr. {perWeek} h/tydz.)","peakMonth":"Najcięższy miesiąc (pesym.)","peakMonthValue":"{peak} h/tydz. (limit {limit})","investments":"Inwestycje","investmentsValue":"{capex} ({depreciation} rocznie)","feed":"Pasze","feedValue":"siano {hay} t, ziarno {grain} t, słoma {straw} t","stocking":"Obsada","stockingValue":"{value} DJP/ha"},"cashflowChart":"Wynik miesiąca po wypłacie na dom (zł)","labourChart":"Godziny w miesiącu (cała rodzina)","disclaimer":"Wyliczenia orientacyjne na podstawie założeń z symulatora; ceny, plony i normy pracy warto sprawdzić lokalnie. Dopłaty i przepisy zmieniają się co roku.","footer":"Symulator gospodarstwa rodzinnego · {variant} · strona {page} z {pages}"},"page":{"header":{"eyebrow":"Planer finansów, pracy i pasz dla gospodarstwa rodzinnego","lead":"Przesuwaj suwaki: bilans pasz, czas pracy i pieniądze przeliczają się od razu."},"theme":{"label":"Motyw:","auto":"Automatyczny","light":"Jasny","dark":"Ciemny","groupLabel":"Motyw kolorów","eco":"Eko"},"kpi":{"netIncome":"Dochód / rok","hours":"Praca / rok","revenue":"Przychód / rok","pessimistic":"Pesymistycznie","investment":"Inwestycje","feed":"Pasze","stocking":"Obsada","stockingDetail":"DJP na ha użytków","regionLabel":"Wynik na bieżąco","pessimisticTitle":"Wariant pesymistyczny"},"presets":{"variant":"Wariant","assumptions":"Założenia","savedVariants":"Moje warianty","saveCurrent":"Zapisz obecne ustawienia","savedLocally":"Zapisane tylko w tej przeglądarce.","exportAndReport":"Zapis i raport","namePlaceholder":"Nazwa, np. Plan 2027","nameLabel":"Nazwa wariantu","philosophies":"Filozofie"},"results":{"title":"Co wychodzi","intro":"Bilans liczony jest dla roku w pełnym działaniu (rok 4, patrz „Jak zacząć”)."},"landAndFeed":{"title":"Ziemia i pasze","intro":"Potrzeba (obrys) i produkcja z własnych pól (wypełnienie)."},"farmPlan":{"title":"Plan rozmieszczenia","intro":"Schemat, nie mapa: proporcje pól zmieniają się razem z suwakami. Wybierz miesiąc, jak często przesuwasz krowy i po ilu dniach wracają na tę samą kwaterę; liczba kwater przeliczy się sama. Rok płodozmianu wybierasz w bloku „Płodozmian” poniżej. Kliknij pole, żeby zobaczyć, co się na nim dzieje.","notes":{"buildings":"<h3>Budynki: tanio i lekko<\/h3><ul><li>Stara obora: dojarnia, mleczarnia, serownia (wymagają osobnego, zmywalnego pomieszczenia).<\/li><li>Wiata szkieletowa z OSB lub deskami, otwarta od wschodu, z głęboką ściółką: krowy i jałówki.<\/li><li>Druga wiata lub przedłużenie: owce i kozy, nocna zagroda przed wilkami.<\/li><li>Kurniki mobilne na płozach, ciągnięte C-360; zimą stoją przy obejściu.<\/li><\/ul>","waterAndFencing":"<h3>Woda i ogrodzenie<\/h3><ul><li>Rura PE wzdłuż alei z szybkozłączkami co 2–3 kwatery, poidło przenośne.<\/li><li>Obwód: 2–3 druty stałe (przy owcach 4–5), wewnątrz taśmy na przenośnych słupkach.<\/li><li>Elektryzator z odpowiednim zapasem mocy, uziemienie w kilku punktach.<\/li><\/ul>","grazingOrderTitle":"Kolejność na pastwisku","buildingsTitle":"Budynki: tanio i lekko","waterAndFencingTitle":"Woda i ogrodzenie"},"mapLabel":"Schemat rozmieszczenia gospodarstwa"},"rotation":{"title":"Płodozmian na gruntach ornych","intro":"W gospodarstwie ekologicznym azot daje koniczyna i obornik, więc część gruntów ornych zawsze jest pod koniczyną z trawami. Liczbę pól wybierasz niżej (lub w grupie „Ziemia”), udział zbóż suwakiem. Kliknij rok, żeby zobaczyć go na planie.","seedsTitle":"Normy wysiewu","seedsIntro":"Nasiona na pola w roku płodozmianu wybranym w tabeli powyżej (normy orientacyjne dla nasion ekologicznych; dokładne podaje dostawca)."},"catchCrops":{"title":"Międzyplony i ekoschematy","intro":"Międzyplon to zielona okrywa między dwiema uprawami głównymi: chroni glebę zimą, wiąże azot, karmi życie glebowe i daje paszę owcom. W ekoschemacie „Rolnictwo węglowe” międzyplon ozimy lub wsiewka to 5 pkt/ha, ok. 500 zł/ha. Włączasz je przyciskami przy płodozmianie albo w grupie „Dopłaty”.","requirements":"Wymogi praktyki (ARiMR, PODR 2025): min. 2 gatunki, nie same zboża; międzyplon ozimy wysiany do 1 X i utrzymany do 15 II (mulczowanie dopuszczalne po 15 XI); wsiewka bobowatych utrzymana do siewu następnej uprawy lub min. 8 tygodni po zbiorze; bez środków ochrony roślin. W gospodarstwie ekologicznym nasiona eko (lub zgoda na nieekologiczne). Ilości wysiewu orientacyjne: sprawdź u dostawcy nasion. Czy ekoschemat łączy się z płatnością ekologiczną na tej samej działce, potwierdź w ODR przed złożeniem wniosku.","grainLegumeMixtures":"Mieszanki zbożowo-strączkowe dawały w doświadczeniach IUNG ok. 2,6–4,9 t/ha i 16–19% białka (groch z pszenicą). Udział strączkowych w siewie 40–50%. Ziarno kur warto uzupełnić serwatką z serowarni (białko) i zielonką z wybiegu.","mixesTitle":"Mieszanki, normy wysiewu i wymagania ekoschematu","brownNote":"Gabe Brown (Brown’s Ranch, Dakota Północna) sieje mieszanki z 6–15 gatunków: trawy, motylkowe, kapustne i rośliny kwitnące, i wypasa je bydłem. Różne korzenie karmią życie glebowe, motylkowe dają azot, a zwierzęta zostawiają nawóz. W Polsce takie mieszanki da się złożyć z nasion od krajowych dostawców (żyto, owies, wyka, peluszka, facelia, gryka, gorczyca, rzodkiew oleista, koniczyny, słonecznik)."},"money":{"title":"Pieniądze","intro":"Od sprzedaży do wyniku na czysto.","chartLabel":"Wykres: sprzedaż, dopłaty, koszty, amortyzacja i wynik"},"cashflow":{"title":"Przepływy gotówki","intro":"Rok w pełnym działaniu, miesiąc po miesiącu. Bez inwestycji, z wypłatą na dom.","chartLabel":"Wykres: wynik miesiąca i saldo konta"},"enterprises":{"title":"Który kierunek się opłaca","intro":"Pasza z własnych pól liczona po koszcie uprawy.","colourNote":"Kolory przy zł/ha i zł/h: od czerwonego (najsłabiej) do zielonego (najlepiej). Zielone z hektara warto skalować, gdy brakuje ziemi; zielone za godzinę, gdy brakuje rąk. W innych tabelach przy kosztach i godzinach mocniejszy czerwony znaczy więcej.","perHourNote":"Zł za godzinę to nadwyżka kierunku podzielona przez jego godziny (ze sprzedażą). Żywność wzięta dla domu nie jest liczona w sprzedaży; jej wartość jest w tabeli „Żywność dla domu”. Ciągnik, maszyny i chłodnia są w wierszu „Wspólne”."},"nextSteps":{"title":"Co dalej: co dołożyć","intro":"Każdy krok przeliczony przy Twoich obecnych ustawieniach."},"sensitivity":{"title":"Co najbardziej zmienia wynik","intro":"Każde założenie osobno o 20% w dół i w górę.","chartLabel":"Wykres wrażliwości wyniku na założenia"},"labour":{"title":"Czas pracy w roku","intro":"Godziny w miesiącu według zajęć.","chartLabel":"Wykres godzin pracy w miesiącach"},"market":{"title":"Co trzeba sprzedać","intro":"Ile trzeba sprzedać, jak często i kiedy. Bez stałych klientów żadna z tych liczb się nie uda."},"investments":{"title":"Inwestycje","intro":"To, czego jeszcze brakuje do wybranych kierunków, rozłożone na lata użytkowania (amortyzacja). Na końcu inne inwestycje.","editNote":"Kwoty są domyślne. Wpisz własną (np. z oferty albo 0, gdy coś już masz) i naciśnij Enter: przeliczę ją na cenę jednostkową i przestawię suwak w grupie „Inwestycje”. Działa też w drugą stronę: suwak zmienia kwotę tutaj."},"household":{"title":"Budżet domu","intro":"Czy wynik gospodarstwa wystarcza na życie."},"comparison":{"title":"Porównanie wariantów","intro":"Każdy wariant przeliczony przy Twoich pozostałych ustawieniach, raz z założeniami realnymi, raz ostrożnymi (niższe ceny i plony, więcej godzin)."},"calendar":{"title":"Kalendarz roku","intro":"Wycielenia i wykoty wczesną wiosną, krycie latem, siano w czerwcu, sprzedaż gęsi i serów jesienią i przed świętami. Termin wypasu według lokalizacji wybranej w nagłówku.","note":"Prace pokazuję tylko dla kierunków, które masz w ustawieniach. Kliknij miesiąc, żeby zobaczyć go na planie."},"stages":{"title":"Jak zacząć: rozkręcanie przez 3–4 lata","intro":"Każdy kierunek rośnie dopiero wtedy, gdy poprzedni się sprzedaje. Wybierz rok, żeby zobaczyć, ile mniej więcej daje gospodarstwo w trakcie rozkręcania.","method":"Założenia: w roku 1 część stad i powierzchni (np. 3/4 krów, połowa kur, bez świń i wyrobów), sprzedaż ok. 75% planu i ok. 15% więcej godzin na naukę; w roku 2 ok. 88% sprzedaży, w roku 3 ok. 96%. Inwestycje liczone dla tego, co jest w danym roku."},"regulations":{"title":"Prawo i formalności","intro":"Skrót najważniejszych spraw. Przepisy się zmieniają, więc przed każdym startem potwierdź szczegóły w powiatowym inspektoracie weterynarii (PIW), w ARiMR i w ODR.","notes":{"subsidies":"<h3>ARiMR i dopłaty<\/h3><ul><li>Numer producenta i siedziba stada; bydło, owce, kozy i świnie kolczykowane i zgłaszane; stado drobiu też zgłoś.<\/li><li>Dzierżawa: dopłaty, także ekologiczną, dostaje dzierżawca, który faktycznie użytkuje ziemię. Przy płatności ekologicznej umowa powinna obejmować cały okres zobowiązania. Umowę spisz na piśmie.<\/li><li>Wniosek o dopłaty co roku. Płatność do owiec liczę od 10 sztuk, do kóz od 5 (sprawdź progi).<\/li><li>Stawki w planerze: płatności bezpośrednie i do zwierząt według szacunków na 2026 r. (stawki zaliczek), dobrostan za 2024 r., ONW 2026, płatność ekologiczna według szacunków na 2023 r.<\/li><\/ul>","organic":"<h3>Rolnictwo ekologiczne<\/h3><ul><li>Umowa z jednostką certyfikującą i okres konwersji (płatność przysługuje także w konwersji).<\/li><li>Kury: najwyżej 6 kur na m² kurnika, wybieg, zakaz syntetycznych aminokwasów, do 5% pasz nieekologicznych.<\/li><li>Kurczaki eko: ubój najwcześniej w 81. dniu życia albo rasy wolno rosnące.<\/li><\/ul>","milkEggsCheese":"<h3>Mleko, jaja, sery<\/h3><ul><li>Mleko surowe i jaja: sprzedaż bezpośrednia; zgłoszenie do powiatowego lekarza weterynarii co najmniej 30 dni przed startem i numer weterynaryjny.<\/li><li>Jaja na targowisku: zwykle wymagane znakowanie kodem producenta (potwierdź w PIW).<\/li><li>Jagnięcina: ubój w zatwierdzonej rzeźni (rolniczej lub usługowej, w swoim albo sąsiednim powiecie), mięso ze znakiem weterynaryjnym. Limit RHD dla mięsa czerwonego wynosił 2300 kg rocznie (rozporządzenie z 2016 r.). Czy możesz sprzedawać całe tusze, czy tylko po rozbiorze w swojej kuchni RHD, potwierdź w PIW.<\/li><li>Sery: rolniczy handel detaliczny (RHD), limity ilościowe ustala decyzja lekarza weterynarii. Przychód z RHD zwolniony z podatku do 100 tys. zł, powyżej 2% ryczałtu.<\/li><li>Nie reklamuj, że mleko „leczy”: oświadczenia zdrowotne na żywności są w UE ściśle regulowane.<\/li><\/ul>","poultryAndPigs":"<h3>Drób mięsny i świnie<\/h3><ul><li>Drób i króliki ubite w gospodarstwie sprzedajesz w ramach sprzedaży bezpośredniej (zgłoszenie do powiatowego lekarza weterynarii). Żeby z nich robić przetwory, potrzebujesz też wpisu do RHD.<\/li><li>Mięso owiec, kóz i świń do wyrobów w RHD musi pochodzić z rzeźni; z uboju na własny użytek nie wolno.<\/li><li>Indyki trzymaj osobno od kur (histomonoza).<\/li><li>Własny wylęg na potrzeby stada nie wymaga rejestracji wylęgarni; sprzedaż piskląt lub jaj wylęgowych już tak (powiatowy lekarz weterynarii).<\/li><li>Tunel zimowy przy nakazie zamknięcia drobiu: wszystkie otwory zasłonięte siatką, karma i woda w środku.<\/li><li>Świnie: sprawdź strefę ASF w PIW. Obowiązuje bioasekuracja, a karmienie resztkami z kuchni jest zabronione.<\/li><li>Ptasia grypa: w okresach zagrożenia trzeba zamknąć drób, więc kurniki mobilne potrzebują wariantu z siatką lub zamknięciem.<\/li><\/ul>","produceBeesEducation":"<h3>Warzywa, pszczoły, zajęcia dla dzieci<\/h3><ul><li>Warzywa sprzedawane bezpośrednio: zapytaj w powiatowej stacji sanitarno-epidemiologicznej o wpis do rejestru.<\/li><li>Pasiekę trzeba zarejestrować u powiatowego lekarza weterynarii.<\/li><li>Grzyby uprawne i soki z własnych owoców: wpis do rejestru w sanepidzie (RHD dla żywności roślinnej).<\/li><li>Zajęcia dla dzieci (zagroda edukacyjna): regularne płatne zajęcia zwykle wymagają działalności w CEIDG, okazjonalne mogą być nierejestrowe; potrzebne dodatkowe OC.<\/li><\/ul>","processingAndShipping":"<h3>Przetwory i wysyłka (RHD)<\/h3><ul><li>RHD pozwala sprzedawać konsumentom na odległość, także wysyłkowo, jeśli w transporcie zachowasz bezpieczne warunki, w tym temperaturę. Nie wolno sprzedawać przez pośredników.<\/li><li>Limity ilościowe RHD dotyczą tylko dostaw do sklepów i restauracji (np. wyroby mięsne 1400 kg rocznie). Sprzedaż konsumentom nie ma limitu ilości.<\/li><li>Ulga podatkowa: co najmniej 50% składników (bez wody) z własnego gospodarstwa; przychód do 100 tys. zł zwolniony, powyżej 2% ryczałtu.<\/li><li>Ministerstwo zapowiedziało w 2026 r. zniesienie ograniczeń terytorialnych i wyższe limity; projekt był w konsultacjach. Przed startem sprawdź, co weszło w życie.<\/li><\/ul>","wolvesBuildingsManure":"<h3>Wilki, budowy, obornik<\/h3><ul><li>Szkody od wilków wypłaca Regionalna Dyrekcja Ochrony Środowiska; zgłaszaj od razu, a owce i kozy zamykaj na noc.<\/li><li>Wiaty: zapytaj w starostwie, czy wystarczy zgłoszenie, czy potrzebne jest pozwolenie na budowę.<\/li><li>Obornik i głęboka ściółka: przechowywanie według programu azotanowego (zapytaj w ODR).<\/li><\/ul>","taxesAndInsurance":"<h3>Podatki i ubezpieczenia<\/h3><ul><li>Sprzedaż nieprzetworzonych produktów (mleko surowe, jaja, żywe zwierzęta) to zwykle działalność rolnicza; przetwory w RHD jak wyżej. Potwierdź z księgowym.<\/li><li>KRUS, ubezpieczenie budynków i OC rolnika są w kosztach stałych w planerze.<\/li><\/ul>"}},"assumptions":{"title":"Założenia i źródła","method":"<h3>Jak liczę<\/h3><ul> <li>Krowa zjada rocznie ok. 5,5 t suchej masy (jersey), 6 t (rasy dwukierunkowe) albo 6,6 t (HF), jałówka 3,3 t, owca z jagniętami 0,8 t, koza 0,6 t.<\/li> <li>Kura: pasza do woli, z czego ok. 90% to własne ziarno i strączkowe, reszta to minerały i muszle (kupowane).<\/li> <li>Siano: 75% plonu łąki idzie na siano, 25% to odrosty do wypasu; nadwyżka pastwiska w 70% do koszenia.<\/li> <li>Ziarno i siano z własnych pól liczę po koszcie uprawy, bez czynszu za ziemię. Ziarno skarmione kurom można by sprzedać drożej, więc „zarobek” na jajach zawiera też ten zysk.<\/li> <li>DJP: przeliczniki orientacyjne (krowa 1, jałówka 0,6, owca i koza 0,1, kura 0,014).<\/li> <li>„Na czysto” to wynik przed zapłaceniem sobie za pracę, bez kosztów kredytu i podatków.<\/li> <li>„Wariant pesymistyczny” to Twoje bieżące ustawienia pogorszone o suwaki z tej grupy: ceny, plony, wydajność zwierząt, godziny i koszty. Czynsz zostaje bez zmian.<\/li> <li>Przetwory przypisuję do gatunku, z którego są (gęsi, kaczki, owce), razem z częścią wędzarni i wysyłki.<\/li> <li>Normy czasu pracy to moje szacunki dla małego gospodarstwa z dojarką konwiową. Popraw je po pierwszym roku na własnych zapiskach.<\/li><\/ul>","sources":"<h3>Źródła<\/h3><ul> <li><a href=\"https://www.farmer.pl/finanse/doplaty-2026-sa-nowe-stawki-na-hektar,182894.html\" target=\"_blank\" rel=\"noopener\">farmer.pl: stawki dopłat bezpośrednich 2026 (zaliczki)<\/a><\/li> <li><a href=\"https://staszow.pl/files/image/2025/Aktualno%C5%9Bci/ARIMR_stawki_p%C5%82atno%C5%9Bci.pdf\" target=\"_blank\" rel=\"noopener\">ARiMR: stawki płatności za 2025 r.<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/rolnictwo-ekologiczne-z-wyzszymi-stawkami-w-2023-roku\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: stawki płatności ekologicznych (2023)<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/hodowla/startuja-wyplaty-za-dobrostan-zwierzat-takie-pieniadze-dostana-rolnicy-lista,21487\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: stawki dobrostanu zwierząt za 2024 r.<\/a><\/li> <li><a href=\"https://www.gov.pl/web/arimr/platnosc-onw---podstawowe-informacje-2026\" target=\"_blank\" rel=\"noopener\">ARiMR: płatność ONW 2026<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/stawki-za-ekoschematy-2024-sa-jednak-wieksze-ostateczne-kwoty\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: stawki ekoschematów 2024<\/a><\/li> <li><a href=\"https://podr.pl/wp-content/uploads/2025/12/RHD-i-MLO.pdf\" target=\"_blank\" rel=\"noopener\">PODR: RHD i MLO (grudzień 2025)<\/a><\/li> <li><a href=\"https://poradnikprzedsiebiorcy.pl/-stawka-ryczaltu-w-rolniczym-handlu-detalicznym\" target=\"_blank\" rel=\"noopener\">Poradnik Przedsiębiorcy: ryczałt w RHD<\/a><\/li> <li><a href=\"https://www.kpodr.pl/wp-content/uploads/2024/03/Kiczorowska-B.-Dobre-praktyki-utrzymania-drobiurzeznego-i-kur-niosek.zmieniona.pdf\" target=\"_blank\" rel=\"noopener\">KPODR: dobre praktyki w chowie drobiu i kur nieśnych<\/a><\/li> <li><a href=\"https://www.iung.pl/wp-content/uploads/2023/09/Instrukcja-Mieszanki-roslin-straczkowych-ze-zbozami.pdf\" target=\"_blank\" rel=\"noopener\">IUNG: mieszanki roślin strączkowych ze zbożami<\/a><\/li> <li><a href=\"https://www.gov.pl/attachment/00bf374e-b258-4c8d-896e-aedf7a17cc2c\" target=\"_blank\" rel=\"noopener\">KOWR: rynek zbóż nr 41/2026<\/a><\/li> <li><a href=\"https://www.sodr.pl/pliki/Analiza-cen-2026-06,2096.pdf\" target=\"_blank\" rel=\"noopener\">ŚODR: ceny bydła, czerwiec 2026<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/drob/produkuje-jajka-od-kur-z-wolnego-wybiegu\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: jaja z wolnego wybiegu (ceny, 2024)<\/a><\/li> <li><a href=\"https://www.gov.pl/attachment/a63161eb-624b-4fb7-b75e-0f54da2b886f\" target=\"_blank\" rel=\"noopener\">KOWR: rynek mięsa, lipiec 2026 (ceny mięsa owczego)<\/a><\/li> <li><a href=\"https://bip2.lasy.gov.pl/pl/bip/px_dg~rdlp_wroclaw~nadl_lwowek_slaski~program_ochrony_przyrody_13_15.pdf\" target=\"_blank\" rel=\"noopener\">Nadleśnictwo Lwówek Śląski: warunki przyrodnicze<\/a><\/li> <li><a href=\"https://www.uvm.edu/d10-files/documents/2025-11/2024-COP-article-Sep2025.pdf\" target=\"_blank\" rel=\"noopener\">University of Vermont: koszty farm mleka z trawy (2024)<\/a><\/li> <li><a href=\"https://www.agproud.com/articles/30227-cheese-production-from-jersey-milk-conserves-resources-and-reduces-environmental-impact\" target=\"_blank\" rel=\"noopener\">Wydajność sera z mleka jersey<\/a><\/li> <li><a href=\"https://www.olx.pl/rolnictwo/ryneczek/q-jagni%C4%99cina-tusza/\" target=\"_blank\" rel=\"noopener\">OLX: ogłoszenia jagnięciny od rolników (ceny)<\/a><\/li> <li><a href=\"https://owczeklimaty.pl/produkt/tusza-jagnieca/\" target=\"_blank\" rel=\"noopener\">Owcze Klimaty: tusza jagnięca, 52 zł/kg<\/a><\/li> <li><a href=\"https://www.iung.pl/wp-content/uploads/2023/10/Zacharzewska_rzeznie-rolnicze-pazdziernik-2023.pdf\" target=\"_blank\" rel=\"noopener\">WIW Kraków (IUNG): rzeźnie rolnicze<\/a><\/li> <li><a href=\"https://www.infor.pl/akt-prawny/DZU.2016.252.0002159,rozporzadzenie-ministra-rolnictwa-i-rozwoju-wsi-w-sprawie-maksymalnej-ilosci-zywnosci-zbywanej-w-ramach-rolniczego-handlu-detalicznego-oraz-zakresu-i-sposobu-jej-dokumentowania.html\" target=\"_blank\" rel=\"noopener\">Rozporządzenie o limitach RHD (2016)<\/a><\/li> <li><a href=\"https://ksowplus.kpodr.pl/wp-content/uploads/2025/11/Adrianna-Augustyniak-Dobrzynskie-warzywa-prezentacja-dobtych-praktyk.pdf\" target=\"_blank\" rel=\"noopener\">KPODR: RWS Dobrzyńskie Warzywa (2025)<\/a><\/li> <li><a href=\"https://modernfarmer.com/2016/10/jm-fortier/\" target=\"_blank\" rel=\"noopener\">Modern Farmer: J.M. Fortier i małe gospodarstwa warzywne<\/a><\/li> <li><a href=\"https://www.inhort.pl/wp-content/uploads/2026/01/8.2_streszczenie-2025.pdf\" target=\"_blank\" rel=\"noopener\">INHORT: rynek miodu 2025<\/a><\/li> <li><a href=\"https://www.lubianka.pl/plik,25306,dzialalnosc-edukacyjna-w-gospodarstwie.pdf\" target=\"_blank\" rel=\"noopener\">DODR: działalność edukacyjna w gospodarstwie<\/a><\/li> <li><a href=\"https://gov.mb.ca/agriculture/livestock/sheep/accelerated-lambing.html\" target=\"_blank\" rel=\"noopener\">Manitoba Agriculture: przyspieszone wykoty owiec<\/a><\/li> <li><a href=\"https://www.flockandherd.net.au/sheep/reader/reproductive-performance-dorper.html\" target=\"_blank\" rel=\"noopener\">Flock and Herd: rozród owiec dorper<\/a><\/li> <li><a href=\"https://www.piwwyszkow.pl/Dokumenty/aktualnosci/RHD/RHD%20-%20pytania%20i%20odpowiedzi%20do%20regulacji%20prawnych.pdf\" target=\"_blank\" rel=\"noopener\">RHD: pytania i odpowiedzi (sprzedaż wysyłkowa, ubój drobiu)<\/a><\/li> <li><a href=\"https://new.podr.pl/wp-content/uploads/2024/01/rhd-zmniejszone-1.pdf\" target=\"_blank\" rel=\"noopener\">PODR: RHD po zmianach (2024)<\/a><\/li> <li><a href=\"https://wiescirolnicze.pl/prawo-i-finanse/koniec-z-ograniczenami-dla-rolnikow-szykuja-sie-przelomowe-zmiany-w-sprzedazy-bezposredniej,30495/\" target=\"_blank\" rel=\"noopener\">Wieści Rolnicze: zapowiedź zmian w RHD (kwiecień 2026)<\/a><\/li> <li><a href=\"https://manufakturadobra.pl/eko-polgesek-z-gesi-pastwiskowej/\" target=\"_blank\" rel=\"noopener\">Manufaktura Dobra: EKO półgęsek, 200 zł/kg<\/a><\/li> <li><a href=\"https://wolnywypas.pl/kaczka/25-tuszka-kaczki-eko.html\" target=\"_blank\" rel=\"noopener\">Wolny Wypas: kaczka eko<\/a> i <a href=\"https://wolnywypas.pl/perliczka/36-perliczka-tuszka.html\" target=\"_blank\" rel=\"noopener\">perliczka eko<\/a><\/li> <li><a href=\"https://lokalnyrolnik.pl/indyk-tuszka-eko-ok-8-kg\" target=\"_blank\" rel=\"noopener\">Lokalny Rolnik: indyk eko, 82,50 zł/kg<\/a><\/li> <li><a href=\"http://grzyby.grzybnia.pl/files/amatorska-uprawa-boczniak.pdf\" target=\"_blank\" rel=\"noopener\">M. Siwulski: amatorska uprawa boczniaka<\/a><\/li> <li><a href=\"https://okfronline.com/2022/07/histomoniasis-blackhead/\" target=\"_blank\" rel=\"noopener\">Histomonoza u indyków i kur<\/a><\/li> <li><a href=\"https://www.motherearthnews.com/homesteading-and-livestock/sustainable-farming/joel-salatin-interview/\" target=\"_blank\" rel=\"noopener\">Joel Salatin: wypas i drób za bydłem<\/a><\/li><\/ul>"},"footer":"Twoje ustawienia zapisują się tylko w tej przeglądarce. Liczby są szacunkiem do planowania, nie biznesplanem do banku.","controls":{"label":"Ustawienia"},"coverCropGuide":{"catchCrops":{"columns":["Mieszanka","Wysiew (orientacyjnie)","Kiedy i gdzie","Po co"],"mixes":{"ryeWithVetch":{"name":"Żyto ozime z wyką kosmatą","seeding":"żyto 60–80 kg/ha, wyka 25–40 kg/ha","timing":"Po żniwach, do 1 października. Przed owsem z grochem.","purpose":"Najpewniejsza: zimuje, wyka wiąże azot, żyto chroni glebę. Wypas owiec jesienią i od połowy lutego, potem przyoranie przed siewem owsa."},"landsberger":{"name":"Mieszanka landsberska","species":"wyka ozima, koniczyna krwistoczerwona, życica wielokwiatowa","seeding":"wyka 20–30, koniczyna 15–20, życica 15–20 kg/ha","timing":"Siew sierpień – wrzesień. Przed późno sianą uprawą lub warzywami.","purpose":"W maju daje pokos zielonki lub sianokiszonki dla krów, ale dla owsa to za późno. Dobra przed warzywami."},"cloverUndersown":{"name":"Wsiewka koniczyny w owies","seeding":"koniczyna czerwona 8–12 kg/ha, życica lub tymotka 4–8 kg/ha","timing":"Kwiecień, razem z owsem z grochem lub zaraz po nim.","purpose":"Liczy się jako wsiewka śródplonowa (utrzymać min. 8 tygodni po zbiorze). Od razu staje się polem koniczyny w płodozmianie."},"winterTurnipRapeRye":{"name":"Rzepik ozimy z żytem","seeding":"rzepik 6–10 kg/ha, żyto 60–80 kg/ha","timing":"Po żniwach, do końca sierpnia (rzepik potrzebuje czasu przed zimą). Przed owsem.","purpose":"Dużo paszy na jesienny wypas owiec i gęsi (październik–listopad), zimuje. Rzepik to kapustowate: nie wysiewaj, jeśli w płodozmianie są kapustne warzywa lub rzepak."},"multiSpeciesRye":{"name":"Mieszanka wielogatunkowa z żytem","species":"rzodkiew oleista, facelia, wyka, koniczyna krwistoczerwona, owies lub gryka","seeding":"gotowe mieszanki zwykle 25–40 kg/ha plus żyto 30–50 kg/ha","timing":"Po żniwach, sierpień. Przed owsem lub warzywami.","purpose":"Najwięcej życia w glebie: różne korzenie, kwiaty dla pszczół. Część przemarza, żyto zostaje zielone do 15 lutego. Droższe nasiona."},"triticaleWinterPea":{"name":"Pszenżyto z peluszką ozimą","seeding":"pszenżyto 80–100 kg/ha, peluszka 40–60 kg/ha","timing":"Wrzesień. Przed późną uprawą lub warzywami.","purpose":"W maju zielonka lub sianokiszonka bogata w białko. Jak landsberska: przed owsem za późno."},"phaceliaBuckwheatSerradella":{"name":"Facelia, gryka, seradela","seeding":"facelia 6–8, gryka 30–40, seradela 20–30 kg/ha","timing":"Po wczesnych żniwach, lipiec – sierpień.","purpose":"Szybka, miododajna (pszczoły), przemarza i zostawia mulcz. Do ekoschematu dodaj gatunek zimujący (np. żyto), bo okrywa musi trwać do 15 lutego."},"brownWinterCocktail":{"name":"Koktajl ozimy wielogatunkowy (G. Brown)","species":"żyto, pszenżyto, wyka ozima, koniczyna krwistoczerwona, rzepik, rzodkiew oleista","seeding":"żyto 35, pszenżyto 30, wyka 20, koniczyna 6, rzepik 2, rzodkiew 2 kg/ha (razem ok. 95 kg/ha)","timing":"Po żniwach do 1 października. Przed owsem lub mieszanką.","purpose":"Jesienią i wczesną wiosną wypas bydła lub owiec, zimą okrywa glebę. Rzodkiew i rzepik spulchniają, wyka i koniczyna wiążą azot. Spełnia wymogi ekoschematu (zostaje do 15 lutego)."}}},"stubbleCrops":{"columns":["Poplon ścierniskowy (przed oziminą, bez dopłaty)","Wysiew (orientacyjnie)","Kiedy","Po co"],"mixes":{"whiteMustard":{"name":"Gorczyca biała","seeding":"15–20 kg/ha","timing":"Zaraz po żniwach, lipiec – początek sierpnia; przyorać we wrześniu przed siewem oziminy.","purpose":"Najtańsza i najszybsza, szybko zakrywa glebę. Kapustowata: uważaj, jeśli uprawiasz kapustne warzywa."},"phaceliaBuckwheat":{"name":"Facelia z gryką","seeding":"facelia 8–10, gryka 30–40 kg/ha","timing":"Zaraz po żniwach.","purpose":"Miododajna (pszczoły), poprawia strukturę gleby, nie jest kapustowata. Mało paszy."},"oatsVetchPea":{"name":"Owies z wyką jarą i grochem","seeding":"owies 60–80, wyka 30–40, groch 40–60 kg/ha","timing":"Najwcześniej po żniwach (lipiec), 7–8 tygodni wzrostu.","purpose":"Zielonka dla krów lub wypas owiec we wrześniu, potem przyoranie. Strączkowe wiążą azot dla oziminy."},"brownSummerCocktail":{"name":"Koktajl letni do wypasu (G. Brown)","species":"owies, peluszka, wyka jara, gryka, facelia, słonecznik, rzodkiew oleista, koniczyna perska","seeding":"owies 30, peluszka 30, wyka 20, gryka 15, słonecznik 5, facelia 4, rzodkiew 3, koniczyna 3 kg/ha (ok. 110 kg/ha)","timing":"Zaraz po najwcześniejszych żniwach (lipiec), 7–9 tygodni wzrostu.","purpose":"Dużo paszy na wrześniowy wypas bydła, potem przyoranie przed oziminą. Kwiaty dla pszczół, korzenie różnej głębokości."}}}},"dataTools":{"groupLabel":"Ustawienia","clearAll":"Wyczyść wszystko","clearAllTitle":"Wszystkie zwierzęta na 0, a cała ziemia poza obejściem pod zboża. Można to cofnąć przyciskiem „Poprzednie dane”.","previous":"↶ Poprzednie dane","previousTitle":"Cofa ostatnią zmianę ustawień (pamięta do 30 kroków)."},"nitrogen":{"title":"Azot i węgiel","intro":"Ile azotu dają zwierzęta, ile rozsiewają same na pastwisku i wybiegach, a ile zostaje w oborniku do wywiezienia; obieg azotu w całym gospodarstwie i orientacyjny bilans węgla w glebie. Wartości szacunkowe, do planowania.","baleGrazingNote":"<h3>Wypas na belach zimą<\/h3><ul><li>Bele rozstawia się jesienią na polu, które wiosną idzie pod uprawę, albo na słabszym kawałku łąki; co roku w innym miejscu.<\/li><li>Nie na glebie podmokłej, zalewowej ani przy rowach i ciekach; przy roztopach zwierzęta przechodzą na suchsze miejsce.<\/li><li>Dostęp do wody zimą (poidło z podgrzewaniem lub beczkowóz) i osłona od wiatru.<\/li><li>Program azotanowy ogranicza nawożenie zimą, więc miejsce i obsadę warto omówić z doradcą ODR.<\/li><\/ul>","baleGrazingTitle":"Wypas na belach zimą","soilCareTitle":"Co i kiedy na glebę w ekologii","soilCare":"<ul><li><b>Badanie gleby<\/b> co 4–5 lat (pH, fosfor, potas, magnez, próchnica) przed planem nawożenia; w ODR lub stacji chemiczno-rolniczej.<\/li><li><b>Wapnowanie<\/b>, gdy pH gleb lekkich spada poniżej ok. 5,5, a średnich poniżej 6 (koniczyna potrzebuje pH ok. 6–6,5): wapno węglanowe lub dolomit (z magnezem), jesienią po żniwach albo wczesną wiosną na użytki zielone, zwykle co 4 lata.<\/li><li><b>Mączki skalne<\/b> (bazaltowa, diabazowa) 1–3 t/ha na kompost lub obornik: powoli uwalniają mikroelementy i wspierają życie glebowe.<\/li><li><b>Fosforyt miękki, kizeryt, siarczan potasu (patentkali)<\/b> są dopuszczone w ekologii przy potwierdzonej potrzebie (badanie gleby); siarka elementarna przy niedoborze siarki pod koniczynę i kapustne.<\/li><li><b>Kompost i herbata kompostowa<\/b> wiosną na łąki i pola; obornik najlepiej przekompostowany, pod okopowe i oziminy.<\/li><li><b>Preparaty mikrobiologiczne i biostymulatory<\/b> (EM, Trichoderma, szczepionki mikoryzowe, wyciągi z alg) tylko z wykazu dopuszczonych do rolnictwa ekologicznego; najlepiej przy siewie i na kompost.<\/li><li><b>Opryski w sadzie<\/b>: siarka i preparaty miedziowe (miedź najwyżej 28 kg/ha w 7 lat), gnojówki z pokrzywy i skrzypu, serwatka przeciw mączniakowi.<\/li><\/ul>","carbonMethodTitle":"Jak liczony jest węgiel","carbonMethod":"<p>Orientacyjne przyrosty węgla w glebie na hektar i rok: pastwisko z częstym przesuwaniem (co 1–3 dni) i odpoczynkiem 40+ dni ok. 0,5 t C, wypas rotacyjny ok. 0,3 t, rzadkie przesuwanie ok. 0,1 t, łąka kośna ok. 0,2 t, koniczyna z trawami ok. 0,5 t, sad ok. 0,3 t; zboża bez okrywy tracą ok. 0,2 t, a międzyplon, obornik i wypas na belach dodają po ok. 0,25–0,3 t. Tona węgla to 3,67 t CO₂.<\/p><p>Metan z trawienia przeżuwaczy (krowa ok. 110 kg CH₄ rocznie, owca ok. 8 kg) przeliczony na CO₂ (×27). Gleba nie przyjmuje węgla bez końca: po 20–30 latach przyrost maleje. To nie jest certyfikowany bilans do sprzedaży kredytów węglowych.<\/p>"},"risk":{"title":"Ryzyko w losowych latach","intro":"Jak często gospodarstwo osiąga cel, gdy plony, ceny, wydajność zwierząt i koszty co roku są trochę inne.","chartLabel":"Wykres: ile lat kończy się danym dochodem","method":"Model przelicza gospodarstwo dla 500 losowych lat: każdy rok ma inne plony, ceny, wydajność zwierząt i koszty, a mniej więcej raz na 20 lat zdarza się zły rok dla zwierząt. Zielone słupki to lata z dochodem co najmniej równym celowi, czerwone poniżej. Wariant pesymistyczny to jeden rok, w którym wszystko idzie źle naraz; zdarza się rzadziej niż najgorsze lata na tym wykresie. Zmienność ustawisz w grupie „Wariant pesymistyczny”."},"language":{"label":"Język:","groupLabel":"Język strony","pl":"Polski","en":"English"},"location":{"label":"Lokalizacja:"},"jump":{"label":"Skocz do:","plan":"Plan rozmieszczenia","rotation":"Płodozmian","nitrogen":"Azot i węgiel","money":"Pieniądze","cashflow":"Przepływy gotówki","labour":"Czas pracy","market":"Sprzedaż","infrastructure":"Infrastruktura","startup":"Jak zacząć","calendar":"Kalendarz"},"footerLinks":"Aplikacja: <a href=\"https://symgospodarstwa.netlify.app/\" target=\"_blank\" rel=\"noopener\">symgospodarstwa.netlify.app<\/a> · kod: <a href=\"https://github.com/marlander111/symulator-gospodarstwa\" target=\"_blank\" rel=\"noopener\">github.com/marlander111/symulator-gospodarstwa<\/a>","infrastructure":{"title":"Wymagana infrastruktura","intro":"Co jest potrzebne do wybranych kierunków. Zaznacz to, co gospodarstwo już ma: zniknie z inwestycji."}},"customers":{"title":"Ilu klientów potrzebujesz","familiesValue":"{count} rodzin","customersValue":"{count} klientów","loyal":"stałych, biorących pełny koszyk (ok. {amount} zł miesięcznie)","occasional":"gdyby każdy kupował tylko jeden produkt (ok. {amount} zł miesięcznie)","note":"Przy stałych rodzinach to ok. {perWeek} wydań tygodniowo, jeśli każda odbiera raz w miesiącu, albo jeden dzień odbioru dla wszystkich. Pierwszych klientów zwykle przyprowadzają znajomi, szkoła, parafia i sąsiedzi; resztę poleceniami."},"nitrogen":{"winterLabel":"Zimą:","winterInSheds":"w wiatach (obornik)","winterBaleGrazing":"wypas na belach","kg":"{value} kg N","perHaOfLimit":"{perHa} z {limit} kg/ha","total":"Azot od zwierząt w roku","onPasture":"zostawiają same na pastwisku i wybiegach (ok. {perHa} kg/ha pastwiska)","onBaleGrazing":"zostaje zimą na polu z belami","inManure":"obornik do wywiezienia: ok. {tonnes} t, ok. {hours} h pracy","columns":{"source":"Gdzie trafia azot
